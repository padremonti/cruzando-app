<!DOCTYPE html>
<html lang="es">
<head>
<!-- mini.html — Mini sesión del Misterio-puerta (MICRO) · PLACEHOLDER
     Entra a UN solo Misterio, el que el painpoint señaló en Sanar.
     Query: mini.html?mid={mid}&pain={pain.id}   (mid = pain.id.slice(0,6)) -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="shortcut icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A0E04">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-title" content="CruzAndo">
<meta name="description" content="Mini sesión — entra al Misterio del Rosario que hoy estás cruzando.">
<title>Mini sesión · CruzAndo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

/* ── Tokens reales del hub (teal/cian) ── */
:root {
  --bg:#002931; --bg2:#001E25; --card:#004C5B; --card2:#003845;
  --border:rgba(67,221,248,0.15); --text:#F0E6DA; --text-soft:#C4A882; --text-dim:#7A5C40;
  --orange:#FF7A00; --orange-soft:#F69C49; --orange-dim:rgba(255,122,0,0.12);
  --brand:#02BBE0; --brand-soft:#43DDF8; --brand-ultra:rgba(2,187,224,0.12);
  --nav-bg:rgba(0,41,49,0.97); --shadow:rgba(0,0,0,0.5);
}
.light {
  --bg:#E6DED3; --bg2:#D9CFC4; --card:#FFFCF7; --card2:#F5EDE4;
  --border:#D0C4B8; --text:#2B1A0E; --text-soft:#6B5040; --text-dim:#9B8878;
  --orange-dim:rgba(255,122,0,0.08);
  --brand:#02BBE0; --brand-soft:#43DDF8; --brand-ultra:rgba(2,187,224,0.10);
  --nav-bg:rgba(237,228,216,0.97); --shadow:rgba(0,0,0,0.15);
}

html { font-size:18px; }
body {
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  line-height:1.6; min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  transition:background 0.35s, color 0.35s;
}
.shell { max-width:480px; margin:0 auto; min-height:100dvh; position:relative; padding:0 20px 96px; display:flex; flex-direction:column; }

.s-top {
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 0 10px;
}
.s-back, .s-theme {
  width:40px; height:40px; border-radius:12px; border:1px solid var(--border);
  background:var(--card); color:var(--text);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.s-back svg, .s-theme svg { width:20px; height:20px; }
.s-title { font-family:'Crimson Pro',Georgia,serif; font-weight:700; font-size:1.15rem; letter-spacing:0.2px; }

.mini-main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 6px; }
.mini-cross { width:40px; height:40px; margin-bottom:20px; }
.mini-kicker {
  display:inline-block; margin-bottom:16px; padding:6px 14px; border-radius:20px;
  background:var(--brand-ultra); color:var(--brand-soft);
  font-size:0.74rem; font-weight:700; letter-spacing:0.6px; text-transform:uppercase;
}
.mini-num { font-size:0.8rem; font-weight:700; letter-spacing:1px; color:var(--text-dim); text-transform:uppercase; margin-bottom:6px; }
.mini-title { font-family:'Crimson Pro',Georgia,serif; font-weight:700; font-size:2rem; line-height:1.2; margin-bottom:8px; }
.mini-sub { color:var(--text-soft); font-size:1.02rem; font-style:italic; max-width:320px; margin-bottom:22px; }
.mini-line { color:var(--text-soft); font-size:0.95rem; max-width:320px; }

.btn-primary {
  width:100%; max-width:360px; padding:15px; border-radius:15px; border:none; cursor:pointer;
  background:var(--orange); color:#fff; font-family:inherit; font-weight:700; font-size:0.98rem;
  transition:opacity .2s;
}
.btn-primary:active { opacity:0.9; }

/* ── Bottom nav (copiada del hub) — "Sanar" activo ── */
.app-nav {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; z-index:100;
  background:var(--nav-bg); border-top:1px solid var(--border);
  display:flex; align-items:stretch;
  padding-bottom:env(safe-area-inset-bottom, 0px);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.app-nav-item {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:10px 4px 12px; background:none; border:none; cursor:pointer;
  font-family:inherit; text-decoration:none; color:rgba(67,221,248,0.45);
  transition:color 0.2s; -webkit-tap-highlight-color:transparent;
}
body.light .app-nav-item { color:rgba(0,41,49,0.45); }
.app-nav-item.active { color:#43DDF8; }
.app-nav-icon { width:24px; height:24px; position:relative; display:flex; align-items:center; justify-content:center; }
.app-nav-item.active .app-nav-icon::before { content:''; position:absolute; inset:-5px; background:rgba(2,187,224,0.12); border-radius:10px; }
.app-nav-label { font-size:0.6rem; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }
</style>
</head>
<body>
<div class="shell">
  <div class="s-top">
    <button class="s-back" onclick="volver()" aria-label="Volver a Sanar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="s-title">Mini sesión</div>
    <button class="s-theme" onclick="toggleDark()" aria-label="Tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </div>

  <div class="mini-main" id="view">
    <div class="mini-line">Cargando…</div>
  </div>
</div>

<!-- TODO: mini sesión atomizada (~3 min): evangelio + fragmento de contemplación + una perspectiva de meditación + intercesión, desde data/0101.json -->

<!-- App-nav del hub — "Sanar" activo -->
<nav class="app-nav">
  <button class="app-nav-item" onclick="navTo('crecer.html')">
    <div class="app-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8 19h6a3.5 3.5 0 0 0 0-7H10a3.5 3.5 0 0 1 0-7h6"/></svg></div>
    <span class="app-nav-label">Crecer</span>
  </button>
  <button class="app-nav-item active" onclick="navTo('sanar.html')">
    <div class="app-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 000-7.8z"/></svg></div>
    <span class="app-nav-label">Sanar</span>
  </button>
  <button class="app-nav-item" onclick="navTo('retiros.html')">
    <div class="app-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-5.5-8-11a8 8 0 0116 0c0 5.5-8 11-8 11z"/><path d="M9 11h6M12 8v6"/></svg></div>
    <span class="app-nav-label">Retiros</span>
  </button>
  <button class="app-nav-item" onclick="navTo('diario.html')">
    <div class="app-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg></div>
    <span class="app-nav-label">Diario</span>
  </button>
  <button class="app-nav-item" onclick="navTo('cantos.html')">
    <div class="app-nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
    <span class="app-nav-label">Cantos</span>
  </button>
</nav>

<script>
(function(){
  'use strict';

  var base = location.origin + location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function qp(k){ try { return new URLSearchParams(location.search).get(k); } catch(e){ return null; } }

  var mid = qp('mid') || '';
  var painId = qp('pain') || '';
  var elemento = mid.slice(0,4) || '0101';                 // futuro-seguro; v1 piloto: 0101
  var numero = parseInt(mid.slice(4), 10);                 // 2 últimos chars del mid → Misterio global

  // ── Navegación / tema (patrón del repo) ─────────────────────────
  window.navTo = function(pg){ location.href = base + pg; };
  window.volver = function(){ navTo('sanar.html'); };

  var isLight = localStorage.getItem('cruzando_theme') === 'light';
  function applyTheme(light){
    document.body.classList.toggle('light', light);
    document.querySelector('meta[name="theme-color"]').content = light ? '#E6DED3' : '#1A0E04';
    localStorage.setItem('cruzando_theme', light ? 'light' : 'dark');
  }
  window.toggleDark = function(){ isLight = !isLight; applyTheme(isLight); };
  if (isLight) applyTheme(true);

  // ── Carga del maestro y render del placeholder ──────────────────
  async function cargar(){
    var data = null;
    try { var r = await fetch(base + 'data/' + elemento + '.json'); if (r.ok) data = await r.json(); } catch(e){}

    var mis = null;
    if (data && data.misterios && !isNaN(numero)) {
      var bloques = Object.keys(data.misterios);
      for (var i=0; i<bloques.length && !mis; i++) {
        (data.misterios[bloques[i]] || []).forEach(function(x){ if (x.numero === numero) mis = x; });
      }
    }

    var cross =
      '<svg class="mini-cross" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+
        '<rect x="46.2" y="0" width="7.6" height="100" fill="#02BBE0"/>'+
        '<rect x="0" y="46.2" width="100" height="7.6" fill="#02BBE0"/>'+
      '</svg>';

    var titulo = mis ? mis.titulo : 'Tu Misterio';
    var sub = mis ? (mis.subtitulo || '') : '';
    var numLbl = (!isNaN(numero)) ? 'Misterio ' + numero : '';

    $('view').innerHTML =
      cross +
      '<div class="mini-kicker">Mini sesión — próximamente</div>'+
      (numLbl ? '<div class="mini-num">'+esc(numLbl)+'</div>' : '')+
      '<div class="mini-title">'+esc(titulo)+'</div>'+
      (sub ? '<div class="mini-sub">'+esc(sub)+'</div>' : '')+
      '<p class="mini-line">Entraremos al Misterio que estás cruzando.</p>'+
      '<button class="btn-primary" onclick="volver()" style="margin-top:28px">Volver</button>';
  }

  cargar();
})();
</script>
</body>
</html>
