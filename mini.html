<!DOCTYPE html>
<html lang="es">
<head>
<!-- mini.html — Mini sesión del Misterio-puerta (MICRO)
     Entra a UN Misterio, el que el painpoint señaló en Sanar.
     Query: mini.html?mid={mid}&pain={pain.id}   (mid = pain.id.slice(0,6))
     Todo se deriva del mid: elemento (data/{elemento}.json), numero y assetMID (assets R2). -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="shortcut icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A0E04">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-title" content="CruzAndo">
<meta name="description" content="Mini sesión — entra al Misterio del Rosario que hoy estás cruzando.">
<title>Mini sesión · CruzAndo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  /* Estructura (chrome oscuro cinematográfico) */
  --parch:#F3EAD8; --bg:#05060c;
  /* Acento por Mundo — se sobreescribe desde tema.paleta del JSON; por defecto, dorado (fallback, no rompe) */
  --gold:#E8B94A; --gold-deep:#C8920F; --soft:#0E8298;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--parch);overflow:hidden;transition:background .35s,color .35s}
body.light{--parch:#0a2530;--bg:#EAF4F6}

/* ── Pantalla completa (sin marco de teléfono) ── */
.screen{position:fixed;inset:0;overflow:hidden;background:var(--bg)}

/* fondos (canto + hero) */
.stills{position:absolute;inset:0;overflow:hidden;background:#05060c}
.lay{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.lay.front{opacity:1}
.kb{position:absolute;inset:-2%;background-size:cover;background-position:center;will-change:transform}
.kb.run{animation:kenburns var(--kbdur,15s) ease-out forwards}
@keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(var(--kbz,1.09)) translate(var(--kbx,0),var(--kby,0))}}
@media (prefers-reduced-motion: reduce){ .kb.run{animation:none!important} .lay{transition-duration:.001ms!important} }
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.scrim{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,7,14,.55) 0%,rgba(6,7,14,0) 24%,rgba(6,7,14,0) 40%,rgba(6,7,14,.7) 78%,rgba(6,7,14,.96) 100%)}

/* capas de momento */
.moment{position:absolute;inset:0;z-index:5;display:none;flex-direction:column}
.moment.show{display:flex}

/* top controls */
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 0}
.topbar-l,.topbar-r{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;flex-shrink:0;border-radius:50%;border:1px solid rgba(243,234,216,.18);background:rgba(8,9,16,.4);backdrop-filter:blur(6px);color:var(--parch);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.vol-wrap{position:relative}
.vol-pop{position:absolute;top:44px;right:0;background:rgba(8,9,16,.8);backdrop-filter:blur(8px);border:1px solid rgba(243,234,216,.16);border-radius:12px;padding:12px 10px;display:none}
.vol-pop.show{display:block}
.vol-pop input{writing-mode:vertical-lr;direction:rtl;width:8px;height:90px;accent-color:var(--gold)}

/* karaoke */
.lyrics{position:absolute;left:0;right:0;top:52%;bottom:118px;z-index:6;overflow:hidden;mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent)}
.lyric-track{position:absolute;top:0;left:0;right:0;padding:0 30px;transition:transform .55s cubic-bezier(.33,.85,.3,1);text-align:center;will-change:transform}
.ly{font-family:'Crimson Pro',serif;font-size:20px;line-height:1.5;color:rgba(243,234,216,.34);padding:7px 0;transition:color .4s,opacity .4s;transform:translateZ(0)}
.ly.active{color:var(--parch);font-size:23px}
.ly.near{color:rgba(243,234,216,.5)}

/* skip */
.skip{position:absolute;right:16px;bottom:128px;z-index:20;display:none;align-items:center;gap:6px;
  padding:8px 14px;border-radius:22px;background:rgba(8,9,16,.5);backdrop-filter:blur(6px);
  border:1px solid rgba(243,234,216,.2);color:var(--parch);font-size:12.5px;font-weight:500;cursor:pointer;opacity:0;transition:opacity .5s}
.skip.show{display:flex;opacity:1}
.skip svg{width:15px;height:15px;fill:currentColor}

/* texto inferior (hero) */
.hero-caption{position:absolute;left:0;right:0;bottom:120px;z-index:6;text-align:center;padding:0 26px}
.hero-kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);opacity:.9}
.hero-title{font-family:'Crimson Pro',serif;font-size:26px;font-weight:600;margin-top:4px}
.hero-sub{font-size:13px;opacity:.7;margin-top:2px;font-style:italic}

/* beads */
.beads-col{position:absolute;left:50%;transform:translateX(-50%);bottom:132px;z-index:7;display:flex;flex-direction:column;align-items:center;gap:7px}
.bead{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(243,234,216,.35);background:transparent;transition:all .4s}
.bead-pater{width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(243,234,216,.45);background:transparent;transition:all .4s}
.bead.active,.bead-pater.active{border-color:var(--gold);background:var(--gold)}
.bead.active,.bead-pater.active{animation:beadPulse .9s ease-in-out infinite}
@keyframes beadPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,185,74,.5)}50%{box-shadow:0 0 0 6px rgba(232,185,74,0)}}
.bead.lit-normal,.bead-pater.lit-normal{border-color:var(--soft);background:var(--soft);opacity:.7}
.bead-sep{width:1px;height:9px;background:rgba(243,234,216,.2)}
.bead-lux{display:none;margin-top:4px}
.bead-lux.show{display:block;animation:luxAppear .6s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes luxAppear{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

/* toolbar inferior */
.toolbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:26px;padding:22px 0 calc(34px + env(safe-area-inset-bottom,0px))}
.tb-btn{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;color:var(--parch);cursor:pointer;font-size:10.5px;opacity:.85}
.tb-btn:active{transform:scale(.94)}
.tb-circle{width:46px;height:46px;border-radius:50%;border:1px solid rgba(243,234,216,.22);background:rgba(8,9,16,.32);display:flex;align-items:center;justify-content:center}
.tb-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.play-main .tb-circle{width:60px;height:60px;background:linear-gradient(160deg,var(--gold),var(--gold-deep));border:none}
.play-main svg{width:26px;height:26px;fill:#1a1305;stroke:none}

/* popup de texto */
.txt-pop{position:absolute;inset:0;z-index:30;background:rgba(5,7,14,.9);backdrop-filter:blur(8px);display:none;flex-direction:column;padding:70px 8px 20px}
.txt-pop.show{display:flex}
.txt-scroll{flex:1;overflow-y:auto;padding:0 22px 10px}
.txt-ref{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.txt-body{font-family:'Crimson Pro',serif;font-size:17px;line-height:1.72;white-space:pre-wrap}
.txt-next{margin:14px 22px 0;padding:13px;border-radius:12px;border:none;background:var(--gold-deep);color:#1a1305;font-weight:600;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}
.txt-close{position:absolute;top:18px;right:18px;z-index:2}

/* diario / meditación */
.diary textarea{width:100%;height:200px;resize:none;background:rgba(7,8,16,.6);border:1px solid rgba(243,234,216,.16);border-radius:12px;color:var(--parch);padding:14px;font-family:'Crimson Pro',serif;font-size:15px;line-height:1.6}
.diary .txt-body{font-size:15px;margin-bottom:14px}

/* epílogo */
.epilogue{z-index:8;justify-content:center;align-items:center;gap:16px;padding:40px}
.epi-title{font-family:'Crimson Pro',serif;font-size:24px;font-weight:600;text-align:center}
.epi-sub{font-size:13px;opacity:.7;text-align:center;margin-bottom:16px}
.epi-btn{width:100%;max-width:280px;padding:15px;border-radius:14px;cursor:pointer;font-size:14px;font-weight:500;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid rgba(243,234,216,.2);background:rgba(8,9,16,.4);color:var(--parch)}
.epi-btn.primary{background:linear-gradient(160deg,var(--gold),var(--gold-deep));color:#1a1305;border:none;font-weight:600}
.epi-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* progreso de momentos */
.progress{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:19;display:flex;gap:6px}
.pdot{width:20px;height:3px;border-radius:2px;background:rgba(243,234,216,.25);transition:background .3s}
.pdot.done{background:var(--soft)} .pdot.active{background:var(--gold)}

.advance-chip{position:absolute;left:50%;bottom:106px;transform:translateX(-50%);z-index:18;display:none;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:22px;background:rgba(8,9,16,.62);backdrop-filter:blur(6px);border:1px solid rgba(231,119,119,.45);font-size:11.5px;color:var(--parch)}
.advance-chip.show{display:flex}
.advance-chip button{background:var(--gold-deep);color:#1a1305;border:none;border-radius:14px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif}

/* pantalla-gesto de inicio (desbloquea el audio con un gesto) */
.start-gate{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:40px;text-align:center;background:radial-gradient(120% 80% at 50% 20%,rgba(10,20,32,.72),rgba(5,6,12,.96));backdrop-filter:blur(4px)}
.sg-title{font-family:'Crimson Pro',serif;font-size:28px;font-weight:600}
.sg-sub{font-size:14px;opacity:.7;font-style:italic;margin-bottom:24px}
.sg-btn{padding:15px 30px;border-radius:26px;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;background:linear-gradient(160deg,var(--gold),var(--gold-deep));color:#1a1305}
.sg-btn:disabled{opacity:.5;cursor:default;background:rgba(243,234,216,.2);color:var(--parch)}
.sg-btn:active:not(:disabled){transform:scale(.96)}

.hidden{display:none!important}
</style>
</head>
<body>
<div class="screen" id="screen">

  <!-- Fondos compartidos -->
  <div class="stills" id="stills">
    <div class="lay front" id="layA"><div class="kb" id="kbA"></div></div>
    <div class="lay" id="layB"><div class="kb" id="kbB"></div></div>
  </div>
  <div class="hero-bg hidden" id="hero"></div>
  <div class="scrim" id="scrim"></div>

  <!-- Progreso de momentos -->
  <div class="progress" id="progress"></div>

  <!-- Topbar: volver (izq) · tema + volumen (der) -->
  <div class="topbar" id="topbar">
    <div class="topbar-l">
      <button class="icon-btn" id="backBtn" title="Volver" aria-label="Volver a Sanar"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>
    <div class="topbar-r">
      <button class="icon-btn" id="themeBtn" title="Tema" aria-label="Tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg></button>
      <div class="vol-wrap">
        <button class="icon-btn" id="volBtn" title="Volumen" aria-label="Volumen"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4 4 0 0 1 0 7"/></svg></button>
        <div class="vol-pop" id="volPop"><input type="range" min="0" max="100" value="80" id="volSlider" aria-label="Volumen"></div>
      </div>
    </div>
  </div>

  <!-- ══ M1 · CANTO ══ -->
  <div class="moment show" id="m-canto">
    <div class="lyrics" id="lyrics"><div class="lyric-track" id="track"></div></div>
    <button class="skip" id="skipBtn"><span>Saltar</span><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8zM17 4h2v16h-2z"/></svg></button>
  </div>

  <!-- ══ M2/M3/M4 · REPRODUCTOR (hero) ══ -->
  <div class="moment" id="m-player">
    <div class="hero-caption" id="heroCap">
      <div class="hero-kicker" id="pKicker">Palabra</div>
      <div class="hero-title" id="pTitle"></div>
      <div class="hero-sub" id="pSub"></div>
    </div>
    <div class="beads-col hidden" id="beadsCol"></div>
    <div class="advance-chip" id="advanceChip"><span id="advanceMsg"></span><button id="advanceBtn">Avanzar</button></div>
    <div class="toolbar" id="playerToolbar">
      <button class="tb-btn play-main" id="ppBtn"><div class="tb-circle"><svg id="ppIc" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></button>
      <button class="tb-btn" id="secBtn"><div class="tb-circle"><svg id="secIc" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div><span id="secLbl">Texto</span></button>
    </div>
  </div>

  <!-- ══ M5 · EPÍLOGO ══ -->
  <div class="moment epilogue" id="m-epilogue">
    <div class="epi-title">Has recorrido el Misterio</div>
    <div class="epi-sub" id="epiSub"></div>
    <button class="epi-btn" id="epiCanto"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg> Escuchar el canto</button>
    <button class="epi-btn" id="epiDiario"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> Escribir en el diario</button>
    <button class="epi-btn primary" id="epiSalir"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Concluir y salir</button>
  </div>

  <!-- Popup de texto (bíblico / contemplación / oración) -->
  <div class="txt-pop" id="txtPop">
    <button class="icon-btn txt-close" id="txtClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="txt-scroll" id="txtScroll">
      <div class="txt-ref" id="txtRef"></div>
      <div class="txt-body" id="txtBody"></div>
    </div>
    <button class="txt-next" id="txtNext">Continuar</button>
  </div>

  <!-- Popup diario / meditación -->
  <div class="txt-pop diary" id="diaryPop">
    <button class="icon-btn txt-close" id="diaryClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="txt-scroll">
      <div class="txt-ref">Para escribir</div>
      <div class="txt-body" id="diaryPrompt"></div>
      <textarea id="diaryText" placeholder="Escribe lo que surja…"></textarea>
    </div>
    <button class="txt-next" id="diarySave">Guardar en el diario</button>
  </div>

  <!-- Pantalla-gesto: el primer play() debe salir de un clic del usuario -->
  <div class="start-gate" id="startGate">
    <div class="sg-title" id="sgTitle">Tu Misterio</div>
    <div class="sg-sub" id="sgSub"></div>
    <button class="sg-btn" id="startBtn" disabled>Preparando…</button>
  </div>

  <!-- sin crossorigin: igual que audio.html (new Audio); R2 no envía cabeceras CORS y el atributo rompe la reproducción -->
  <audio id="audio"></audio>
</div>

<script>
/* ═══════════ CONFIG · todo se deriva del mid (cero hardcode) ═══════════ */
const R2_ILU = 'https://pub-96c43f31e0da42dd950d4ac90328256e.r2.dev';
const R2_MUS = 'https://pub-faed94e375aa443e846e07f81ef93274.r2.dev';
const R2_AUD = 'https://pub-cd28789360f74fc0a623bb76605f42c3.r2.dev';

const base = location.origin + location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
const qp = k => { try { return new URLSearchParams(location.search).get(k); } catch(e){ return null; } };

const MIDQ   = qp('mid') || '010101';                          // fallback piloto Mundo 1
const PAINID = qp('pain') || '';
const elemento = MIDQ.slice(0,4) || '0101';                    // data/{elemento}.json
const numero   = parseInt(MIDQ.slice(4,6), 10);               // Misterio global 1-20
const assetMID = `${+MIDQ.slice(0,2)}_${+MIDQ.slice(2,4)}_${numero}`;  // 010101 → 1_1_1 (convención audio.html)

const URLS = {
  hero:       `${R2_ILU}/P_${assetMID}.webp`,
  cantoImg:   letra => `${R2_ILU}/cantos/${assetMID}/P_${assetMID}${letra}.webp`,   // P_1_1_1a.webp — letra a,b,c…
  cantoAudio: `${R2_MUS}/m4a/M_${assetMID}.m4a`,
  cantoLrc:   `${R2_MUS}/lrc/M_${assetMID}.lrc`,
  ubible:     `${R2_AUD}/ubible/UBIBLE_${assetMID}.mp3`,
  cont:       `${R2_AUD}/cont/CONT_${assetMID}.mp3`,
  rezo:       `${R2_AUD}/global/MA.mp3`,   // TODO: alternar MA/MB/L_MA según posición en el bloque e idioma, como audio.html
  pray:       `${R2_AUD}/pray/PRAY_${assetMID}.mp3`,
  data:       `${base}data/${elemento}.json`,
  beadSync:   `${base}data/bead_sync.json`
};

/* ═══════════ Datos (fetch con fallback) ═══════════ */
let MISTERIO=null, MISTERIO_TEMA=null, BEADSYNC=null, LRC_TEXT=null;

const LRC_FALLBACK = `[ti: El cuerpo lo sabe]
[lyrics]
[00:10.13] 1. En Nazaret,
[00:11.79] aire nuevo se respira;
[00:15.08] y a través
[00:16.71] de la luz la Virgen mira:
[00:20.02] es Gabriel
[00:21.65] que llegó sin hacer ruido,
[00:24.68] y el Nuevo Edén
[00:26.31] queda todo estremecido.
[00:29.62] Con nitidez
[00:31.47] fue presencia en lo profundo;
[00:34.23] poco después
[00:36.15] Dios empieza a hacerse mundo.
[00:38.59] El cuerpo lo sabe y no se equivoca,
[00:43.83] cuando percibe la gracia que toca;
[00:48.20] la fuerza, la risa, la brisa, la calma,
[00:53.06] el cuerpo lo sabe:
[00:58.01] es Dios en el alma.`;

const FALLBACK_MIST={numero:numero||1,titulo:'Tu Misterio',subtitulo:'',referencia:'',
  evangelio:'(No se pudo cargar el texto del Misterio.)',
  contemplacion:'(Contemplación no disponible.)',
  meditacion:'(Preguntas de meditación no disponibles.)',
  intercesion:'(Oración final no disponible.)'};
const BEAD_FALLBACK={MA:[{bead:0,label:'Padrenuestro',start:0,end:22.97}]};

async function loadData(){
  // {elemento}.json → Misterio por numero + tema (paleta)
  try{
    const r=await fetch(URLS.data); if(!r.ok) throw 0;
    const j=await r.json();
    MISTERIO_TEMA = j.tema || null;
    if(j.misterios){
      const bloques=Object.keys(j.misterios);
      for(const b of bloques){ const hit=(j.misterios[b]||[]).find(m=>Number(m.numero)===numero); if(hit){ MISTERIO=hit; break; } }
    }
    if(!MISTERIO) MISTERIO=FALLBACK_MIST;
  }catch(e){ MISTERIO=FALLBACK_MIST; }
  // .lrc (solo letra/tiempos para el karaoke; si no hay líneas con marca temporal, fallback local)
  try{ const r=await fetch(URLS.cantoLrc); if(!r.ok) throw 0; const t=await r.text(); LRC_TEXT = /\[\d+:\d/.test(t) ? t : LRC_FALLBACK; }
  catch(e){ LRC_TEXT=LRC_FALLBACK; }
  // bead_sync.json
  try{ const r=await fetch(URLS.beadSync); if(!r.ok) throw 0; BEADSYNC=await r.json(); }
  catch(e){ BEADSYNC=BEAD_FALLBACK; }
  applyPalette(); initCanto();
}

/* Paleta por Mundo: tiñe los acentos (botón principal, kicker, beads activos, resplandor) desde tema.paleta.
   Si el JSON no trae paleta, se queda el dorado por defecto (no rompe). */
function applyPalette(){
  const p = MISTERIO_TEMA && MISTERIO_TEMA.paleta;
  if(!p) return;
  const root=document.documentElement.style;
  if(p.base || p.bold){ root.setProperty('--gold', p.base || p.bold); root.setProperty('--gold-deep', p.bold || p.base); }
  if(p.soft || p.mist){ root.setProperty('--soft', p.soft || p.mist); }
}

/* ═══════════ Parser .lrc (letra) — intacto; stills/cut ya no alimentan el fondo ═══════════ */
function parseLrc(text){
  const lines=text.split(/\r?\n/), stills={}, events=[];
  let mode=null;
  const reTime=/^\s*\[(\d+):(\d+(?:\.\d+)?)\]/;
  const reStill=/^\s*(\d+)\s*:\s*([^|]+?)\s*(?:\|\s*(.*))?$/;
  for(const raw of lines){
    const line=raw.replace(/\s+$/,''); if(!line.trim())continue;
    const low=line.trim().toLowerCase();
    if(low==='[stills]'){mode='stills';continue;}
    if(low==='[lyrics]'){mode='lyrics';continue;}
    if(/^\[(ti|ar|al|by|offset):/i.test(line.trim()))continue;
    if(mode==='stills' && !reTime.test(line)){ const m=line.match(reStill); if(m)stills[parseInt(m[1],10)]={id:m[2].trim(),label:(m[3]||'').trim()}; continue; }
    const tm=line.match(reTime); if(!tm)continue;
    const t=parseInt(tm[1],10)*60+parseFloat(tm[2]);
    let rest=line.slice(tm[0].length); const ev={t,fx:{}};
    const cut=rest.match(/\[cut:(\d+)\]/i); if(cut){ev.cut=parseInt(cut[1],10);rest=rest.replace(cut[0],'');}
    let d; const reDir=/\[([a-z]+):([^\]]*)\]/ig;
    while((d=reDir.exec(rest))!==null){ev.fx[d[1].toLowerCase()]=d[2].toLowerCase();}
    rest=rest.replace(/\[[a-z]+:[^\]]*\]/ig,'').trim();
    if(rest)ev.text=rest; events.push(ev);
  }
  events.sort((a,b)=>a.t-b.t);
  return {stills,events};
}

/* ═══════════ CANTO — carrusel Ken Burns PROCEDIMENTAL ═══════════ */
const $=id=>document.getElementById(id);
const screen=$('screen'),track=$('track'),audio=$('audio');
const layA=$('layA'),layB=$('layB'),kbA=$('kbA'),kbB=$('kbB');
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const CANTO_LETTERS='abcdefghi'.split('');   // máx 9 imágenes por Misterio
const FALLBACK_SEC=6;                          // sin duración de audio → avanza imagen cada X s
let DATA=null,lyricEvents=[];
let imgLetters=[], imgDurEach=15;             // letras detectadas (3-9) y duración por imagen
let cur=0,cantoPlaying=false,raf=0,frontA=true,curImgIdx=-1,curLine=-1;
let skipShownAt=20, epilogueMode=false;

function cantoBg(letra){ return `url('${URLS.cantoImg(letra)}')`; }
function initCanto(){
  DATA=parseLrc(LRC_TEXT);
  lyricEvents=DATA.events.filter(e=>e.text);   // el .lrc solo aporta letra/tiempos; stills/cut NO alimentan el fondo
  track.innerHTML='';
  lyricEvents.forEach(e=>{const d=document.createElement('div');d.className='ly';d.textContent=e.text;track.appendChild(d);});
  curImgIdx=-1;curLine=-1;
}
/* Detección invisible del nº de imágenes: precarga a,b,c… hasta el primer 404 (máx 9), sin pintar nada roto */
function detectCantoImages(){
  imgLetters=[]; curImgIdx=-1;
  let i=0;
  (function probe(){
    if(i>=CANTO_LETTERS.length){ finishDetect(); return; }   // tope de 9
    const letra=CANTO_LETTERS[i];
    const im=new Image();
    im.onload=()=>{ imgLetters.push(letra); if(imgLetters.length===1 && curImgIdx<0){ curImgIdx=0; showImg(0); } i++; probe(); };
    im.onerror=()=>{ finishDetect(); };                      // primer 404 → fin del conjunto de este Misterio
    im.src=URLS.cantoImg(letra);
  })();
}
/* Sin imágenes de carrusel (a,b,c…) → usar la still única P_{assetMID}.webp (la de la oración) */
function finishDetect(){
  if(imgLetters.length===0) showStill(URLS.hero);
}
function showStill(url){
  const inLayer=frontA?layB:layA, inKb=frontA?kbB:kbA, outLayer=frontA?layA:layB;
  inKb.style.background=`url('${url}')`; inKb.style.backgroundSize='cover'; inKb.style.backgroundPosition='center';
  if(!reduceMotion){ inKb.style.setProperty('--kbz',1.06); inKb.style.setProperty('--kbx','0%'); inKb.style.setProperty('--kby','0%'); inKb.style.animationDuration='30s'; inKb.classList.remove('run'); void inKb.offsetWidth; inKb.classList.add('run'); }
  inLayer.classList.add('front'); outLayer.classList.remove('front'); frontA=!frontA;
}
/* Muestra la imagen real del índice (a,b,c…) con Ken Burns variado por índice; cross-fade de dos capas */
function showImg(idx){
  const letra=imgLetters[idx]; if(!letra)return;
  const inLayer=frontA?layB:layA, inKb=frontA?kbB:kbA, outLayer=frontA?layA:layB;
  const dirs=[['-3%','-2%'],['3%','-3%'],['-2%','3%'],['2%','2%']];
  let pan=dirs[idx%dirs.length], zoom=(idx%2===0)?1.09:1.06, durS=Math.max(8,imgDurEach);
  if(reduceMotion){ zoom=1; pan=['0%','0%']; }
  inKb.style.background=cantoBg(letra);inKb.style.backgroundSize='cover';inKb.style.backgroundPosition='center';
  inKb.style.setProperty('--kbz',zoom);inKb.style.setProperty('--kbx',pan[0]);inKb.style.setProperty('--kby',pan[1]);
  inKb.style.animationDuration=durS+'s'; inKb.classList.remove('run');void inKb.offsetWidth; if(!reduceMotion) inKb.classList.add('run');
  inLayer.classList.add('front');outLayer.classList.remove('front'); frontA=!frontA;
}
function setActiveLine(idx){
  const kids=track.children;
  for(let i=0;i<kids.length;i++){kids[i].classList.toggle('active',i===idx);kids[i].classList.toggle('near',Math.abs(i-idx)===1);}
  if(idx>=0&&kids[idx]){const el=kids[idx];const anchor=$('lyrics').clientHeight*0.42;const y=el.offsetTop+el.offsetHeight/2;track.style.transform=`translateY(${anchor-y}px)`;}
}
function cantoRender(){
  // Fondo: reparto uniforme de imágenes por tiempo (procedimental, sin [stills]/[cut])
  const N=imgLetters.length;
  if(N>0){
    const dur=audio.duration;
    const seg=(dur>0&&isFinite(dur)) ? dur/N : FALLBACK_SEC;   // sin duración → fallback temporal
    imgDurEach=seg;
    const idx=Math.min(N-1, Math.max(0, Math.floor(cur/seg)));
    if(idx!==curImgIdx){ curImgIdx=idx; showImg(idx); }
  }
  // Karaoke (letra)
  let lIdx=-1;for(let i=0;i<lyricEvents.length;i++){if(lyricEvents[i].t<=cur)lIdx=i;else break;}
  if(lIdx!==curLine){curLine=lIdx;setActiveLine(lIdx);}
  if(!epilogueMode && cur>=skipShownAt) $('skipBtn').classList.add('show');
}
function cantoTick(){ if(!cantoPlaying)return; cur=audio.currentTime; cantoRender(); raf=requestAnimationFrame(cantoTick); }
function cantoPlay(){
  cantoPlaying=true;
  audio.play().catch(err=>{ console.warn('[canto] audio.play() rechazado →', err && err.name, '·', err && err.message); });
  raf=requestAnimationFrame(cantoTick);
}
function cantoPause(){ cantoPlaying=false; cancelAnimationFrame(raf); audio.pause(); }

function startCanto(fromEpilogue){
  epilogueMode=!!fromEpilogue;
  showMoment('canto');
  $('stills').classList.remove('hidden'); $('hero').classList.add('hidden');
  $('skipBtn').classList.toggle('show', epilogueMode);   // epílogo: skip desde 0
  cur=0; curImgIdx=-1; curLine=-1; frontA=true;
  detectCantoImages();                                    // precarga a..i para el reparto uniforme por tiempo
  audio.src=URLS.cantoAudio; audio.load();
  audio.onended=()=>{ if(epilogueMode)backToEpilogue(); else advanceFromCanto(); };
  audio.onerror=()=>{ const er=audio.error; console.warn('[canto] audio error → code', er&&er.code, '·', er&&er.message); $('skipBtn').classList.add('show'); };
  audio.currentTime=0; cantoPlay();
}
$('skipBtn').onclick=()=>{ cantoPause(); if(epilogueMode)backToEpilogue(); else advanceFromCanto(); };

/* ═══════════ REPRODUCTOR (M2/M3/M4) ═══════════ */
const STEPS=[
  {key:'ubible', kicker:'Palabra',        url:()=>URLS.ubible, sec:'texto', txt:()=>({ref:MISTERIO.referencia, body:MISTERIO.evangelio})},
  {key:'cont',   kicker:'Contemplación',  url:()=>URLS.cont,   sec:'texto', txt:()=>({ref:'Contemplación', body:MISTERIO.contemplacion})},
  {key:'rezo',   kicker:'El rezo',        url:()=>URLS.rezo,   sec:'escribir', beads:true},
  {key:'pray',   kicker:'Oración final',  url:()=>URLS.pray,   sec:'amen', txt:()=>({ref:'Oración final', body:MISTERIO.intercesion})}
];
let stepIdx=-1, playing=false;

function advanceFromCanto(){ cantoPause(); stepIdx=-1; goStep(0); }
function goStep(i){
  if(i>=STEPS.length){ goEpilogue(); return; }
  stepIdx=i; const s=STEPS[i];
  showMoment('player');
  $('stills').classList.add('hidden'); $('hero').classList.remove('hidden');
  $('hero').style.backgroundImage=`url('${URLS.hero}')`;
  $('pKicker').textContent=s.kicker; $('pTitle').textContent=MISTERIO.titulo; $('pSub').textContent=MISTERIO.subtitulo;
  updateProgress();
  const secLbl=$('secLbl'), secIc=$('secIc');
  if(s.sec==='escribir'){ secLbl.textContent='Escribir'; secIc.innerHTML='<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'; }
  else { secLbl.textContent='Texto'; secIc.innerHTML='<path d="M4 6h16M4 12h16M4 18h10"/>'; }
  $('beadsCol').classList.toggle('hidden', !s.beads);
  if(s.beads) renderBeadsCol();
  audio.src=s.url(); audio.load(); _updateSyncKey(s.url()); hideAdvance();
  audio.onended=()=>{ goStep(stepIdx+1); };
  audio.onerror=()=>{ const er=audio.error; console.warn('[player] audio error →', s.key, '· code', er&&er.code, '·', er&&er.message); showAdvance('Audio aún no generado'); };
  playing=true; setPP(true); audio.currentTime=0; audio.play().catch(err=>{ console.warn('[player] audio.play() rechazado →', s.key, err && err.name); });
  audio.ontimeupdate=()=>{ if(s.beads)_tickBeads(); };
}
function setPP(on){ $('ppIc').innerHTML = on?'<path d="M8 5v14M16 5v14"/>':'<path d="M8 5v14l11-7z"/>'; $('ppIc').style.fill=on?'none':'#1a1305'; $('ppIc').style.stroke=on?'#1a1305':'none'; }
$('ppBtn').onclick=()=>{ playing=!playing; if(playing){audio.play();}else{audio.pause();} setPP(playing); };
$('secBtn').onclick=()=>{
  const s=STEPS[stepIdx];
  if(s.sec==='escribir'){ openDiary(); }
  else { const t=s.txt(); openText(t.ref,t.body, s.sec==='amen'?'Amén':'Continuar', ()=>{ goStep(stepIdx+1); }); }
};
function showAdvance(msg){ $('advanceMsg').textContent=msg||''; $('advanceChip').classList.add('show'); }
function hideAdvance(){ $('advanceChip').classList.remove('show'); }
$('advanceBtn').onclick=()=>{ hideAdvance(); goStep(stepIdx+1); };

function updateProgress(){
  const dots=['canto','ubible','cont','rezo','pray','epilogo'];
  const key = stepIdx>=0 ? STEPS[stepIdx].key : 'canto';
  const ci = dots.indexOf(key);
  $('progress').innerHTML = dots.map((d,i)=>`<div class="pdot ${i<ci?'done':i===ci?'active':''}"></div>`).join('');
}

/* ═══════════ BEADS (indicador pasivo del rezo — no tocar) ═══════════ */
let _currentSyncKey=null;
function renderBeadsCol(){
  const col=$('beadsCol'); col.innerHTML='';
  const pater=document.createElement('div'); pater.className='bead-pater'; pater.id='bead-pater'; col.appendChild(pater);
  const sep=document.createElement('div'); sep.className='bead-sep'; col.appendChild(sep);
  for(let i=0;i<10;i++){const d=document.createElement('div');d.className='bead';col.appendChild(d);}
  const lux=document.createElement('div'); lux.className='bead-lux'; lux.id='bead-lux';
  lux.innerHTML='<svg width="20" height="20" viewBox="0 0 100 100"><rect x="46.2" y="0" width="7.6" height="100" fill="var(--gold)"/><rect x="0" y="36" width="100" height="7.6" fill="var(--gold)"/></svg>';
  col.appendChild(lux);
}
function _getBeadEl(idx){ if(idx===0)return $('bead-pater'); return document.querySelectorAll('#beadsCol .bead')[idx-1]||null; }
function _updateSyncKey(trackUrl){
  if(!BEADSYNC||!trackUrl){_currentSyncKey=null;return;}
  const name=trackUrl.split('/').pop().replace(/\?.*$/,'').replace(/\.mp3$/i,'').toUpperCase();
  _currentSyncKey=Object.keys(BEADSYNC).find(k=>k.toUpperCase()===name)||null;
}
function _tickBeads(){
  if(!_currentSyncKey||!BEADSYNC)return;
  const windows=BEADSYNC[_currentSyncKey]; if(!windows)return;
  const t=audio.currentTime; let active=-1;
  for(let i=0;i<windows.length;i++){if(t>=windows[i].start&&t<=windows[i].end){active=i;break;}}
  for(let i=0;i<windows.length;i++){ const el=_getBeadEl(i); if(!el)continue;
    el.classList.remove('active','lit-normal');
    if(i===active)el.classList.add('active'); else if(t>windows[i].end)el.classList.add('lit-normal'); }
  const lux=$('bead-lux'); if(lux){const last=windows[windows.length-1]; if(t>last.end)lux.classList.add('show');else lux.classList.remove('show');}
}

/* ═══════════ POPUPS de texto ═══════════ */
function openText(ref,body,nextLbl,onNext){
  $('txtRef').textContent=ref||''; $('txtBody').textContent=body||''; $('txtNext').textContent=nextLbl||'Continuar';
  $('txtNext').onclick=()=>{ closeText(); if(onNext)onNext(); };
  $('txtPop').classList.add('show');
}
function closeText(){ $('txtPop').classList.remove('show'); }
$('txtClose').onclick=closeText;

function openDiary(){ $('diaryPrompt').textContent=MISTERIO.meditacion||''; $('diaryPop').classList.add('show'); }
$('diaryClose').onclick=()=>$('diaryPop').classList.remove('show');
$('diarySave').onclick=()=>{ /* TODO: guardar en el diario real (users/{uid}/reflections o diario.html) */ $('diaryPop').classList.remove('show'); };

/* ═══════════ EPÍLOGO ═══════════ */
function goEpilogue(){ audio.pause(); playing=false; hideAdvance(); showMoment('epilogue'); $('stills').classList.add('hidden'); $('hero').classList.remove('hidden'); updateProgress(); }
function backToEpilogue(){ cantoPause(); epilogueMode=false; goEpilogue(); }
$('epiCanto').onclick=()=>startCanto(true);
$('epiDiario').onclick=openDiary;
$('epiSalir').onclick=()=>{ /* TODO: marcar 'completado' + consumir crédito antes de salir */ volver(); };

/* ═══════════ Director de escena ═══════════ */
function showMoment(name){
  ['canto','player','epilogue'].forEach(m=>$('m-'+m).classList.toggle('show', m===name));
  $('scrim').classList.toggle('hidden', false);
}

/* ═══════════ Navegación / tema (patrón del repo) ═══════════ */
function volver(){ location.href = base + 'sanar.html'; }
$('backBtn').onclick=volver;

let isLight = localStorage.getItem('cruzando_theme')==='light';
function applyTheme(light){
  document.body.classList.toggle('light', light);
  const mt=document.querySelector('meta[name="theme-color"]'); if(mt) mt.content = light ? '#E6DED3' : '#1A0E04';
  localStorage.setItem('cruzando_theme', light?'light':'dark');
}
if(isLight) applyTheme(true);
$('themeBtn').onclick=()=>{ isLight=!isLight; applyTheme(isLight); };

$('volBtn').onclick=()=>$('volPop').classList.toggle('show');
$('volSlider').oninput=e=>{ audio.volume=e.target.value/100; };
audio.volume=0.8;

/* ═══════════ Arranque — datos listos, gesto de inicio ═══════════ */
function paintTexts(){
  const tit = (MISTERIO && MISTERIO.titulo) || 'Tu Misterio';
  const sub = (MISTERIO && MISTERIO.subtitulo) || '';
  $('sgTitle').textContent = tit;
  $('sgSub').textContent = sub;
  $('epiSub').textContent = tit + (sub ? ' · ' + sub : '');
  document.title = 'Mini sesión · ' + tit;
}
const startGate=$('startGate'), startBtn=$('startBtn');
startBtn.onclick=()=>{ startGate.classList.add('hidden'); startCanto(false); };
loadData()
  .then(()=>{ paintTexts(); startBtn.disabled=false; startBtn.textContent='Tocar para orar'; })
  .catch(err=>{ console.error('[mini] loadData falló →', err); paintTexts(); startBtn.disabled=false; startBtn.textContent='Tocar para orar'; });
</script>
