<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A1714">
<title>CruzAndo · Sesión Diaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════
   CruzAndo · Sesión Diaria · audio.html
   Módulo experimental standalone
   ══════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ── Tema oscuro (default) ── */
  --bg:        #1A1714;
  --card:      #252119;
  --border:    #3A3530;
  --text:      #E6DED3;
  --text-soft: #B8A898;
  --text-dim:  #786858;
  --sec-bg:    #1E1B16;
  --shadow:    rgba(0,0,0,0.4);
  --green:     #34A853;
  --green-soft:rgba(52,168,83,0.18);
  --lvl-bold:  #FF7A00;
  --lvl-soft:  #F69C49;
  --lvl-light: #FFCFA2;
  --lvl-ultra: rgba(255,122,0,0.10);
  --goz-color: #D4A017;
  --lum-color: #01BBE1;
  --dol-color: #C0392B;
  --glo-color: #8E44AD;
  /* RGB del bg para los degradados de imagen */
  --bg-rgb:    26,23,20;
}

/* ── Tema claro ── */
body.light {
  --bg:        #F5F0E8;
  --card:      #FFFCF7;
  --border:    #D9D1C7;
  --text:      #2B2622;
  --text-soft: #6B6259;
  --text-dim:  #9B9389;
  --sec-bg:    #EDE8DF;
  --shadow:    rgba(43,38,34,0.10);
  --green-soft:rgba(52,168,83,0.12);
  --bg-rgb:    245,240,232;
}

html { font-size: 18px; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── Shell ── */
.shell {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  position: relative;
}

/* ── Screens ── */
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; min-height: 100dvh; }

/* ══════════════════════════════════════════════
   PANTALLA: LOGIN
   ══════════════════════════════════════════════ */
#scr-login {
  align-items: center;
  justify-content: center;
  padding: 40px 28px;
  background: var(--bg);
  text-align: center;
}
.login-logo {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 2.8rem;
  font-weight: 600;
  color: var(--lvl-bold);
  letter-spacing: -1px;
  margin-bottom: 6px;
}
.login-subtitle {
  font-size: 0.78rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 48px;
}
.login-form { width: 100%; max-width: 340px; text-align: left; }
.login-label {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 8px;
  display: block;
}
.login-input {
  width: 100%;
  padding: 14px 18px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s;
  margin-bottom: 16px;
}
.login-input:focus { border-color: var(--lvl-bold); }
.btn-login {
  width: 100%;
  padding: 15px;
  background: var(--lvl-bold);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  margin-bottom: 14px;
}
.btn-login:active { transform: scale(0.97); }
.btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 4px 0 14px;
}
.divider-line { flex: 1; height: 1px; background: var(--border); }
.divider-text { font-size: 0.72rem; color: var(--text-dim); }
.btn-google {
  width: 100%;
  padding: 14px;
  background: var(--card);
  color: var(--text);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-family: 'Inter', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: border-color 0.2s, transform 0.15s;
}
.btn-google:active { transform: scale(0.97); }
.btn-google:hover { border-color: var(--text-dim); }
.login-error {
  margin-top: 14px;
  padding: 12px 16px;
  background: rgba(192,57,43,0.15);
  border: 1px solid rgba(192,57,43,0.3);
  border-radius: 10px;
  font-size: 0.82rem;
  color: #e74c3c;
  display: none;
}

/* ══════════════════════════════════════════════
   PANTALLA: LOADING
   ══════════════════════════════════════════════ */
#scr-loading {
  align-items: center;
  justify-content: center;
  padding: 40px;
  text-align: center;
}
.loading-logo {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 2.2rem;
  font-weight: 600;
  color: var(--lvl-bold);
  margin-bottom: 8px;
}
.loading-msg { font-size: 0.82rem; color: var(--text-dim); margin-top: 6px; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--lvl-bold);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════════════════════════
   PANTALLA: SESIÓN PRINCIPAL
   ══════════════════════════════════════════════ */
#scr-session {
  flex-direction: column;
  height: 100dvh;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

/* ── Fondo difuminado full-screen ── */
.session-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}
.session-bg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  filter: blur(18px) brightness(0.35);
  transform: scale(1.1);
  opacity: 0.9;
}

/* ── Hero — ocupa todo el espacio disponible sobre los controles ── */
.hero {
  position: relative;
  z-index: 1;
  width: 100%;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.hero-img-wrap {
  position: relative;
  width: 100%;
  height: 100%;
}
.hero-img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center top;
  border-radius: 0;
}
.hero-img-placeholder {
  width: 100%;
  height: 100%;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
}
/* ── Welcome overlay: bienvenida visual durante INTRO y START ── */

/* Degradados — fusionan imagen con fondo */
.hero-grad-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 35%;
  background: linear-gradient(
    to bottom,
    rgba(var(--bg-rgb), 0.85) 0%,
    transparent 100%
  );
  pointer-events: none;
  z-index: 4;
}
.hero-grad-bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 55%;
  background: linear-gradient(
    to top,
    rgba(0,0,0,0.82)  0%,
    rgba(0,0,0,0.60)  30%,
    rgba(0,0,0,0.25)  60%,
    transparent       100%
  );
  pointer-events: none;
  z-index: 4;
}

/* Texto sobre la imagen — esquina inferior */
.hero-bottom-text {
  position: absolute;
  bottom: 16px; left: 18px; right: 18px;
  z-index: 5; pointer-events: none;
}
.audio-bloque-label {
  font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 2px; color: var(--lvl-bold);
  margin-bottom: 4px;
}
.audio-hero-titulo {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 2rem; font-weight: 600; color: #fff;
  line-height: 1.15; margin-bottom: 4px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.5);
}
.audio-hero-subtitulo {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1rem; font-style: italic;
  color: rgba(255,255,255,0.75);
  text-shadow: 0 1px 6px rgba(0,0,0,0.5);
}
.audio-hero-beads { display: flex; gap: 7px; margin-top: 8px; }

/* ── Controles — glass sobre fondo difuminado ── */
.session-controls {
  position: relative;
  z-index: 1;
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  padding: 10px 20px 12px;
  background: rgba(var(--bg-rgb), 0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 20px 20px 0 0;
  margin-top: -20px;
  gap: 0;
  overflow: hidden;
  justify-content: space-between;
}

/* Sección actual */
.section-label-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.section-perspective {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  padding-left: 2px;
  animation: fadeIn 0.3s ease;
  min-height: 1.6rem;
}
.perspective-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.perspective-label {
  font-size: 0.95rem;
  font-style: italic;
  color: var(--text-soft);
  line-height: 1.3;
}
.section-label {
  font-size: 0.88rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--lvl-soft);
  display: flex;
  align-items: center;
  gap: 7px;
}
.section-pulse {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--lvl-bold);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.5; transform: scale(1.4); }
}
.section-time {
  font-size: 0.82rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

/* Segmentos de secciones */
.playlist-progress {
  display: flex;
  gap: 3px;
  padding: 10px 18px 0;
}
.playlist-seg {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: var(--border);
  overflow: hidden;
  transition: background 0.3s;
}
.playlist-seg.done { background: var(--lvl-bold); }
.playlist-seg.active { background: var(--border); }
.playlist-seg.active .playlist-seg-fill {
  height: 100%;
  background: var(--lvl-bold);
  border-radius: 2px;
  transition: width 0.3s linear;
}
.playlist-seg-fill { width: 0%; }

/* ── Audio Bottom: progreso + toolbar ── */
.audio-bottom {
  position: relative;
  z-index: 2;
  flex: 0 0 auto;
  background: var(--audio-bottom-bg, var(--card));
  border-top: 1px solid var(--border);
}

/* ── Variables de contraste para toolbar (dark default → light override) ── */
:root { --tb-circle-bg:rgba(255,255,255,0.06); --tb-circle-border:rgba(255,255,255,0.22); --tb-icon:rgba(255,255,255,0.62); --tb-bead:rgba(255,255,255,0.16); }
body.light { --tb-circle-bg:var(--card); --tb-circle-border:var(--border); --tb-icon:var(--text-dim); --tb-bead:var(--card); }

/* ── Audio Toolbar (5 botones estilo rosario) ── */
.audio-tools-bar {
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px 12px env(safe-area-inset-bottom, 8px);
  position: relative;
}
.audio-tools-bar::before {
  content: '';
  position: absolute;
  top: 32px;
  left: 0; right: 0;
  height: 1.5px;
  background: var(--tb-bead);
  z-index: 0;
}
.atb-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
  touch-action: manipulation;
}
.atb-circle {
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 2px solid var(--tb-circle-border);
  background: var(--tb-circle-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--tb-icon);
  transition: all 0.2s;
  position: relative;
  z-index: 1;
}
.atb-circle.primary {
  background: var(--lvl-bold);
  border-color: var(--lvl-bold);
  color: #fff;
  box-shadow: 0 4px 16px rgba(var(--lvl-bold-rgb,255,122,0), 0.45);
}
.atb-btn:active .atb-circle { transform: scale(0.9); }

/* Barra de progreso del audio actual */
.audio-progress-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 18px 0;
}
.audio-progress-bar {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  overflow: visible;
}
.audio-progress-fill {
  height: 100%;
  background: var(--lvl-bold);
  border-radius: 3px;
  width: 0%;
  transition: width 0.1s linear;
  position: relative;
}
.audio-progress-fill::after {
  content: '';
  position: absolute;
  right: -5px; top: -4px;
  width: 12px; height: 12px;
  background: var(--lvl-bold);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.2s;
}
.audio-progress-bar:hover .audio-progress-fill::after { opacity: 1; }
.audio-time {
  font-size: 0.68rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Metros ganados */
.meters-row { display: none; }
.meters-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 16px;
  background: var(--lvl-ultra);
  border: 1px solid rgba(var(--lvl-bold-rgb,255,122,0), 0.25);
  border-radius: 20px;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--lvl-soft);
}
.meters-icon { font-size: 0.9rem; }

/* Botón de completar sesión */
.btn-complete {
  width: 100%;
  padding: 15px;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  margin-top: 16px;
  display: none;
}
.btn-complete.visible { display: block; }
.btn-complete:active { transform: scale(0.97); }



/* ── Notificación de metros ganados ── */
.meters-toast {
  position: fixed;
  bottom: 96px;
  right: 20px;
  padding: 8px 16px;
  background: var(--card);
  border: 1.5px solid var(--lvl-soft);
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--lvl-soft);
  z-index: 200;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
}
.meters-toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* ══════════════════════════════════════════════
   MODAL: PREGUNTAS DE MEDITACIÓN
   ══════════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,8,6,0.75);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 300;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 0;
}
.modal-overlay.open { display: flex; }

.modal-sheet {
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  border-top: 1.5px solid var(--border);
  padding: 0 0 env(safe-area-inset-bottom, 0);
  max-height: 85dvh;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.32s cubic-bezier(0.34, 1.4, 0.64, 1);
}
@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0.7; }
  to   { transform: translateY(0);    opacity: 1; }
}

.modal-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 12px auto 0;
  flex-shrink: 0;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px 12px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.modal-title {
  font-size: 0.95rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-dim);
}
.modal-saved {
  font-size: 0.85rem;
  color: var(--green);
  opacity: 0;
  transition: opacity 0.3s;
}
.modal-saved.show { opacity: 1; }
.modal-close {
  width: 28px; height: 28px;
  background: var(--sec-bg);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-soft);
  transition: background 0.2s;
}
.modal-close:active { background: var(--border); }

.modal-body {
  overflow-y: auto;
  flex: 1;
  padding: 16px 20px 24px;
  -webkit-overflow-scrolling: touch;
}

.question-group {
  margin-bottom: 22px;
}
.question-label-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.question-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.question-label {
  font-size: 0.95rem;
  font-weight: 700;
  text-transform: none;
  letter-spacing: 0;
  font-style: italic;
}
.question-text {
  font-size: 1.05rem;
  color: var(--text-soft);
  line-height: 1.7;
  margin-bottom: 12px;
  font-style: italic;
}
.question-textarea {
  width: 100%;
  min-height: 80px;
  padding: 12px 14px;
  background: var(--sec-bg);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
  line-height: 1.7;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
}
.question-textarea:focus { border-color: var(--lvl-soft); }
.question-meters {
  font-size: 0.82rem;
  color: var(--text-dim);
  margin-top: 5px;
  text-align: right;
  min-height: 14px;
  transition: color 0.3s;
}
.question-meters.earned { color: var(--lvl-soft); }

/* ══════════════════════════════════════════════
   PANTALLA: COMPLETADO
   ══════════════════════════════════════════════ */
#scr-complete {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
  pointer-events: none;
}
#scr-complete.open {
  transform: translateY(0);
  pointer-events: auto;
}
.epilogo-handle {
  width: 40px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 10px auto 4px;
  flex-shrink: 0;
}

/* ── Epílogo del canto ── */
.epilogo-canto {
  width: 100%;
  flex: 1;
  min-height: 0;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  text-align: left;
}
.epilogo-canto-header {
  flex-shrink: 0;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.epilogo-canto-titulo {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--text);
  flex: 1;
}
.epilogo-canto-badge {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--lvl-soft);
  background: var(--lvl-ultra);
  padding: 3px 10px;
  border-radius: 20px;
  white-space: nowrap;
}
/* Player del canto en epílogo */
.epilogo-player {
  flex-shrink: 0;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.epilogo-play-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--lvl-bold);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex-shrink: 0;
  transition: transform 0.15s;
}
.epilogo-play-btn:active { transform: scale(0.92); }
.epilogo-player-bar {
  flex: 1;
}
.epilogo-bar-track {
  width: 100%;
  height: 4px;
  background: var(--border);
  border-radius: 3px;
  cursor: pointer;
  margin-bottom: 4px;
}
.epilogo-bar-fill {
  height: 100%;
  background: var(--lvl-bold);
  border-radius: 3px;
  width: 0%;
  transition: width 0.1s linear;
}
.epilogo-bar-time {
  font-size: 0.7rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
/* Letra del canto */
.epilogo-letra {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 16px 20px 20px;
  font-size: 1rem;
  line-height: 1.85;
  color: var(--text-soft);
  white-space: pre-line;
  font-style: italic;
}
.epilogo-canto-titulo-wrap {
  flex: 1;
}
.epilogo-canto-subtitulo {
  display: block;
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 3px;
}
/* Zona inferior: metros + botones */
#complete-controls {
  flex-shrink: 0;
  padding: 10px 20px calc(16px + 64px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.complete-meters {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--lvl-bold);
}
.btn-next-session {
  width: 100%;
  max-width: 320px;
  padding: 15px;
  background: var(--lvl-bold);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  margin-bottom: 12px;
}
.btn-next-session:active { transform: scale(0.97); }

/* ══════════════════════════════════════════════
   UTILIDADES COMUNES
   ══════════════════════════════════════════════ */
.fade-in { animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }


/* ── Bottom nav bar (estándar CruzAndo) ── */
.app-nav {
  position:fixed; bottom:0; left:50%;
  transform:translateX(-50%) translateY(100%);
  width:100%; max-width:480px; z-index:250;
  background:var(--bg); border-top:1px solid var(--border);
  display:flex; align-items:stretch;
  padding-bottom:env(safe-area-inset-bottom, 0px);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.app-nav.visible { transform:translateX(-50%) translateY(0); }
.app-nav-item {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:4px; padding:10px 4px 12px;
  background:none; border:none; cursor:pointer;
  font-family:inherit; text-decoration:none;
  color:var(--text-dim); transition:color 0.2s;
  -webkit-tap-highlight-color:transparent;
}
.app-nav-item:active { opacity:1; }
.app-nav-item.active { color:var(--lvl-bold); }
.app-nav-item[disabled] { cursor:default; opacity:1; }
@keyframes navSpring {
  0%   { transform:scale(1); }
  35%  { transform:scale(0.78); }
  65%  { transform:scale(1.18); }
  82%  { transform:scale(0.95); }
  100% { transform:scale(1); }
}
.app-nav-item.tapped .app-nav-icon { animation:navSpring 0.38s cubic-bezier(0.34,1.72,0.64,1) both; }
.app-nav-item.tapped { color:var(--lvl-bold); }
.app-nav-icon {
  width:24px; height:24px; position:relative;
  display:flex; align-items:center; justify-content:center;
}
.app-nav-item.active .app-nav-icon::before {
  content:''; position:absolute; inset:-5px;
  background:rgba(255,122,0,0.12); border-radius:10px;
}
.app-nav-label {
  font-size:0.6rem; font-weight:600; letter-spacing:0.4px;
  text-transform:uppercase;
}


/* Referencia bíblica en el degradado inferior */
.hero-reference {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.55);
  margin-top: 4px;
  letter-spacing: 0.5px;
  font-style: normal;
}

/* ══ Micro-aprendizaje — overlay emergente ══════════════════════ */
#scr-micro {
  position: fixed; inset: 0; z-index: 600;
  background: var(--bg); overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
  display: block;
  pointer-events: none;
}
#scr-micro.open { transform: translateY(0); pointer-events: auto; }
.micro-handle {
  width: 40px; height: 4px; background: var(--border);
  border-radius: 2px; margin: 12px auto 0; flex-shrink: 0;
}
.micro-screen { padding: 0 18px 100px; }
.micro-header {
  padding: 18px 0 12px; display: flex; align-items: center; justify-content: space-between;
}
.micro-label {
  font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.2px; color: var(--lvl-bold);
}
.micro-sub {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1.2rem; font-weight: 600; color: var(--text); margin-top: 2px;
}
.micro-progress { display: flex; gap: 6px; margin-bottom: 16px; }
.micro-dot { height: 5px; border-radius: 3px; background: var(--border); transition: all 0.4s ease; }
.micro-dot.done { background: var(--green); }
.micro-dot.active { background: var(--lvl-bold); }
.micro-card {
  background: var(--card); border-radius: 20px; padding: 28px 22px;
  border: 1.5px solid var(--border); animation: slideUp 0.4s ease both;
  min-height: 200px; display: flex; flex-direction: column; justify-content: space-between;
}
.micro-card-emoji  { font-size: 2.2rem; margin-bottom: 14px; }
.micro-card-titulo {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1.55rem; font-weight: 600; color: var(--lvl-bold); line-height: 1.2; margin-bottom: 12px;
}
.micro-card-contenido {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1.2rem; font-weight: 400; line-height: 1.75; color: var(--text); flex: 1;
}
.micro-card-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border);
}
.micro-card-count { font-size: 0.68rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.8px; }
.micro-q-card {
  background: var(--card); border-radius: 20px; padding: 24px 22px;
  border: 1.5px solid var(--border); animation: slideUp 0.45s cubic-bezier(0.34,1.72,0.64,1) both;
}
.micro-q-label {
  font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.2px; color: var(--lvl-bold); margin-bottom: 14px;
}
.micro-q-texto {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1.35rem; font-weight: 500; line-height: 1.55; color: var(--text); margin-bottom: 20px;
}
.micro-option {
  width: 100%; padding: 13px 16px; border-radius: 14px;
  border: 1.5px solid var(--border); background: transparent;
  color: var(--text); font-family: inherit; font-size: 0.88rem;
  cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px;
  transition: all 0.2s; margin-bottom: 10px;
}
.micro-option.selected { border-color: var(--lvl-bold); background: rgba(255,122,0,0.07); }
.micro-option.dimmed  { opacity: 0.4; cursor: default; pointer-events: none; }
.micro-option-circle {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  border: 1.5px solid var(--border); background: transparent; font-size: 0.75rem;
  display: flex; align-items: center; justify-content: center; color: var(--lvl-bold);
}
.micro-eco {
  margin-top: 10px; padding: 12px 14px; border-radius: 12px;
  background: rgba(255,122,0,0.06); border: 1px solid rgba(255,122,0,0.15);
  font-family: 'Crimson Pro', Georgia, serif; font-size: 1.05rem; color: var(--text-soft);
  display: flex; align-items: flex-start; gap: 8px;
}
.micro-eco-emoji { font-size: 1.3rem; flex-shrink: 0; margin-top: 1px; }
.micro-final {
  text-align: center; padding: 40px 0 20px;
}
.micro-final-cross { margin-bottom: 24px; }
.micro-final-titulo {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1.6rem; font-weight: 600; color: var(--text); margin-bottom: 10px;
}
.micro-final-sub {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1.1rem; color: var(--text-soft); line-height: 1.6; margin-bottom: 20px;
}
.micro-metros-chip {
  display: inline-block; padding: 6px 14px; border-radius: 20px;
  background: rgba(76,175,125,0.12); color: var(--green);
  font-size: 0.78rem; font-weight: 700; margin-bottom: 24px;
}
.micro-nav { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
.micro-btn-primary {
  width: 100%; padding: 15px; border-radius: 14px;
  background: var(--lvl-bold); color: #fff; border: none;
  font-family: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer;
  transition: opacity 0.2s; -webkit-tap-highlight-color: transparent;
}
.micro-btn-primary:active { opacity: 0.85; }
.micro-btn-outline {
  width: 100%; padding: 13px; border-radius: 14px;
  background: transparent; color: var(--text-soft);
  border: 1.5px solid var(--border); font-family: inherit; font-size: 0.88rem;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}

/* ── Overlay oscuro dinámico sobre la imagen del hero ── */
.hero-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.82);
  z-index: 4;
  transition: opacity 0.7s ease;
  pointer-events: none;
}
.hero-overlay.revealed { opacity: 0; }

/* Textos de identidad sobre el overlay oscuro */
.hero-identity {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px 16px;
  transition: opacity 0.5s ease;
  pointer-events: none;
}
.hero-identity.hidden { opacity: 0; }
.hero-identity-nivel {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: rgba(255,255,255,0.55);
  margin-bottom: 4px;
}
.hero-identity-misterio {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1.9rem;
  font-weight: 600;
  font-style: italic;
  color: #fff;
  line-height: 1.2;
  text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  margin-bottom: 6px;
  padding: 0 60px;
  text-align: center;
}
.hero-identity-bloque {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--lvl-bold);
  margin-top: 6px;
}

/* ── Columnas de botones circulares sobre el hero ── */
.hero-btn-col {
  position: absolute;
  top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
}
.hero-btn-col.left  { left: 12px; }
.hero-btn-col.right { right: 12px; }

.hero-circle-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(0,0,0,0.42);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.14);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.82);
  transition: background 0.2s, opacity 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.hero-circle-btn:active { transform: scale(0.88); background: rgba(0,0,0,0.65); }
.hero-circle-btn.muted  { opacity: 0.4; }

/* ── Navegación ← → entre misterios (hero) ── */
.hero-mystery-nav{position:absolute;top:50%;transform:translateY(-50%);left:0;right:0;display:flex;justify-content:space-between;padding:0 8px;pointer-events:none;z-index:10}
.hero-nav-btn{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,0.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1.5px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.85);cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background 0.15s,transform 0.15s}
.hero-nav-btn:active{background:rgba(0,0,0,0.55);transform:scale(0.92)}

/* ── Preparación en el hero (pill) ── */
.prep-hero{position:absolute;top:10px;left:54px;right:54px;z-index:10}
.prep-hero-btn{width:100%;height:34px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;background:rgba(0,0,0,0.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:17px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden}
.prep-hero-btn:active{opacity:0.7}
.prep-hero-kicker{font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--lvl-bold);flex-shrink:0}
.prep-hero-name{font-size:0.75rem;color:rgba(255,255,255,0.8);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Botón de Preparación (ya completado el micro) ── */
.prep-btn-wrap { padding: 12px 0 4px; }
.prep-btn {
  width: 100%; padding: 16px 20px; border-radius: 16px;
  background: var(--card); border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; text-align: left; color: var(--text);
  font-family: inherit; -webkit-tap-highlight-color: transparent;
  transition: border-color 0.2s;
}
.prep-btn:active { border-color: var(--lvl-bold); }
.prep-btn-label {
  font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: var(--lvl-bold); display: block; margin-bottom: 2px;
}
.prep-btn-name {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1.05rem; font-weight: 500; color: var(--text-soft);
}

/* ── Waveform overlay sobre imagen ── */
.waveform-overlay {
  position: absolute;
  bottom: 30%;
  left: 0; right: 0;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  pointer-events: none;
  z-index: 3;
}
.wave-bar {
  width: 3px;
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  transform-origin: center;
  animation: waveAnim var(--dur) ease-in-out infinite alternate;
  animation-play-state: paused;
}
@keyframes waveAnim {
  from { height: 4px; }
  to   { height: var(--h); }
}
.nav-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:1;padding:10px 4px 12px;text-decoration:none;color:var(--text-muted)}

/* ── Audio Home ── */
/* ── Audio Home — overlay emergente (como epílogo) ── */

<body>
<div class="shell">

  <!-- ═══ PANTALLA: LOADING ═══ -->
  <div class="screen active" id="scr-loading">
    <div class="spinner"></div>
    <div class="loading-logo">CruzAndo</div>
    <div class="loading-msg" id="loading-msg">Iniciando…</div>
  </div>

  <!-- ═══ PANTALLA: LOGIN ═══ -->
  <div class="screen" id="scr-login">
    <div class="login-logo">CruzAndo</div>
    <div class="login-subtitle">Sesión Diaria</div>
    <div class="login-form">
      <label class="login-label" for="inp-email">Correo electrónico</label>
      <input class="login-input" type="email" id="inp-email" placeholder="tu@correo.com" autocomplete="email">
      <label class="login-label" for="inp-pass">Contraseña</label>
      <input class="login-input" type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password">
      <button class="btn-login" id="btn-email-login">Entrar</button>
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">o continúa con</span>
        <div class="divider-line"></div>

let _prevMysteryBusy = false;
window._goToPrevMystery = async () => {
  if (_prevMysteryBusy) return;
  _prevMysteryBusy = true;
  show('scr-loading'); setMsg('Cargando misterio anterior…');

  try {
    if (!audioProgress) { location.reload(); return; }

    let { nivel, cuaderno, misterio } = audioProgress;
    misterio--;
    if (misterio < 1) {
      misterio = 20; cuaderno--;
      if (cuaderno < 1) { cuaderno = 4; nivel = Math.max(1, nivel - 1); }
    }
    audioProgress.nivel    = nivel;
    audioProgress.cuaderno = cuaderno;
    audioProgress.misterio = misterio;
    audioProgress.firstAnswered = [false, false, false];

    console.log('Retrocediendo a:', nivel, cuaderno, misterio);
    await saveAudioProgress();

    if (epilogoAudioEl) { epilogoAudioEl.pause(); epilogoAudioEl = null; }
    sessionMeters = 0; sectionRewards = new Set(); sessionCompleted = false; currentTrack = -1;
    stopAudio(); bgmStop();

    // Recargar JSON del cuaderno si es diferente al actual
    const nivelId = String(nivel).padStart(2,'0') + String(cuaderno).padStart(2,'0');
    const base = location.origin + location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
    try {
      const resp = await fetch(base + 'data/' + nivelId + '.json');
      if (resp.ok) currentData = await resp.json();
    } catch(e) { console.warn('No se pudo recargar JSON:', e); }

    await buildSession();
  } catch(e) {
    console.error('Error en _goToPrevMystery:', e);
    setMsg('Error al cargar. Recargando…');
    setTimeout(() => location.reload(), 1500);
  } finally {
    _prevMysteryBusy = false;
  }
};

window._repeatSession = async () => {
  closeEpilogo();
  if (epilogoAudioEl) { epilogoAudioEl.pause(); epilogoAudioEl = null; }
  audioProgress.firstAnswered = [false, false, false];
  await saveAudioProgress();
  sessionMeters = 0; sessionCompleted = false; currentTrack = -1;

window.advanceAndRestart = async () => {
  closeEpilogo();
  if (epilogoAudioEl) { epilogoAudioEl.pause(); epilogoAudioEl = null; }
  let { nivel, cuaderno, misterio } = audioProgress;
  misterio++;

  audioProgress.nivel = nivel;
  audioProgress.cuaderno = cuaderno;
  audioProgress.misterio = misterio;
  audioProgress.firstAnswered = [false, false, false];
  await saveAudioProgress();
  sessionMeters = 0; sectionRewards = new Set(); sessionCompleted = false;

  stopAudio();
  await buildSession();
};

// Primer misterio (1-20) no completado en el nivel/cuaderno dado,
// según el historial de la sesión de audio. Si todos están hechos, devuelve 1.
function getFirstUncompletedMisterio(nivel, cuaderno) {
  if (!audioProgress || !audioProgress.history) return 1;
  const done = new Set(
    audioProgress.history
      .filter(h => h.n === nivel && h.c === cuaderno)
      .map(h => h.m)
  );
  for (let m = 1; m <= 20; m++) {
    if (!done.has(m)) return m;
  }
  return 1;
}

async function loadUserAndStart(skipProgressRead = false) {
  show('scr-loading');
  setMsg('Cargando tu camino…');

  const uid = currentUser.uid;

  // Leer plan del usuario
  userPlan = 'premium'; // default premium; se corrige tras leer Firestore
  try {
    const userSnap = await getDoc(doc(db, 'users', uid));
    if (userSnap.exists()) {
      userPlan = resolvePlan(userSnap.data()); // 'free' | 'beta' | 'premium'
    } else {
      console.warn('Documento users/uid no encontrado — asumiendo premium');
    }
  } catch(e) {
    console.warn('Error leyendo plan (asumiendo premium):', e.message);
  }

  // Leer audioProgress (omitir si ya está en memoria y skipProgressRead=true)
  if (!skipProgressRead) {
    try {
      const snap = await getDoc(doc(db, 'users', uid, 'audioProgress', 'current'));
      if (snap.exists()) {
        audioProgress = snap.data();
      } else {
        audioProgress = {
          nivel: 1, cuaderno: 1, misterio: 1,
          firstAnswered: [false, false, false],
          history: []
        };
        await setDoc(doc(db, 'users', uid, 'audioProgress', 'current'), audioProgress);
      }
    } catch(e) {
      console.error('Error cargando progreso:', e);
      if (!audioProgress) audioProgress = { nivel: 1, cuaderno: 1, misterio: 1, firstAnswered:[false,false,false], history:[] };
    }
  }

  // Si viene ?c=0101 desde world.html / orar.html, respetar el nivel solicitado
  const urlParam = new URLSearchParams(location.search).get('c');
  if (urlParam && /^\d{4}$/.test(urlParam)) {
    const urlNivel    = parseInt(urlParam.substring(0, 2), 10);
    const urlCuaderno = parseInt(urlParam.substring(2, 4), 10);
    if (urlNivel >= 1 && urlNivel <= 7 && urlCuaderno >= 1 && urlCuaderno <= 4) {
      if (audioProgress.nivel !== urlNivel || audioProgress.cuaderno !== urlCuaderno) {
        audioProgress.nivel         = urlNivel;
        audioProgress.cuaderno      = urlCuaderno;
        audioProgress.misterio      = getFirstUncompletedMisterio(urlNivel, urlCuaderno);
        audioProgress.firstAnswered = [false, false, false];
        // No guardamos en Firestore aquí: el bookmark se actualiza solo cuando
        // el usuario completa algo, para no sobreescribir la posición de frontera.
      }
    }
    // Bookmark cross-modo: guardar en localStorage el nivel que el usuario está usando
    try { localStorage.setItem('cruzando_current_nivel', urlParam); } catch(e) {}
  }

  // Si viene ?nivel=&cuaderno=&misterio= (desde index.html o orar.html), respetar posición exacta
  const _sp = new URLSearchParams(location.search);
  const _pN = parseInt(_sp.get('nivel'), 10);
  const _pC = parseInt(_sp.get('cuaderno'), 10);
  const _pM = parseInt(_sp.get('misterio'), 10);
  let goDirectly = false;
  if (!isNaN(_pN) && !isNaN(_pC) && !isNaN(_pM) &&
      _pN >= 1 && _pN <= 7 && _pC >= 1 && _pC <= 4 && _pM >= 1 && _pM <= 20) {
    audioProgress.nivel    = _pN;
    audioProgress.cuaderno = _pC;
    audioProgress.misterio = _pM;
    try { localStorage.setItem('cruzando_current_nivel', String(_pN).padStart(2,'0') + String(_pC).padStart(2,'0')); } catch(e) {}
    history.replaceState({}, '', 'audio.html');
    goDirectly = true;
  }

  console.log('userPlan:', userPlan, '| misterio:', audioProgress.nivel, audioProgress.cuaderno, audioProgress.misterio);
  await buildSession();
}

  BLOCKS.forEach((b, bi) => {

    const isToday = b === today;
    let badge = 'pending', bTxt = 'Pendiente';

      `</div></div>`;
    card.onclick = () => {
      closeAudioHome();
      audioProgress.misterio = misterioNum;
      buildSession();
    };
    grid.appendChild(card);
  });

  openAudioHome();
}

function hasSessionToday() {
  if (!audioProgress || !audioProgress.history || !audioProgress.history.length) return false;
  const last = audioProgress.history[audioProgress.history.length - 1];

  const lastDate = new Date(last.completedAt);
  const today    = new Date();
  return lastDate.getFullYear() === today.getFullYear() &&
         lastDate.getMonth()    === today.getMonth()    &&
         lastDate.getDate()     === today.getDate();
}

// Escribe el slot del misterio completado en progress/{nivelId},
// el mismo formato que lee world.html e index.html (orar.html lo escribe también aquí).
async function syncToOrarProgress(nivel, cuaderno, misterio) {
  if (!currentUser) return;

  // Mapear misterio 1-20 → bloque + índice dentro del bloque
  let block, blockIdx;
  if      (misterio <= 5)  { block = 'gozosos';   blockIdx = misterio - 1; }
  else if (misterio <= 10) { block = 'luminosos';  blockIdx = misterio - 6; }
  else if (misterio <= 15) { block = 'dolorosos';  blockIdx = misterio - 11; }
  else                     { block = 'gloriosos';  blockIdx = misterio - 16; }

  const nivelId = String(nivel).padStart(2, '0') + String(cuaderno).padStart(2, '0');
  const ref = doc(db, 'users', currentUser.uid, 'progress', nivelId);

  try {
    const snap = await getDoc(ref);
    const EMPTY_BLOCK = [null, null, null, null, null];
    const ALL_BLOCKS  = ['gozosos', 'luminosos', 'dolorosos', 'gloriosos'];

    // Partir del progreso existente para no sobreescribir lo que orar.html ya marcó
    let prog = {};
    ALL_BLOCKS.forEach(b => { prog[b] = EMPTY_BLOCK.slice(); });

    if (snap.exists()) {
      const existing = snap.data().progress || {};
      ALL_BLOCKS.forEach(b => {
        if (Array.isArray(existing[b]) && existing[b].length === 5) {
          prog[b] = existing[b].slice();
        }
      });
    }

    prog[block][blockIdx] = Date.now();
    await setDoc(ref, { progress: prog }, { merge: true });
  } catch(e) {
    console.warn('[CruzAndo] syncToOrarProgress:', e);
  }
}

  const result  = { q0:'', q1:'', q2:'' };

  // Leer el formato de orar.html (un doc por pregunta) — fuente de verdad para diario.html
  await Promise.all([0,1,2].map(async qi => {
    const docId = `${nivelId}_${block}_${blockIdx}_q${qi}`;
    try {
      const snap = await getDoc(doc(db, 'users', currentUser.uid, 'reflections', docId));
      if (snap.exists()) result[`q${qi}`] = snap.data().text || '';
    } catch(e) {}
  }));

  // Fallback: formato antiguo de audio.html (un doc con q0/q1/q2 por misterio)
  if (!result.q0 && !result.q1 && !result.q2) {
    const { misterio } = currentSession;
    const oldKey = `${nivel}_${cuaderno}_${misterio}`;
    try {
      const snap = await getDoc(doc(db, 'users', currentUser.uid, 'reflections', oldKey));
      if (snap.exists()) {
        const d = snap.data();
        result.q0 = d.q0 || '';
        result.q1 = d.q1 || '';
        result.q2 = d.q2 || '';
      }
    } catch(e) {}
  }

  return result;
}

// ════════════════════════════════════════════
// CONSTRUIR SESIÓN
// ════════════════════════════════════════════

async function buildSession() {
  const { nivel, cuaderno, misterio } = audioProgress;
  setMsg(`Preparando Nivel ${nivel}-${cuaderno}, Misterio ${misterio}…`);

  // Construir ID de nivel (ej. 0101)
  const nivelId = String(nivel).padStart(2,'0') + String(cuaderno).padStart(2,'0');

  // Cargar JSON del cuaderno
  try {
    const base = location.origin + location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
    const resp = await fetch(base + 'data/' + nivelId + '.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    currentData = await resp.json();
  } catch(e) {
    // Fallback: si no hay JSON, crear sesión con placeholders
    currentData = null;
    console.warn('No se encontró JSON para', nivelId);
  }

  // Determinar bloque (misterios del día o según posición 1-20)
  // Misterios 1-5 = gozosos, 6-10 = luminosos, 11-15 = dolorosos, 16-20 = gloriosos
  const m = misterio; // 1-20
  let block, blockIdx;
  if      (m <= 5)  { block = 'gozosos';   blockIdx = m - 1; }
  else if (m <= 10) { block = 'luminosos';  blockIdx = m - 6; }
  else if (m <= 15) { block = 'dolorosos';  blockIdx = m - 11; }
  else              { block = 'gloriosos';  blockIdx = m - 16; }

  // Datos del misterio desde JSON
  let mysteryData = null;
  if (currentData && currentData.misterios && currentData.misterios[block]) {
    mysteryData = currentData.misterios[block][blockIdx] || null;
  }

  // Construir playlist
  // Las Preguntas se expanden en 6 tracks (QA·silencio·QB·silencio·QC·silencio)
  // agrupados visualmente como un solo segmento en la barra.
  const n = nivel, c = cuaderno;
  const silencioUrl = AUDIO_FOLDERS['rezo'] + 'silencio.mp3'; // /audio/global/silencio.mp3
  const pausaUrl   = AUDIO_FOLDERS['rezo'] + 'pausa.mp3';
  const playlist = [
    // ── Introducción: En el nombre del Padre... ──
    { label:'Introducción',    file:'ennombre.mp3',               folder:'rezo',   seg:0 },
    { label:'Introducción',    file:'pausa.mp3',                  folder:'rezo',   seg:0, silence:true },
    { label:'Bienvenida',      file:`START_${n}_${c}_${m}.mp3`,  folder:'start',  seg:1 },
    { label:'Bienvenida',      file:'pausa.mp3',                  folder:'rezo',   seg:1, silence:true },
    { label:'Camino y Palabra',file:`UBIBLE_${n}_${c}_${m}.mp3`, folder:'ubible', seg:2 },
    { label:'Camino y Palabra',file:'pausa.mp3',                  folder:'rezo',   seg:2, silence:true },
    { label:'Contemplación',   file:`CONT_${n}_${c}_${m}.mp3`,   folder:'cont',   seg:3 },
    { label:'Contemplación',   file:'pausa.mp3',                  folder:'rezo',   seg:3, silence:true },
    { label:'Rezo',            file:`rezo.mp3`,                   folder:'rezo',   seg:4 },
    { label:'Rezo',            file:'pausa.mp3',                  folder:'rezo',   seg:4, silence:true },
    { label:'Canto',           file:`M_${n}_${c}_${m}.mp3`,      folder:'music',  seg:5 },
    { label:'Canto',           file:'pausa.mp3',                  folder:'rezo',   seg:5, silence:true },
    // ── Separador de Meditación ──
    { label:'Meditación',      file:'meditacion.mp3',             folder:'rezo',   seg:6 },
    { label:'Meditación',      file:'pausa.mp3',                  folder:'rezo',   seg:6, silence:true },
    // ── Bloque de Preguntas ──
    { label:'Preguntas',       file:`QA_${n}_${c}_${m}.mp3`,     folder:'q',      seg:7, qIdx:0 },
    { label:'Preguntas',       file:'silencio.mp3',               folder:'rezo',   seg:7, silence:true },
    { label:'Preguntas',       file:`QB_${n}_${c}_${m}.mp3`,     folder:'q',      seg:7, qIdx:1 },
    { label:'Preguntas',       file:'silencio.mp3',               folder:'rezo',   seg:7, silence:true },
    { label:'Preguntas',       file:`QC_${n}_${c}_${m}.mp3`,     folder:'q',      seg:7, qIdx:2 },
    { label:'Preguntas',       file:'silencio.mp3',               folder:'rezo',   seg:7, silence:true },
    // ── Oración final + pausa + Despedida ──
    { label:'Oración final',   file:`PRAY_${n}_${c}_${m}.mp3`,   folder:'pray',   seg:8 },
    { label:'Oración final',   file:'pausa.mp3',                  folder:'rezo',   seg:8, silence:true },
    { label:'Despedida',       file:`BYE_${n}_${c}_${m}.mp3`,    folder:'bye',    seg:9 }
  ].map(t => ({
    ...t,
    url: (t.folder === 'rezo' && t.file === 'silencio.mp3') ? silencioUrl
       : (t.folder === 'rezo' && t.file === 'pausa.mp3')    ? pausaUrl
       : AUDIO_FOLDERS[t.folder] + t.file
  }));


  currentSession = { nivel: n, cuaderno: c, misterio: m, block, blockIdx, mysteryData, playlist };
  sessionMeters = 0;
  sectionRewards = new Set();
  sessionCompleted = false;

  // ── Micro-aprendizaje: solo en el primer misterio de cada bloque (1, 6, 11, 16)
  const isFirstOfBlock = (m === 1 || m === 6 || m === 11 || m === 16);
  if (isFirstOfBlock && getPrefs().microInAudio !== false) {
    // Cargar micro JSON
    microData = null;
    try {
      const base = location.origin + location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
      const resp = await fetch(base + 'data/' + nivelId + '-micro.json');
      if (resp.ok) microData = await resp.json();
    } catch(e) { console.warn('[CruzAndo] micro json:', e); }

    // Leer microDone de Firestore
    blockMicroDone = false;
    if (microData && currentUser) {
      try {
        const snap = await getDoc(doc(db, 'users', currentUser.uid, 'progress', nivelId));
        if (snap.exists()) {
          const done = snap.data().microDone || {};
          blockMicroDone = done[block] === true;
        }
      } catch(e) { console.warn('[CruzAndo] microDone read:', e); }
    }

    if (microData && microData.bloques && microData.bloques[block] && !blockMicroDone) {
      // Micro no completado → bienvenida visual + audio de invitación → micro screen
      playMicroIntroThenMicro(block, nivelId);
      return;
    }
  }

  // Micro ya completado (o no aplica) → iniciar player directamente
  const showPrep = isFirstOfBlock && blockMicroDone
    && microData && microData.bloques && microData.bloques[block];
  startPlayerSession(showPrep ? block : null);
}

// ════════════════════════════════════════════
// INICIO DEL PLAYER (post-micro o directo)
// ════════════════════════════════════════════

function openMicro()  { $('scr-micro').classList.add('open'); }
function closeMicro() { $('scr-micro').classList.remove('open'); }

function startPlayerSession(prepBlock) {
  renderSession();

  // Botón "Preparación" en el hero (solo si micro ya fue completado en este bloque)
  const prepHero   = $('prep-hero');
  const btnPrepHero = $('btn-prep-hero');
  if (prepBlock && microData && microData.bloques && microData.bloques[prepBlock]) {
    const bloque  = microData.bloques[prepBlock];
    const nivelId = String(currentSession.nivel).padStart(2,'0') + String(currentSession.cuaderno).padStart(2,'0');
    if (btnPrepHero) {
      btnPrepHero.innerHTML =
        '<span class="prep-hero-kicker">✦ Preparación</span>' +
        '<span class="prep-hero-name">' + (bloque.subtitulo || BLOCK_NAMES[prepBlock]) + '</span>';
      btnPrepHero.onclick = () => { stopAudio(); bgmStop(); renderMicroAudio(prepBlock, nivelId); };
    }
    if (prepHero) prepHero.style.display = '';
  } else {
    if (prepHero) prepHero.style.display = 'none';
  }

  show('scr-session');
}

// ════════════════════════════════════════════
// MICRO-APRENDIZAJE EN AUDIO
// ════════════════════════════════════════════

function renderMicroAudio(b, nivelId) {
  const bloque    = microData.bloques[b];
  const tarjetas  = bloque.tarjetas  || [];
  const preguntas = bloque.preguntas || [];
  const total     = tarjetas.length + preguntas.length;
  let step = 0;
  let seleccion = null;

  $('micro-label').textContent = 'Prepara tu corazón · ' + (BLOCK_NAMES[b] || b);
  $('micro-sub').textContent   = bloque.subtitulo || '';

  function renderDots() {
    const wrap = $('micro-progress');
    let html = '';
    for (let i = 0; i < total; i++) {
      const cls = i < step ? 'done' : i === step ? 'active' : '';
      const w   = i === step ? '24px' : '8px';
      html += `<div class="micro-dot ${cls}" style="width:${w};flex:${i === step ? '0 0 24px' : '1'}"></div>`;
    }
    wrap.innerHTML = html;
  }

  function renderStep() {
    seleccion = null;
    renderDots();
    const content = $('micro-content');
    const nav     = $('micro-nav');

    // Pantalla final
    if (step >= total) {
      const blockColor = { gozosos:'#27AE60', luminosos:'#F4D03F', dolorosos:'#C0392B', gloriosos:'#8E44AD' }[b] || '#FF7A00';
      content.innerHTML =
        '<div class="micro-final">' +
          '<div class="micro-final-cross">' +
            '<svg viewBox="0 0 100 100" width="48" height="48" style="filter:drop-shadow(0 0 8px ' + blockColor + '80)">' +
              '<rect x="46" y="5" width="8" height="90" fill="' + blockColor + '"/>' +
              '<rect x="5" y="42" width="90" height="8" fill="' + blockColor + '"/>' +
            '</svg>' +
          '</div>' +
          '<div class="micro-final-titulo">Tu corazón está preparado</div>' +
          '<div class="micro-final-sub">Reza sin prisa. Lo que necesitas ya lo traes contigo.</div>' +
          '<div class="micro-metros-chip">🚶 +' + METERS_MICRO + 'm al peregrino</div>' +
        '</div>';
      nav.innerHTML = '<button class="micro-btn-primary" id="micro-btn-comenzar">Comenzar sesión →</button>';
      $('micro-btn-comenzar').onclick = async () => {
        blockMicroDone = true;
        await saveMicroDone(b, nivelId);
        await addMetersToFirestore(METERS_MICRO);
        sessionMeters += METERS_MICRO;
        closeMicro();
        startPlayerSession(null);
      };
      return;
    }

    // Tarjeta informativa
    if (step < tarjetas.length) {
      const t = tarjetas[step];
      content.innerHTML =
        '<div class="micro-card">' +
          '<div>' +
            '<div class="micro-card-emoji">' + escHTML(t.emoji) + '</div>' +
            '<div class="micro-card-titulo">' + escHTML(t.titulo) + '</div>' +
            '<div class="micro-card-contenido">' + escHTML(t.contenido) + '</div>' +
          '</div>' +
          '<div class="micro-card-footer">' +
            '<span class="micro-card-count">Tarjeta ' + (step + 1) + ' de ' + tarjetas.length + '</span>' +
          '</div>' +
        '</div>';
      nav.innerHTML =
        (step > 0 ? '<button class="micro-btn-outline" id="micro-prev">← Anterior</button>' : '') +
        '<button class="micro-btn-primary" id="micro-next">' +
          (step === tarjetas.length - 1 ? 'Prepara tu corazón →' : 'Siguiente →') +
        '</button>';
      if ($('micro-prev')) $('micro-prev').onclick = () => { step--; renderStep(); };
      $('micro-next').onclick = () => { step++; renderStep(); };
      return;
    }

    // Pregunta de apropiación
    const pi = step - tarjetas.length;
    const p  = preguntas[pi];
    content.innerHTML =
      '<div class="micro-q-card">' +
        '<div class="micro-q-label">✦ ' + (pi + 1) + ' de ' + preguntas.length + '</div>' +
        '<div class="micro-q-texto">' + escHTML(p.pregunta) + '</div>' +
        p.opciones.map((o, oi) =>
          '<button class="micro-option" id="micro-opt-' + oi + '">' +
            '<span class="micro-option-circle" id="micro-circ-' + oi + '"></span>' +
            escHTML(o.texto) +
          '</button>'
        ).join('') +
        '<div id="micro-eco" style="display:none"></div>' +
      '</div>';
    nav.innerHTML = '<button class="micro-btn-primary" id="micro-next-q" style="display:none">' +
      (pi === preguntas.length - 1 ? 'Estoy listo →' : 'Siguiente →') + '</button>';

    p.opciones.forEach((o, oi) => {
      $('micro-opt-' + oi).onclick = () => {
        if (seleccion !== null) return;
        seleccion = oi;
        p.opciones.forEach((_, i) => {
          if (i === oi) { $('micro-opt-' + i).classList.add('selected'); $('micro-circ-' + i).textContent = '✓'; }
          else { $('micro-opt-' + i).classList.add('dimmed'); }
        });
        const eco = $('micro-eco');
        eco.innerHTML =
          '<div class="micro-eco"><span class="micro-eco-emoji">' + escHTML(o.emoji) + '</span>' + escHTML(o.eco) + '</div>';
        eco.style.display = '';
        $('micro-next-q').style.display = '';
      };
    });
    $('micro-next-q').onclick = () => { step++; renderStep(); };
  }

  openMicro();
  renderStep();
}

function playMicroIntroThenMicro(block, nivelId) {
  // Mostrar scr-session con welcome overlay mientras suena la invitación al micro
  applyBlockColor(block);
  renderWelcomeOverlay();
  // Ocultar barra inferior (aún no hay sesión activa)
  const controls = document.querySelector('#scr-session .audio-bottom');
  if (controls) controls.style.visibility = 'hidden';
  show('scr-session');

  const url = AUDIO_FOLDERS['rezo'] + 'micro_' + block + '.mp3';
  const introAudio = new Audio(url);

  const goToMicro = () => {
    if (controls) controls.style.visibility = '';
    renderMicroAudio(block, nivelId);
  };

  introAudio.onerror = goToMicro;
  introAudio.onended = goToMicro;
  introAudio.play().catch(goToMicro);
}

async function saveMicroDone(block, nivelId) {
  if (!currentUser) return;
  try {
    await setDoc(doc(db, 'users', currentUser.uid, 'progress', nivelId),
      { microDone: { [block]: true } }, { merge: true });
  } catch(e) { console.warn('[CruzAndo] saveMicroDone:', e); }
}

// ════════════════════════════════════════════
// RENDER SESIÓN
// ════════════════════════════════════════════

function renderSession() {
  const { nivel, cuaderno, misterio, block, blockIdx, mysteryData, playlist } = currentSession;

  // Color de bloque
  applyBlockColor(block);
  const ab = document.querySelector('.audio-bottom');
  if (ab) ab.style.setProperty('--audio-bottom-bg', TBG_AUDIO[block] || 'var(--card)');

  renderWelcomeOverlay();

  // Ordinal por bloque (1°–5°, no global 1–20)

  // Hero bottom text — estilo orar.html
  const titulo   = mysteryData?.titulo    || `${ORDS[blockIdx] || (blockIdx+1+'º')} Misterio`;
  const subtitle = mysteryData?.subtitulo || '';
  $('audio-hero-bloque').textContent    = BLOCK_FULL_NAMES[block] || block;
  $('audio-hero-titulo').textContent    = titulo;
  $('audio-hero-subtitulo').textContent = subtitle;

  // Beads de progreso del bloque
  const nivelIdB = String(nivel).padStart(2,'0') + String(cuaderno).padStart(2,'0');
  let progressArr = [null,null,null,null,null];
  try {
    const stored = JSON.parse(localStorage.getItem('cruzando_nivel_' + nivelIdB) || 'null');
    if (stored?.progress?.[block]) progressArr = stored.progress[block];
  } catch(e) {}
  const beadsEl = $('audio-hero-beads');
  if (beadsEl) beadsEl.innerHTML = progressArr.map((d,i) => {
    const cur = i === blockIdx;
    const bg  = d ? '#34A853' : cur ? '#fff' : 'rgba(255,255,255,0.35)';
    const sz  = cur ? '12px' : '8px';
    const sh  = cur ? 'box-shadow:0 0 6px rgba(255,255,255,0.6);border:2px solid #fff;' : '';
    return `<div style="width:${sz};height:${sz};border-radius:50%;background:${bg};${sh}transition:all 0.2s"></div>`;
  }).join('');

  // Imagen
  const imgUrl = `${IMG_BASE}P_${nivel}_${cuaderno}_${misterio}.webp`;
  const heroImg = $('hero-img');
  heroImg.onload = () => {
    heroImg.style.display = 'block';
    $('hero-placeholder').style.display = 'none';
  };
  heroImg.onerror = () => {
    heroImg.style.display = 'none';
    $('hero-placeholder').style.display = 'flex';
    $('hero-placeholder').textContent = BLOCK_COLORS[block]?.dot || '🕊️';
  };
  heroImg.src = imgUrl;
  const bgImg = $('session-bg-img');
  if (bgImg) bgImg.src = imgUrl;

  // Inicializar progress bars: 8 segmentos visuales (no uno por track)
  const container = $('playlist-progress');
  container.innerHTML = Array.from({length: NUM_SEGS}, (_, i) =>
    `<div class="playlist-seg" id="pseg-${i}"><div class="playlist-seg-fill" id="pseg-fill-${i}"></div></div>`
  ).join('');

  // Sección inicial
  updateSectionDisplay(-1);
  updateMysteryNavBtns();

  // Limpiar pantalla de completado para evitar acumulación de botones
  const actionsDiv = $('complete-actions');
  if (actionsDiv) actionsDiv.innerHTML = '';
  const epilogoDiv = $('epilogo-canto');
  if (epilogoDiv) epilogoDiv.style.display = 'none';

  const nivelId = String(nivel).padStart(2,'0') + String(cuaderno).padStart(2,'0');

  // Eventos controles
  $('btn-play-pause').onclick = togglePlayPause;
  $('btn-prev').onclick = () => {
    const prev = prevRealTrack(currentTrack);
    if (prev >= 0) goTrack(prev);
  };
  $('btn-next').onclick = () => {
    const next = nextRealTrack(currentTrack);
    if (next >= 0) goTrack(next);
  };
  $('btn-complete').onclick = completeSession;

  // Botones circulares del hero
  const btnBgm = $('btn-bgm');
  if (btnBgm) btnBgm.onclick = bgmToggle;

  const btnTheme = $('btn-theme');
  if (btnTheme) btnTheme.onclick = toggleTheme;

  // Audio toolbar
  const atbNivel = $('atb-nivel');
  if (atbNivel) atbNivel.onclick = () => goTo('world.html');
  const btnEscribir = $('btn-escribir');
  if (btnEscribir) btnEscribir.onclick = openModal;

  // Navegación de misterios (hero arrows) — con confirmación si hay audio activo
  const btnPrevMys = $('btn-prev-mystery');
  if (btnPrevMys) btnPrevMys.onclick = handleNavPrev;
  const btnNextMys = $('btn-next-mystery');
  if (btnNextMys) btnNextMys.onclick = handleNavNext;
  updateMysteryNavBtns();

  // Progress bar click
  $('progress-bar').onclick = e => {
    if (!audioEl || !audioEl.duration) return;
    const rect = $('progress-bar').getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    audioEl.currentTime = ratio * audioEl.duration;
  };

  // Modal
  $('modal-close').onclick   = closeModal;
  $('modal-overlay').onclick = e => { if (e.target === $('modal-overlay')) closeModal(); };

  // Iniciar BGM de fondo
  bgmInit();

  // Waveform
  initWaveform();

  updateToggleHref();
}

function updateToggleHref() {
  const tab = $('tab-toggle-texto');
  if (!tab || !currentSession) return;
  const { nivel, cuaderno, misterio } = currentSession;
  const nivelId = String(nivel).padStart(2,'0') + String(cuaderno).padStart(2,'0');
  tab.href = `orar.html?c=${nivelId}&misterio=${misterio}`;
}

function initWaveform() {
  const container = document.getElementById('waveform-overlay');
  if (!container) return;
  container.innerHTML = '';
  for (let i = 0; i < 20; i++) {
    const bar = document.createElement('div');
    bar.className = 'wave-bar';
    const h   = 10 + Math.random() * 40;
    const dur = (0.4 + Math.random() * 0.6).toFixed(2);
    bar.style.setProperty('--h', h + 'px');
    bar.style.setProperty('--dur', dur + 's');
    bar.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
    container.appendChild(bar);
  }
}

function setWaveformPlaying(playing) {
  document.querySelectorAll('.wave-bar').forEach(bar => {
    bar.style.animationPlayState = playing ? 'running' : 'paused';
  });
}

function startPlaylist() {
  if (currentUser && currentSession) {
    const { nivel, cuaderno, misterio } = currentSession;
    setDoc(
      doc(db, 'users', currentUser.uid, 'bookmark', 'current'),
      { nivel, cuaderno, misterio, modo: 'audio', updatedAt: Date.now() },
      { merge: true }
    ).catch(e => console.warn('[bookmark]', e));
  }
  goTrack(0);
}

// Otorgar metros al terminar una sección de audio (evita doble-award por re-escucha)
async function awardSectionMeters(track) {
  let key = null;
  if      (track.folder === 'ubible')                          key = 'ubible';
  else if (track.folder === 'cont')                            key = 'cont';
  else if (track.folder === 'rezo' && track.seg === 4)         key = 'rezo_seg4';
  else if (track.folder === 'q' && typeof track.qIdx === 'number') key = 'q_' + track.qIdx;
  if (!key || sectionRewards.has(key)) return;
  const def = METERS_SECTION[key];
  if (!def) return;
  sectionRewards.add(key);
  sessionMeters += def.meters;
  await addMetersToFirestore(def.meters);
  $('session-meters-display').textContent = `${sessionMeters.toLocaleString('es-MX')}m esta sesión`;
  showToast(`+${def.meters}m · ${def.label}`);
}

function isCanto(idx) {
  const { playlist } = currentSession;
  return playlist && playlist[idx] && playlist[idx].folder === 'music';
}

// Saltar tracks de pausa/silencio — para controles ⏮⏭
function nextRealTrack(idx) {
  const { playlist } = currentSession;
  let next = idx + 1;
  while (next < playlist.length && playlist[next].silence) next++;
  return next < playlist.length ? next : -1;
}

function prevRealTrack(idx) {
  const { playlist } = currentSession;
  let prev = idx - 1;
  while (prev >= 0 && playlist[prev].silence) prev--;
  // Si el track actual ya es real, retroceder al anterior real
  // Si el track anterior real ya completó, ir al que le precede
  return prev >= 0 ? prev : -1;
}

// Progreso acumulado dentro del bloque de Preguntas (seg 6)
// Para animar la barra del segmento 5 de forma continua a través de 6 sub-tracks
function getSegProgress(trackIdx) {
  const { playlist } = currentSession;
  const track = playlist[trackIdx];
  if (!track || track.seg !== 5) return null;
  // Sub-tracks del seg 5: índices en playlist donde seg===5
  const qTracks = playlist.map((t,i) => t.seg === 7 ? i : -1).filter(i => i >= 0);
  const posInGroup = qTracks.indexOf(trackIdx); // 0-5
  const total = qTracks.length; // 6
  return { posInGroup, total };
}

function goTrack(idx) {
  const { playlist } = currentSession;
  if (idx < 0 || idx >= playlist.length) return;

  stopAudio();
  currentTrack = idx;

  const track = playlist[idx];

  // Tracks de pausa/silencio: reproducir sin actualizar UI ni BGM
  if (!track.silence) {
    updateSectionDisplay(idx);
    if (isCanto(idx)) {
      bgmPause();
    } else {
      bgmResume();
    }
  }

  audioEl = new Audio(track.url);

  audioEl.onerror = () => {
    console.warn('Audio no encontrado:', track.url);
    // Si falla el START (primer track), el nivel no está publicado aún
    if (track.folder === 'start') {
      showComingSoon();
      return;
    }
    markSegProgress(idx, 100);
    if (isCanto(idx)) bgmResume();
    // Si quedan tracks, avanzar; si no, terminar
    if (idx + 1 < currentSession.playlist.length) {
      goTrack(idx + 1);
    } else {
      onPlaylistEnded();
    }
  };

  audioEl.ontimeupdate = () => {
    if (!audioEl.duration || track.silence) return;
    const pct = (audioEl.currentTime / audioEl.duration) * 100;
    $('progress-fill').style.width = pct + '%';
    $('time-current').textContent = fmtTime(audioEl.currentTime);
    $('time-duration').textContent = fmtTime(audioEl.duration);
    $('section-time').textContent  = fmtTime(audioEl.currentTime) + ' / ' + fmtTime(audioEl.duration);

    // Barra del segmento visual
    const gp = getSegProgress(idx);
    if (gp) {
      const segPct = ((gp.posInGroup + pct / 100) / gp.total) * 100;
      const fill = $('pseg-fill-' + track.seg);
      if (fill) fill.style.width = segPct + '%';
    } else {
      const fill = $('pseg-fill-' + track.seg);
      if (fill) fill.style.width = pct + '%';
    }
  };

  audioEl.onended = () => {
    if (!track.silence) {
      if (isCanto(idx)) bgmResume();
      // Marcar segmento visual como done
      const gp = getSegProgress(idx);
      if (gp) {
        if (gp.posInGroup === gp.total - 1) markSegDone(track.seg);
      } else {
        markSegDone(track.seg);
      }
      // Metros por sección completada
      awardSectionMeters(track);
    }
    if (idx + 1 < playlist.length) {
      goTrack(idx + 1);
    } else {
      onPlaylistEnded();
    }
  };

  // play() directo — funciona dentro del gesto del usuario y para tracks sucesivos
  if (window.CZSound && idx === 0) CZSound('playStart');
  audioEl.play().then(() => {
    isPlaying = true;
    updatePlayPauseBtn();
  }).catch(e => {
    console.warn('Autoplay bloqueado:', e);
    isPlaying = false;
    updatePlayPauseBtn();
  });

  // Marcar segmento visual como activo (solo si no es silence y no está ya done)
  if (!track.silence) {
    const segEl = $('pseg-' + track.seg);
    if (segEl && !segEl.classList.contains('done')) segEl.classList.add('active');
  }
}

function markSegProgress(trackIdx, pct) {
  const { playlist } = currentSession;
  const track = playlist[trackIdx];
  if (!track) return;
  const fill = $('pseg-fill-' + track.seg);
  if (fill) fill.style.width = pct + '%';
}

function stopAudio() {
  if (audioEl) {
    audioEl.pause();
    audioEl.onended = null;
    audioEl.onerror = null;
    audioEl.ontimeupdate = null;
    audioEl.oncanplaythrough = null;
    audioEl = null;
  }
  isPlaying = false;
  updatePlayPauseBtn();
  $('progress-fill').style.width = '0%';
  $('time-current').textContent = '0:00';
  $('time-duration').textContent = '0:00';
}

// ── Web Audio API para control preciso de ganancia del BGM ──
let bgmAudioCtx  = null;
let bgmSource    = null;
let bgmGainNode  = null;
let bgmFadeTimer = null;

function bgmClearFade() {
  if (bgmFadeTimer) { clearTimeout(bgmFadeTimer); bgmFadeTimer = null; }
}

function bgmInit() {
  if (!currentSession) return;
  const { nivel, cuaderno } = currentSession;
  const url = `${BGM_BASE}BGM_${nivel}_${cuaderno}.mp3`;

  bgmEl = new Audio(url);
  bgmEl.loop = true;
  bgmEl.crossOrigin = 'anonymous';
  bgmLoaded = false;

  bgmEl.onerror = () => {
    console.warn('BGM no encontrado:', url);
    bgmEl = null;
  };

  bgmEl.oncanplaythrough = () => {
    if (bgmLoaded) return; // evitar doble setup
    bgmLoaded = true;

    // Crear contexto Web Audio y conectar GainNode
    try {
      bgmAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      bgmSource   = bgmAudioCtx.createMediaElementSource(bgmEl);
      bgmGainNode = bgmAudioCtx.createGain();
      bgmGainNode.gain.value = 0; // arrancar en silencio
      bgmSource.connect(bgmGainNode);
      bgmGainNode.connect(bgmAudioCtx.destination);
    } catch(e) {
      // Fallback: usar .volume nativo si Web Audio falla
      console.warn('Web Audio API no disponible, usando volume nativo');
      bgmGainNode = null;
    }

    if (bgmEnabled && !isCanto(currentTrack)) {
      bgmResume();
    }
  };
}

function bgmSetGain(value) {
  // Controla ganancia vía Web Audio si disponible, o .volume nativo
  if (bgmGainNode) {
    bgmGainNode.gain.value = Math.max(0, Math.min(1, value));
  } else if (bgmEl) {
    bgmEl.volume = Math.max(0, Math.min(1, value));
  }
}

function bgmGetGain() {
  if (bgmGainNode) return bgmGainNode.gain.value;
  if (bgmEl) return bgmEl.volume;
  return 0;
}

function bgmFadeTo(target, durationMs, onDone) {
  bgmClearFade();
  if (!bgmEl) return;
  const steps    = 30;
  const interval = durationMs / steps;
  const start    = bgmGetGain();
  const delta    = (target - start) / steps;
  let   step     = 0;

  function tick() {
    step++;
    const val = start + delta * step;
    bgmSetGain(step < steps ? val : target);
    if (step < steps) {
      bgmFadeTimer = setTimeout(tick, interval);
    } else {
      bgmFadeTimer = null;
      if (onDone) onDone();
    }
  }
  tick();
}

function bgmPause() {
  bgmClearFade();
  if (!bgmEl) return;
  bgmFadeTo(0, 400, () => {
    if (bgmEl) bgmEl.pause();
  });
}

function bgmResume() {
  bgmClearFade();
  if (!bgmEl || !bgmEnabled) return;

  // Reanudar contexto si fue suspendido (política autoplay)
  if (bgmAudioCtx && bgmAudioCtx.state === 'suspended') {
    bgmAudioCtx.resume().catch(() => {});
  }
  if (bgmEl.paused) {
    bgmEl.play().catch(() => {});
  }
  bgmFadeTo(BGM_VOL, 600);
}

function bgmStop() {
  bgmClearFade();
  if (bgmEl) {
    bgmEl.pause();
    bgmEl.oncanplaythrough = null;
    bgmEl.onerror = null;
    bgmEl = null;
  }
  if (bgmAudioCtx) {
    bgmAudioCtx.close().catch(() => {});
    bgmAudioCtx = null;
  }
  bgmSource   = null;
  bgmGainNode = null;
  bgmLoaded   = false;
}

function bgmToggle() {
  bgmEnabled = !bgmEnabled;
  if (bgmEnabled) {
    bgmResume();
  } else {
    bgmPause();
  }
  updateBgmBtn();
}

function updateMysteryNavBtns() {
  const m    = audioProgress?.misterio || 1;
  const prev = $('btn-prev-mystery');
  const next = $('btn-next-mystery');
  if (prev) prev.style.opacity = m > 1  ? '1' : '0.3';

}

function updateBgmBtn() {
  const btn = $('btn-bgm');
  if (!btn) return;
  btn.title = bgmEnabled ? 'Silenciar música de fondo' : 'Activar música de fondo';
  btn.classList.toggle('muted', !bgmEnabled);
  const on  = btn.querySelector('.bgm-on');
  const off = btn.querySelector('.bgm-off');
  if (on)  on.style.display  = bgmEnabled ? '' : 'none';
  if (off) off.style.display = bgmEnabled ? 'none' : '';
}

function togglePlayPause() {
  if (!audioEl) {
    if (currentTrack < 0) startPlaylist();
    return;
  }
  if (isPlaying) {
    audioEl.pause();
    isPlaying = false;
  } else {
    audioEl.play().then(() => { isPlaying = true; }).catch(()=>{});
    isPlaying = true;
  }
  updatePlayPauseBtn();
}

function updatePlayPauseBtn() {
  $('ico-play').style.display  = isPlaying ? 'none' : 'block';
  $('ico-pause').style.display = isPlaying ? 'block' : 'none';
  setWaveformPlaying(isPlaying);
}

// Perspectivas por qIdx
const Q_PERSPECTIVES = [
  { label: 'Por María hacia Jesús:', color: '#FF7A00' },
  { label: 'Desde el Hijo hacia el Padre:', color: '#C0392B' },
  { label: 'Hijos y hermanos en el Espíritu:', color: '#27AE60' }
];

function updateSectionDisplay(idx) {
  const { playlist } = currentSession;
  const perspWrap  = $('section-perspective');
  const perspLabel = $('perspective-label');
  const perspDot   = $('perspective-dot');
  const heroOv     = $('hero-overlay');
  const heroId     = $('hero-identity');

  if (idx < 0 || idx >= playlist.length) {
    $('section-name').textContent = idx < 0 ? 'Listo para comenzar' : 'Sesión completada';
    $('section-pulse').style.animationPlayState = 'paused';
    if (perspWrap) perspWrap.style.display = 'none';
    if (heroOv) heroOv.classList.toggle('revealed', idx >= 0);
    if (heroId) heroId.classList.toggle('hidden', idx >= 0);
    return;
  }

  const track = playlist[idx];
  $('section-name').textContent = track.label;
  $('section-pulse').style.animationPlayState = 'running';

  // Hero overlay oscuro: visible en seg 0 (Intro) y seg 1 (Bienvenida); revelado desde seg 2 (UBIBLE)
  if (heroOv) heroOv.classList.toggle('revealed', track.seg > 1);
  if (heroId) heroId.classList.toggle('hidden', track.seg > 1);

  // Mostrar perspectiva solo en QA (qIdx:0), QB (qIdx:1), QC (qIdx:2)
  if (typeof track.qIdx === 'number' && perspWrap) {
    const p = Q_PERSPECTIVES[track.qIdx];
    perspLabel.textContent   = p.label;
    perspDot.style.background = p.color;
    perspWrap.style.display  = 'flex';
  } else {
    if (perspWrap) perspWrap.style.display = 'none';
  }
}

function markSegDone(segIdx) {
  // segIdx = índice del segmento VISUAL (0-7), no del track
  const seg = $('pseg-' + segIdx);
  if (seg) {
    seg.classList.remove('active');
    seg.classList.add('done');
    const fill = $('pseg-fill-' + segIdx);
    if (fill) fill.style.width = '100%';
  }
}

function onPlaylistEnded() {
  isPlaying = false;
  setWaveformPlaying(false);
  updatePlayPauseBtn();
  updateSectionDisplay(currentSession.playlist.length);
  const btnC = $('btn-complete');
  if (btnC) { btnC.disabled = false; btnC.classList.add('visible'); }
  $('section-pulse').style.animationPlayState = 'paused';
}
