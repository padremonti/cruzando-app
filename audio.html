// ── Cargar cantos del nivel ──
let CANTOS_DATA = null;

async function loadCantos(nivelId) {
  if (CANTOS_DATA) return CANTOS_DATA;
  try {
    const base = location.origin + location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
    const resp = await fetch(base + 'data/' + nivelId + '-cantos.json');
    if (!resp.ok) return null;
    CANTOS_DATA = await resp.json();
    return CANTOS_DATA;
  } catch(e) { return null; }
}

function getCanto(cantosData, block, blockIdx) {
  if (!cantosData || !cantosData.cantos || !cantosData.cantos[block]) return null;
  return cantosData.cantos[block][blockIdx] || null;
}

function renderEpilogo(canto, audioUrl) {
  const wrap = $('epilogo-canto');
  if (!canto) { wrap.style.display = 'none'; return; }

  $('epilogo-titulo').textContent = canto.titulo;
  $('epilogo-letra').textContent  = canto.letra;
  wrap.style.display = '';

  // Player del epílogo
  if (epilogoAudioEl) { epilogoAudioEl.pause(); epilogoAudioEl = null; }
  epilogoAudioEl = new Audio(audioUrl);

  epilogoAudioEl.ontimeupdate = () => {
    if (!epilogoAudioEl.duration) return;
    const pct = (epilogoAudioEl.currentTime / epilogoAudioEl.duration) * 100;
    $('epilogo-bar-fill').style.width = pct + '%';
    $('epilogo-bar-time').textContent =
      fmtTime(epilogoAudioEl.currentTime) + ' / ' + fmtTime(epilogoAudioEl.duration);
  };
  epilogoAudioEl.onended = () => {
    $('epilogo-ico-play').style.display  = 'block';
    $('epilogo-ico-pause').style.display = 'none';
    $('epilogo-bar-fill').style.width = '0%';
    epilogoAudioEl.currentTime = 0;
    // Metros por escuchar el canto del epílogo completo
    if (!sectionRewards.has('epilogo')) {
      sectionRewards.add('epilogo');
      sessionMeters += METERS_EPILOGO_CANTO;
      addMetersToFirestore(METERS_EPILOGO_CANTO);
      $('complete-meters').textContent = `+${sessionMeters.toLocaleString('es-MX')}m`;
      showToast(`+${METERS_EPILOGO_CANTO}m · Canto escuchado`);
    }
  };
  epilogoAudioEl.onerror = () => {
    $('epilogo-play-btn').style.opacity = '0.4';
    $('epilogo-play-btn').disabled = true;
  };

  $('epilogo-play-btn').onclick = () => {
    if (!epilogoAudioEl) return;
    if (epilogoAudioEl.paused) {
      epilogoAudioEl.play().catch(() => {});
      $('epilogo-ico-play').style.display  = 'none';
      $('epilogo-ico-pause').style.display = 'block';
    } else {
      epilogoAudioEl.pause();
      $('epilogo-ico-play').style.display  = 'block';
      $('epilogo-ico-pause').style.display = 'none';
    }
  };

  $('epilogo-bar-track').onclick = e => {
    if (!epilogoAudioEl || !epilogoAudioEl.duration) return;
    const rect = $('epilogo-bar-track').getBoundingClientRect();
    epilogoAudioEl.currentTime = ((e.clientX - rect.left) / rect.width) * epilogoAudioEl.duration;
  };
}

async function completeSession() {
  if (sessionCompleted) return;
  sessionCompleted = true;

  // Deshabilitar el botón para evitar doble pulsación
  const btnC = $('btn-complete');
  if (btnC) { btnC.disabled = true; btnC.classList.remove('visible'); }

  stopAudio();
  bgmStop();

  // Registrar en historial
  if (window.CZSound) CZSound('mysteryClear');
  const { nivel, cuaderno, misterio, block, blockIdx } = currentSession;
  if (!audioProgress.history) audioProgress.history = [];
  audioProgress.history.push({ n:nivel, c:cuaderno, m:misterio, completedAt: Date.now() });

  // Bonus de bloque: +1000m si se completaron los 5 misterios del bloque por primera vez
  const BLOCK_RANGES = { gozosos:[1,5], luminosos:[6,10], dolorosos:[11,15], gloriosos:[16,20] };
  const [bMin, bMax] = BLOCK_RANGES[block];
  const doneInBlock = new Set(
    (audioProgress.history).filter(h => h.n === nivel && h.c === cuaderno && h.m >= bMin && h.m <= bMax).map(h => h.m)
  );
  const blockBonuses = audioProgress.blockBonuses || {};
  const bonusKey = `${nivel}_${cuaderno}_${block}`;
  if (doneInBlock.size >= 5 && !blockBonuses[bonusKey]) {
    blockBonuses[bonusKey] = true;
    audioProgress.blockBonuses = blockBonuses;
    sessionMeters += METERS_BLOCK_BONUS;
    await addMetersToFirestore(METERS_BLOCK_BONUS);
    if (window.CZSound) CZSound('blockClear');
    setTimeout(() => showToast(`+${METERS_BLOCK_BONUS}m · ¡Bloque ${BLOCK_NAMES[block]} completado!`), 400);
  }

  /* Medalla automática: completar el bloque gloriosos del cuaderno 4 desbloquea la medalla del Mundo */
  if (block === 'gloriosos' && cuaderno === 4 && doneInBlock.size >= 5 && currentUser) {
    if (window.CZSound) CZSound('levelClear');
    const MUNDO_MEDAL_MAP = {
      1: 'medal_cruz', 2: 'medal_emociones', 3: 'medal_mente',
      4: 'medal_corazon', 5: 'medal_relaciones', 6: 'medal_amor', 7: 'medal_tiempo'
    };
    const medalId = MUNDO_MEDAL_MAP[nivel];
    if (medalId) {
      try {
        const extrasRef  = doc(db, 'users', currentUser.uid, 'extras', 'purchases');
        const extrasSnap = await getDoc(extrasRef);
        const items      = extrasSnap.exists() ? (extrasSnap.data().items || []) : [];
        if (!items.some(it => it.id === medalId)) {
          items.push({ id: medalId, type: 'medal', earnedAt: new Date().toISOString() });
          await setDoc(extrasRef, { items }, { merge: true });
          setTimeout(() => showToast('🏅 ¡Medalla desbloqueada!'), 1200);
        }
      } catch (e) { console.warn('[CruzAndo] medal:', e.message); }
    }
  }

  await saveAudioProgress();
  await syncToOrarProgress(nivel, cuaderno, misterio);

  $('session-meters-display').textContent = `${sessionMeters.toLocaleString('es-MX')}m esta sesión`;

  // Pantalla completado — datos básicos
  $('complete-meters').textContent  = `+${sessionMeters.toLocaleString('es-MX')}m`;
  $('epilogo-subtitulo').textContent = `${ORDS[misterio-1]} Misterio ${BLOCK_NAMES[block]} · Nivel ${nivel}-${cuaderno}`;

  // Cargar canto del epílogo
  const nivelId   = String(nivel).padStart(2,'0') + String(cuaderno).padStart(2,'0');
  CANTOS_DATA     = null; // forzar recarga si cambió de nivel
  const cantosData = await loadCantos(nivelId);
  const canto      = getCanto(cantosData, block, blockIdx);
  const cantoUrl   = AUDIO_FOLDERS['music'] + `M_${nivel}_${cuaderno}_${misterio}.mp3`;
  renderEpilogo(canto, cantoUrl);

  // Desbloqueo de canto de bloque al completar los 5 misterios
  const BLOCK_IDX_MAP = { gozosos:1, luminosos:2, dolorosos:3, gloriosos:4 };
  const esUltimoDelBloque = [5,10,15,20].includes(misterio);
  if (esUltimoDelBloque && currentUser && cantosData && cantosData.cantos && cantosData.cantos[block]) {
    const bloqueIdx = BLOCK_IDX_MAP[block];
    const cantoKey  = `${nivel}_${cuaderno}_${bloqueIdx}`;
    try {
      const yaDesbloqueado = await getDoc(doc(db, 'users', currentUser.uid, 'unlockedCantos', cantoKey));
      if (!yaDesbloqueado.exists()) {
        const letraCompleta = cantosData.cantos[block]
          .map(c => c.letra || '')
          .join('\n\n───\n\n');
        await setDoc(
          doc(db, 'users', currentUser.uid, 'unlockedCantos', cantoKey),
          {
            titulo:    cantosData.cantos[block][0]?.titulo || block,
            bloque:    block, nivel, cuaderno, bloqueIdx,
            letra:     letraCompleta,
            unlockedAt: Date.now()
          }
        );
        setTimeout(() => showToast('🎵 Nuevo canto desbloqueado'), 800);
      }
    } catch(e) { console.warn('[cantos unlock]', e); }
  }

  // Botones de acción
  const actions = $('complete-actions');
  const s = 'width:100%;padding:15px;border-radius:14px;font-family:Inter,sans-serif;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:10px;display:block;';
  if (userPlan === 'free') {
    actions.innerHTML =
      '<button onclick="window.showDailyLimit()" style="' + s + 'background:var(--lvl-bold);color:#fff;border:none;">Volver mañana 🙏</button>' +
      '<button onclick="window._repeatSession()" style="' + s + 'background:var(--card);color:var(--text-soft);border:1.5px solid var(--border);">🔄 Repetir sesión</button>';
  } else {
    actions.innerHTML =
      '<button onclick="window.advanceAndRestart()" style="' + s + 'background:var(--lvl-bold);color:#fff;border:none;">Siguiente misterio →</button>' +
      '<button onclick="window._repeatSession()" style="' + s + 'background:var(--card);color:var(--text-soft);border:1.5px solid var(--border);">🔄 Repetir sesión</button>';
  }

  $('scr-complete').classList.add('open');
  $('fab-questions') && ($('fab-questions').style.display = 'none');
}

function closeEpilogo() {
  $('scr-complete').classList.remove('open');
}

// ════════════════════════════════════════════
// MODAL DE PREGUNTAS
// ════════════════════════════════════════════

async function openModal() {
  const existing = await loadReflections();
  localAnswers[0] = existing.q0 || '';
  localAnswers[1] = existing.q1 || '';
  localAnswers[2] = existing.q2 || '';

  const { mysteryData } = currentSession;
  const questions = parseQuestions(mysteryData?.meditacion || '');

  const body = $('modal-body');
  body.innerHTML = Q_LABELS.map((label, i) => `
    <div class="question-group">
      <div class="question-label-row">
        <div class="question-dot" style="background:${Q_COLORS[i]}"></div>
        <span class="question-label" style="color:${Q_COLORS[i]}">${label}</span>
      </div>
      <p class="question-text">${escHTML(questions[i] || '')}</p>
      <textarea
        class="question-textarea"
        id="q-ta-${i}"
        placeholder="Escribe tu reflexión…"
        rows="3"
      >${escHTML(localAnswers[i])}</textarea>
      <div class="question-meters" id="q-meters-${i}"></div>
    </div>
  `).join('');

  // Eventos con debounce
  [0,1,2].forEach(i => {
    const ta = $(`q-ta-${i}`);
    if (!ta) return;
    ta.addEventListener('input', () => onAnswerInput(i, ta.value));
  });

  $('modal-overlay').classList.add('open');
  updateFabBadge();
}

function closeModal() {
  // Guardado final forzado
  forceSaveAll();
  $('modal-overlay').classList.remove('open');
}

function onAnswerInput(qi, value) {
  localAnswers[qi] = value;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => autoSave(qi, value), 2000);
}

async function autoSave(qi, value) {
  if (!value.trim()) return;
  await saveReflection(qi, value);
  showSavedIndicator();
  await awardQuestionMeters(qi, value);
}

async function forceSaveAll() {
  clearTimeout(autosaveTimer);
  for (let i = 0; i < 3; i++) {
    if (localAnswers[i].trim()) {
      await saveReflection(i, localAnswers[i]);
      await awardQuestionMeters(i, localAnswers[i]);
    }
  }
  showSavedIndicator();
  updateFabBadge();
}

async function awardQuestionMeters(qi, value) {
  if (!value.trim()) return;
  const wasFirst = !audioProgress.firstAnswered[qi];
  if (wasFirst) {
    audioProgress.firstAnswered[qi] = true;
    await saveAudioProgress();
    const earned = METERS_Q_FIRST;
    sessionMeters += earned;
    await addMetersToFirestore(earned);
    $('session-meters-display').textContent = `${sessionMeters.toLocaleString('es-MX')}m esta sesión`;
    const el = $(`q-meters-${qi}`);
    if (el) { el.textContent = `+${earned}m ganados`; el.classList.add('earned'); }
    showToast(`+${earned}m · ${Q_LABELS[qi].replace(':','')}`);
  } else {
    // Actualización posterior
    const el = $(`q-meters-${qi}`);
    if (el && !el.classList.contains('earned')) {
      el.textContent = `+${METERS_Q_UPDATE}m`;
      el.classList.add('earned');
      await addMetersToFirestore(METERS_Q_UPDATE);
      sessionMeters += METERS_Q_UPDATE;
      $('session-meters-display').textContent = `${sessionMeters.toLocaleString('es-MX')}m esta sesión`;
    }
  }
}

function showSavedIndicator() {
  const el = $('modal-saved');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function updateFabBadge() {
  const answered = [0,1,2].filter(i => localAnswers[i].trim()).length;
  const circle = $('escribir-circle');
  if (circle) circle.style.background = answered > 0
    ? 'rgba(var(--lvl-bold-rgb,255,122,0),0.55)' : '';
}

function parseQuestions(text) {
  if (!text) return ['','',''];
  const labels = ['Por María hacia Jesús:','Desde el Hijo hacia el Padre:','Hijos y hermanos en el Espíritu:'];
  const out = [];
  let remaining = text;
  for (let i = 0; i < labels.length; i++) {
    const idx = remaining.indexOf(labels[i]);
    if (idx >= 0) {
      if (i > 0) out.push(remaining.substring(0, idx).trim());
      remaining = remaining.substring(idx + labels[i].length).trim();
    }
  }
  out.push(remaining.trim());
  while (out.length < 3) out.push('');
  return out.slice(0,3);
}

function escHTML(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function goTo(page) {
  stopAudio();
  bgmStop();
  const base = location.origin + location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
  location.href = base + page;
}

let _navChord = 0;
function playNavChord() {
  const CHORDS = [[523,659,784],[659,784,988],[784,988,1175],[587,740,880]];
  try {
    const ac    = new (window.AudioContext || window.webkitAudioContext)();
    const now   = ac.currentTime;
    const notes = CHORDS[_navChord % 4]; _navChord++;
    const master = ac.createGain();
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(0.07, now + 0.018);
    master.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    master.connect(ac.destination);
    notes.forEach((freq, j) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = j === 0 ? 'sine' : 'triangle';
      o.frequency.value = freq; g.gain.value = j === 0 ? 0.8 : 0.5;
      o.connect(g); g.connect(master);
      o.start(now + j * 0.012); o.stop(now + 0.45);
    });
  } catch(e) {}
}

function navTap(el) {
  if (window.CZSound) CZSound('navTap');
  playNavChord();
  el.classList.remove('tapped');
  void el.offsetWidth;
  el.classList.add('tapped');
  setTimeout(() => el.classList.remove('tapped'), 400);
}
window.navTap = navTap;
window.goTo   = goTo;

// Swipe horizontal sobre el hero: izquierda → siguiente, derecha → anterior
// Swipe vertical en cualquier parte de la sesión: arriba → muestra nav, abajo → oculta
(function(){
  let navT = null;
  function showAppNav(){ const n=$('app-nav'); if(!n)return; n.classList.add('visible'); clearTimeout(navT); navT=setTimeout(()=>n.classList.remove('visible'),3500); }
  function hideAppNav(){ const n=$('app-nav'); if(!n)return; n.classList.remove('visible'); clearTimeout(navT); }

  // Horizontal swipe (y navegación vertical) solo en el hero
  const hero = document.querySelector('.hero-img-wrap');
  if (hero) {
    let sy = 0;
    hero.addEventListener('touchstart', e => { sy=e.touches[0].clientY; }, { passive: true });
    hero.addEventListener('touchend', e => {
      if ($('scr-complete') && $('scr-complete').classList.contains('open')) return;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dy) > 50) { if (dy < 0) showAppNav(); else hideAppNav(); }
    }, { passive: true });
  }

  // Swipe vertical en los controles (zona inferior) para mostrar nav
  const scr = document.getElementById('scr-session');
  if (scr) {
    let cy = 0, cx = 0;
    scr.addEventListener('touchstart', e => { cy=e.touches[0].clientY; cx=e.touches[0].clientX; }, { passive: true });
    scr.addEventListener('touchend', e => {
      if ($('scr-complete') && $('scr-complete').classList.contains('open')) return;
      const dy = e.changedTouches[0].clientY - cy;
      const dx = e.changedTouches[0].clientX - cx;
      if (Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx) * 1.5) {
        if (dy < 0) showAppNav(); else hideAppNav();
      }
    }, { passive: true });
  }
})();
