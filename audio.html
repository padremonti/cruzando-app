<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A1714">
<title>CruzAndo · Sesión Diaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════
   CruzAndo · Sesión Diaria · audio.html
   Módulo experimental standalone
   ══════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ── Tema oscuro (default) ── */
  --bg:        #1A1714;
  --card:      #252119;
  --border:    #3A3530;
  --text:      #E6DED3;
  --text-soft: #B8A898;
  --text-dim:  #786858;
  --sec-bg:    #1E1B16;
  --shadow:    rgba(0,0,0,0.4);
  --green:     #34A853;
  --green-soft:rgba(52,168,83,0.18);
  --lvl-bold:  #FF7A00;
  --lvl-soft:  #F69C49;
  --lvl-light: #FFCFA2;
  --lvl-ultra: rgba(255,122,0,0.10);
  --goz-color: #D4A017;
  --lum-color: #01BBE1;
  --dol-color: #C0392B;
  --glo-color: #8E44AD;
  /* RGB del bg para los degradados de imagen */
  --bg-rgb:    26,23,20;
}

/* ── Tema claro ── */
body.light {
  --bg:        #F5F0E8;
  --card:      #FFFCF7;
  --border:    #D9D1C7;
  --text:      #2B2622;
  --text-soft: #6B6259;
  --text-dim:  #9B9389;
  --sec-bg:    #EDE8DF;
  --shadow:    rgba(43,38,34,0.10);
  --green-soft:rgba(52,168,83,0.12);
  --bg-rgb:    245,240,232;
}

html { font-size: 18px; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── Shell ── */
.shell {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  position: relative;
}

/* ── Screens ── */
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; min-height: 100dvh; }

/* ══════════════════════════════════════════════
   PANTALLA: LOGIN
   ══════════════════════════════════════════════ */
#scr-login {
  align-items: center;
  justify-content: center;
  padding: 40px 28px;
  background: var(--bg);
  text-align: center;
}
.login-logo {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 2.8rem;
  font-weight: 600;
  color: var(--lvl-bold);
  letter-spacing: -1px;
  margin-bottom: 6px;
}
.login-subtitle {
  font-size: 0.78rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 48px;
}
.login-form { width: 100%; max-width: 340px; text-align: left; }
.login-label {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 8px;
  display: block;
}
.login-input {
  width: 100%;
  padding: 14px 18px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s;
  margin-bottom: 16px;
}
.login-input:focus { border-color: var(--lvl-bold); }
.btn-login {
  width: 100%;
  padding: 15px;
  background: var(--lvl-bold);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  margin-bottom: 14px;
}
.btn-login:active { transform: scale(0.97); }
.btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 4px 0 14px;
}
.divider-line { flex: 1; height: 1px; background: var(--border); }
.divider-text { font-size: 0.72rem; color: var(--text-dim); }
.btn-google {
  width: 100%;
  padding: 14px;
  background: var(--card);
  color: var(--text);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-family: 'Inter', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: border-color 0.2s, transform 0.15s;
}
.btn-google:active { transform: scale(0.97); }
.btn-google:hover { border-color: var(--text-dim); }
.login-error {
  margin-top: 14px;
  padding: 12px 16px;
  background: rgba(192,57,43,0.15);
  border: 1px solid rgba(192,57,43,0.3);
  border-radius: 10px;
  font-size: 0.82rem;
  color: #e74c3c;
  display: none;
}

/* ══════════════════════════════════════════════
   PANTALLA: LOADING
   ══════════════════════════════════════════════ */
#scr-loading {
  align-items: center;
  justify-content: center;
  padding: 40px;
  text-align: center;
}
.loading-logo {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 2.2rem;
  font-weight: 600;
  color: var(--lvl-bold);
  margin-bottom: 8px;
}
.loading-msg { font-size: 0.82rem; color: var(--text-dim); margin-top: 6px; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--lvl-bold);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════════════════════════
   PANTALLA: SESIÓN PRINCIPAL
   ══════════════════════════════════════════════ */
#scr-session {
  flex-direction: column;
  background: var(--bg);
  min-height: 100dvh;
  position: relative;
}

/* ── Hero con imagen y degradados estilo Hallow ── */
/* ── Hero: layout vertical — título arriba, imagen completa, subtítulo abajo ── */
.hero {
  width: 100%;
  flex-shrink: 0;
  background: var(--bg);
}

/* Banda superior: badge + nombre oficial */
.hero-top-label {
  padding: 14px 20px 10px;
  background: var(--bg);
}
.hero-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.theme-toggle {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-soft);
  transition: background 0.2s, border-color 0.2s;
  flex-shrink: 0;
}
.theme-toggle:active { transform: scale(0.92); }
.hero-mystery-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 0.82rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--lvl-soft);
  padding: 6px 16px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--card);
}
.hero-mystery-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--lvl-bold);
  flex-shrink: 0;
}

/* Imagen completa — sin recorte */
.hero-img-wrap {
  position: relative;
  width: 100%;
  background: #111;
}
.hero-img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
}
.hero-img-placeholder {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: linear-gradient(160deg, #2A2520 0%, #1A1714 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
}
/* Degradados que mezclan con el color de fondo */
.hero-grad-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 38%;
  background: linear-gradient(to bottom,
    rgba(var(--bg-rgb), 1) 0%,
    rgba(var(--bg-rgb), 0.6) 40%,
    transparent 100%);
  pointer-events: none;
}
.hero-grad-bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 38%;
  background: linear-gradient(to top,
    rgba(var(--bg-rgb), 1) 0%,
    rgba(var(--bg-rgb), 0.6) 40%,
    transparent 100%);
  pointer-events: none;
}

/* Banda inferior: subtítulo contemplativo + referencia */
.hero-bottom-text {
  padding: 12px 20px 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.hero-subtitle {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.55rem;
  font-weight: 600;
  font-style: italic;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 6px;
}

/* ── Controles debajo del hero ── */
.session-controls {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 18px 20px 24px;
  gap: 0;
}

/* Sección actual */
.section-label-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.section-perspective {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  padding-left: 2px;
  animation: fadeIn 0.3s ease;
}
.perspective-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.perspective-label {
  font-size: 0.95rem;
  font-style: italic;
  color: var(--text-soft);
  line-height: 1.3;
}
.section-label {
  font-size: 0.88rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--lvl-soft);
  display: flex;
  align-items: center;
  gap: 7px;
}
.section-pulse {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--lvl-bold);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.5; transform: scale(1.4); }
}
.section-time {
  font-size: 0.82rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

/* Barra de progreso de playlist */
.playlist-progress {
  display: flex;
  gap: 3px;
  margin-bottom: 18px;
}
.playlist-seg {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: var(--border);
  overflow: hidden;
  transition: background 0.3s;
}
.playlist-seg.done { background: var(--lvl-bold); }
.playlist-seg.active { background: var(--border); }
.playlist-seg.active .playlist-seg-fill {
  height: 100%;
  background: var(--lvl-bold);
  border-radius: 2px;
  transition: width 0.3s linear;
}
.playlist-seg-fill { width: 0%; }

/* Controles principales */
.main-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  margin-bottom: 22px;
}
.ctrl-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, transform 0.15s;
  padding: 6px;
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
}
.ctrl-btn:active { transform: scale(0.88); color: var(--text); }
.ctrl-btn-primary {
  width: 62px; height: 62px;
  background: var(--lvl-bold);
  color: #fff;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s, box-shadow 0.2s;
  box-shadow: 0 4px 20px rgba(var(--lvl-bold-rgb, 255,122,0), 0.4);
  -webkit-tap-highlight-color: transparent;
}
.ctrl-btn-primary:active { transform: scale(0.93); }

/* Barra de progreso del audio actual */
.audio-progress-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.audio-progress-bar {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  overflow: visible;
}
.audio-progress-fill {
  height: 100%;
  background: var(--lvl-bold);
  border-radius: 3px;
  width: 0%;
  transition: width 0.1s linear;
  position: relative;
}
.audio-progress-fill::after {
  content: '';
  position: absolute;
  right: -5px; top: -4px;
  width: 12px; height: 12px;
  background: var(--lvl-bold);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.2s;
}
.audio-progress-bar:hover .audio-progress-fill::after { opacity: 1; }
.audio-time {
  font-size: 0.68rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Metros ganados */
.meters-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 0;
}
.meters-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 16px;
  background: var(--lvl-ultra);
  border: 1px solid rgba(var(--lvl-bold-rgb,255,122,0), 0.25);
  border-radius: 20px;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--lvl-soft);
}
.meters-icon { font-size: 0.9rem; }

/* Botón de completar sesión */
.btn-complete {
  width: 100%;
  padding: 15px;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  margin-top: 16px;
  display: none;
}
.btn-complete.visible { display: block; }
.btn-complete:active { transform: scale(0.97); }

/* ── Botón flotante de preguntas ── */
.fab-questions {
  position: fixed;
  bottom: 88px;      /* por encima del tab bar */
  right: 16px;
  height: 52px;
  padding: 0 18px 0 14px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 26px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,0.35);
  z-index: 100;
  transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.fab-questions:active { transform: scale(0.94); }
.fab-questions.has-answers {
  background: var(--lvl-ultra);
  border-color: var(--lvl-soft);
  box-shadow: 0 4px 20px rgba(var(--lvl-bold-rgb,255,122,0), 0.25);
}
.fab-label {
  font-family: 'Inter', sans-serif;
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text-soft);
  letter-spacing: 0.2px;
}
.fab-questions.has-answers .fab-label { color: var(--lvl-soft); }
.fab-badge {
  position: absolute;
  top: -4px; right: -4px;
  width: 16px; height: 16px;
  background: var(--lvl-bold);
  border-radius: 50%;
  font-size: 0.58rem;
  font-weight: 800;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  display: none;
}
.fab-badge.visible { display: flex; }

/* ── Notificación de metros ganados ── */
.meters-toast {
  position: fixed;
  bottom: 96px;
  right: 20px;
  padding: 8px 16px;
  background: var(--card);
  border: 1.5px solid var(--lvl-soft);
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--lvl-soft);
  z-index: 200;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
}
.meters-toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* ══════════════════════════════════════════════
   MODAL: PREGUNTAS DE MEDITACIÓN
   ══════════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,8,6,0.75);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 300;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 0;
}
.modal-overlay.open { display: flex; }

.modal-sheet {
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  border-top: 1.5px solid var(--border);
  padding: 0 0 env(safe-area-inset-bottom, 0);
  max-height: 85dvh;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.32s cubic-bezier(0.34, 1.4, 0.64, 1);
}
@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0.7; }
  to   { transform: translateY(0);    opacity: 1; }
}

.modal-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 12px auto 0;
  flex-shrink: 0;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px 12px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.modal-title {
  font-size: 0.95rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-dim);
}
.modal-saved {
  font-size: 0.85rem;
  color: var(--green);
  opacity: 0;
  transition: opacity 0.3s;
}
.modal-saved.show { opacity: 1; }
.modal-close {
  width: 28px; height: 28px;
  background: var(--sec-bg);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-soft);
  transition: background 0.2s;
}
.modal-close:active { background: var(--border); }

.modal-body {
  overflow-y: auto;
  flex: 1;
  padding: 16px 20px 24px;
  -webkit-overflow-scrolling: touch;
}

.question-group {
  margin-bottom: 22px;
}
.question-label-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.question-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.question-label {
  font-size: 0.95rem;
  font-weight: 700;
  text-transform: none;
  letter-spacing: 0;
  font-style: italic;
}
.question-text {
  font-size: 1.05rem;
  color: var(--text-soft);
  line-height: 1.7;
  margin-bottom: 12px;
  font-style: italic;
}
.question-textarea {
  width: 100%;
  min-height: 80px;
  padding: 12px 14px;
  background: var(--sec-bg);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
  line-height: 1.7;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
}
.question-textarea:focus { border-color: var(--lvl-soft); }
.question-meters {
  font-size: 0.82rem;
  color: var(--text-dim);
  margin-top: 5px;
  text-align: right;
  min-height: 14px;
  transition: color 0.3s;
}
.question-meters.earned { color: var(--lvl-soft); }

/* ══════════════════════════════════════════════
   PANTALLA: COMPLETADO
   ══════════════════════════════════════════════ */
#scr-complete {
  align-items: center;
  justify-content: flex-start;
  padding: 40px 24px 100px;
  text-align: center;
  background: var(--bg);
  flex-direction: column;
  gap: 0;
  overflow-y: auto;
}

/* ── Epílogo del canto ── */
.epilogo-canto {
  width: 100%;
  max-width: 360px;
  margin: 24px 0 20px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  text-align: left;
}
.epilogo-canto-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.epilogo-canto-titulo {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--text);
  flex: 1;
}
.epilogo-canto-badge {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--lvl-soft);
  background: var(--lvl-ultra);
  padding: 3px 10px;
  border-radius: 20px;
  white-space: nowrap;
}
/* Player del canto en epílogo */
.epilogo-player {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.epilogo-play-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--lvl-bold);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex-shrink: 0;
  transition: transform 0.15s;
}
.epilogo-play-btn:active { transform: scale(0.92); }
.epilogo-player-bar {
  flex: 1;
}
.epilogo-bar-track {
  width: 100%;
  height: 4px;
  background: var(--border);
  border-radius: 3px;
  cursor: pointer;
  margin-bottom: 4px;
}
.epilogo-bar-fill {
  height: 100%;
  background: var(--lvl-bold);
  border-radius: 3px;
  width: 0%;
  transition: width 0.1s linear;
}
.epilogo-bar-time {
  font-size: 0.7rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
/* Letra del canto */
.epilogo-letra {
  padding: 16px 20px 20px;
  font-size: 1rem;
  line-height: 1.85;
  color: var(--text-soft);
  white-space: pre-line;
  font-style: italic;
  max-height: 320px;
  overflow-y: auto;
}
.complete-icon {
  font-size: 3.5rem;
  margin-bottom: 20px;
  animation: scaleIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes scaleIn {
  from { transform: scale(0.3); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.complete-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 2rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 10px;
  line-height: 1.2;
}
.complete-subtitle {
  font-size: 0.85rem;
  color: var(--text-soft);
  line-height: 1.7;
  margin-bottom: 28px;
  max-width: 300px;
}
.complete-meters {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--lvl-bold);
  margin-bottom: 28px;
}
.btn-next-session {
  width: 100%;
  max-width: 320px;
  padding: 15px;
  background: var(--lvl-bold);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  margin-bottom: 12px;
}
.btn-next-session:active { transform: scale(0.97); }

const $ = id => document.getElementById(id);
const fmtTime = s => {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
};

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function setMsg(msg) {
  $('loading-msg').textContent = msg;
}

function showToast(text) {
  const t = $('meters-toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function applyBlockColor(block) {
  const c = BLOCK_COLORS[block] || BLOCK_COLORS.gozosos;
  document.documentElement.style.setProperty('--lvl-bold', c.bold);
  const rgb = c.bold.replace('#','').match(/.{2}/g).map(h=>parseInt(h,16)).join(',');
  document.documentElement.style.setProperty('--lvl-bold-rgb', rgb);
  document.documentElement.style.setProperty('--lvl-soft', c.bold);
  document.documentElement.style.setProperty('--lvl-ultra', `rgba(${rgb},0.10)`);
  $('mystery-dot').style.background = c.bold;
}

window._logout        = () => signOut(auth).then(() => { location.href = 'index.html'; }).catch(() => { location.href = 'index.html'; });

window._goToPrevMystery = () => {
  console.log('_goToPrevMystery llamado. audioProgress:', JSON.stringify(audioProgress));
  if (!audioProgress) {
    console.warn('audioProgress es null — recargando app');
    location.reload();
    return;
  }
  // audioProgress ya apunta al misterio que falló (el nuevo)
  // retrocedemos DOS pasos: uno para deshacer el avance, otro para ir al anterior
  // — o simplemente retrocedemos uno desde el misterio actual
  let { nivel, cuaderno, misterio } = audioProgress;
  misterio--;
  if (misterio < 1) {
    misterio = 20;
    cuaderno--;
    if (cuaderno < 1) { cuaderno = 4; nivel = Math.max(1, nivel - 1); }
  }
  console.log('Yendo a misterio:', nivel, cuaderno, misterio);
  audioProgress.nivel = nivel;
  audioProgress.cuaderno = cuaderno;
  audioProgress.misterio = misterio;
  audioProgress.firstAnswered = [false, false, false];
  await saveAudioProgress();
  sessionMeters = 0; sessionCompleted = false; currentTrack = -1;
  if (epilogoAudioEl) { epilogoAudioEl.pause(); epilogoAudioEl = null; }
  stopAudio(); bgmStop();
  show('scr-loading'); setMsg('Cargando misterio anterior…');
  setTimeout(() => buildSession(), 300);
};

async function loadUserAndStart() {
  show('scr-loading');
  setMsg('Cargando tu camino…');

  const uid = currentUser.uid;

  // Leer plan del usuario
  userPlan = 'premium'; // asumir premium hasta confirmar lo contrario
  try {
    const userSnap = await getDoc(doc(db, 'users', uid));
    if (userSnap.exists()) {
      const data = userSnap.data();
      const plan = (data.plan || '').toLowerCase().trim();
      console.log('Firestore plan field:', plan);
      // Solo asignar free si el plan es explícitamente vacío o 'free'
      if (plan === 'free' || plan === '') {
        userPlan = 'free';
      } else {
        userPlan = 'premium'; // beta, pro, premium → todos tienen acceso completo
      }
      console.log('userPlan asignado:', userPlan);
    } else {
      console.warn('Documento users/uid no encontrado — asumiendo premium');
    }
  } catch(e) {
    console.warn('Error leyendo plan (asumiendo premium):', e.message);
  }

  // Leer audioProgress
  try {
    const snap = await getDoc(doc(db, 'users', uid, 'audioProgress', 'current'));
    if (snap.exists()) {
      audioProgress = snap.data();
    } else {
      audioProgress = {
        nivel: 1, cuaderno: 1, misterio: 1,
        firstAnswered: [false, false, false],
        history: []
      };
      await setDoc(doc(db, 'users', uid, 'audioProgress', 'current'), audioProgress);
    }
  } catch(e) {
    console.error('Error cargando progreso:', e);
    audioProgress = { nivel: 1, cuaderno: 1, misterio: 1, firstAnswered:[false,false,false], history:[] };
  }

  // Límite diario de free: se gestiona en el botón de completar sesión
  console.log('userPlan:', userPlan, '| misterio:', audioProgress.nivel, audioProgress.cuaderno, audioProgress.misterio);
  await buildSession();
}

function hasSessionToday() {
  if (!audioProgress || !audioProgress.history || !audioProgress.history.length) return false;
  const last = audioProgress.history[audioProgress.history.length - 1];
  if (!last || !last.completedAt) return false;
  const lastDate = new Date(last.completedAt);
  const today    = new Date();
  return lastDate.getFullYear() === today.getFullYear() &&
         lastDate.getMonth()    === today.getMonth()    &&
         lastDate.getDate()     === today.getDate();
}

  try {
    await updateDoc(doc(db, 'users', currentUser.uid), {
      totalMeters: increment(meters)
    });

async function saveReflection(qi, text) {
  if (!currentUser || !currentSession) return;
  const { nivel, cuaderno, misterio } = currentSession;
  const key = `${nivel}_${cuaderno}_${misterio}`;
  try {
    await setDoc(
      doc(db, 'users', currentUser.uid, 'reflections', key),
      { [`q${qi}`]: text, updatedAt: Date.now() },
      { merge: true }
    );
  } catch(e) { console.error(e); }

async function loadReflections() {
  if (!currentUser || !currentSession) return { q0:'', q1:'', q2:'' };
  const { nivel, cuaderno, misterio } = currentSession;
  const key = `${nivel}_${cuaderno}_${misterio}`;
  try {
    const snap = await getDoc(doc(db, 'users', currentUser.uid, 'reflections', key));
    if (snap.exists()) return snap.data();
  } catch(e) {}
  return { q0:'', q1:'', q2:'' };
}

// CONSTRUIR SESIÓN
// ════════════════════════════════════════════

async function buildSession() {
  const { nivel, cuaderno, misterio } = audioProgress;
  setMsg(`Preparando Nivel ${nivel}-${cuaderno}, Misterio ${misterio}…`);

  // Construir ID de nivel (ej. 0101)
  const nivelId = String(nivel).padStart(2,'0') + String(cuaderno).padStart(2,'0');

  // Cargar JSON del cuaderno
  try {
    const base = location.origin + location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
    const resp = await fetch(base + 'data/' + nivelId + '.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    currentData = await resp.json();
  } catch(e) {
    // Fallback: si no hay JSON, crear sesión con placeholders
    currentData = null;
    console.warn('No se encontró JSON para', nivelId);
  }

  // Determinar bloque (misterios del día o según posición 1-20)
  // Misterios 1-5 = gozosos, 6-10 = luminosos, 11-15 = dolorosos, 16-20 = gloriosos
  const m = misterio; // 1-20
  let block, blockIdx;
  if      (m <= 5)  { block = 'gozosos';   blockIdx = m - 1; }
  else if (m <= 10) { block = 'luminosos';  blockIdx = m - 6; }
  else if (m <= 15) { block = 'dolorosos';  blockIdx = m - 11; }
  else              { block = 'gloriosos';  blockIdx = m - 16; }

  // Datos del misterio desde JSON
  let mysteryData = null;
  if (currentData && currentData.misterios && currentData.misterios[block]) {
    mysteryData = currentData.misterios[block][blockIdx] || null;
  }

  // Construir playlist
  // Las Preguntas se expanden en 6 tracks (QA·silencio·QB·silencio·QC·silencio)
  // agrupados visualmente como un solo segmento en la barra.
  const n = nivel, c = cuaderno;
  const silencioUrl = AUDIO_FOLDERS['rezo'] + 'silencio.mp3'; // /audio/global/silencio.mp3
  const pausaUrl   = AUDIO_FOLDERS['rezo'] + 'pausa.mp3';
  const playlist = [
    { label:'Bienvenida',      file:`START_${n}_${c}_${m}.mp3`,  folder:'start',  seg:0 },
    { label:'Bienvenida',      file:'pausa.mp3',                  folder:'rezo',   seg:0, silence:true },
    { label:'Camino y Palabra',file:`UBIBLE_${n}_${c}_${m}.mp3`, folder:'ubible', seg:1 },
    { label:'Camino y Palabra',file:'pausa.mp3',                  folder:'rezo',   seg:1, silence:true },
    { label:'Contemplación',   file:`CONT_${n}_${c}_${m}.mp3`,   folder:'cont',   seg:2 },
    { label:'Contemplación',   file:'pausa.mp3',                  folder:'rezo',   seg:2, silence:true },
    { label:'Rezo',            file:`rezo.mp3`,                   folder:'rezo',   seg:3 },
    { label:'Rezo',            file:'pausa.mp3',                  folder:'rezo',   seg:3, silence:true },
    { label:'Canto',           file:`M_${n}_${c}_${m}.mp3`,      folder:'music',  seg:4 },
    { label:'Canto',           file:'pausa.mp3',                  folder:'rezo',   seg:4, silence:true },
    // ── Separador de Meditación ──
    { label:'Meditación',      file:'meditacion.mp3',             folder:'rezo',   seg:5 },
    { label:'Meditación',      file:'pausa.mp3',                  folder:'rezo',   seg:5, silence:true },
    // ── Bloque de Preguntas ──
    { label:'Preguntas',       file:`QA_${n}_${c}_${m}.mp3`,     folder:'q',      seg:6, qIdx:0 },
    { label:'Preguntas',       file:'silencio.mp3',               folder:'rezo',   seg:6, silence:true },
    { label:'Preguntas',       file:`QB_${n}_${c}_${m}.mp3`,     folder:'q',      seg:6, qIdx:1 },
    { label:'Preguntas',       file:'silencio.mp3',               folder:'rezo',   seg:6, silence:true },
    { label:'Preguntas',       file:`QC_${n}_${c}_${m}.mp3`,     folder:'q',      seg:6, qIdx:2 },
    { label:'Preguntas',       file:'silencio.mp3',               folder:'rezo',   seg:6, silence:true },
    // ── Oración final + pausa + Despedida ──
    { label:'Oración final',   file:`PRAY_${n}_${c}_${m}.mp3`,   folder:'pray',   seg:7 },
    { label:'Oración final',   file:'pausa.mp3',                  folder:'rezo',   seg:7, silence:true },
    { label:'Despedida',       file:`BYE_${n}_${c}_${m}.mp3`,    folder:'bye',    seg:8 }
  ].map(t => ({
    ...t,
    url: (t.folder === 'rezo' && t.file === 'silencio.mp3') ? silencioUrl
       : (t.folder === 'rezo' && t.file === 'pausa.mp3')    ? pausaUrl
       : AUDIO_FOLDERS[t.folder] + t.file
  }));


  currentSession = { nivel: n, cuaderno: c, misterio: m, block, blockIdx, mysteryData, playlist };
  sessionMeters = 0;
  sessionCompleted = false;

  renderSession();
  show('scr-session');
}

// ════════════════════════════════════════════
// RENDER SESIÓN
// ════════════════════════════════════════════

function renderSession() {
  const { nivel, cuaderno, misterio, block, blockIdx, mysteryData, playlist } = currentSession;

  // Color de bloque
  applyBlockColor(block);

  // Badge superior: ordinal + tipo
  const ord = ORDS[misterio - 1] || misterio + 'º';
  const blockName = BLOCK_NAMES[block] || block;
  $('mystery-badge-text').textContent = `${ord} Misterio ${blockName}`;

  // Nombre oficial del Catecismo
  const officialName = OFFICIAL_NAMES[block] ? OFFICIAL_NAMES[block][blockIdx] || '' : '';
  $('mystery-official-name').textContent = officialName;

  // Subtítulo (nombre temático del cuaderno/misterio) — degradado inferior
  const subtitle = mysteryData ? (mysteryData.subtitulo || mysteryData.titulo || '') : `Misterio ${misterio}`;
  $('hero-subtitle').textContent = subtitle;

  // Referencia bíblica — solo la cita, no el texto completo
  const ref = mysteryData ? (mysteryData.referencia || '') : '';
  $('hero-reference').textContent = ref;

  // Imagen
  const imgUrl = `${IMG_BASE}P_${nivel}_${cuaderno}_${misterio}.webp`;
  const heroImg = $('hero-img');
  heroImg.onload = () => {
    heroImg.style.display = 'block';
    $('hero-placeholder').style.display = 'none';
  };
  heroImg.onerror = () => {
    heroImg.style.display = 'none';
    $('hero-placeholder').style.display = 'flex';
    $('hero-placeholder').textContent = BLOCK_COLORS[block]?.dot || '🕊️';
  };
  heroImg.src = imgUrl;

  // Inicializar progress bars: 8 segmentos visuales (no uno por track)
  const container = $('playlist-progress');
  container.innerHTML = Array.from({length: NUM_SEGS}, (_, i) =>
    `<div class="playlist-seg" id="pseg-${i}"><div class="playlist-seg-fill" id="pseg-fill-${i}"></div></div>`
  ).join('');

  // Sección inicial
  updateSectionDisplay(-1);

  // Limpiar pantalla de completado para evitar acumulación de botones
  const actionsDiv = $('complete-actions');
  if (actionsDiv) actionsDiv.innerHTML = '';
  const epilogoDiv = $('epilogo-canto');
  if (epilogoDiv) epilogoDiv.style.display = 'none';

  // FAB preguntas — visible siempre en sesión
  $('fab-questions').style.display = 'flex';

  // Eventos controles
  $('btn-play-pause').onclick = togglePlayPause;
  $('btn-prev').onclick       = () => goTrack(currentTrack - 1);
  $('btn-next').onclick       = () => goTrack(currentTrack + 1);
  $('btn-complete').onclick   = completeSession;

  // Progress bar click
  $('progress-bar').onclick = e => {
    if (!audioEl || !audioEl.duration) return;
    const rect = $('progress-bar').getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    audioEl.currentTime = ratio * audioEl.duration;
  };

  // FAB y modal
  $('fab-questions').onclick = openModal;
  $('modal-close').onclick   = closeModal;
  $('modal-overlay').onclick = e => { if (e.target === $('modal-overlay')) closeModal(); };

  // Btn next mystery (pantalla completado)
  // Texto del botón según plan
  // Botones de acción se generan dinámicamente en completeSession()

  // Botón BGM
  const btnBgm = $('btn-bgm');
  if (btnBgm) btnBgm.onclick = bgmToggle;

  // Botón tema
  const btnTheme = $('btn-theme');
  if (btnTheme) btnTheme.onclick = toggleTheme;

  // Iniciar BGM de fondo
  bgmInit();

  // Arrancar reproducción automáticamente
  startPlaylist();
}

function startPlaylist() {
  goTrack(0);
}

function isCanto(idx) {
  const { playlist } = currentSession;
  return playlist && playlist[idx] && playlist[idx].folder === 'music';
}

// Progreso acumulado dentro del bloque de Preguntas (seg 6)
// Para animar la barra del segmento 5 de forma continua a través de 6 sub-tracks
function getSegProgress(trackIdx) {
  const { playlist } = currentSession;
  const track = playlist[trackIdx];
  if (!track || track.seg !== 5) return null;
  // Sub-tracks del seg 5: índices en playlist donde seg===5
  const qTracks = playlist.map((t,i) => t.seg === 6 ? i : -1).filter(i => i >= 0);
  const posInGroup = qTracks.indexOf(trackIdx); // 0-5
  const total = qTracks.length; // 6
  return { posInGroup, total };
}

function goTrack(idx) {
  const { playlist } = currentSession;
  if (idx < 0 || idx >= playlist.length) return;

  stopAudio();
  currentTrack = idx;
  updateSectionDisplay(idx);

  const track = playlist[idx];

  // BGM: silencio en Bienvenida (START) y Canto; activo desde UBIBLE en adelante
  if (isCanto(idx)) {
    bgmPause();
  } else {
    bgmResume();
  }

  audioEl = new Audio(track.url);

  audioEl.onerror = () => {
    console.warn('Audio no encontrado:', track.url);
    // Si falla el START (primer track), el nivel no está publicado aún
    if (track.folder === 'start') {
      showComingSoon();
      return;
    }
    markSegProgress(idx, 100);
    if (isCanto(idx)) bgmResume();
    // Si quedan tracks, avanzar; si no, terminar
    if (idx + 1 < currentSession.playlist.length) {
      goTrack(idx + 1);
    } else {
      onPlaylistEnded();
    }
  };

  audioEl.ontimeupdate = () => {
    if (!audioEl.duration) return;
    const pct = (audioEl.currentTime / audioEl.duration) * 100;
    $('progress-fill').style.width = pct + '%';
    $('time-current').textContent = fmtTime(audioEl.currentTime);
    $('time-duration').textContent = fmtTime(audioEl.duration);
    $('section-time').textContent  = fmtTime(audioEl.currentTime) + ' / ' + fmtTime(audioEl.duration);

    // Barra del segmento visual
    const gp = getSegProgress(idx);
    if (gp) {
      // Segmento de Preguntas: progreso continuo a través de los 6 sub-tracks
      const segPct = ((gp.posInGroup + pct / 100) / gp.total) * 100;
      const fill = $('pseg-fill-' + track.seg);
      if (fill) fill.style.width = segPct + '%';
    } else {
      const fill = $('pseg-fill-' + track.seg);
      if (fill) fill.style.width = pct + '%';
    }
  };

  audioEl.onended = () => {
    if (isCanto(idx)) bgmResume();
    // Marcar segmento visual como done solo al terminar el ÚLTIMO sub-track del grupo
    const gp = getSegProgress(idx);
    if (gp) {
      if (gp.posInGroup === gp.total - 1) markSegDone(track.seg); // seg:6
    } else {
      markSegDone(track.seg);
    }
    if (idx + 1 < playlist.length) {
      goTrack(idx + 1);
    } else {
      onPlaylistEnded();
    }
  };

  audioEl.oncanplaythrough = () => {
    audioEl.play().then(() => {
      isPlaying = true;
      updatePlayPauseBtn();
    }).catch(e => {
      console.warn('Autoplay bloqueado:', e);
      isPlaying = false;
      updatePlayPauseBtn();
    });
  };

  // Marcar segmento visual como activo (solo si no está ya done)
  const segEl = $('pseg-' + track.seg);
  if (segEl && !segEl.classList.contains('done')) segEl.classList.add('active');
}

function markSegProgress(trackIdx, pct) {
  const { playlist } = currentSession;
  const track = playlist[trackIdx];
  if (!track) return;
  const fill = $('pseg-fill-' + track.seg);
  if (fill) fill.style.width = pct + '%';
}

function stopAudio() {
  if (audioEl) {
    audioEl.pause();
    audioEl.onended = null;
    audioEl.onerror = null;
    audioEl.ontimeupdate = null;
    audioEl.oncanplaythrough = null;
    audioEl = null;
  }
  isPlaying = false;
  updatePlayPauseBtn();
  $('progress-fill').style.width = '0%';
  $('time-current').textContent = '0:00';
  $('time-duration').textContent = '0:00';
}

// BGM — Música de fondo
// ════════════════════════════════════════════

// ── Web Audio API para control preciso de ganancia del BGM ──
let bgmAudioCtx  = null;
let bgmSource    = null;
let bgmGainNode  = null;
let bgmFadeTimer = null;

function bgmClearFade() {
  if (bgmFadeTimer) { clearTimeout(bgmFadeTimer); bgmFadeTimer = null; }
}

function bgmInit() {
  if (!currentSession) return;
  const { nivel, cuaderno } = currentSession;
  const url = `${BGM_BASE}BGM_${nivel}_${cuaderno}.mp3`;

  bgmEl = new Audio(url);
  bgmEl.loop = true;
  bgmEl.crossOrigin = 'anonymous';
  bgmLoaded = false;

  bgmEl.onerror = () => {
    console.warn('BGM no encontrado:', url);
    bgmEl = null;
  };

  bgmEl.oncanplaythrough = () => {
    if (bgmLoaded) return; // evitar doble setup
    bgmLoaded = true;

    // Crear contexto Web Audio y conectar GainNode
    try {
      bgmAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      bgmSource   = bgmAudioCtx.createMediaElementSource(bgmEl);
      bgmGainNode = bgmAudioCtx.createGain();
      bgmGainNode.gain.value = 0; // arrancar en silencio
      bgmSource.connect(bgmGainNode);
      bgmGainNode.connect(bgmAudioCtx.destination);
    } catch(e) {
      // Fallback: usar .volume nativo si Web Audio falla
      console.warn('Web Audio API no disponible, usando volume nativo');
      bgmGainNode = null;
    }

    if (bgmEnabled && !isCanto(currentTrack)) {
      bgmResume();
    }
  };
}

function bgmSetGain(value) {
  // Controla ganancia vía Web Audio si disponible, o .volume nativo
  if (bgmGainNode) {
    bgmGainNode.gain.value = Math.max(0, Math.min(1, value));
  } else if (bgmEl) {
    bgmEl.volume = Math.max(0, Math.min(1, value));
  }
}

function bgmGetGain() {
  if (bgmGainNode) return bgmGainNode.gain.value;
  if (bgmEl) return bgmEl.volume;
  return 0;
}

function bgmFadeTo(target, durationMs, onDone) {
  bgmClearFade();
  if (!bgmEl) return;
  const steps    = 30;
  const interval = durationMs / steps;
  const start    = bgmGetGain();
  const delta    = (target - start) / steps;
  let   step     = 0;

  function tick() {
    step++;
    const val = start + delta * step;
    bgmSetGain(step < steps ? val : target);
    if (step < steps) {
      bgmFadeTimer = setTimeout(tick, interval);
    } else {
      bgmFadeTimer = null;
      if (onDone) onDone();
    }
  }
  tick();
}

function bgmPause() {
  bgmClearFade();
  if (!bgmEl) return;
  bgmFadeTo(0, 400, () => {
    if (bgmEl) bgmEl.pause();
  });
}

function bgmResume() {
  bgmClearFade();
  if (!bgmEl || !bgmEnabled) return;

  // Reanudar contexto si fue suspendido (política autoplay)
  if (bgmAudioCtx && bgmAudioCtx.state === 'suspended') {
    bgmAudioCtx.resume().catch(() => {});
  }
  if (bgmEl.paused) {
    bgmEl.play().catch(() => {});
  }
  bgmFadeTo(BGM_VOL, 600);
}

function bgmStop() {
  bgmClearFade();
  if (bgmEl) {
    bgmEl.pause();
    bgmEl.oncanplaythrough = null;
    bgmEl.onerror = null;
    bgmEl = null;
  }
  if (bgmAudioCtx) {
    bgmAudioCtx.close().catch(() => {});
    bgmAudioCtx = null;
  }
  bgmSource   = null;
  bgmGainNode = null;
  bgmLoaded   = false;
}

function bgmToggle() {
  bgmEnabled = !bgmEnabled;
  if (bgmEnabled) {
    bgmResume();
  } else {
    bgmPause();
  }
  updateBgmBtn();
}

function updateBgmBtn() {
  const btn = $('btn-bgm');
  if (!btn) return;
  btn.title = bgmEnabled ? 'Silenciar música de fondo' : 'Activar música de fondo';
  btn.classList.toggle('muted', !bgmEnabled);
  const on  = btn.querySelector('.bgm-on');
  const off = btn.querySelector('.bgm-off');
  if (on)  on.style.display  = bgmEnabled ? 'inline-block' : 'none';
  if (off) off.style.display = bgmEnabled ? 'none' : 'inline-block';
}

function togglePlayPause() {
  if (!audioEl) {
    if (currentTrack < 0) startPlaylist();
    return;
  }
  if (isPlaying) {
    audioEl.pause();
    isPlaying = false;
  } else {
    audioEl.play().then(() => { isPlaying = true; }).catch(()=>{});
    isPlaying = true;
  }
  updatePlayPauseBtn();
}

function updatePlayPauseBtn() {
  $('ico-play').style.display  = isPlaying ? 'none' : 'block';
  $('ico-pause').style.display = isPlaying ? 'block' : 'none';
}

// Perspectivas por qIdx
const Q_PERSPECTIVES = [
  { label: 'Por María hacia Jesús:', color: '#FF7A00' },
  { label: 'Desde el Hijo hacia el Padre:', color: '#C0392B' },
  { label: 'Hijos y hermanos en el Espíritu:', color: '#27AE60' }
];

function updateSectionDisplay(idx) {
  const { playlist } = currentSession;
  const perspWrap  = $('section-perspective');
  const perspLabel = $('perspective-label');
  const perspDot   = $('perspective-dot');

  if (idx < 0 || idx >= playlist.length) {
    $('section-name').textContent = idx < 0 ? 'Listo para comenzar' : 'Sesión completada';
    $('section-pulse').style.animationPlayState = 'paused';
    if (perspWrap) perspWrap.style.display = 'none';
    return;
  }

  const track = playlist[idx];
  $('section-name').textContent = track.label;
  $('section-pulse').style.animationPlayState = 'running';

  // Mostrar perspectiva solo en QA (qIdx:0), QB (qIdx:1), QC (qIdx:2)
  if (typeof track.qIdx === 'number' && perspWrap) {
    const p = Q_PERSPECTIVES[track.qIdx];
    perspLabel.textContent   = p.label;
    perspDot.style.background = p.color;
    perspWrap.style.display  = 'flex';
  } else {
    if (perspWrap) perspWrap.style.display = 'none';
  }
}

function markSegDone(segIdx) {
  // segIdx = índice del segmento VISUAL (0-7), no del track
  const seg = $('pseg-' + segIdx);
  if (seg) {
    seg.classList.remove('active');
    seg.classList.add('done');
    const fill = $('pseg-fill-' + segIdx);
    if (fill) fill.style.width = '100%';
  }
}

function onPlaylistEnded() {
  isPlaying = false;
  updatePlayPauseBtn();
  updateSectionDisplay(currentSession.playlist.length);
  const btnC = $('btn-complete');
  if (btnC) { btnC.disabled = false; btnC.classList.add('visible'); }
  $('section-pulse').style.animationPlayState = 'paused';
}

// ── Cargar cantos del nivel ──
let CANTOS_DATA = null;

async function loadCantos(nivelId) {
  if (CANTOS_DATA) return CANTOS_DATA;
  try {
    const base = location.origin + location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
    const resp = await fetch(base + 'data/' + nivelId + '-cantos.json');
    if (!resp.ok) return null;
    CANTOS_DATA = await resp.json();
    return CANTOS_DATA;
  } catch(e) { return null; }
}

function getCanto(cantosData, block, blockIdx) {
  if (!cantosData || !cantosData.cantos || !cantosData.cantos[block]) return null;
  return cantosData.cantos[block][blockIdx] || null;
}

function renderEpilogo(canto, audioUrl) {
  const wrap = $('epilogo-canto');
  if (!canto) { wrap.style.display = 'none'; return; }

  $('epilogo-titulo').textContent = canto.titulo;
  $('epilogo-letra').textContent  = canto.letra;
  wrap.style.display = '';

  // Player del epílogo
  if (epilogoAudioEl) { epilogoAudioEl.pause(); epilogoAudioEl = null; }
  epilogoAudioEl = new Audio(audioUrl);

  epilogoAudioEl.ontimeupdate = () => {
    if (!epilogoAudioEl.duration) return;
    const pct = (epilogoAudioEl.currentTime / epilogoAudioEl.duration) * 100;
    $('epilogo-bar-fill').style.width = pct + '%';
    $('epilogo-bar-time').textContent =
      fmtTime(epilogoAudioEl.currentTime) + ' / ' + fmtTime(epilogoAudioEl.duration);
  };
  epilogoAudioEl.onended = () => {
    $('epilogo-ico-play').style.display  = 'block';
    $('epilogo-ico-pause').style.display = 'none';
    $('epilogo-bar-fill').style.width = '0%';
    epilogoAudioEl.currentTime = 0;
  };
  epilogoAudioEl.onerror = () => {
    $('epilogo-play-btn').style.opacity = '0.4';
    $('epilogo-play-btn').disabled = true;
  };

  $('epilogo-play-btn').onclick = () => {
    if (!epilogoAudioEl) return;
    if (epilogoAudioEl.paused) {
      epilogoAudioEl.play().catch(() => {});
      $('epilogo-ico-play').style.display  = 'none';
      $('epilogo-ico-pause').style.display = 'block';
    } else {
      epilogoAudioEl.pause();
      $('epilogo-ico-play').style.display  = 'block';
      $('epilogo-ico-pause').style.display = 'none';
    }
  };

  $('epilogo-bar-track').onclick = e => {
    if (!epilogoAudioEl || !epilogoAudioEl.duration) return;
    const rect = $('epilogo-bar-track').getBoundingClientRect();
    epilogoAudioEl.currentTime = ((e.clientX - rect.left) / rect.width) * epilogoAudioEl.duration;
  };
}

async function completeSession() {
  if (sessionCompleted) return;
  sessionCompleted = true;

  // Deshabilitar el botón para evitar doble pulsación
  const btnC = $('btn-complete');
  if (btnC) { btnC.disabled = true; btnC.classList.remove('visible'); }

  stopAudio();
  bgmStop();

  const metersEarned = METERS_SESSION;
  sessionMeters += metersEarned;

  await addMetersToFirestore(metersEarned);
  $('session-meters-display').textContent = `${sessionMeters.toLocaleString('es-MX')}m esta sesión`;

  // Registrar en historial
  const { nivel, cuaderno, misterio, block, blockIdx } = currentSession;
  if (!audioProgress.history) audioProgress.history = [];
  audioProgress.history.push({ n:nivel, c:cuaderno, m:misterio, completedAt: Date.now() });
  await saveAudioProgress(); // guardar historial inmediatamente

  // Pantalla completado — datos básicos
  $('complete-title').textContent    = currentSession.mysteryData?.titulo || `Misterio ${misterio}`;
  $('complete-subtitle').textContent = `Nivel ${nivel}-${cuaderno} · ${ORDS[misterio-1]} Misterio ${BLOCK_NAMES[block]}`;
  $('complete-meters').textContent   = `+${sessionMeters.toLocaleString('es-MX')}m`;

  // Cargar canto del epílogo
  const nivelId   = String(nivel).padStart(2,'0') + String(cuaderno).padStart(2,'0');
  CANTOS_DATA     = null; // forzar recarga si cambió de nivel
  const cantosData = await loadCantos(nivelId);
  const canto      = getCanto(cantosData, block, blockIdx);
  const cantoUrl   = AUDIO_FOLDERS['music'] + `M_${nivel}_${cuaderno}_${misterio}.mp3`;
  renderEpilogo(canto, cantoUrl);

  // Botones de acción
  const actions = $('complete-actions');
  const s = 'width:100%;padding:15px;border-radius:14px;font-family:Inter,sans-serif;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:10px;display:block;';
  if (userPlan === 'free') {
    actions.innerHTML =
      '<button onclick="window.showDailyLimit()" style="' + s + 'background:var(--lvl-bold);color:#fff;border:none;">Volver mañana 🙏</button>' +
      '<button onclick="window._repeatSession()" style="' + s + 'background:var(--card);color:var(--text-soft);border:1.5px solid var(--border);">🔄 Repetir sesión</button>';
  } else {
    actions.innerHTML =
      '<button onclick="window.advanceAndRestart()" style="' + s + 'background:var(--lvl-bold);color:#fff;border:none;">Siguiente misterio →</button>' +
      '<button onclick="window._repeatSession()" style="' + s + 'background:var(--card);color:var(--text-soft);border:1.5px solid var(--border);">🔄 Repetir sesión</button>';
  }

  show('scr-complete');
  $('fab-questions').style.display = 'none';
}

function showComingSoon() {
  stopAudio();
  bgmStop();
  const { nivel, cuaderno } = currentSession;
  const s = 'padding:14px 0;border-radius:13px;font-family:Inter,sans-serif;font-size:1rem;font-weight:700;cursor:pointer;width:100%;max-width:280px;display:block;margin:0 auto 12px;';
  $('scr-loading').innerHTML =

    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.8rem;font-weight:600;color:var(--text);margin-bottom:14px;line-height:1.3;">Contenido en camino</div>' +
    '<p style="font-size:1rem;color:var(--text-soft);line-height:1.75;margin-bottom:28px;max-width:300px;margin-left:auto;margin-right:auto;">' +
    'El Nivel ' + nivel + '-' + cuaderno + ' sigue en desarrollo.<br>Se publicará pronto.<br><br>Mientras tanto, puedes rezar los misterios anteriores.</p>' +

async function advanceAndRestart() {
  if (epilogoAudioEl) { epilogoAudioEl.pause(); epilogoAudioEl = null; }
  // Calcular siguiente misterio
  let { nivel, cuaderno, misterio } = audioProgress;
  misterio++;
  if (misterio > 20) {
    misterio = 1;
    cuaderno++;
    if (cuaderno > 4) {
      cuaderno = 1;
      nivel++;
    }
  }
  audioProgress.nivel         = nivel;
  audioProgress.cuaderno      = cuaderno;
  audioProgress.misterio      = misterio;
  audioProgress.firstAnswered = [false, false, false];

  // Guardar en Firestore y ESPERAR confirmación
  // (garantiza que otros dispositivos leerán el progreso correcto)
  await saveAudioProgress();

  // Construir nueva sesión directamente desde el estado en memoria
  sessionMeters    = 0;
  sessionCompleted = false;
  $('fab-questions').style.display = 'flex';
  await buildSession();
}

async function openModal() {
  const existing = await loadReflections();
  localAnswers[0] = existing.q0 || '';
  localAnswers[1] = existing.q1 || '';
  localAnswers[2] = existing.q2 || '';

  const { mysteryData } = currentSession;
  const questions = parseQuestions(mysteryData?.meditacion || '');

  const body = $('modal-body');
  body.innerHTML = Q_LABELS.map((label, i) => `
    <div class="question-group">
      <div class="question-label-row">
        <div class="question-dot" style="background:${Q_COLORS[i]}"></div>
        <span class="question-label" style="color:${Q_COLORS[i]}">${label}</span>
      </div>
      <p class="question-text">${escHTML(questions[i] || '')}</p>
      <textarea
        class="question-textarea"
        id="q-ta-${i}"
        placeholder="Escribe tu reflexión…"
        rows="3"
      >${escHTML(localAnswers[i])}</textarea>
      <div class="question-meters" id="q-meters-${i}"></div>
    </div>
  `).join('');

  // Eventos con debounce
  [0,1,2].forEach(i => {
    const ta = $(`q-ta-${i}`);
    if (!ta) return;
    ta.addEventListener('input', () => onAnswerInput(i, ta.value));
  });

  $('modal-overlay').classList.add('open');
  updateFabBadge();
}

function closeModal() {
  // Guardado final forzado
  forceSaveAll();
  $('modal-overlay').classList.remove('open');
}

function onAnswerInput(qi, value) {
  localAnswers[qi] = value;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => autoSave(qi, value), 2000);
}

async function autoSave(qi, value) {
  if (!value.trim()) return;
  await saveReflection(qi, value);
  showSavedIndicator();
  await awardQuestionMeters(qi, value);
}

async function forceSaveAll() {
  clearTimeout(autosaveTimer);
  for (let i = 0; i < 3; i++) {
    if (localAnswers[i].trim()) {
      await saveReflection(i, localAnswers[i]);
      await awardQuestionMeters(i, localAnswers[i]);
    }
  }
  showSavedIndicator();
  updateFabBadge();
}

async function awardQuestionMeters(qi, value) {
  if (!value.trim()) return;
  const wasFirst = !audioProgress.firstAnswered[qi];
  if (wasFirst) {
    audioProgress.firstAnswered[qi] = true;
    await saveAudioProgress();
    const earned = METERS_Q_FIRST;
    sessionMeters += earned;
    await addMetersToFirestore(earned);
    $('session-meters-display').textContent = `${sessionMeters.toLocaleString('es-MX')}m esta sesión`;
    const el = $(`q-meters-${qi}`);
    if (el) { el.textContent = `+${earned}m ganados`; el.classList.add('earned'); }
    showToast(`+${earned}m · ${Q_LABELS[qi].replace(':','')}`);
  } else {
    // Actualización posterior
    const el = $(`q-meters-${qi}`);
    if (el && !el.classList.contains('earned')) {
      el.textContent = `+${METERS_Q_UPDATE}m`;
      el.classList.add('earned');
      await addMetersToFirestore(METERS_Q_UPDATE);
      sessionMeters += METERS_Q_UPDATE;
      $('session-meters-display').textContent = `${sessionMeters.toLocaleString('es-MX')}m esta sesión`;
    }
  }
}

function showSavedIndicator() {
  const el = $('modal-saved');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function updateFabBadge() {
  const answered = [0,1,2].filter(i => localAnswers[i].trim()).length;
  const badge = $('fab-badge');
  if (answered > 0) {
    badge.textContent = answered;
    badge.classList.add('visible');
    $('fab-questions').classList.add('has-answers');
  } else {
    badge.classList.remove('visible');
    $('fab-questions').classList.remove('has-answers');
  }
}

function parseQuestions(text) {
  if (!text) return ['','',''];
  const labels = ['Por María hacia Jesús:','Desde el Hijo hacia el Padre:','Hijos y hermanos en el Espíritu:'];
  const out = [];
  let remaining = text;
  for (let i = 0; i < labels.length; i++) {
    const idx = remaining.indexOf(labels[i]);
    if (idx >= 0) {
      if (i > 0) out.push(remaining.substring(0, idx).trim());
      remaining = remaining.substring(idx + labels[i].length).trim();
    }
  }
  out.push(remaining.trim());
  while (out.length < 3) out.push('');
  return out.slice(0,3);
}

function escHTML(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
