<style>
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

/* ── Variables CSS ── */
:root {
  --bg:#E6DED3; --bg-rgb:230,222,211; --card:#FFFCF7; --border:#D9D1C7;
  --text:#2B2622; --text-soft:#6B6259; --text-dim:#9B9389;
  --input-bg:#FFFCF7; --sec-bg:#EDE5D8; --shadow:rgba(43,38,34,0.08);
  --brand:#02BBE0; --brand-soft:#43DDF8;
  --brand-ultra:rgba(2,187,224,0.10); --brand-glow:rgba(2,187,224,0.20);
  --orange:#FF7A00;
}
.dark {
  --bg:#002931; --bg-rgb:0,41,49; --card:#004C5B; --card2:#003845;
  --border:rgba(67,221,248,0.2); --sec-bg:#003845; --input-bg:#004C5B;
  --shadow:rgba(0,0,0,0.35);
  --text:#F0EAE2; --text-soft:#C8BFB5; --text-dim:#9A9088;
  --brand:#02BBE0; --brand-soft:#43DDF8;
  --brand-ultra:rgba(2,187,224,0.12); --brand-glow:rgba(2,187,224,0.25);
}

/* ── Base ── */
html { font-size:18px; }
body {
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  line-height:1.7; min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  transition:background 0.4s, color 0.4s;
}
.shell { max-width:480px; margin:0 auto; min-height:100dvh; }

/* ── Header hero ── */
.rt-header {
  position:relative; overflow:hidden;
  min-height:340px;
  display:flex; flex-direction:column;
  justify-content:flex-end;
}
.rt-header::before {
  content:''; position:absolute; inset:0;
  background-image:url('https://pub-96c43f31e0da42dd950d4ac90328256e.r2.dev/estampa_sanar/medjugorge_1.jpeg');
  background-size:cover; background-position:center top;
}
.rt-header::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.72) 100%);
  z-index:1;
}
.rt-header-text {
  position:relative; z-index:6;
  padding:0 20px 24px;
  display:flex; flex-direction:column; gap:4px;
}
.rt-chip {
  font-family:'Inter',sans-serif; font-size:0.65rem; font-weight:800;
  text-transform:uppercase; letter-spacing:1.5px;
  color:rgba(255,255,255,0.75);
}
.rt-titulo {
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:2rem; font-weight:600; color:#FFFFFF;
  line-height:1.2; text-shadow:0 1px 10px rgba(0,0,0,0.5);
}
.rt-subtitulo {
  font-family:'Crimson Pro',Georgia,serif;
  font-size:1.1rem; font-style:italic;
  color:rgba(255,255,255,0.75);
}

/* ── Beads sobre el hero ── */
#rt-beads-wrap {
  position:absolute; right:12px; top:50%;
  transform:translateY(-50%);
  z-index:6;
}
#rt-beads-col {
  display:flex; flex-direction:column;
  align-items:center; gap:10px;
}

/* ── Play ── */
.rt-play-wrap {
  display:flex; flex-direction:column;
  align-items:center; gap:12px; padding:24px 0 32px;
}
#rt-btn-play {
  width:80px; height:80px; border-radius:50%;
  background:var(--mundo-color, var(--brand));
  border:none; color:white; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 24px rgba(0,0,0,0.35);
  transition:transform 0.15s;
}
#rt-btn-play:active { transform:scale(0.94); }
.rt-play-hint {
  font-family:'Inter',sans-serif; font-size:0.8rem;
  color:var(--text-dim); letter-spacing:0.5px;
}

/* ── Botones post-rezo ── */
#rt-post-rezo {
  display:flex; flex-direction:column;
  gap:12px; padding:8px 24px 40px;
}
.rt-btn-accion {
  width:100%; padding:16px 20px;
  border-radius:20px; border:1.5px solid var(--border);
  background:var(--card); color:var(--text);
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:1.2rem; font-weight:600; cursor:pointer;
  display:flex; align-items:center; gap:10px;
  justify-content:center;
}
.rt-btn-accion.rt-btn-primary {
  background:var(--mundo-color, var(--brand));
  border-color:transparent; color:white;
}
.rt-btn-accion.rt-btn-secondary {
  background:none; color:var(--text-dim);
}

/* ── Oración body ── */
.rt-oracion-body { padding:32px 20px 180px; }
.rt-sec-label {
  font-family:'Inter',sans-serif; font-size:0.7rem; font-weight:800;
  text-transform:uppercase; letter-spacing:2px;
  color:var(--mundo-color, var(--brand)); margin-bottom:16px;
}
.rt-oracion-texto {
  font-family:'Crimson Pro',Georgia,serif;
  font-size:1.3rem; line-height:1.85; color:var(--text);
  font-style:italic; margin-bottom:24px;
}
.rt-btn-audio {
  display:flex; align-items:center; gap:10px;
  padding:12px 20px; border-radius:24px;
  border:1.5px solid var(--border); background:none;
  color:var(--text); font-family:'Inter',sans-serif;
  font-size:0.9rem; cursor:pointer;
}

/* ── Nav btns fijos ── */
.rt-nav-btns {
  position:fixed; bottom:0; left:0; right:0;
  padding:16px 20px calc(env(safe-area-inset-bottom, 8px) + 16px);
  background:var(--card); border-top:1px solid var(--border);
  display:flex; flex-direction:column; gap:10px;
  max-width:480px; margin:0 auto; z-index:10;
}
.rt-btn-primary {
  width:100%; padding:16px; border-radius:28px; border:none;
  background:var(--mundo-color, var(--brand)); color:white;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:1.2rem; font-weight:600; cursor:pointer;
}
.rt-btn-secondary {
  width:100%; padding:13px; border-radius:28px;
  border:1.5px solid var(--border); background:none;
  color:var(--text-dim); font-family:'Inter',sans-serif;
  font-size:0.9rem; cursor:pointer;
}

/* ── Cuentas del Rosario (de rezar.html) ── */
.bead {
  width:28px; height:28px; border-radius:50%;
  border:2px solid rgba(255,255,255,0.35);
  background:rgba(255,255,255,0.08);
  transition:background 0.18s, border-color 0.18s, transform 0.12s;
}
.bead.active,.bead-pater.active { border-color:var(--lvl-bold);background:transparent;animation:beadPulse 0.9s ease-in-out infinite }
.bead.active.lit-correct,.bead-pater.active.lit-correct,
.bead.active.lit-normal,.bead-pater.active.lit-normal { border-color:var(--lvl-bold);background:var(--lvl-bold);animation:beadPulseFilled 0.9s ease-in-out infinite }
.bead.lit-correct,.bead-pater.lit-correct,
.bead.lit-normal,.bead-pater.lit-normal { border-color:var(--lvl-bold);background:var(--lvl-bold) }
@keyframes beadPulse { 0%,100%{box-shadow:0 0 0 3px rgba(var(--lvl-bold-rgb,2,187,224),0.25);transform:scale(1)} 50%{box-shadow:0 0 0 8px rgba(var(--lvl-bold-rgb,2,187,224),0.5);transform:scale(1.15)} }
@keyframes beadPulseFilled { 0%,100%{box-shadow:0 0 0 3px rgba(var(--lvl-bold-rgb,2,187,224),0.25);transform:scale(1)} 50%{box-shadow:0 0 0 8px rgba(var(--lvl-bold-rgb,2,187,224),0.5);transform:scale(1.15)} }
.bead.lit-spam,.bead-pater.lit-spam { background:#888;border-color:#888;animation:none }
.bead.lit-white,.bead-pater.lit-white { background:rgba(255,255,255,0.85);border-color:rgba(255,255,255,0.85);animation:none }
@keyframes beadGold { 0%{box-shadow:0 0 0 0 rgba(255,215,0,0)} 30%{box-shadow:0 0 0 8px rgba(255,215,0,0.6)} 100%{box-shadow:0 0 0 14px rgba(255,215,0,0)} }
.bead.gold-flash,.bead-pater.gold-flash { animation:bead-pop 0.18s ease-out,beadGold 0.7s ease-out }
@keyframes bead-pop { 0%{transform:scale(1)} 40%{transform:scale(1.3)} 100%{transform:scale(1)} }
@keyframes beadBonusFloat{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-28px)}}
.bead-pater.active { background:transparent }
.bead-pater {
  width:20px; height:20px; border-radius:50%;
  border:2px solid rgba(255,255,255,0.55);
  background:rgba(255,255,255,0.15);
  transition:background 0.18s, border-color 0.18s;
  margin-bottom:4px;
}
.bead-lux-cross { display:none;margin-top:6px;flex-direction:column;align-items:center; }
.bead-lux-cross.show { display:flex;animation:luxAppear 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards; }
.bead-lux-cross.show .lux-glow svg {
  filter:drop-shadow(0 0 6px rgba(255,255,255,0.9)) drop-shadow(0 0 14px rgba(255,255,255,0.5));
  animation:luxGlowPulse 1.2s ease-in-out infinite;
}
@keyframes luxGlowPulse { 0%,100%{filter:drop-shadow(0 0 4px rgba(255,255,255,0.7))} 50%{filter:drop-shadow(0 0 14px rgba(255,255,255,1)) drop-shadow(0 0 28px rgba(67,221,248,0.6))} }
@keyframes luxAppear { 0%{opacity:0;transform:scale(0.4)} 60%{opacity:1;transform:scale(1.15)} 100%{opacity:1;transform:scale(1)} }
.lux-glow { position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center; }
.lux-glow::before {
  content:''; position:absolute; inset:-8px; border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.35) 0%,transparent 70%);
  animation:luxPulse 1.4s ease-in-out infinite;
}
@keyframes luxPulse { 0%,100%{opacity:0.4;transform:scale(0.9)} 50%{opacity:1;transform:scale(1.15)} }
.rt-bead-lux,.bead-lux-cross{opacity:0;pointer-events:none}
.rt-bead-lux.show,.bead-lux-cross.show{opacity:1;animation:luxAppear 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards}

/* ── App Nav (swipe up) ── */
.app-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);
  width:100%;max-width:480px;z-index:250;
  background:var(--card);border-top:1px solid var(--border);
  display:flex;align-items:stretch;
  padding-bottom:env(safe-area-inset-bottom,0px);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.app-nav.visible{transform:translateX(-50%) translateY(0)}
.app-nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;padding:10px 4px 12px;
  background:none;border:none;cursor:pointer;font-family:inherit;
  color:rgba(67,221,248,0.45);
  transition:color 0.2s;-webkit-tap-highlight-color:transparent;
}
body.light .app-nav-item{color:rgba(0,41,49,0.45)}
.app-nav-item.tapped .app-nav-icon{animation:navSpring 0.38s cubic-bezier(0.34,1.72,0.64,1) both}
.app-nav-item.tapped{color:var(--lvl-bold)}
.app-nav-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.app-nav-label{font-size:0.6rem;font-weight:600;letter-spacing:0.4px;text-transform:uppercase}
.nav-hide-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px 12px;background:none;border:none;cursor:pointer;font-family:inherit;color:var(--text-dim);-webkit-tap-highlight-color:transparent;}
.nav-hide-icon{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:var(--text-dim)}
@keyframes navSpring{0%{transform:scale(1)}35%{transform:scale(0.78)}65%{transform:scale(1.18)}82%{transform:scale(0.95)}100%{transform:scale(1)}}
/* ── Exit modal ── */
.rt-exit-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.65);
  display:none;align-items:center;justify-content:center;
  z-index:300;padding:24px;
}
.rt-exit-overlay.open{display:flex}
.rt-exit-box{
  background:var(--card);border-radius:20px;
  border:1px solid var(--border);
  padding:28px 24px;width:100%;max-width:320px;text-align:center;
}
.rt-exit-title{font-size:1rem;font-weight:700;margin-bottom:6px;color:var(--text)}
.rt-exit-sub{font-size:0.82rem;color:var(--text-soft);line-height:1.6;margin-bottom:20px}
.rt-exit-btns{display:flex;gap:10px}
.rt-exit-cancel{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--border);background:transparent;font-family:inherit;font-size:0.85rem;font-weight:600;color:var(--text-soft);cursor:pointer;}
.rt-exit-confirm{flex:1;padding:12px;border-radius:12px;border:none;background:#C0392B;font-family:inherit;font-size:0.85rem;font-weight:600;color:#fff;cursor:pointer;}
.rt-exit-confirm:active,.rt-exit-cancel:active{transform:scale(0.96)}
</style>
</head>
<body>
<!-- ══ El Santuario, bajo desarrollo ══════════════════════════════
     Los Retiros no entran en el MVP con el que se prueba con usuarios reales.
     La UI ya no tiene entrada a esta página con el flag apagado; esta guarda
     cubre la puerta trasera —URL directa, marcador, historial— y corre antes
     de pintar nada. El developer entra: es quien lo está construyendo, y sin
     esta salida no habría forma de seguir. ════════════════════════ -->
<script>
(function () {
  if (window.retirosON && window.retirosON()) return;
  var base = location.origin + location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
  location.replace(base + 'index.html');
}());
</script>

<div class="shell">

  <!-- PANTALLA 1: REZO -->
  <div id="rt-scr-rezo">

    <div class="rt-header" id="rt-header">
      <div id="rt-tap-zone" style="position:absolute;inset:0;z-index:5;cursor:pointer;-webkit-tap-highlight-color:transparent;"></div>
      <div id="rt-beads-wrap">
        <div id="rt-beads-col"></div>
      </div>
      <div class="rt-header-text">
        <div class="rt-chip" id="rt-chip"></div>
        <h1 class="rt-titulo" id="rt-titulo"></h1>
        <p class="rt-subtitulo" id="rt-subtitulo"></p>
      </div>
    </div>

    <div class="rt-play-wrap">
      <button id="rt-btn-play" onclick="window.rtTogglePlay()">
        <svg id="rt-icon-play" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <svg id="rt-icon-pause" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="display:none">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
      </button>
      <p class="rt-play-hint" id="rt-play-hint">Toca para rezar</p>
    </div>

    <audio id="rt-rezo-audio" preload="auto"></audio>

    <div id="rt-post-rezo" style="display:none">
      <button class="rt-btn-accion" id="rt-btn-canto" onclick="window.rtToggleCanto()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
        Escuchar canto
      </button>
      <button class="rt-btn-accion rt-btn-secondary" id="rt-btn-letra" onclick="window.rtVerLetra()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        Letra del canto
      </button>
      <button class="rt-btn-accion rt-btn-primary" onclick="window.rtMostrarOracion()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
          <line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/>
        </svg>
        Oración
      </button>
      <audio id="rt-canto-audio" preload="none"></audio>
    </div>

  </div>

  <!-- PANTALLA 2: ORACIÓN -->
  <div id="rt-scr-oracion" style="display:none">

    <div class="rt-header" style="min-height:120px">
      <div class="rt-chip" id="rt-chip-2"></div>
      <h2 class="rt-titulo" style="font-size:1.6rem" id="rt-titulo-2"></h2>
    </div>

    <div class="rt-oracion-body">
      <div class="rt-sec-label">Oración</div>
      <p class="rt-oracion-texto" id="rt-oracion-texto"></p>

      <div class="rt-oracion-player" id="rt-oracion-player" style="display:none">

          <svg id="rt-orac-icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <svg id="rt-orac-icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
          <span id="rt-orac-btn-label">Escuchar la oración</span>
        </button>
        <audio id="rt-oracion-audio" preload="none"></audio>
      </div>
    </div>

    <div class="rt-nav-btns">
      <button class="rt-btn-primary" id="rt-btn-continuar" onclick="window.rtContinuar()">
        Continuar →
      </button>
      <button class="rt-btn-secondary" onclick="window.rtGuardarYSalir()">
        Guardar y salir
      </button>

  </div>

  <!-- ═══ APP NAV (swipe up) ═══ -->
  <nav class="app-nav" id="rt-app-nav">
    <button class="app-nav-item" onclick="rtNavTap(this);window.rtGuardarYSalir()">
      <div class="app-nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>

        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </div>
      <span class="app-nav-label">Salir</span>

  <!-- Exit modal -->

        <button class="rt-exit-confirm" onclick="window.rtConfirmExit()">Salir</button>

</div>

<!-- Popup letra del canto -->
<div id="rt-popup-letra" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:flex-end">
  <div style="background:var(--card);border-radius:24px 24px 0 0;padding:28px 20px 40px;width:100%;max-height:70vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600">Letra</span>
      <button onclick="document.getElementById('rt-popup-letra').style.display='none'"
        style="background:none;border:none;color:var(--text-dim);font-size:1.5rem;cursor:pointer">✕</button>
    </div>
    <p id="rt-letra-texto" style="font-family:'Crimson Pro',serif;font-size:1.1rem;line-height:1.8;color:var(--text-soft);font-style:italic">
      Letra del canto — próximamente.
    </p>
  </div>
</div>

<script>
// ── Tema (inmediato) ──────────────────────────────────────
(function () {
  var saved = localStorage.getItem('cruzando_theme');
  if (saved === 'light') document.documentElement.classList.remove('dark');
  else                   document.documentElement.classList.add('dark');
})();

// ── Globals ───────────────────────────────────────────────
var MUNDO_COLORS = {
  1:'#FF7A00', 2:'#01BBE1', 3:'#8E44AD',
  4:'#C0392B', 5:'#27AE60', 6:'#E91E8C', 7:'#D4A017'
};

var _rtRetiroSlug    = '';
var _rtMisterioIdx   = 0;
var _rtData          = null;
var _rtMisterio      = null;
var _rtBeadSync      = null;
var _rtBeadCount     = 0;
var _rtBeadActive    = -1;
var _rtBeadTimer     = null;
var _rtCurrentSyncKey = null;
var _rtBeadTapTimes  = {};
var _rtBeadSpam      = {};
var _rtUID           = null;
var _rtDB            = null;
var TOTAL_MISTERIOS  = 5;

function hexToRgb(hex) {
  var r = parseInt(hex.slice(1,3), 16);
  var g = parseInt(hex.slice(3,5), 16);
  var b = parseInt(hex.slice(5,7), 16);
  return r + ',' + g + ',' + b;
}

// ── DOMContentLoaded ─────────────────────────────────────
document.addEventListener('DOMContentLoaded', async function () {
  var params     = new URLSearchParams(location.search);
  _rtRetiroSlug  = params.get('retiro')   || '';
  _rtMisterioIdx = parseInt(params.get('misterio') || '0', 10);

  if (!_rtRetiroSlug) { window.location.href = 'retiros.html'; return; }

  // Cargar JSON del taller
  var res  = await fetch('data/' + _rtRetiroSlug + '.json');
  _rtData  = await res.json();
  _rtMisterio = _rtData.misterios[_rtMisterioIdx];

  // Cargar bead_sync.json
  try {
    var bsRes   = await fetch('data/bead_sync.json');
    _rtBeadSync = await bsRes.json();
  } catch (e) { _rtBeadSync = null; }

  // Color mundo
  var mundoColor = _rtData.mundoColor || MUNDO_COLORS[_rtData.mundo] || '#FF7A00';
  document.documentElement.style.setProperty('--mundo-color', mundoColor);
  document.documentElement.style.setProperty('--lvl-bold',    mundoColor);
  document.documentElement.style.setProperty('--lvl-bold-rgb', hexToRgb(mundoColor));

  // Poblar header
  var chip = _rtData.nombre || '';
  var tit  = _rtMisterio.nombre || '';
  var sub  = _rtMisterio.subtitulo || '';
  document.getElementById('rt-chip').textContent      = chip;
  document.getElementById('rt-titulo').textContent    = tit;
  document.getElementById('rt-subtitulo').textContent = sub;
  document.getElementById('rt-chip-2').textContent    = chip;
  document.getElementById('rt-titulo-2').textContent  = tit;

  // Oración
  document.getElementById('rt-oracion-texto').textContent = _rtMisterio.oracion?.texto || '';
  var oracionAudio = _rtMisterio.oracion?.audio || '';
  if (oracionAudio) {
    document.getElementById('rt-oracion-audio').src = oracionAudio;
    document.getElementById('rt-oracion-player').style.display = '';
  }

  // Canto
  var cantoAudio = _rtMisterio.canto?.audio || '';
  if (cantoAudio) {
    document.getElementById('rt-canto-audio').src = cantoAudio;
  } else {
    document.getElementById('rt-btn-canto').style.display = 'none';
  }

  // Botón continuar
  var siguiente = _rtMisterioIdx + 1;
  var btnCont   = document.getElementById('rt-btn-continuar');
  if (siguiente >= TOTAL_MISTERIOS) {
    btnCont.textContent = 'Completar retiro ✓';
  } else {
    btnCont.textContent = 'Continuar al Misterio ' + (siguiente + 1) + ' →';
  }

  // Configurar rezo + beads
  _rtSetupRezo();

  // Auth
  _auth.onAuthStateChanged(function (user) {
    if (!user) { window.location.href = 'index.html'; return; }
    _rtUID = user.uid;
    _rtDB  = _db;
    _rtGuardarProgreso({ rezandoMisterio: _rtMisterioIdx });
  });

  // Tap en header = contar bead
  document.getElementById('rt-tap-zone').addEventListener('click', function () {
    window.rtCountBead();
  });

  rtInitNavSwipe();
});

// ── Setup rezo ────────────────────────────────────────────
function _rtSetupRezo() {
  var prefs = {};
  try { prefs = JSON.parse(localStorage.getItem('cruzando_rezar_prefs') || '{}'); } catch(e) {}
  var pfx = prefs.idioma === 'latin' ? 'L_' : '';
  var ab  = (_rtMisterioIdx % 2 === 0) ? 'MA' : 'MB';
  _rtCurrentSyncKey = pfx + ab;

  var audioUrl = 'https://pub-cd28789360f74fc0a623bb76605f42c3.r2.dev/global/' + _rtCurrentSyncKey + '.m4a';
  document.getElementById('rt-rezo-audio').src = audioUrl;

  document.getElementById('rt-rezo-audio').addEventListener('ended', function () {
    _rtStopBeadTimer();
    document.getElementById('rt-post-rezo').style.display = 'flex';
    document.getElementById('rt-post-rezo').scrollIntoView({ behavior: 'smooth' });
    document.getElementById('rt-play-hint').textContent = '¡Completado!';
  });

  _rtRenderBeads();
}

// ── Toggle play ───────────────────────────────────────────
window.rtTogglePlay = function () {
  var audio     = document.getElementById('rt-rezo-audio');
  var iconPlay  = document.getElementById('rt-icon-play');
  var iconPause = document.getElementById('rt-icon-pause');
  var hint      = document.getElementById('rt-play-hint');

  if (audio.paused) {
    audio.play();
    iconPlay.style.display  = 'none';
    iconPause.style.display = 'block';
    hint.textContent = 'Toca la imagen para contar cada Avemaría';
    _rtStartBeadTimer();
  } else {
    audio.pause();
    iconPlay.style.display  = 'block';
    iconPause.style.display = 'none';
    hint.textContent = 'Pausado';
    _rtStopBeadTimer();
  }
};

// ── Toggle canto ──────────────────────────────────────────
window.rtToggleCanto = function () {
  var audio = document.getElementById('rt-canto-audio');
  var btn   = document.getElementById('rt-btn-canto');
  if (audio.paused) {
    audio.play();
    btn.innerHTML = btn.innerHTML.replace('Escuchar canto', 'Pausar canto');
  } else {
    audio.pause();
    btn.innerHTML = btn.innerHTML.replace('Pausar canto', 'Escuchar canto');
  }
};

// ── Letra del canto ───────────────────────────────────────
window.rtVerLetra = function () {
  document.getElementById('rt-popup-letra').style.display = 'flex';
};

// ── Mostrar pantalla oración ──────────────────────────────
window.rtMostrarOracion = function () {
  document.getElementById('rt-scr-rezo').style.display    = 'none';
  document.getElementById('rt-scr-oracion').style.display = 'block';
  window.scrollTo(0, 0);
};

// ── Toggle audio oración ──────────────────────────────────
window.rtToggleOracionAudio = function () {
  var audio     = document.getElementById('rt-oracion-audio');
  var iconPlay  = document.getElementById('rt-orac-icon-play');
  var iconPause = document.getElementById('rt-orac-icon-pause');
  var label     = document.getElementById('rt-orac-btn-label');

  if (audio.paused) {
    audio.play();
    iconPlay.style.display  = 'none';
    iconPause.style.display = 'block';
    label.textContent = 'Pausar';
  } else {
    audio.pause();
    iconPlay.style.display  = 'block';
    iconPause.style.display = 'none';
    label.textContent = 'Escuchar la oración';
  }
};

// ── Render beads ──────────────────────────────────────────
function _rtRenderBeads() {
  var col = document.getElementById('rt-beads-col');
  if (!col) return;
  col.innerHTML = '';

  var pater = document.createElement('div');
  pater.className = 'bead-pater'; pater.id = 'rt-bead-pater';
  col.appendChild(pater);

  var sep = document.createElement('div');
  sep.style.cssText = 'width:1px;height:8px;background:rgba(255,255,255,0.15);margin:0 auto';
  col.appendChild(sep);

  for (var i = 0; i < 10; i++) {
    var d = document.createElement('div');
    d.className = 'bead';
    col.appendChild(d);
  }

  var lux = document.createElement('div');
  lux.className = 'bead-lux-cross'; lux.id = 'rt-bead-lux';
  lux.innerHTML = '<div class="lux-glow"><svg width="28" height="28" viewBox="0 0 100 100"><rect x="46.2" y="0" width="7.6" height="100" fill="white"/><rect x="0" y="36" width="100" height="7.6" fill="white"/></svg></div>';
  col.appendChild(lux);
}

function _rtGetBeadEl(idx) {
  if (idx === 0) return document.getElementById('rt-bead-pater');
  return document.querySelectorAll('#rt-beads-col .bead')[idx - 1] || null;
}

function _rtStartBeadTimer() {
  _rtStopBeadTimer();
  _rtBeadTimer = setInterval(_rtTickBeads, 80);
}

function _rtStopBeadTimer() {
  if (_rtBeadTimer) { clearInterval(_rtBeadTimer); _rtBeadTimer = null; }
  if (_rtBeadActive >= 0) {
    var el = _rtGetBeadEl(_rtBeadActive);
    if (el) el.classList.remove('active');
    _rtBeadActive = -1;
  }
}

function _rtTickBeads() {
  var audio = document.getElementById('rt-rezo-audio');
  if (!audio || audio.paused || !_rtBeadSync || !_rtCurrentSyncKey) return;
  var t       = audio.currentTime;
  var windows = _rtBeadSync[_rtCurrentSyncKey];
  if (!windows) return;

  var active = -1;
  for (var i = 0; i < windows.length; i++) {
    if (t >= windows[i].start && t <= windows[i].end) { active = i; break; }
  }
  if (active === _rtBeadActive) return;

  // Ventana del bead anterior terminó
  if (_rtBeadActive >= 0) {
    var old = _rtGetBeadEl(_rtBeadActive);
    if (old) {
      old.classList.remove('active');
      var wasSpam   = old.classList.contains('lit-spam');
      var wasTapped = old.classList.contains('lit-correct') ||
                      old.classList.contains('lit-normal')  ||
                      wasSpam;
      if (!wasTapped) {
        old.classList.add('lit-white');
        if (_rtBeadCount === _rtBeadActive) _rtBeadCount = _rtBeadActive + 1;
      } else if (wasSpam) {
        if (_rtBeadCount === _rtBeadActive) _rtBeadCount = _rtBeadActive + 1;
      }
    }
  }

  _rtBeadActive = active;

  if (active >= 0) {
    // Beads saltados → blanco
    while (_rtBeadCount < active) {
      var skipped = _rtGetBeadEl(_rtBeadCount);
      if (skipped) {
        skipped.classList.remove('active');
        if (!skipped.classList.contains('lit-correct') &&
            !skipped.classList.contains('lit-normal')  &&
            !skipped.classList.contains('lit-spam')) {
          skipped.classList.add('lit-white');
        }
      }
      _rtBeadCount++;
    }
    var el = _rtGetBeadEl(active);
    if (el) {
      var finished = el.classList.contains('lit-spam') || el.classList.contains('lit-white');
      if (!finished) { el.classList.remove('active'); void el.offsetWidth; el.classList.add('active'); }
    }
  }
}

function _rtShowBeadBonus(beadEl) {
  if (!beadEl) return;
  var el = document.createElement('div');
  el.textContent = '+25m';
  el.style.cssText = 'position:absolute;left:50%;transform:translate(-50%,0);font-size:0.7rem;font-weight:700;color:var(--lvl-bold);pointer-events:none;animation:beadBonusFloat 0.9s ease-out forwards;z-index:10;';
  beadEl.style.position = 'relative';
  beadEl.appendChild(el);
  setTimeout(function () { el.remove(); }, 950);
}

function _rtPlayBeadSound() {
  try {
    var ac = new (window.AudioContext || window.webkitAudioContext)();
    var now = ac.currentTime;
    var master = ac.createGain();
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(0.22, now + 0.008);
    master.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
    master.connect(ac.destination);
    var osc1 = ac.createOscillator(), g1 = ac.createGain();
    osc1.type = 'sine'; osc1.frequency.value = 432; g1.gain.value = 0.7;
    osc1.connect(g1); g1.connect(master); osc1.start(now); osc1.stop(now + 0.9);
    var osc2 = ac.createOscillator(), g2 = ac.createGain();
    osc2.type = 'sine'; osc2.frequency.value = 864; g2.gain.value = 0.25;
    osc2.connect(g2); g2.connect(master); osc2.start(now); osc2.stop(now + 0.6);
    var bufSize = Math.floor(ac.sampleRate * 0.04);
    var buf = ac.createBuffer(1, bufSize, ac.sampleRate);
    var bd = buf.getChannelData(0);
    for (var i = 0; i < bufSize; i++) bd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSize, 18);
    var noise = ac.createBufferSource(); noise.buffer = buf;
    var bpf = ac.createBiquadFilter(); bpf.type = 'bandpass'; bpf.frequency.value = 1800; bpf.Q.value = 1.2;
    var gn = ac.createGain(); gn.gain.value = 0.35;
    noise.connect(bpf); bpf.connect(gn); gn.connect(master);
    noise.start(now); noise.stop(now + 0.04);
    setTimeout(function () { try { ac.close(); } catch (e) {} }, 1100);
  } catch (e) {}
}

window.rtCountBead = function () {
  if (_rtBeadCount >= 11) return;
  var beadIdx = _rtBeadCount;
  var now     = Date.now();

  if (_rtBeadSync && _rtCurrentSyncKey && _rtBeadActive >= 0) {
    if (beadIdx > _rtBeadActive) {
      _rtPlayFail();
      if (navigator.vibrate) navigator.vibrate([80]);
      return;
    }
  }

  var lastTap = _rtBeadTapTimes[beadIdx] || 0;
  if ((now - lastTap) < 3000 && lastTap > 0) {
    _rtBeadSpam[beadIdx] = true;
    var elS = _rtGetBeadEl(beadIdx);
    if (elS) {
      elS.classList.remove('active', 'lit-correct', 'lit-normal', 'lit-white');
      elS.classList.add('lit-spam');
      elS.style.animation = 'none';
    }
    _rtPlayFail();
    if (navigator.vibrate) navigator.vibrate([80]);
    return;
  }
  _rtBeadTapTimes[beadIdx] = now;
  _rtBeadCount++;

  var isOnTime = false;
  if (_rtBeadSync && _rtCurrentSyncKey) {
    var audio2 = document.getElementById('rt-rezo-audio');
    var wins   = _rtBeadSync[_rtCurrentSyncKey];
    if (wins && wins[beadIdx] && audio2) {
      var t2 = audio2.currentTime;
      isOnTime = (t2 >= wins[beadIdx].start && t2 <= wins[beadIdx].end);
    }
  }

  var el2 = _rtGetBeadEl(beadIdx);
  if (el2) {
    if (isOnTime) {
      el2.classList.add('lit-correct', 'gold-flash');
      _rtShowBeadBonus(el2);
      if (window.addMeters) window.addMeters(25);
    } else {
      el2.classList.add('lit-normal');
    }
    if (beadIdx === _rtBeadActive) {
      el2.classList.remove('active');
      void el2.offsetWidth;
      el2.classList.add('active');
    } else {
      el2.classList.remove('active');
    }
    _rtPlayBeadSound();
    if (navigator.vibrate) navigator.vibrate([40]);
  }

  if (_rtBeadCount === 11) {
    var lux = document.getElementById('rt-bead-lux');
    if (lux) { lux.classList.remove('show'); void lux.offsetWidth; lux.classList.add('show'); }
  }
};

function _rtPlayFail() {
  try {
    var ctx  = new (window.AudioContext || window.webkitAudioContext)();
    var osc  = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

// ── App Nav ──────────────────────────────────────────────
var _rtNavHideTimer = null;
function rtShowAppNav() {
  var nav = document.getElementById('rt-app-nav');
  if (!nav) return;
  nav.classList.add('visible');
  clearTimeout(_rtNavHideTimer);
  _rtNavHideTimer = setTimeout(function() { nav.classList.remove('visible'); }, 3500);
}
function rtNavTap(el) {
  el.classList.remove('tapped'); void el.offsetWidth; el.classList.add('tapped');
  setTimeout(function() { el.classList.remove('tapped'); }, 400);
}
function rtInitNavSwipe() {
  var sy = 0, sx = 0;
  document.addEventListener('touchstart', function(e) {
    sy = e.touches[0].clientY; sx = e.touches[0].clientX;
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    var dy = e.changedTouches[0].clientY - sy;
    var dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx) * 1.5) {
      if (dy < 0) rtShowAppNav();
      else document.getElementById('rt-app-nav')?.classList.remove('visible');
    }
  }, { passive: true });
}

// ── Exit modal ────────────────────────────────────────────
function rtShowExitModal() {
  var audio = document.getElementById('rt-rezo-audio');
  if (audio && !audio.paused) audio.pause();
  document.getElementById('rt-exit-modal').classList.add('open');
}
window.rtHideExitModal = function() {
  document.getElementById('rt-exit-modal').classList.remove('open');
};
window.rtConfirmExit = function() {
  window.rtHideExitModal();
  window.rtGuardarYSalir();
};
window.rtShowExitModal = rtShowExitModal;

// ── Navegación ────────────────────────────────────────────
window.rtContinuar = function () {
  var siguiente = _rtMisterioIdx + 1;
  _rtGuardarProgreso({
    rezandoCompletado: firebase.firestore.FieldValue.arrayUnion(_rtMisterioIdx)
  });
  if (siguiente >= TOTAL_MISTERIOS) {
    _rtGuardarProgreso({ completed: true, completedAt: new Date().toISOString() });
    window.location.href = 'retiros.html?retiro=' + _rtRetiroSlug + '&completado=true';
  } else {
    window.location.href = 'rezar_taller.html?retiro=' + _rtRetiroSlug + '&misterio=' + siguiente;
  }
};

window.rtGuardarYSalir = function () {
  _rtGuardarProgreso({ rezandoMisterio: _rtMisterioIdx });
  window.location.href = 'retiros.html?retiro=' + _rtRetiroSlug + '&resume=true';
};

function _rtGuardarProgreso(extra) {
  if (!_rtUID || !_rtDB) return;
  var data = Object.assign({
    tallerSlug: _rtRetiroSlug,
    lastSeenAt: new Date().toISOString()
  }, extra || {});
  _rtDB.collection('users').doc(_rtUID)
    .collection('talleres').doc(_rtRetiroSlug)
    .set(data, { merge: true })
    .catch(function (e) { console.warn('[rt] progreso:', e); });
}
</script>
