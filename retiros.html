<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="shortcut icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#002931">
<!-- PWA / Home Screen Icon -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="CruzAndo">
<title>El Santuario · CruzAndo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

:root {
  --bg:            #002931;
  --bg-rgb:        0,41,49;
  --bg2:           #120A02;
  --card:          #004C5B;
  --border:        rgba(67,221,248,0.15);
  --text:          #F0E6DA;
  --text-soft:     #C4A882;
  --text-dim:      #7A5C40;
  --orange:        #FF7A00;
  --green:         #4CAF7D;
  --brand:         #02BBE0;
  --brand-soft:    #43DDF8;
  --brand-ultra:   rgba(2,187,224,0.12);
  --brand-glow:    rgba(2,187,224,0.25);
}
body.light {
  --bg:            #E6DED3;
  --bg-rgb:        230,222,211;
  --bg2:           #EDE5D8;
  --card:          #FFFCF7;
  --border:        #D9CFC4;
  --text:          #2B2622;
  --text-soft:     #6B6259;
  --text-dim:      #9B9389;
  --brand:         #02BBE0;
  --brand-soft:    #43DDF8;
  --brand-ultra:   rgba(2,187,224,0.10);
  --brand-glow:    rgba(2,187,224,0.20);
}

html { font-size:18px; }
body {
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  line-height:1.6; min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  transition:background 0.3s, color 0.3s;
}
.shell { max-width:480px; margin:0 auto; min-height:100dvh; padding-bottom:140px; }

/* ── Header ── */
.header {
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:10px;
  padding:14px 18px 12px;
  background:var(--bg); border-bottom:1px solid var(--border);
}
.header-center { flex:1; min-width:0; }
.header-title {
  font-family:'Crimson Pro',Georgia,serif; font-size:26px; font-weight:600;
  color:var(--text); line-height:1.2;
}
.icon-btn {
  width:38px; height:38px; border-radius:50%;
  background:var(--card); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--text-soft);
  transition:all 0.2s; flex-shrink:0;
}
.icon-btn:active { transform:scale(0.92); }
.icon-btn svg { width:18px; height:18px; }

/* ── Hero ── */
.hero {
  padding:28px 22px 22px;
  border-bottom:1px solid var(--border);
}
.hero-question {
  font-family:'Crimson Pro',Georgia,serif; font-size:26px; font-weight:600;
  color:var(--text); line-height:1.3; margin-bottom:8px;
}
.hero-sub {
  font-size:0.85rem; color:var(--text-soft); line-height:1.65;
}

/* ── Hospedería ── */
.hospederia { padding:22px 18px 8px; }

/* ── Mundo separador ── */
.mundo-group { margin-bottom:34px; }
.mundo-sep {
  display:flex; align-items:center; gap:10px; margin-bottom:16px;
}
.mundo-sep-line { flex:1; height:1px; }
.mundo-sep-label {
  font-size:0.6rem; font-weight:700; text-transform:uppercase;
  letter-spacing:1px; white-space:nowrap;
}

/* ── Cards ── */
.retiro-card {
  background:var(--card); border-radius:18px;
  border:1.5px solid var(--border);
  padding:20px 20px 18px; margin-bottom:14px;
  transition:opacity 0.2s;
}
.retiro-card.bloqueado  { opacity:0.45; }
.retiro-card.pendiente  { opacity:0.60; }
.retiro-card.completado { opacity:0.72; }

.card-top {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:10px;
}
.card-icono { font-size:1.4rem; line-height:1; }
.card-chip {
  font-size:0.6rem; font-weight:700; text-transform:uppercase;
  letter-spacing:0.8px; padding:3px 10px; border-radius:20px;
  border:1.5px solid; background:transparent;
}
.card-nombre {
  font-family:'Crimson Pro',Georgia,serif; font-size:26px; font-weight:600;
  color:var(--text); line-height:1.3; margin-bottom:14px;
}

/* Barra de progreso (en_progreso) */
.card-prog-wrap {
  height:4px; border-radius:2px; overflow:hidden;
  background:rgba(255,255,255,0.08); margin-bottom:14px;
}
body.light .card-prog-wrap { background:rgba(0,0,0,0.08); }
.card-prog-bar { height:100%; border-radius:2px; }

/* Barra de progreso detallada (en_progreso) */
.card-progreso-barra {
  height: 3px; border-radius: 2px;
  background: var(--border); margin: 6px 0 2px 0; overflow: hidden;
}
.card-progreso-fill { height: 100%; border-radius: 2px; transition: width 0.3s ease; }
.card-progreso-texto {
  font-family: 'Inter', sans-serif; font-size: 11px;
  color: var(--text-soft); margin-bottom: 10px;
}

/* Footer de card */
.card-footer { display:flex; align-items:center; gap:10px; min-height:40px; }
.card-btn {
  flex:1; padding:13px 16px; border:none; border-radius:13px;
  font-family:'Inter',sans-serif; font-size:0.85rem; font-weight:700;
  color:#1A0E04; cursor:pointer; text-align:center;
  transition:opacity 0.2s, transform 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.card-btn:active { opacity:0.82; transform:scale(0.97); }

.card-msg-lock {
  font-size:0.78rem; color:var(--text-dim);
  line-height:1.5; font-style:italic;
}
.card-msg-done {
  font-size:0.82rem; color:var(--text-dim);
  font-weight:600; display:flex; align-items:center; gap:6px;
}
.card-msg-pronto {
  font-size:0.78rem; color:var(--text-dim); line-height:1.5;
}
.card-lock-svg {
  width:26px; height:26px; flex-shrink:0; color:var(--text-dim); opacity:0.7;
}

/* ── Spinner ── */
.spinner-wrap { display:flex; align-items:center; justify-content:center; min-height:50dvh; }
.spinner {
  width:32px; height:32px; border:3px solid var(--border);
  border-top-color:var(--brand, #02BBE0); border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── Error ── */
.error-msg {
  padding:48px 24px; text-align:center;
  color:var(--text-soft); font-size:0.9rem; line-height:1.7;
}

/* ── Bottom nav ── */
.app-nav {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; z-index:80;
  background:var(--bg); border-top:1px solid var(--border);
  display:flex; align-items:stretch;
  padding-bottom:env(safe-area-inset-bottom, 0px);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.app-nav-item {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:4px; padding:10px 4px 12px;
  background:none; border:none; cursor:pointer;
  font-family:inherit; text-decoration:none;
  color:var(--text-dim); transition:color 0.2s;
  -webkit-tap-highlight-color:transparent;
}
.app-nav-item:active { opacity:1; }
.app-nav-item.active { color:var(--orange); }
.app-nav-item[disabled] { cursor:default; opacity:1; }
@keyframes navSpring {
  0%   { transform:scale(1); }
  35%  { transform:scale(0.78); }
  65%  { transform:scale(1.18); }
  82%  { transform:scale(0.95); }
  100% { transform:scale(1); }
}
.app-nav-item.tapped .app-nav-icon { animation:navSpring 0.38s cubic-bezier(0.34,1.72,0.64,1) both; }
.app-nav-item.tapped { color:var(--orange); }
.app-nav-icon {
  width:24px; height:24px; position:relative;
  display:flex; align-items:center; justify-content:center;
}
.app-nav-item.active .app-nav-icon::before {
  content:''; position:absolute; inset:-5px;
  background:rgba(255,122,0,0.12); border-radius:10px;
}
.app-nav-label { font-size:0.6rem; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }

/* ── Skeleton loader ── */
.sk-card {
  background:var(--card); border:1.5px solid var(--border);
  border-radius:18px; padding:20px 20px 18px; margin-bottom:14px;
}
.sk-top  { height:18px; width:35%; border-radius:6px; background:var(--border); margin-bottom:12px; }
.sk-name { height:26px; width:72%; border-radius:6px; background:var(--border); margin-bottom:16px; }
.sk-btn  { height:46px; border-radius:13px; background:var(--border); }
@keyframes shimmer {
  0%,100% { opacity:0.45; }
  50%     { opacity:1; }
}
.sk-card:nth-child(1) { animation:shimmer 1.5s ease-in-out infinite; }
.sk-card:nth-child(2) { animation:shimmer 1.5s ease-in-out 0.2s infinite; }
.sk-card:nth-child(3) { animation:shimmer 1.5s ease-in-out 0.4s infinite; }

/* ── Vista B — Barra superior ── */
#retiro-header {
  position:fixed; top:0; left:0; right:0; height:52px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px;
  background:var(--bg); border-bottom:1px solid var(--border);
  z-index:100;
}
#retiro-titulo {
  font-family:'Inter',sans-serif; font-size:15px; font-weight:600;
  color:var(--text); flex:1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  margin-right:12px;
}
#retiro-controles { display:flex; gap:8px; flex-shrink:0; }
#retiro-controles button {
  width:36px; height:36px; border-radius:50%; border:none;
  background:var(--card); color:var(--text);
  font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:opacity 0.2s;
}
#retiro-controles button:active { opacity:0.7; }
#btn-bgm-retiro { opacity:0.45; }
#btn-bgm-retiro.bgm-activo { opacity:1; color:var(--orange); }

/* ── Vista B — Barra de progreso segmentada ── */
#retiro-progreso {
  position:fixed; top:52px; left:0; right:0; height:4px;
  display:flex; gap:2px; padding:0 2px;
  background:var(--bg); z-index:100;
}
.progreso-segmento {
  flex:1; height:4px; border-radius:2px;
  background:var(--border); transition:background 0.3s ease;
}
.progreso-segmento.completado { background:var(--orange); }
.progreso-segmento.activo     { background:var(--orange); opacity:0.5; }

/* ── Vista B — Área de tarjetas ── */
#retiro-tarjetas {
  position:fixed; top:56px; left:0; right:0; bottom:0;
  overflow:hidden;
  padding-bottom:80px;
}

/* ── 5C: Tarjetas ── */
.tarjeta {
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg); padding:24px 24px 100px; box-sizing:border-box;
}
.tarjeta-inner { max-width:480px; width:100%; text-align:center; }
.tarjeta-tipo {
  font-family:'Inter',sans-serif; font-size:11px; font-weight:600;
  letter-spacing:0.1em; color:var(--text-soft);
  margin-bottom:12px; text-transform:uppercase;
}
.tarjeta-titulo {
  font-family:'Crimson Pro',Georgia,serif; font-size:36px; font-weight:600;
  color:var(--text); margin-bottom:8px; line-height:1.3;
}
.tarjeta-info {
  font-family:'Inter',sans-serif; font-size:14px;
  color:var(--text-soft); margin-bottom:32px;
}
.btn-completar {
  background:var(--orange); color:white;
  border:none; border-radius:24px; padding:14px 28px;
  font-family:'Inter',sans-serif; font-size:16px; font-weight:600;
  cursor:pointer; width:100%; max-width:320px;
  transition:opacity 0.2s;
}
.btn-completar:active { opacity:0.8; }
.msg-bloqueo {
  font-family:'Inter',sans-serif; font-size:13px;
  color:var(--orange); margin-top:16px;
  opacity:0; transition:opacity 0.3s ease;
}
@keyframes sacudir {
  0%   { transform:translateX(0); }
  20%  { transform:translateX(-8px); }
  40%  { transform:translateX(8px); }
  60%  { transform:translateX(-6px); }
  80%  { transform:translateX(6px); }
  100% { transform:translateX(0); }
}
.sacudir { animation:sacudir 0.4s ease; }

/* ── 5D: Plantillas de tarjetas ── */
.tarjeta-umbral {
  position:relative;
  background:linear-gradient(135deg, #1a1a2e 0%, #2d1b3d 100%);
}
.tarjeta-hero-overlay {
  position:absolute; inset:0; background:rgba(0,0,0,0.45);
}
.tarjeta-inner-centrada {
  text-align:center; position:relative; z-index:1;
}
.tarjeta-titulo-hero {
  font-family:'Cormorant Garamond',Georgia,serif; font-size:36px; font-weight:600;
  color:white; line-height:1.3; margin-bottom:12px;
}
.tarjeta-subtexto {
  font-family:'Inter',sans-serif; font-size:16px;
  color:rgba(255,255,255,0.7); margin-bottom:32px; line-height:1.5;
}
.tarjeta-contenido {
  overflow-y:auto; align-items:flex-start; padding-top:32px;
}
.tarjeta-texto-lora {
  font-family:'Crimson Pro',Georgia,serif; font-size:24px;
  line-height:1.75; color:var(--text); margin-bottom:24px;
}
.contempl-title{display:block;font-weight:700;font-size:1rem;color:var(--text);margin-bottom:10px;line-height:1.4;font-style:normal;}
.tarjeta-oracion .tarjeta-texto-lora {
  font-size:26px; line-height:1.8;
  color:rgba(255,255,255,0.92); text-align:left;
}
.tarjeta-texto-cita {
  font-style:italic;
  border-left:3px solid var(--orange); padding-left:16px;
}
.tarjeta-referencia {
  font-family:'Inter',sans-serif; font-size:13px;
  color:var(--text-soft); margin-bottom:24px;
}
.tarjeta-oracion {
  background:#0d0d1a; justify-content:center;
}
.btn-primario {
  background:var(--orange); color:white;
  border:none; border-radius:24px; padding:14px 28px;
  font-family:'Inter',sans-serif; font-size:17px; font-weight:600;
  cursor:pointer; width:100%; max-width:320px; margin-top:8px;
  transition:opacity 0.2s;
}
.btn-primario:active { opacity:0.82; }
.btn-secundario {
  background:transparent; color:var(--orange);
  border:1.5px solid var(--orange); border-radius:24px;
  padding:12px 28px;
  font-family:'Inter',sans-serif; font-size:16px; font-weight:600;
  cursor:pointer; width:100%; max-width:320px; margin-top:8px;
  transition:opacity 0.3s ease;
}
.btn-amen {
  background:white; color:#0d0d1a;
  border:none; border-radius:24px; padding:16px 40px;
  font-family:'Cormorant Garamond',Georgia,serif; font-size:26px; font-weight:600;
  cursor:pointer; width:100%; max-width:280px; margin-top:32px;
}
.pregunta-bloque { margin-bottom:24px; }
.textarea-reflexion {
  width:100%; min-height:100px; border-radius:12px;
  border:1.5px solid var(--border);
  background:var(--card); color:var(--text);
  font-family:'Crimson Pro',Georgia,serif; font-size:22px; line-height:1.6;
  padding:12px 16px; resize:vertical; box-sizing:border-box;
}
.textarea-reflexion:focus { outline:none; border-color:var(--orange); }

/* ── Bloque 6: Actividades ── */
.escala-contenedor {
  display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:16px;
}
.escala-btn {
  padding:10px 18px; border-radius:24px;
  border:1.5px solid var(--border); background:var(--card);
  color:var(--text); font-family:'Inter',sans-serif;
  font-size:15px; font-weight:600; cursor:pointer;
  transition:background 0.15s, color 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.escala-btn:active, .escala-btn.seleccionado {
  background:var(--orange); color:white; border-color:var(--orange);
}

.imagenes-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;
}
.imagen-seleccion {
  width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px;
  border:2.5px solid transparent; cursor:pointer;
  transition:border-color 0.15s;
}
.imagen-seleccion:active, .imagen-seleccion.seleccionada {
  border-color:var(--orange);
}

.input-frase { margin-bottom:12px; }

.opciones-lista {
  display:flex; flex-direction:column; gap:10px; margin-bottom:16px;
}
.opcion-btn {
  padding:14px 20px; border-radius:16px;
  border:1.5px solid var(--border); background:var(--card);
  color:var(--text); font-family:'Crimson Pro',Georgia,serif;
  font-size:30px; cursor:pointer; text-align:left;
  transition:background 0.15s, color 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.opcion-btn:active, .opcion-btn.seleccionado {
  background:var(--orange); color:white; border-color:var(--orange);
}

.silencio-timer {
  font-family:'Inter',sans-serif; font-size:56px; font-weight:300;
  color:var(--orange); text-align:center; letter-spacing:0.04em;
  margin:20px 0;
}

.dos-caras-contenedor {
  display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:16px;
}
.dos-caras-btn {
  width:100%; max-width:320px; padding:18px 20px; border-radius:16px;
  border:1.5px solid var(--border); background:var(--card);
  color:var(--text); font-family:'Crimson Pro',Georgia,serif;
  font-size:28px; cursor:pointer; text-align:center; line-height:1.4;
  transition:background 0.15s, color 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.dos-caras-btn:active, .dos-caras-btn.seleccionado {
  background:var(--orange); color:white; border-color:var(--orange);
}
.dos-caras-o {
  font-size:14px; color:var(--text-dim); font-style:italic;
}

.actividad-feedback {
  font-family:'Inter',sans-serif; font-size:14px; font-weight:600;
  color:var(--green); text-align:center; margin-top:12px;
  transition:opacity 0.3s ease;
}

/* la_palabra */
.palabras-texto {
  font-family:'Crimson Pro',Georgia,serif; font-size:36px;
  line-height:2.2; color:var(--text); margin:16px 0; text-align:left;
}
.palabra-tap {
  cursor:pointer; border-radius:4px; padding:2px 4px;
  display:inline; transition:background 0.15s, color 0.15s;
}
.palabra-seleccionada {
  background:var(--orange); color:white; border-radius:4px;
}

/* mapa_corporal */
.cuerpo-contenedor {
  display:flex; flex-direction:column; align-items:center; gap:12px; margin:12px 0;
}
.cuerpo-svg {
  width:110px; height:242px; cursor:pointer; overflow:visible;
}
.cuerpo-zona {
  fill:var(--card); stroke:var(--border); stroke-width:1.5;
  transition:fill 0.15s;
}
.cuerpo-zona:hover { fill:var(--orange); opacity:0.55; }
.zona-texto {
  font-family:'Inter',sans-serif; font-size:15px;
  color:var(--text-soft); text-align:center;
}

/* escala_dificultad */
.dificultad-contenedor {
  display:flex; gap:12px; justify-content:center; margin:16px 0; flex-wrap:wrap;
}
.dificultad-btn {
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:16px 12px; border-radius:14px;
  border:1.5px solid var(--border); background:var(--card);
  cursor:pointer; min-width:80px;
  transition:background 0.15s, color 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.dificultad-btn:active, .dificultad-activo {
  border-color:var(--orange); background:var(--orange); color:white;
}
.dificultad-emoji { font-size:28px; line-height:1; }
.dificultad-label {
  font-family:'Inter',sans-serif; font-size:12px;
  color:inherit; text-align:center; line-height:1.3;
}

/* nombrar_emocion */
.emociones-grid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:16px 0;
}
.emocion-btn {
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:10px 4px; border-radius:12px;
  border:1.5px solid var(--border); background:var(--card);
  cursor:pointer;
  transition:background 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.emocion-btn:active, .emocion-activa {
  border-color:var(--orange); background:rgba(255,122,0,0.14);
}
.emocion-icono { font-size:24px; line-height:1; }
.emocion-label {
  font-family:'Inter',sans-serif; font-size:11px;
  color:var(--text); text-align:center; line-height:1.3;
}

/* antes_despues */
.antes-despues-contenedor {
  display:flex; flex-direction:column; gap:16px; width:100%;
}
.antes-despues-bloque {
  display:flex; flex-direction:column; gap:6px; text-align:left;
}
.antes-despues-label {
  font-family:'Crimson Pro',Georgia,serif; font-size:26px; font-weight:700;
  font-style:italic; color:var(--text-soft);
}

/* ── Cierre card ── */
.tarjeta-cierre {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:24px; padding:32px 24px;
  min-height:420px; text-align:center;
}
.cierre-espera {
  display:flex; flex-direction:column; align-items:center; gap:16px;
}
.cierre-spinner {
  width:48px; height:48px; border-radius:50%;
  border:3px solid var(--border);
  border-top-color:var(--orange);
  animation:spin 0.9s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.cierre-espera-texto {
  font-family:'Crimson Pro',Georgia,serif; font-size:15px;
  font-style:italic; color:var(--text-soft);
}
.cierre-feedback {
  display:none; flex-direction:column; align-items:center; gap:20px;
}
.cierre-feedback-texto {
  font-family:'Crimson Pro',Georgia,serif; font-size:30px; line-height:1.7;
  color:var(--text); max-width:340px; text-align:center;
}
.cierre-badge {
  display:none; flex-direction:column; align-items:center; gap:12px;
  padding-top:8px;
}
.badge-icono {
  font-size:52px; line-height:1;
}
.badge-titulo {
  font-family:'Crimson Pro',Georgia,serif; font-size:18px; font-weight:700;
  color:var(--orange);
}
.badge-subtexto {
  font-size:13px; color:var(--text-dim);
}
.cierre-cantos {
  flex-direction:column; align-items:center; gap:10px;
  width:100%; max-width:260px; text-align:center;
}
.cierre-cantos-label {
  font-size:14px; color:var(--text-soft);
}
.cierre-acciones {
  display:flex; flex-direction:column; gap:12px;
  width:100%; max-width:260px;
}
</style>
<script src="plan-utils.js"></script>
</head>
<body>
<!-- Aplicar tema antes de render para evitar flash -->
<script>(function(){ if(localStorage.getItem('cruzando_theme')==='light') document.body.classList.add('light'); })();</script>

<div class="shell">

  <!-- Header -->
  <header class="header">

    </button>
    <div class="header-center">
      <div class="header-title">El Santuario</div>
    </div>
    <button class="icon-btn" id="btn-dark" onclick="window.toggleDarkMode()" title="Cambiar tema">
      <svg id="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"

        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>

        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>

    </button>
  </header>

  <!-- VISTA A — La Hospedería -->
  <div id="vista-hospederia">

    <!-- Hero -->
    <section class="hero">
      <p class="hero-question">¿Qué estás cruzando ahora?</p>
      <p class="hero-sub">Encuentra un retiro para este momento de tu camino.</p>
    </section>

    <!-- Catálogo -->
    <div id="hospederia" class="hospederia">
      <div class="spinner-wrap"><div class="spinner"></div></div>
    </div>

  </div><!-- /#vista-hospederia -->

  <!-- VISTA B — El Retiro -->
  <div id="vista-retiro" style="display:none">

    <!-- Barra superior fija -->
    <div id="retiro-header">
      <span id="retiro-titulo">Cargando...</span>
      <div id="retiro-controles">
        <button id="btn-bgm-retiro" onclick="window.toggleBgmRetiro()" title="Música de fondo">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
        </button>
        <button id="btn-play" onclick="window.toggleAudioRetiro()">
          <svg id="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:block">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <svg id="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>
        <button id="btn-cerrar" onclick="window.cerrarRetiro()">✕</button>
      </div>
    </div>

    <!-- Barra de progreso segmentada -->
    <div id="retiro-progreso">
      <!-- Los segmentos se generan dinámicamente -->
    </div>

    <!-- Área de tarjetas -->
    <div id="retiro-tarjetas"></div>

  </div>

  <!-- Bottom nav -->
  <nav class="app-nav">
    <button class="app-nav-item" onclick="window.navTap(this); window.goTo('orar.html')">
      <div class="app-nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

          <line x1="4" y1="9" x2="20" y2="9"/>

      <span class="app-nav-label">Orar</span>
    </button>
    <button class="app-nav-item" onclick="window.navTap(this); window.goTo('diario.html')">

        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"

          <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>

      </div>
      <span class="app-nav-label">Diario</span>
    </button>
    <button class="app-nav-item" onclick="window.navTap(this); window.goTo('cantos.html')">
      <div class="app-nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"

          <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <span class="app-nav-label">Cantos</span>
    </button>
    <button class="app-nav-item active" disabled>
      <div class="app-nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s-8-5.5-8-11a8 8 0 0116 0c0 5.5-8 11-8 11z"/>
          <path d="M9 11h6M12 8v6"/>
        </svg>
      </div>
      <span class="app-nav-label">Sanar</span>
    </button>
    <button class="app-nav-item" onclick="window.navTap(this); window.goTo('index.html')">
      <div class="app-nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </div>
      <span class="app-nav-label">Inicio</span>
    </button>
  </nav>

</div><!-- /.shell -->
