  // ── Seleccionar bloque desde listón ──
  function bkSelectBloque(bloque) {
    if (bkAnimating) return;
    const newIdx = BLOCKS.indexOf(bloque);

    // Marcar listón activo
    document.querySelectorAll('.bk-ribbon').forEach(r =>
      r.classList.toggle('active', r.dataset.bloque === bloque)
    );

    if (!bkIsOpen) {
      // Primera apertura: girar tapa
      bkAnimating = true; bkIsOpen = true;
      $('bk-cover').classList.add('open');
      $('bk-shadow').classList.add('open');
      setTimeout(() => {
        $('bk-viewport').classList.add('active');
        bkShowPage(bloque, 'right');
        bkCurrentIdx = newIdx;
        bkAnimating  = false;
      }, 750);
      return;
    }

    if (bkCurrentIdx === newIdx) return;

    // Dirección: listón más arriba (índice menor) → viene de la derecha
    const dir = newIdx < bkCurrentIdx ? 'right' : 'left';
    bkSlideTo(bloque, newIdx, dir);
  }

  function bkSlideTo(bloque, newIdx, dir) {
    if (bkAnimating) return;
    bkAnimating = true;

    const oldPage = $('bkpg-' + BLOCKS[bkCurrentIdx]);
    oldPage.classList.remove('pg-current');
    oldPage.classList.add(dir === 'right' ? 'exit-r' : 'exit-l');

    setTimeout(() => {
      oldPage.classList.remove('exit-l','exit-r','pg-current');
      oldPage.classList.add('enter-r');
      bkShowPage(bloque, dir === 'right' ? 'left' : 'right');
      bkCurrentIdx = newIdx;
      bkAnimating  = false;
    }, 440);
  }

  function bkShowPage(bloque, fromDir) {
    const pg = $('bkpg-' + bloque);
    pg.classList.remove('enter-r','enter-l','exit-l','exit-r','pg-current');
    pg.classList.add(fromDir === 'right' ? 'enter-r' : 'enter-l');
    pg.offsetHeight; // reflow
    pg.classList.remove('enter-r','enter-l');
    pg.classList.add('pg-current');
  }

  // ── Botón Orar: muestra micro dentro del libro o va directo a oración ──
  function bkGoOrar(bloque) {
    if (bkAnimating) return;
    bkAnimating = true;
    currentBlock = bloque;

    const hasUnfinished = !microDone[bloque];
    const hasMicro = MICRO_DATA && MICRO_DATA.bloques && MICRO_DATA.bloques[bloque];

    // Página resumen sale hacia la izquierda
    const curPg = $('bkpg-' + bloque);
    curPg.classList.remove('pg-current');
    curPg.classList.add('exit-l');

    setTimeout(() => {
      curPg.classList.remove('exit-l','pg-current');
      curPg.classList.add('enter-r');
      bkAnimating = false;

      if (hasMicro && hasUnfinished) {
        // Mostrar micro DENTRO del libro
        bkShowMicro(bloque);
      } else {
        // Ir directo a oración (transición libro↑)
        transitionToprayer(bloque);
      }
    }, 440);
  }

  // ── Mostrar micro-aprendizaje dentro del viewport del libro ──
  let bkMicroStep = 0;
  let bkMicroAnswered = false;
  let bkMicroBloque = null;

  function bkShowMicro(bloque) {
    bkMicroBloque = bloque;
    bkMicroStep = 0;
    bkMicroAnswered = false;

    const pg = $('bkpg-micro');
    pg.classList.remove('enter-r','enter-l','exit-l','exit-r','pg-current');
    pg.classList.add('enter-r');
    pg.offsetHeight; // reflow
    pg.classList.remove('enter-r');
    pg.classList.add('pg-current');

    // Botón volver a resumen
    const backBtn = $('bk-micro-back-btn');
    if (backBtn) backBtn.onclick = () => bkMicroBackToSummary(bloque);

    bkRenderMicroStep();
  }

  function bkMicroBackToSummary(bloque) {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    const microPg = $('bkpg-micro');
    const summPg  = $('bkpg-' + bloque);

    microPg.classList.remove('pg-current');
    microPg.classList.add('exit-r');

    summPg.classList.remove('enter-r','enter-l');
    summPg.classList.add('enter-l');
    summPg.offsetHeight;
    summPg.classList.remove('enter-l');
    summPg.classList.add('pg-current');

    setTimeout(() => {
      microPg.classList.remove('exit-r','pg-current');
      microPg.classList.add('enter-r');
    }, 450);

    bkCurrentIdx = BLOCKS.indexOf(bloque);
  }

  function bkRenderMicroStep() {
    const b  = bkMicroBloque;
    const bd = MICRO_DATA.bloques[b];
    const tarjetas = bd.tarjetas || [];
    const total = tarjetas.length + 1;
    const step  = bkMicroStep;

    // Tag con nombre del bloque
    const tagEl = $('bk-micro-tag');
    if (tagEl) tagEl.textContent = 'Misterios ' + BLOCK_NAMES[b];

    // Puntos de progreso
    const dotsEl = $('bk-micro-dots');
    if (dotsEl) {
      dotsEl.innerHTML = Array.from({length: total}, (_, i) =>
        '<div class="bk-micro-dot' +
        (i < step ? ' done' : i === step ? ' active' : '') + '"></div>'
      ).join('');
    }

    // Barra de progreso
    const fill = $('bk-micro-progress-fill');
    if (fill) fill.style.width = Math.round((step / total) * 100) + '%';

    const body   = $('bk-micro-body');
    const footer = $('bk-micro-footer');

    if (step < tarjetas.length) {
      // Ficha de contenido
      const t = tarjetas[step];
      const esUltima = step === tarjetas.length - 1;
      body.innerHTML =
        '<div class="bk-micro-emoji">' + (t.emoji || '📖') + '</div>' +
        '<p class="bk-micro-text">' + escHTML(t.texto) + '</p>' +
        '<button class="bk-micro-tts" id="bk-micro-tts-btn" onclick="window._ca.bkMicroTTS()">🔊 Escuchar</button>';
      footer.innerHTML =
        (step > 0 ? '<button class="bk-micro-btn bk-micro-btn-sec" onclick="window._ca.bkMicroPrev()">← Anterior</button>' : '') +
        '<button class="bk-micro-btn bk-micro-btn-pri" onclick="window._ca.bkMicroNext()">' +
        (esUltima ? 'Pregunta →' : 'Siguiente →') + '</button>';
    } else {
      // Pregunta de apertura
      const preg = bd.pregunta;
      bkMicroAnswered = false;
      body.innerHTML =
        '<div class="bk-micro-q-label">🤲 Pregunta de apertura</div>' +
        '<div class="bk-micro-q-emoji">' + (preg.emoji || '💭') + '</div>' +
        '<p class="bk-micro-q-text">' + escHTML(preg.texto) + '</p>' +
        '<div class="bk-micro-opciones">' +
          preg.opciones.map((op, oi) =>
            '<button class="bk-micro-opcion" id="bk-micro-op-' + oi + '" onclick="window._ca.bkMicroResponder(' + oi + ')">' +
              '<span class="bk-micro-opcion-letra">' + op.letra + '</span>' + escHTML(op.texto) +
            '</button>'
          ).join('') +
        '</div>' +
        '<div class="bk-micro-eco" id="bk-micro-eco"></div>';
      footer.innerHTML =
        '<button class="bk-micro-btn bk-micro-btn-sec" onclick="window._ca.bkMicroPrev()">← Anterior</button>' +
        '<button class="bk-micro-btn bk-micro-btn-rezar" id="bk-micro-btn-rezar" onclick="window._ca.bkMicroFinalizar()">📿 Rezar ahora</button>';
    }
    // Scroll al inicio de la ficha
    if (body) body.scrollTop = 0;
  }

  function bkMicroNext() {
    if (bkMicroStep < (MICRO_DATA.bloques[bkMicroBloque].tarjetas.length)) {
      bkMicroStep++;
      bkRenderMicroStep();
    }
  }
  function bkMicroPrev() {
    if (bkMicroStep > 0) { bkMicroStep--; bkRenderMicroStep(); }
  }

  function bkMicroTTS() {
    const t = MICRO_DATA.bloques[bkMicroBloque].tarjetas[bkMicroStep];
    if (!t) return;
    const btn = $('bk-micro-tts-btn');
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
      if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 Escuchar'; }
      return;
    }
    const utt = new SpeechSynthesisUtterance(t.texto);
    utt.lang = 'es-MX'; utt.rate = 0.9;
    const voces = window.speechSynthesis.getVoices();
    const voz = voces.find(v => v.lang.startsWith('es') && v.name.toLowerCase().includes('male')) ||
               voces.find(v => v.lang.startsWith('es') && !v.name.toLowerCase().includes('female')) ||
               voces.find(v => v.lang.startsWith('es')) || null;
    if (voz) utt.voice = voz;
    utt.onstart = () => { if (btn) { btn.classList.add('playing'); btn.textContent = '⏹ Detener'; } };
    utt.onend = utt.onerror = () => { if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 Escuchar'; } };
    window.speechSynthesis.speak(utt);
  }

  function bkMicroResponder(oi) {
    if (bkMicroAnswered) return;
    bkMicroAnswered = true;
    const op = MICRO_DATA.bloques[bkMicroBloque].pregunta.opciones[oi];
    MICRO_DATA.bloques[bkMicroBloque].pregunta.opciones.forEach((_, i) => {
      const btn = $('bk-micro-op-' + i);
      if (btn) btn.classList.toggle('selected', i === oi);
    });
    const eco = $('bk-micro-eco');
    if (eco) {
      eco.innerHTML = '<span style="margin-right:4px">' + (op.emoji || '✨') + '</span>' + escHTML(op.eco);
      eco.classList.add('visible');
    }
    playNotes([523, 659]);
    const btnR = $('bk-micro-btn-rezar');
    if (btnR) { btnR.style.display = ''; }
  }

  function bkMicroFinalizar() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    microDone[bkMicroBloque] = true;
    saveProgress();
    playNotes([523, 659, 784, 880]);
    luxShine();
    // Transición: el libro sube y desaparece
    setTimeout(() => transitionToPrayer(bkMicroBloque), 300);
  }

  // ── Transición libro → pantalla de oración ──
  function transitionToPlayer(bloque) { transitionToPrayer(bloque); } // alias
  function transitionToBook() {
    // Mostrar libro regresando
    const outer = $('book-outer-wrap');
    if (outer) {
      outer.classList.remove('exit-up');
      outer.classList.add('enter-down');
      outer.offsetHeight;
      outer.classList.remove('enter-down');
    }
  }

  function transitionToPrayer(bloque) {
    stopAudio();
    currentBlock = bloque;
    const prog = progress[bloque] || [];
    const first = prog.findIndex(x => x === null);
    currentMystery = first >= 0 ? first : 0;
    openSection = null;

    // Animar libro hacia arriba
    const outer = $('book-outer-wrap');
    if (outer) {
      outer.classList.add('exit-up');
    }

    setTimeout(() => {
      // Mostrar pantalla de oración con animación
      renderPrayer();
      const prayerScr = $('scr-prayer');
      prayerScr.classList.add('slide-in-up');
      setTimeout(() => prayerScr.classList.remove('slide-in-up'), 550);
    }, 420);
  }

  // ── Entrar a un bloque (vía hoy-tab o directo) ──
  function enterBlock(b) {
    // Ahora todo pasa por bkGoOrar (el libro es el motor)
    // Esta función puede ser llamada si se llega desde tab-hoy sin haber abierto el libro
    currentBlock = b;
    const prog = progress[b] || [];
    const first = prog.findIndex(x => x === null);
    currentMystery = first >= 0 ? first : 0;
    openSection = null;
    const hasMicro = MICRO_DATA && MICRO_DATA.bloques && MICRO_DATA.bloques[b];
    if (hasMicro && !microDone[b]) {
      // Necesita pasar por el libro: seleccionar bloque y mostrar
      // Si el libro aún no está abierto, abrirlo primero
      if (!bkIsOpen) {
        // Primero abrir el libro mostrando la página de ese bloque
        bkSelectBloque(b);
        // Dar tiempo a que se abra el libro antes de ir al micro
        setTimeout(() => { bkGoOrar(b); }, 1100);
      } else {
        bkGoOrar(b);
      }
    } else {
      transitionToPlayer(b);
    }
  }

  // ══════════════════════════════════════════════════════
  // MICRO-APRENDIZAJE
  // ══════════════════════════════════════════════════════

  function renderMicro(b) {
    const bd = MICRO_DATA.bloques[b];
    microStep = 0; microAnswered = false;
    $('h-title').textContent = 'CruzAndo';
    $('h-sub').textContent = 'Preparación · ' + BLOCK_NAMES[b];
    $('micro-bloque-label').textContent = 'Misterios ' + BLOCK_NAMES[b];
    $('micro-titulo').textContent = bd.titulo;
    $('micro-subtitulo').textContent = bd.subtitulo || '';
    $('btn-back-micro').onclick = () => { stopAudio(); renderHome(); };
    renderMicroStep(b);
    show('scr-micro');
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  function renderMicroStep(b) {
    const bd = MICRO_DATA.bloques[b];
    const tarjetas = bd.tarjetas || [];
    const total = tarjetas.length + 1;
    $('micro-progress-fill').style.width = Math.round((microStep / total) * 100) + '%';

    const content  = $('micro-content');
    const navBtns  = $('micro-nav-btns');

    if (microStep < tarjetas.length) {
      const t = tarjetas[microStep];
      content.innerHTML =
        '<div class="micro-card">' +
          '<span class="micro-card-emoji">' + (t.emoji || '📖') + '</span>' +
          '<p class="micro-card-texto">' + escHTML(t.texto) + '</p>' +
          '<button class="micro-tts-btn" id="micro-tts-btn" onclick="window._ca.microTTS()">🔊 Escuchar</button>' +
        '</div>';
      const esUltima = microStep === tarjetas.length - 1;
      navBtns.innerHTML =
        (microStep > 0 ? '<button class="btn btn-outline" onclick="window._ca.microPrev()">← Anterior</button>' : '') +
        '<button class="btn btn-primary" onclick="window._ca.microNext()">' + (esUltima ? 'Pregunta →' : 'Siguiente →') + '</button>';
    } else {
      const preg = bd.pregunta;
      microAnswered = false;
      content.innerHTML =
        '<div class="micro-pregunta-box">' +
          '<div class="micro-pregunta-label">🤲 Pregunta de apertura</div>' +
          '<span class="micro-pregunta-emoji">' + (preg.emoji || '💭') + '</span>' +
          '<p class="micro-pregunta-texto">' + escHTML(preg.texto) + '</p>' +
          '<div class="micro-opciones">' +
            preg.opciones.map((op, oi) =>
              '<button class="micro-opcion" id="micro-op-' + oi + '" onclick="window._ca.microResponder(' + oi + ')">' +
                '<span class="micro-opcion-letra">' + op.letra + '</span>' + escHTML(op.texto) +
              '</button>'
            ).join('') +
          '</div>' +
          '<div class="micro-eco" id="micro-eco"></div>' +
        '</div>';
      navBtns.innerHTML =
        '<button class="btn btn-outline" onclick="window._ca.microPrev()">← Anterior</button>' +
        '<button class="btn btn-primary btn-rezar" id="btn-ir-rezar" style="display:none" onclick="window._ca.microFinalizar()">📿 Rezar ahora</button>';
    }
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  function microResponder(oi) {
    if (microAnswered) return;
    microAnswered = true;
    const b = currentBlock;
    const op = MICRO_DATA.bloques[b].pregunta.opciones[oi];
    MICRO_DATA.bloques[b].pregunta.opciones.forEach((_, i) => {
      const btn = $('micro-op-' + i);
      if (btn) btn.classList.toggle('selected', i === oi);
    });
    const ecoEl = $('micro-eco');
    if (ecoEl) {
      ecoEl.innerHTML = '<span class="micro-eco-emoji">' + (op.emoji || '✨') + '</span> ' + escHTML(op.eco);
      ecoEl.classList.add('visible');
    }
    playNotes([523, 659]);
    const btnR = $('btn-ir-rezar');
    if (btnR) btnR.style.display = '';
  }

  function microNext() { microStep++; renderMicroStep(currentBlock); }
  function microPrev() { if (microStep > 0) { microStep--; renderMicroStep(currentBlock); } }

  function microTTS() {
    const t = MICRO_DATA.bloques[currentBlock].tarjetas[microStep];
    if (!t) return;
    const btn = $('micro-tts-btn');
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
      if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 Escuchar'; }
      return;
    }
    const utt = new SpeechSynthesisUtterance(t.texto);
    utt.lang = 'es-MX'; utt.rate = 0.9;
    const voces = window.speechSynthesis.getVoices();
    const voz = voces.find(v => v.lang.startsWith('es') && v.name.toLowerCase().includes('male')) ||
                voces.find(v => v.lang.startsWith('es') && !v.name.toLowerCase().includes('female')) ||
                voces.find(v => v.lang.startsWith('es')) || null;
    if (voz) utt.voice = voz;
    utt.onstart = () => { if (btn) { btn.classList.add('playing'); btn.textContent = '⏹ Detener'; } };
    utt.onend = utt.onerror = () => { if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 Escuchar'; } };
    window.speechSynthesis.speak(utt);
  }

  function microFinalizar() {
    microDone[currentBlock] = true;
    saveProgress();
    playNotes([523, 659, 784, 880]);
    luxShine();
    setTimeout(() => renderPrayer(), 600);
  }

  // ── Render: Pantalla de Oración ──
  function renderPrayer() {
    const b = currentBlock;
    const mi = currentMystery;
    const mists = DATA.misterios[b];
    const m = mists[mi];
    const prog = progress[b];

    $('h-title').textContent = 'CruzAndo';
    $('h-sub').textContent = nivelLabel(DATA.tema.id) + ' · ' + BLOCK_NAMES[b];

    // Counter
    $('prayer-counter').textContent = ORDS[mi] + ' Misterio ' + BTYPES[b];
    $('prayer-title').textContent = m.titulo;
    $('prayer-subtitle').textContent = m.subtitulo || '';

    // Beads (rosary chain)
    const dots = $('prayer-dots');
    const beadPositions = [24, 72, 120, 168, 216];
    const boldColor = DATA.tema.paleta.bold;
    const lightColor = DATA.tema.paleta.light;
    const borderC = isDark ? '#3A3530' : '#D9D1C7';
    const lineColorDone = lightColor;
    const lineColorPending = borderC;

    // Find how far the chain color extends
    const lastDoneIdx = (() => { for (let i = 4; i >= 0; i--) { if (prog[i]) return i; } return -1; })();
    const chainEndX = lastDoneIdx >= 0 ? beadPositions[lastDoneIdx] : 24;

    let svgHTML = '<svg viewBox="0 0 240 30" preserveAspectRatio="xMidYMid meet">';
    // Background line (pending)
    svgHTML += '<line x1="24" y1="15" x2="216" y2="15" stroke="' + lineColorPending + '" stroke-width="1.5" stroke-linecap="round"/>';
    // Done line
    if (lastDoneIdx >= 0) {
      svgHTML += '<line x1="24" y1="15" x2="' + chainEndX + '" y2="15" stroke="' + lineColorDone + '" stroke-width="1.5" stroke-linecap="round"/>';
    }
    // Beads
    for (let i = 0; i < 5; i++) {
      const cx = beadPositions[i];
      if (prog[i]) {
        // Done bead
        svgHTML += '<circle cx="' + cx + '" cy="15" r="9" fill="' + boldColor + '" style="cursor:pointer" onclick="window._ca.goMystery(' + i + ')"/>';
      } else if (i === mi) {
        // Active bead (current mystery)
        svgHTML += '<circle cx="' + cx + '" cy="15" r="9.5" fill="none" stroke="' + boldColor + '" stroke-width="2" style="cursor:pointer" onclick="window._ca.goMystery(' + i + ')"/>';
        svgHTML += '<circle cx="' + cx + '" cy="15" r="4" fill="' + lightColor + '" style="cursor:pointer" onclick="window._ca.goMystery(' + i + ')"/>';
      } else {
        // Pending bead
        svgHTML += '<circle cx="' + cx + '" cy="15" r="9" fill="none" stroke="' + borderC + '" stroke-width="1.2" style="cursor:pointer" onclick="window._ca.goMystery(' + i + ')"/>';
      }
    }
    svgHTML += '</svg>';
    dots.innerHTML = svgHTML;

    // Evangelio
    $('ev-text').textContent = m.evangelio;
    $('ev-ref').textContent = '— ' + m.referencia;

    // Acordeón
    renderAccordion(b, mi, m);

    // Done bar
    const doneWrap = $('mystery-done-wrap');
    if (prog[mi]) {
      const d = new Date(prog[mi]);
      doneWrap.style.display = '';
      doneWrap.innerHTML =
        '<div class="mystery-done-bar fade-in">' +
          '<span class="done-check">✓</span>' +
          '<div><div class="done-text">Misterio completado</div>' +
          '<div class="done-date">' + d.toLocaleDateString('es-MX',{day:'numeric',month:'long'}) + '</div></div>' +
        '</div>';
    } else {
      doneWrap.style.display = 'none';
    }

    // Bottom nav
    renderBottomNav(b, mi);

    show('scr-prayer');
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  // ── Acordeón ──
  function renderAccordion(b, mi, m) {
    const acc = $('accordion');
    const sections = [
      { key:'rezar', icon:'📿', label:'Rezar este Misterio', bgVar:'--lvl-ultra' },
      { key:'canto', icon:'🎵', label:'Canto', bgVar:'--lvl-ultra' },
      { key:'contemplar', icon:'👁️', label:'Contemplar', bgVar:'--lvl-ultra' },
      { key:'meditar', icon:'✏️', label:'Meditar y escribir', bgVar:'--lvl-ultra' },
      { key:'intercesion', icon:'🙏', label:'Intercesión', bgVar:'--lvl-ultra' },
    ];

    acc.innerHTML = sections.map(s => {
      const isOpen = openSection === s.key;
      return '<div class="acc-item' + (isOpen ? ' open' : '') + '" id="acc-' + s.key + '">' +
        '<button class="acc-trigger" onclick="window._ca.toggleSection(\'' + s.key + '\')">' +
          '<div class="acc-trigger-left">' +
            '<div class="acc-icon" style="background:var(' + s.bgVar + ')">' + s.icon + '</div>' +
            '<span class="acc-label">' + s.label + '</span>' +
          '</div>' +
          '<svg class="acc-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</button>' +
        '<div class="acc-body" style="max-height:' + (isOpen ? '2000px' : '0') + '">' +
          '<div class="acc-body-inner">' + sectionContent(s.key, b, mi, m) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function sectionContent(key, b, mi, m) {
    if (key === 'rezar') {
      const src = DATA.audio_rezo || '';
      return audioPlayerHTML('ap-rezar', 'Padrenuestro · 10 Avemarías · Gloria · Jaculatoria', src);
    }
    if (key === 'canto') {
      const src = DATA.audio_canto || '';
      if (src) return audioPlayerHTML('ap-canto', 'Canto contemplativo', src);
      return '<div class="canto-box"><p>🕊️ Momento de silencio y canto contemplativo</p><span class="canto-hint">Tómate unos momentos para cantar, meditar o guardar silencio antes de continuar</span></div>';
    }
    if (key === 'contemplar') {
      const src = m.audio_contemplacion || '';
      let html = audioPlayerHTML('ap-contempl', 'Audio de la contemplación', src);
      html += '<div class="contempl-text">' + escHTML(m.contemplacion) + '</div>';
      return html;
    }
    if (key === 'meditar') {
      return renderMeditation(b, mi, m);
    }
    if (key === 'intercesion') {
      let html = '<div class="interc-text">' + escHTML(m.intercesion) + '</div>';
      const isDone = progress[b] && progress[b][mi];
      html += '<button class="amen-btn' + (isDone ? ' done' : '') + '" onclick="window._ca.completeMystery()">' + (isDone ? '✓ Amén' : 'Amén') + '</button>';
      return html;
    }
    return '';
  }

  function renderMeditation(b, mi, m) {
    // Parsear las 3 preguntas de meditación
    const questions = parseMeditation(m.meditacion);
    const j = journal[b] && journal[b][mi] ? journal[b][mi] : {};
    const mc = medConfirmed[b] && medConfirmed[b][mi] ? medConfirmed[b][mi] : {};

    return questions.map((q, qi) => {
      const val = j['q' + qi] || '';
      const confirmed = mc['q' + qi] || false;
      const btnClass = 'med-confirm' + (confirmed ? ' done' : '');
      const btnText = confirmed ? '✓ Reflexión guardada' : '📝 Guardar reflexión';
      return '<div class="med-group">' +
        '<div class="med-label-row">' +
          '<div class="med-dot" style="background:' + MED_COLORS[qi] + '"></div>' +
          '<span class="med-label-text" style="color:' + MED_COLORS[qi] + '">' + MED_LABELS[qi] + '</span>' +
        '</div>' +
        '<p class="med-question">' + escHTML(q) + '</p>' +
        '<textarea class="journal-area" id="med-ta-' + qi + '" placeholder="Escribe tu reflexión…" ' +
          'oninput="window._ca.onMedInput(\'' + b + '\',' + mi + ',' + qi + ',this.value)">' + escHTML(val) + '</textarea>' +
        '<button class="' + btnClass + '" id="med-btn-' + qi + '" onclick="window._ca.confirmReflection(\'' + b + '\',' + mi + ',' + qi + ')">' + btnText + '</button>' +
      '</div>';
    }).join('');
  }

  function parseMeditation(text) {
    if (!text) return ['','',''];
    // Intentar separar por las 3 etiquetas
    const labels = MED_LABELS;
    const parts = [];
    let remaining = text;
    for (let i = 0; i < labels.length; i++) {
      const idx = remaining.indexOf(labels[i]);
      if (idx >= 0) {
        if (i > 0 && parts.length < i) parts.push(remaining.substring(0, idx).trim());
        remaining = remaining.substring(idx + labels[i].length);
        // Quitar : inicial si hay
        remaining = remaining.replace(/^\s*:\s*/, '');
      }
    }
    if (remaining.trim()) parts.push(remaining.trim());

    // Si no se pudo parsear con labels, intentar por líneas
    if (parts.length < 3) {
      const lines = text.split('\n').filter(l => l.trim());
      return [lines[0] || '', lines[1] || '', lines[2] || ''];
    }
    return parts.length >= 3 ? parts.slice(0,3) : [...parts, ...Array(3-parts.length).fill('')];
  }

  function saveJournal(b, mi, qi, val) {
    if (!journal[b]) journal[b] = {};
    if (!journal[b][mi]) journal[b][mi] = {};
    journal[b][mi]['q' + qi] = val;
    saveProgress();
  }

  function onMedInput(b, mi, qi, val) {
    saveJournal(b, mi, qi, val);
    // Auto-trigger a los 140 caracteres si no está confirmado aún
    if (!medConfirmed[b]) medConfirmed[b] = {};
    if (!medConfirmed[b][mi]) medConfirmed[b][mi] = {};
    if (!medConfirmed[b][mi]['q' + qi] && val.length >= 140) {
      confirmReflection(b, mi, qi);
    }
  }

  function confirmReflection(b, mi, qi) {
    if (!medConfirmed[b]) medConfirmed[b] = {};
    if (!medConfirmed[b][mi]) medConfirmed[b][mi] = {};
    if (medConfirmed[b][mi]['q' + qi]) return; // ya confirmado

    // Verificar que haya texto
    const j = journal[b] && journal[b][mi] ? journal[b][mi] : {};
    const val = j['q' + qi] || '';
    if (val.trim().length < 5) return; // muy corto, ignorar

    medConfirmed[b][mi]['q' + qi] = true;
    saveProgress();

    // Sonido suave (nota ascendente según pregunta)
    const freqs = [[523,659],[587,740],[659,880]];
    playNotes(freqs[qi] || freqs[0]);

    // Visual: actualizar botón con glow
    const btn = document.getElementById('med-btn-' + qi);
    if (btn) {
      btn.className = 'med-confirm done glow';
      btn.textContent = '✓ Reflexión guardada';
    }

    // GAMIFICACIÓN: Dar recompensa de 650m con Mariano descansando
    const rewardKey = b + '_' + mi + '_q' + qi;
    if (!reflectionRewards[rewardKey]) {
      reflectionRewards[rewardKey] = true;
      gainMeters(650, getNextRestPose());
    }
  }

  function toggleSection(key) {
    openSection = openSection === key ? null : key;
    renderAccordion(currentBlock, currentMystery, DATA.misterios[currentBlock][currentMystery]);
  }

  // ── Completar misterio ──
  function completeMystery() {
    const b = currentBlock;
    const mi = currentMystery;
    if (progress[b][mi]) return; // ya completado

    progress[b][mi] = Date.now();
    saveProgress();

    // Celebración del misterio
    const variant = BLOCKS.indexOf(b) * 5 + mi;
    celebrationSound(variant);

    // Checar si el bloque está completo
    const allDone = progress[b].every(x => x !== null);
    if (allDone) {
      // Celebración de bloque completo
      setTimeout(() => {
        showConfetti();
        showCelebration(b);
      }, 600);
    } else {
      // Auto-avanzar al siguiente misterio
      renderPrayer();
      if (mi < 4) {
        setTimeout(() => {
          currentMystery = mi + 1;
          openSection = null;
          stopAudio();
          renderPrayer();
        }, 800);
      }
    }
  }

  // ── Bottom Nav ──
  function renderBottomNav(b, mi) {
    const nav = $('bottom-nav');
    const hasPrev = mi > 0;
    const hasNext = mi < 4;
    const isDone = progress[b][mi];

    let html = '';
    if (hasPrev) {
      html += '<button class="btn btn-outline" onclick="window._ca.goMystery(' + (mi-1) + ')">← Anterior</button>';
    }
    if (hasNext && isDone) {
      html += '<button class="btn btn-primary" onclick="window._ca.goMystery(' + (mi+1) + ')">Siguiente →</button>';
    } else if (!isDone) {
      // No mostrar "siguiente" hasta completar con Amén
    }
    nav.innerHTML = html;
  }

  function goMystery(i) {
    currentMystery = i;
    openSection = null;
    stopAudio();
    renderPrayer();
  }

  // ── Celebración de bloque ──
  function showCelebration(b) {
    // PRIMERO: Celebración grand de Mariano (pantalla completa, 3.5s)
    showMarianoGrandCelebration();

    // DESPUÉS: Pantalla de celebración tradicional
    setTimeout(() => {
      const blockName = BLOCK_NAMES[b];
      const maria = 'img/maria_' + b + '.webp';

      const container = $('maria-container');
      const img = new Image();
      img.onload = () => {
        container.outerHTML = '<img class="maria-img" id="maria-container" src="' + maria + '" alt="Virgen María">';
      };
      img.onerror = () => {
        container.innerHTML = '🙏';
      };
      img.src = maria;

      $('celeb-title').textContent = '¡Misterios ' + blockName + ' completados!';
      $('celeb-sub').textContent = 'Has contemplado los cinco Misterios ' + blockName + ' de este nivel. Que María siga acompañándote en el camino.';
      $('btn-celeb-home').onclick = () => {
        stopAudio();
        renderHome();
      };

      show('scr-celebration');
      celebrationSound(BLOCKS.indexOf(b));
    }, 3500); // Esperar a que termine Mariano Grand
  }

  // ── Escape HTML ──
  function escHTML(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  // ── Iniciar ──
  async function init() {
    // Leer ID desde URL
    const params = new URLSearchParams(window.location.search);
    NIVEL_ID = params.get('c') || '0101';

    // Validar formato 4 dígitos
    if (!/^\d{4}$/.test(NIVEL_ID)) {
      showError('ID inválido: ' + NIVEL_ID + '. Usa un código de 4 dígitos (ej. 0101).');
      return;
    }

    // Cargar JSON (ruta relativa al directorio del HTML)
    const loc = window.location;
    const base = loc.origin + loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);
    try {
      const resp = await fetch(base + 'data/' + NIVEL_ID + '.json');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      DATA = await resp.json();
    } catch(e) {
      showError('No se pudo cargar data/' + NIVEL_ID + '.json. Verifica que el archivo exista.');
      return;
    }

    // Cargar micro-data (opcional, no bloquea si no existe)
    try {
      const mr = await fetch(base + 'data/' + NIVEL_ID + '-micro.json');
      if (mr.ok) MICRO_DATA = await mr.json();
    } catch(e) { MICRO_DATA = null; }

    // Cargar progreso
    loadProgress();

    // Aplicar dark mode
    if (isDark) {
      document.body.classList.add('dark');
      $('ico-sun').style.display = 'none';
      $('ico-moon').style.display = 'block';
    }

    // Aplicar paleta
    applyPalette();

    // Event listeners
    $('btn-dark').onclick = toggleDark;
    $('btn-back-home').onclick = () => {
      stopAudio();
      const prayerScr = $('scr-prayer');
      prayerScr.classList.add('slide-out-down');
      setTimeout(() => {
        prayerScr.classList.remove('slide-out-down');
        renderHome();
      }, 400);
    };

    // API global para onclick en HTML
    window._ca = {
      toggleAudio: toggleAudio,
      seekAudio: seekAudio,
      toggleSection: toggleSection,
      completeMystery: completeMystery,
      goMystery: goMystery,
      saveJournal: saveJournal,
      onMedInput: onMedInput,
      confirmReflection: confirmReflection,
      enterBlock: enterBlock,
      microNext: microNext,
      microPrev: microPrev,
      microTTS: microTTS,
      microResponder: microResponder,
      microFinalizar: microFinalizar,
      bkSelectBloque: bkSelectBloque,
      bkGoOrar: bkGoOrar,
      // Micro integrado en el libro
      bkMicroNext: bkMicroNext,
      bkMicroPrev: bkMicroPrev,
      bkMicroTTS: bkMicroTTS,
      bkMicroResponder: bkMicroResponder,
      bkMicroFinalizar: bkMicroFinalizar,
    };

    // Render
    $('scr-loading').style.display = 'none';
    $('main-header').style.display = '';
    renderHome();
  }

  function showError(msg) {
    $('scr-loading').style.display = 'none';
    $('error-msg').textContent = msg;
    $('scr-error').style.display = 'flex';
  }

  // Arrancar
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
