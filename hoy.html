<style>
:root{
  --bg:#002931; --bg2:#001E25; --card:#004C5B; --card2:#003845;
  --border:rgba(67,221,248,0.15);
  --text:#F0E6DA; --text-soft:#C4A882; --text-dim:#7A5C40;
  --brand:#02BBE0; --brand-soft:#43DDF8;
  --cuenta-apagada:rgba(243,234,216,0.13);
  --cuenta-borde:rgba(243,234,216,0.26);
  --scrim:0,41,49;
  --verde:#3FE08A; --verde-rgb:63,224,138;
}
body.light{
  --bg:#E6DED3; --bg2:#D9CFC4; --card:#FFFCF7; --card2:#F5EDE4;
  --border:#D0C4B8;
  --text:#2B1A0E; --text-soft:#6B5040; --text-dim:#9B8878;
  --cuenta-apagada:rgba(43,26,14,0.09);
  --cuenta-borde:rgba(43,26,14,0.22);
  --scrim:230,222,211;
  --verde:#0E9A5B; --verde-rgb:14,154,91;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
button{font:inherit;cursor:pointer}

.shell{max-width:480px;margin:0 auto;padding:0 20px 108px;min-height:100dvh;display:flex;flex-direction:column}

.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:calc(env(safe-area-inset-top) + 14px) 0 12px;
}
.marca{font-family:'Lora',Georgia,serif;font-weight:600;font-size:.9rem;color:var(--text-soft)}
.tbtn{
  background:transparent;border:1px solid var(--border);border-radius:999px;
  padding:6px 12px;color:var(--text-soft);font-size:.75rem;
}

/* ── carga y avisos ── */
.centro{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:14px;padding:40px 10px;
}
.centro h2{font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:1.5rem;margin:0;line-height:1.2}
.centro p{margin:0;color:var(--text-soft);font-size:.92rem;max-width:30ch;line-height:1.55}
.spinner{
  width:30px;height:30px;border-radius:50%;
  border:2px solid var(--border);border-top-color:var(--brand);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── hero ── */
/* Las ilustraciones P_*.webp son VERTICALES (3:4). A 190px de alto y ancho
   completo la caja era 2:1, y `cover` dejaba ver solo el 36% central de la
   escena: cabezas cortadas y, en Pentecostés, la paloma fuera del cuadro.
   Con 38dvh (capado a 300px) se ve el ~58%, y la altura acompana a la
   pantalla en vez de pesar el doble en un telefono corto. */
.hero{position:relative;margin:0 -20px;height:min(38dvh,300px);overflow:hidden;background:var(--bg2)}
/* El encuadre sube al 25%: estas escenas estan compuestas a cuerpo entero y
   el centro geometrico cae por los torsos. */
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
/* El velo arranca mas abajo que antes (34%): con el hero mas alto, ese 34% se
   comia la mitad de la imagen. El remate opaco se conserva — es lo que funde
   la ilustracion con el fondo de la pagina. */
.hero .fade{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(var(--scrim),0) 56%, rgba(var(--scrim),.72) 84%, rgb(var(--scrim)) 100%);
}

.fecha{font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;color:var(--text-dim);margin:2px 0 6px}
.bloque-tit{
  font-family:'Crimson Pro',Georgia,serif;font-weight:600;
  font-size:1.68rem;line-height:1.12;margin:0 0 5px;letter-spacing:-.012em;color:var(--acento);
}
.bloque-sub{
  font-family:'Crimson Pro',Georgia,serif;font-style:italic;
  font-size:.98rem;color:var(--text-soft);margin:0;line-height:1.4;
}

.completo{
  margin:18px 0 0;border-radius:18px;padding:22px 18px 20px;text-align:center;
  background:radial-gradient(ellipse at 50% 0%, rgba(var(--verde-rgb),.20) 0%, transparent 72%),
             rgba(var(--verde-rgb),.07);
  border:1px solid rgba(var(--verde-rgb),.55);
  box-shadow:0 0 26px rgba(var(--verde-rgb),.22), inset 0 0 32px rgba(var(--verde-rgb),.07);
}
.completo .tick{
  width:34px;height:34px;border-radius:50%;margin:0 auto 11px;
  background:var(--verde);color:#04140C;display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;font-weight:700;box-shadow:0 0 18px rgba(var(--verde-rgb),.6);
}
.completo .big{
  font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:1.72rem;
  line-height:1.1;letter-spacing:-.015em;color:var(--verde);
  text-shadow:0 0 22px rgba(var(--verde-rgb),.45);
}

.pill{
  display:flex;align-items:center;gap:10px;margin:16px 0 0;border-radius:14px;padding:12px 15px;
  background:rgba(var(--pc-rgb),.13);
  border:1px solid rgba(var(--pc-rgb),.45);
}
.pill .tick{
  width:22px;height:22px;border-radius:50%;flex:none;background:var(--pc);color:#12181A;
  display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;
}
.pill .pt{font-size:.88rem;font-weight:600;color:var(--text);line-height:1.35}

.aviso{
  font-size:.82rem;color:var(--text-soft);margin:14px 0 0;line-height:1.5;
  border-left:2px solid var(--acento);padding-left:11px;
}
.aviso b{color:var(--text);font-weight:600}

.elige{margin:13px 0 0}
.elige p{margin:0 0 8px;font-size:.8rem;color:var(--text-soft)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  border-radius:999px;padding:7px 15px;background:transparent;
  border:1px solid var(--cc);color:var(--cc);font-size:.82rem;font-weight:600;
  transition:background .15s,color .15s;
}
.chip[aria-pressed="true"]{background:var(--cc);color:#12181A}

/* El free ve UN Misterio, no una lista de cinco: la tarjeta le da el peso que
   en la vista del dia tiene el bloque entero. Mismo acento, misma tipografia. */
.solo{
  margin:18px 0 0;padding:18px 16px;border-radius:14px;
  background:rgba(var(--acento-rgb),.09);
  border:1px solid rgba(var(--acento-rgb),.28);
}
.solo .solo-n{
  display:block;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--acento);font-weight:600;margin-bottom:6px;
  font-variant-numeric:tabular-nums;
}
.solo .solo-t{margin:0;font-size:1.32rem;line-height:1.25;color:var(--text);font-weight:500}
.cinco{list-style:none;margin:16px 0 0;padding:0}
.cinco li{
  display:grid;grid-template-columns:24px 1fr auto;gap:11px;align-items:center;
  padding:9px 8px 9px 0;border-bottom:1px solid var(--border);border-radius:8px;
}
.cinco li:last-child{border-bottom:none}
.cinco .n{font-size:.72rem;color:var(--text-dim);text-align:right;font-variant-numeric:tabular-nums}
.cinco .t{font-size:.93rem;color:var(--text);line-height:1.35}
.cinco li.done .t{color:var(--text-soft)}
.cinco li.done .n{color:var(--acento)}
.cinco .check{
  width:19px;height:19px;border-radius:50%;flex:none;background:var(--acento);color:#12181A;
  display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;
}
.cinco li.next{background:rgba(var(--acento-rgb),.10);padding-left:8px;margin-left:-8px}
.cinco li.next .n{color:var(--acento);font-weight:500}
.cinco li.next .t{font-weight:600}
.cinco .flecha{color:var(--acento);font-size:.8rem}

.acciones{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.btn{
  display:block;width:100%;text-align:center;border-radius:12px;padding:14px 16px;
  font-size:.95rem;font-weight:600;border:1px solid transparent;transition:transform .12s;
}
.btn:active{transform:scale(.985)}
.btn-1{background:var(--acento);color:#12181A;border-color:var(--acento)}
.btn-2{background:transparent;color:var(--text);border-color:var(--border)}

.manana{
  margin:16px 0 0;text-align:center;font-size:.85rem;color:var(--text-soft);
  border:1px dashed var(--border);border-radius:12px;padding:14px 12px;line-height:1.5;
}
.manana b{display:block;color:var(--text);font-weight:600;margin-bottom:2px}

/* ── la tira del Nivel ── */
.nivel{margin-top:auto;padding-top:28px}
.niv-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:11px}
.niv-nom{font-size:.8rem;color:var(--text-soft);font-weight:500}
.niv-vuelta{font-size:.71rem;color:var(--text-dim);font-variant-numeric:tabular-nums}
.tira{display:flex;gap:14px;justify-content:space-between}
.grupo{display:flex;gap:5px}
.bead{
  width:11px;height:11px;border-radius:50%;padding:0;cursor:default;
  background:var(--cuenta-apagada);border:1px solid var(--cuenta-borde);
}
.bead.rezado{background:var(--bc);border-color:var(--bc);box-shadow:inset 0 -1px 0 rgba(0,0,0,.28)}
.bead.abierto{background:rgba(var(--bc-rgb),.26);border-color:var(--bc)}
.bead.hoy{
  background:rgba(var(--bc-rgb),.34);border-color:var(--bc);
  animation:lat 2.1s ease-out infinite;
}
.bead.vueltahoy{background:var(--bc);border-color:var(--bc);box-shadow:0 0 9px var(--bc)}
@keyframes lat{
  0%{box-shadow:0 0 0 0 rgba(var(--bc-rgb),.55)}
  70%{box-shadow:0 0 0 6px transparent}
  100%{box-shadow:0 0 0 0 transparent}
}
@media (prefers-reduced-motion:reduce){
  .bead.hoy{animation:none;box-shadow:0 0 0 2px rgba(var(--bc-rgb),.45)}
  *{transition:none !important}
}
.pie-bead{margin:13px 0 0;font-size:.82rem;color:var(--text-soft);min-height:3em;line-height:1.45}
.pie-bead .tt{
  font-family:'Crimson Pro',Georgia,serif;font-style:italic;
  color:var(--text);font-size:.94rem;display:block;
}
.pie-bead .est{display:inline-flex;align-items:center;gap:7px;margin-top:5px;font-size:.79rem}
.pie-bead .sym{
  width:16px;height:16px;border-radius:50%;flex:none;
  display:inline-flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;
}
.pie-bead .sym.ok{background:var(--sc);color:#12181A}
.pie-bead .sym.on{background:rgba(var(--sc-rgb),.34);border:1px solid var(--sc)}
.pie-bead .sym.off{background:var(--cuenta-apagada);border:1px solid var(--cuenta-borde)}

/* ── navegación ── */
.app-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:var(--card2);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
body.light .app-nav{background:var(--card)}
.app-nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:10px 4px 12px;background:none;border:none;color:var(--text-dim);
}
.app-nav-item.active{color:var(--brand-soft)}
.app-nav-item[disabled]{cursor:default;opacity:1}
.app-nav-icon{position:relative;display:flex;align-items:center;justify-content:center}
.app-nav-item.active .app-nav-icon::before{
  content:'';position:absolute;inset:-5px;
  background:rgba(2,187,224,0.12);border-radius:10px;
}
@keyframes navSpring{
  0%{transform:scale(1)} 35%{transform:scale(0.78)}
  65%{transform:scale(1.18)} 100%{transform:scale(1)}
}
.app-nav-item.tapped .app-nav-icon{animation:navSpring .38s cubic-bezier(0.34,1.72,0.64,1) both}
.app-nav-item.tapped{color:var(--brand-soft)}
.app-nav-label{font-size:.63rem;font-weight:600;letter-spacing:.02em}
</style>

<script>
(function () {
  'use strict';

  var IMG_BASE = 'https://pub-96c43f31e0da42dd950d4ac90328256e.r2.dev/';
  var BASE_M   = { gozosos:1, luminosos:6, dolorosos:11, gloriosos:16 };
  var CORTO    = { gozosos:'Gozosos', luminosos:'Luminosos',
                   dolorosos:'Dolorosos', gloriosos:'Gloriosos' };
  var DIAS  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
               'agosto','septiembre','octubre','noviembre','diciembre'];

  var usr = null, plan = 'free';
  var nivelId = null, nivel = 1, cuaderno = 1;
  var prog = {}, data = null;
  var seleccion = null;

  var $app = document.getElementById('app');

  // ── tema ────────────────────────────────────────────────────────
  function aplicarTema(t){
    document.body.classList.toggle('light', t === 'light');
    document.body.classList.toggle('dark',  t !== 'light');
  }
  aplicarTema(localStorage.getItem('cruzando_theme') || 'dark');
  window._toggleTema = function(){
    var t = (localStorage.getItem('cruzando_theme') === 'light') ? 'dark' : 'light';
    localStorage.setItem('cruzando_theme', t);
    aplicarTema(t);
  };

  /* Navegación: el mismo gesto que el resto de la app —el muelle del icono y
     el acorde de tres notas— para que Hoy no se sienta una pantalla aparte.
     Van en window porque la barra los llama desde el onclick del HTML. */
  window._navChord = 0;
  function playNavChord(){
    var CHORDS = [[523,659,784],[659,784,988],[784,988,1175],[587,740,880]];
    try {
      var ac = new (window.AudioContext || window.webkitAudioContext)();
      var now = ac.currentTime;
      var notes = CHORDS[window._navChord % 4]; window._navChord++;
      var master = ac.createGain();
      master.gain.setValueAtTime(0, now);
      master.gain.linearRampToValueAtTime(0.07, now + 0.018);
      master.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      master.connect(ac.destination);
      notes.forEach(function(freq, j){
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = j === 0 ? 'sine' : 'triangle';
        o.frequency.value = freq; g.gain.value = j === 0 ? 0.8 : 0.5;
        o.connect(g); g.connect(master);
        o.start(now + j * 0.012); o.stop(now + 0.45);
      });
    } catch(e) {}
  }
  window.navTap = function(el){
    if (window.CZSound) CZSound('navTap');
    playNavChord();
    el.classList.remove('tapped');
    void el.offsetWidth;
    el.classList.add('tapped');
    setTimeout(function(){ el.classList.remove('tapped'); }, 400);
  };
  window.goTo = function(pg){ location.href = base() + pg; };

  function base(){
    return location.origin + location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
  }
  function fechaLarga(f){
    return DIAS[f.getDay()] + ' ' + f.getDate() + ' de ' + MESES[f.getMonth()];
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function pantalla(titulo, texto, btnTxt, btnFn){
    $app.innerHTML =
      '<div class="centro"><h2>' + esc(titulo) + '</h2><p>' + esc(texto) + '</p>' +
      (btnTxt ? '<button class="btn btn-2" id="cbtn" style="max-width:260px">' + esc(btnTxt) + '</button>' : '') +
      '</div>';
    if (btnTxt) document.getElementById('cbtn').onclick = btnFn;
  }

  /* La frontera la calcula niveles.js —con su clave versionada y su catch que
     distingue un fallo de código de una caída de red—. Aquí solo va la E/S,
     que en esta página es el SDK compat. */
  async function calcularFrontera(uid){
    var r = await Niveles.calcularFrontera(async function(id){
      var snap = await _db.collection('users').doc(uid)
                          .collection('progress').doc(id).get();
      return snap.exists ? snap.data() : null;
    });
    if (r.degradado) window._frontierDegradado = r.degradado;
    return r.frontera || Niveles.ORDEN[0];
  }
  /* Aqui vivia marcador(), que leia `cruzando_current_nivel`. Se retiro: ver
     el aviso de arrancar(). Hoy ya no LEE ni ESCRIBE el marcador — quien lo
     mueve es el reproductor al que se entrega la sesion (audio y rezar lo
     escriben al fijar Nivel), asi que el mapa sigue el paso de lo que se reza
     y no de lo que se mira. */

  /* Una vuelta nueva empieza cuando los cuatro bloques están a cero: es el
     instante en que rosario.js acaba de cerrar el último. De esa fecha sale
     qué días han pasado ya, y por tanto qué bloques siguen abiertos. */
  async function asegurarVueltaDesde(){
    var todosCero = Dia.BLOQUES.every(function(b){ return Dia.hechos(prog, b) === 0; });
    var hoyK = Dia.clave();
    if (todosCero && prog.vueltaDesde !== hoyK) {
      prog.vueltaDesde = hoyK;
      try {
        await _db.collection('users').doc(usr.uid).collection('progress').doc(nivelId)
                 .set({ vueltaDesde: hoyK }, { merge:true });
      } catch(e){ console.warn('[hoy] vueltaDesde:', e); }
    } else if (!prog.vueltaDesde) {
      prog.vueltaDesde = hoyK;
      try {
        await _db.collection('users').doc(usr.uid).collection('progress').doc(nivelId)
                 .set({ vueltaDesde: hoyK }, { merge:true });
      } catch(e){}
    }
  }

  /* El compromiso del día: elegido un bloque, ese es el Rosario de hoy. Se
     escribe ANTES de navegar, para que volver a Hoy tras la sesión encuentre
     el día ya decidido. Local primero: una elección no se pierde por red. */
  async function fijarBloqueDelDia(bloque){
    var d = { fecha: Dia.clave(), bloque: bloque };
    prog.diaBloque = d;
    try { localStorage.setItem('cruzando_dia_' + nivelId, JSON.stringify(d)); } catch(e){}
    try {
      await _db.collection('users').doc(usr.uid).collection('progress').doc(nivelId)
               .set({ diaBloque: d }, { merge:true });
    } catch(e){ console.warn('[hoy] diaBloque:', e); }
  }

  // ── render ──────────────────────────────────────────────────────
  function render(){
    var hoy = new Date();
    var st  = Dia.estadoDelNivel(prog, hoy);
    var disp = st.disponibles;

    var foco = (seleccion && disp.indexOf(seleccion) >= 0) ? seleccion : disp[0];
    if (!foco) foco = st.hoyBloque;

    var acc     = COLORES_BLOQUE[foco];
    var next    = Dia.primerPendiente(prog, foco);
    var nMis    = BASE_M[foco] + next;
    var hFoco   = Dia.hechos(prog, foco);
    var hoyHecho= Dia.hechos(prog, st.hoyBloque) === 5 && !st.completo && !st.diaGastado;
    var mis     = (data && data.misterios && data.misterios[foco]) || [];
    var subt    = (data && data.subtitulos_bloque && data.subtitulos_bloque[foco]) || '';
    var h = '';

    h += '<div class="hero"><img src="' + IMG_BASE + 'P_' + nivel + '_' + cuaderno + '_' + nMis +
         '.webp" alt="" onerror="this.style.display=\'none\'"><div class="fade"></div></div>';

    h += '<p class="fecha">' + fechaLarga(hoy) + '</p>';
    h += '<h1 class="bloque-tit">' + esc(NOMBRES_BLOQUE[foco]) + '</h1>';
    h += '<p class="bloque-sub">' + esc(subt) + '</p>';

    if (st.completo && !st.diaGastado) {
      h += '<div class="completo"><div class="tick">&#10003;</div><div class="big">Nivel completo</div></div>';
    } else if (hoyHecho) {
      h += '<div class="pill" style="--pc:' + COLORES_BLOQUE[st.hoyBloque] +
           ';--pc-rgb:' + rgbBloque(st.hoyBloque) + '">' +
           '<span class="tick">&#10003;</span><span class="pt">' +
           esc(NOMBRES_BLOQUE[st.hoyBloque]) + ' completados</span></div>';
    } else if (hFoco > 0 && !st.completo) {
      h += '<p class="aviso">Llevas <b>' + hFoco + ' de 5</b>.</p>';
    } else if (st.diaGastado) {
      h += '<p class="aviso">Es tu Rosario de hoy.</p>';
    }

    if (disp.length > 1 && !st.diaGastado) {
      h += '<div class="elige"><p>' +
           (hoyHecho ? 'Puedes rezar lo que quedó pendiente.' : 'Hoy puedes rezar:') +
           '</p><div class="chips">';
      disp.forEach(function(b){
        h += '<button class="chip" type="button" data-sel="' + b + '" style="--cc:' +
             COLORES_BLOQUE[b] + '" aria-pressed="' + (b === foco) + '">' + CORTO[b] + '</button>';
      });
      h += '</div></div>';
    }

    h += '<ul class="cinco">';
    for (var i = 0; i < 5; i++) {
      var done   = st.bloques[foco][i] === 'rezado' || st.bloques[foco][i] === 'vueltahoy';
      var esNext = (i === next) && (!done || st.completo);
      h += '<li class="' + (done ? 'done ' : '') + (esNext ? 'next' : '') + '">' +
           '<span class="n">' + (BASE_M[foco] + i) + '</span>' +
           '<span class="t">' + esc((mis[i] && mis[i].titulo) || ('Misterio ' + (BASE_M[foco]+i))) + '</span>' +
           (done ? '<span class="check">&#10003;</span>'
                 : (esNext ? '<span class="flecha">&#9654;</span>' : '<span></span>')) + '</li>';
    }
    h += '</ul>';

    var lbl;
    if (st.completo)            lbl = 'Rezar de nuevo';
    else if (hFoco > 0)         lbl = 'Continuar &middot; Misterio ' + nMis;
    else if (foco === st.hoyBloque) lbl = 'Rezar los Misterios de hoy';
    else                        lbl = 'Rezar los Misterios ' + CORTO[foco];

    h += '<div class="acciones">';
    h += '<button class="btn btn-1" id="ir-rezar" type="button">' + lbl + '</button>';
    h += '<button class="btn btn-2" id="ir-2" type="button">Orar, Misterio a Misterio</button>';
    h += '</div>';

    if (st.diaGastado) {
      var otros = Dia.BLOQUES.filter(function(b){
        return b !== foco && Dia.hechos(prog, b) < 5;
      }).map(function(b){ return CORTO[b]; });
      if (otros.length) {
        h += '<div class="manana"><b>' + otros.join(' &middot; ') +
             '</b>Disponibles mañana. Un Rosario cada día.</div>';
      }
    }

    h += tiraDe(function(b, j){ return st.bloques[b][j]; });

    $app.innerHTML = h;
    $app.style.setProperty('--acento', acc);
    $app.style.setProperty('--acento-rgb', rgbBloque(foco));

    Array.prototype.forEach.call($app.querySelectorAll('.chip'), function(c){
      c.onclick = function(){ seleccion = c.getAttribute('data-sel'); render(); };
    });

    document.getElementById('ir-rezar').onclick = async function(){
      await fijarBloqueDelDia(foco);
      location.href = 'rezar.html?c=' + nivelId + '&b=' + foco + '&m=' + nMis + '&hoy=1';
    };

    document.getElementById('ir-2').onclick = async function(){
      await fijarBloqueDelDia(foco);
      location.href = 'audio.html?nivel=' + nivel + '&cuaderno=' + cuaderno + '&misterio=' + nMis + '&hoy=1';
    };

    cablearTira(function(b, j){
      var e = st.bloques[b][j];
      if (e === 'rezado' || e === 'vueltahoy')    return { cls:'ok',  sym:'&#10003;', txt:'Ya lo rezaste' };
      if (e === 'espera')                         return { cls:'off', sym:'', txt:'Disponible ' + Dia.proximoDia(b, hoy) };
      if (st.diaGastado && b !== st.elegido)      return { cls:'off', sym:'', txt:'Disponible mañana' };
      return { cls:'on', sym:'', txt:'Disponible hoy' };
    });
  }

  /* ══════════════════  EL CAMINO DEL FREE  ═════════════════════════
     Un Misterio al dia, el suyo, en modo audio. No hay bloque del dia, no hay
     eleccion y no hay Rosario que completar: hay un paso, y manana el siguiente.

     La fuente es `freeProgress/current`, el MISMO documento que audio.html lee
     al arrancar. Por eso Hoy no puede mandarle a un Misterio que audio le vaya
     a rechazar: los dos leen el mismo sitio, y audio redirige si no coinciden.

     Y no se pasa `hoy=1`: esa bandera existia para decir "esta sesion NO
     progresa". La del free si progresa —es su camino—, asi que su marcador
     tiene que moverse como el de cualquiera. */
  var freeProg = null;

  async function arrancarFree(){
    var d = null;
    try {
      var fs = await _db.collection('users').doc(usr.uid)
                        .collection('freeProgress').doc('current').get();
      if (fs.exists) d = fs.data();
    } catch(e){
      /* Sin red se cae al espejo local, que audio tambien mantiene. */
      try { d = JSON.parse(localStorage.getItem('cruzando_free_prog') || 'null'); } catch(_){}
    }
    /* El reinicio de medianoche es una sola regla y vive en plan-utils. */
    freeProg = window.normalizarFreeProgress
             ? normalizarFreeProgress(d)
             : (d || { nivelId:'0101', misterio:1, completedToday:false, fechaHoy:'' });

    nivelId = freeProg.nivelId || '0101';
    if (!Niveles.publicado(nivelId)) nivelId = '0101';
    nivel    = parseInt(nivelId.slice(0,2), 10) || 1;
    cuaderno = parseInt(nivelId.slice(2,4), 10) || 1;

    try {
      var r = await fetch(base() + 'data/' + nivelId + '.json');
      if (r.ok) data = await r.json();
    } catch(e){}
    if (!data) {
      pantalla('No se pudo cargar el Nivel',
        'Revisa tu conexión y vuelve a intentarlo.',
        'Reintentar', function(){ location.reload(); });
      return;
    }

    /* La tira se pinta con `progress`, que es lo que los reproductores escriben
       de verdad —no con "todo lo anterior a mi posicion"—. Asi dice la verdad
       tambien para quien fue premium y bajo de plan: lo que rezo sigue rezado. */
    try {
      var ps = await _db.collection('users').doc(usr.uid)
                        .collection('progress').doc(nivelId).get();
      prog = ps.exists ? ps.data() : {};
    } catch(e){ prog = {}; }

    renderFree();
  }

  function renderFree(){
    var hoy   = new Date();
    var nMis  = Math.min(20, Math.max(1, freeProg.misterio || 1));
    var foco  = ['gozosos','luminosos','dolorosos','gloriosos'][Math.floor((nMis - 1) / 5)];
    var i     = (nMis - 1) % 5;
    var hecho = freeProg.completedToday;
    var acc   = COLORES_BLOQUE[foco];
    var mis   = (data && data.misterios && data.misterios[foco]) || [];
    var subt  = (data && data.subtitulos_bloque && data.subtitulos_bloque[foco]) || '';
    var tit   = (mis[i] && mis[i].titulo) || ('Misterio ' + nMis);
    var h = '';

    h += '<div class="hero"><img src="' + IMG_BASE + 'P_' + nivel + '_' + cuaderno + '_' + nMis +
         '.webp" alt="" onerror="this.style.display=\'none\'"><div class="fade"></div></div>';

    h += '<p class="fecha">' + fechaLarga(hoy) + '</p>';
    h += '<h1 class="bloque-tit">' + esc(NOMBRES_BLOQUE[foco]) + '</h1>';
    h += '<p class="bloque-sub">' + esc(subt) + '</p>';

    /* El reconocimiento va ANTES de la tarjeta: lo primero que hay que saber al
       volver es que el dia esta rezado. Despues, lo que viene. */
    if (hecho) {
      h += '<div class="pill" style="--pc:' + acc + ';--pc-rgb:' + rgbBloque(foco) + '">' +
           '<span class="tick">&#10003;</span><span class="pt">Ya rezaste hoy</span></div>';
    }

    h += '<div class="solo"><span class="solo-n">' +
         (hecho ? 'Mañana &middot; Misterio ' + nMis + ' de 20'
                : 'Misterio ' + nMis + ' de 20') + '</span>' +
         '<h2 class="solo-t">' + esc(tit) + '</h2></div>';

    h += '<div class="acciones">';
    h += hecho
       ? '<button class="btn btn-2" id="ir-camino" type="button">Ver mi camino</button>'
       : '<button class="btn btn-1" id="ir-audio" type="button">Orar este Misterio</button>';
    h += '</div>';

    /* La cuenta que apunta el puntero late si aun se puede rezar (`hoy`) y se
       queda encendida en suave si el dia ya se cerro (`abierto`): late lo que
       pide accion, no lo que solo espera. */
    h += tiraDe(function(b, j){
      if (hechoEn(b, j)) return 'rezado';
      if (b === foco && j === i) return hecho ? 'abierto' : 'hoy';
      return '';
    });

    $app.innerHTML = h;
    $app.style.setProperty('--acento', acc);
    $app.style.setProperty('--acento-rgb', rgbBloque(foco));

    var bA = document.getElementById('ir-audio');
    if (bA) bA.onclick = function(){
      location.href = 'audio.html?nivel=' + nivel + '&cuaderno=' + cuaderno + '&misterio=' + nMis;
    };
    var bC = document.getElementById('ir-camino');
    if (bC) bC.onclick = function(){ goTo('crecer.html'); };

    cablearTira(function(b, j){
      if (hechoEn(b, j))                  return { cls:'ok',  sym:'&#10003;', txt:'Ya lo rezaste' };
      if (b === foco && j === i)          return hecho
        ? { cls:'off', sym:'', txt:'Te espera mañana' }
        : { cls:'on',  sym:'', txt:'Es tu Misterio de hoy' };
      return { cls:'off', sym:'', txt:'Aún no' };
    });
  }

  /* Lo REZADO de verdad, del documento que escriben los reproductores. */
  function hechoEn(bloque, j){
    var a = (prog && prog.progress && prog.progress[bloque]) || [];
    return !!a[j];
  }

  /* La tira de veinte es la misma pieza en los dos modelos: cambia el estado de
     cada cuenta, no el dibujo. Quien la pinta pasa la funcion que decide. */
  function tiraDe(estadoDe){
    var vueltas = (window.Rosario ? Rosario.vueltas(prog) : 0);
    var h = '<div class="nivel"><div class="niv-cab">' +
            '<span class="niv-nom">' + esc(Niveles.nombre(nivelId) || nivelId) + '</span>' +
            '<span class="niv-vuelta">' + (vueltas > 0 ? (vueltas + 1) + 'ª vuelta' : '') + '</span></div>';
    h += '<div class="tira">';
    Dia.BLOQUES.forEach(function(b){
      var titB = (data && data.misterios && data.misterios[b]) || [];
      h += '<div class="grupo">';
      for (var j = 0; j < 5; j++) {
        h += '<button class="bead ' + estadoDe(b, j) + '" type="button" style="--bc:' +
             COLORES_BLOQUE[b] + ';--bc-rgb:' + rgbBloque(b) + '" data-b="' + b + '" data-i="' + j + '" ' +
             'aria-label="Misterio ' + (BASE_M[b]+j) + ', ' +
             esc((titB[j] && titB[j].titulo) || '') + '"></button>';
      }
      h += '</div>';
    });
    return h + '</div><p class="pie-bead" id="pie"><span class="tt">&nbsp;</span></p></div>';
  }

  /* Las cuentas NO navegan: escriben su nombre debajo y nada mas. Si una llevara
     a rezar, la tira seria el mapa por accidente. */
  function cablearTira(leyendaDe){
    Array.prototype.forEach.call($app.querySelectorAll('.bead'), function(bd){
      bd.onclick = function(){
        var b = bd.getAttribute('data-b'), j = +bd.getAttribute('data-i');
        var titB = (data && data.misterios && data.misterios[b]) || [];
        var e = leyendaDe(b, j);
        document.getElementById('pie').innerHTML =
          '<span class="tt">' + esc((titB[j] && titB[j].titulo) || ('Misterio ' + (BASE_M[b]+j))) + '</span>' +
          '<span class="est" style="--sc:' + COLORES_BLOQUE[b] +
          ';--sc-rgb:' + rgbBloque(b) + '">' +
          '<span class="sym ' + e.cls + '">' + e.sym + '</span>' + e.txt + '</span>';
      };
    });
  }

  /* Aqui vivia irAlSiguienteNivel(), detras del boton «Ir al siguiente Nivel».
     Se retiro por DOS motivos independientes, y cualquiera de los dos bastaba:

     · Era una puerta trasera. Saltaba de Nivel escribiendo el marcador, es decir
       ponia al usuario por delante de su propio progreso. En esta pantalla el
       Nivel se DERIVA de la frontera, que ya avanza sola en cuanto se cierran
       los veinte: no hay nada que pedir a mano.
     · Y era codigo muerto. Solo salia con `st.completo`, que es
       `Dia.nivelCompleto` leyendo `vuelta` —los cuatro bloques con sus cinco a
       la vez—; pero `rosario.js` pone `vuelta[bloque]` a ceros en el mismo
       instante en que la quinta decena cierra el Rosario (marcar(), «empieza
       otra vuelta»). Rezando tres vueltas enteras con el motor real, `hechos()`
       nunca pasa de 4 y `nivelCompleto()` no es cierto ni una sola vez.

     ⚠ Lo segundo alcanza tambien a `hoyHecho` y al aviso «Nivel completo» de
        render(), que quedan igual de inalcanzables. No se tocaron aqui porque
        eso es el modelo de la pantalla, no una puerta: pide decision aparte. */

  /* ══════════════  EL ARRANQUE, EN DOS FASES  ═══════════════
     La FASE 1 pinta desde localStorage, sin tocar la red —lo que index y crecer
     hacen desde siempre y lo que a esta pantalla le faltaba—. Sin ella la cadena
     entera (doc de usuario → frontera → JSON → progreso → escritura) corre EN
     SERIE con el spinner en pantalla; y en WebKit, donde Firestore degrada a
     peticiones sueltas en vez de un canal multiplexado, cada eslabón cuesta un
     viaje entero. De ahí salían los 30-45 s del iPhone que en Chrome no se ven.

     La FASE 2 confirma contra Firestore y solo repinta si algo cambió. */

  function progresoCacheado(id){
    try { return JSON.parse(localStorage.getItem('cruzando_progress_' + id) || 'null'); }
    catch(e){ return null; }
  }
  function guardarProgresoCache(id, d){
    try { localStorage.setItem('cruzando_progress_' + id, JSON.stringify(d || {})); }
    catch(e){}
  }

  /* Un Nivel sin publicar no se le sirve a nadie salvo al developer, que es
     quien los está construyendo. Se aplica igual en las dos fases. */
  function ajustarPublicado(id, pl){
    if (!id) return id;
    if (Niveles.publicado(id) || pl === 'developer') return id;
    var prev = Niveles.ORDEN[Math.max(0, Niveles.ORDEN.indexOf(id) - 1)];
    return Niveles.publicado(prev) ? prev : '0101';
  }

  function fijarNivel(id){
    nivelId  = id;
    nivel    = parseInt(id.slice(0,2), 10) || 1;
    cuaderno = parseInt(id.slice(2,4), 10) || 1;
  }

  async function cargarData(id){
    try {
      var r = await fetch(base() + 'data/' + id + '.json');
      if (r.ok) return await r.json();
    } catch(e){}
    return null;
  }

  // Espejo local de la elección del día, por si la red falló al fijarla.
  function aplicarDiaLocal(){
    try {
      var loc = JSON.parse(localStorage.getItem('cruzando_dia_' + nivelId) || 'null');
      if (loc && loc.fecha === Dia.clave() && !Dia.elegidoHoy(prog)) prog.diaBloque = loc;
    } catch(e){}
  }

  /* La huella de lo último pintado. La FASE 2 casi siempre confirma lo que la
     FASE 1 ya enseñó: repintar entonces solo borraría el chip que el usuario
     acaba de tocar y el nombre del Misterio que está leyendo al pie. */
  var _pintado = null;

  function pintar(){
    var huella = nivelId + '|' + JSON.stringify(prog || {});
    if (huella === _pintado) return false;
    _pintado = huella;
    render();
    return true;
  }

  /* La frontera solo se recalcula cuando puede haber cambiado: cuando no hay
     copia en este aparato, o cuando una sesión dejó el caché sucio. Es la misma
     puerta que la FASE 2 de crecer. Son hasta 28 lecturas EN SERIE.

     ⚠ El `dirty` se LEE y no se limpia. Quien lo consume es crecer, y limpiarlo
     aquí le dejaría el mapa pintado con el progreso viejo. */
  async function fronteraDelDia(){
    var cache = Niveles.fronteraCacheada();
    var sucio = false;
    try { sucio = localStorage.getItem('cruzando_progress_cache_dirty') === 'true'; }
    catch(e){}
    if (cache && !sucio) return cache;
    return await calcularFrontera(usr.uid);
  }

  /* ── FASE 1: pintar sin red ────────────────────────────────
     Solo si están las tres piezas y el plan cacheado NO es free: el free tiene
     OTRO modelo de pantalla, y pintarle el de premium para corregirlo un segundo
     después sería peor que el spinner. El único `await` es el JSON del Nivel, que
     es un fichero estático del propio origen, no una lectura de Firestore. */
  async function fase1(){
    var pl = window.effectivePlan ? effectivePlan() : null;
    if (!pl || pl === 'free') return false;
    var id = ajustarPublicado(Niveles.fronteraCacheada(), pl);
    if (!id) return false;
    var pc = progresoCacheado(id);
    if (!pc) return false;
    var d = await cargarData(id);
    if (!d) return false;
    plan = pl;
    data = d;
    prog = pc;
    fijarNivel(id);
    aplicarDiaLocal();
    pintar();
    return true;
  }

  // ── FASE 2: confirmar contra Firestore ─────────────────────
  async function arrancar(){
    var yaPintado = await fase1();
    var idPintado = yaPintado ? nivelId : null;

    var ud = {};
    try {
      var us = await _db.collection('users').doc(usr.uid).get();
      ud = us.exists ? us.data() : {};
    } catch(e){}
    window.currentPlan = window.resolvePlan ? resolvePlan(ud) : 'free';
    plan = window.effectivePlan ? effectivePlan() : window.currentPlan;

    /* Aqui se parte en dos. El free no pasa de esta linea: su Nivel no sale de
       la frontera ni del marcador, sino de freeProgress —y no hay nada que
       elegir, asi que tampoco hay estado del dia que calcular. */
    if (plan === 'free') { await arrancarFree(); return; }

    /* ⚠ EL MARCADOR NO MANDA AQUÍ, y esa es la diferencia con crecer.
       `cruzando_current_nivel` significa «dónde estoy MIRANDO»: el selector de
       esferas lo escribe por el mero hecho de hojear (crecer.html, selectNivel).
       Hoy es la pantalla del AVANCE —repasar lo ya recorrido es lo que hace el
       mapa—, y el avance es exactamente lo que dice la frontera: el primer Nivel
       cuyo `progress` no está completo. Con el marcador de por medio, hojear el
       mapa y pulsar Hoy servía el Rosario de un Nivel que no tocaba. */
    /* Y tampoco se acepta un `?c=` en la URL. Era la otra puerta a lo mismo:
       decirle a Hoy por dónde ir. El Nivel de esta pantalla se DERIVA, siempre;
       para entrar a un Nivel concreto está el mapa, que es donde se repasa. */
    var id = Dia.nivelDiario(plan, {
      frontera: await fronteraDelDia(), orden: Niveles.ORDEN
    });

    /* Red de seguridad: para premium nivelDiario devuelve siempre algo —frontera
       o el primero del itinerario—, asi que esto solo salta si alguien llega
       aqui con un plan que no tiene camino resuelto. */
    if (!id) {
      pantalla('Todavía no hay Nivel que rezar',
        'Vuelve al camino y entra por el Misterio que estés cruzando.',
        'Ir al camino', function(){ location.href = 'crecer.html'; });
      return;
    }
    id = ajustarPublicado(id, plan);

    if (id !== idPintado) {
      var d2 = await cargarData(id);
      if (d2) { data = d2; fijarNivel(id); }
      else if (!yaPintado) {
        pantalla('No se pudo cargar el Nivel',
          'Revisa tu conexión y vuelve a intentarlo.',
          'Reintentar', function(){ location.reload(); });
        return;
      }
      /* Si ya hay algo en pantalla y el JSON del Nivel nuevo no baja, se
         conserva lo pintado: cambiarlo por un error sería un retroceso. */
    }

    try {
      var ps = await _db.collection('users').doc(usr.uid)
                        .collection('progress').doc(nivelId).get();
      prog = ps.exists ? ps.data() : {};
      guardarProgresoCache(nivelId, prog);
    } catch(e){ if (!yaPintado) prog = {}; }

    aplicarDiaLocal();

    /* La escritura de `vueltaDesde` ya NO bloquea el pintado. Su única parte
       síncrona —dejar la fecha en `prog`— corre antes del primer `await` de la
       función, así que render() ve el estado bueno y el `set()` viaja por detrás.
       Un `set()` de Firestore solo resuelve con el acuse del servidor: con la red
       floja, esperarlo dejaba la pantalla en el spinner sin necesidad. */
    asegurarVueltaDesde();
    pintar();
  }

  _auth.onAuthStateChanged(function(user){
    if (!user) { location.replace('index.html'); return; }
    usr = user;
    window.currentUser = user;
    arrancar().catch(function(e){
      console.error('[hoy]', e);
      pantalla('Algo salió mal', 'Vuelve a intentarlo en un momento.',
               'Reintentar', function(){ location.reload(); });
    });
  });
}());
</script>
<script src="sounds.js"></script>
</body>
</html>
