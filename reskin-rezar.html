<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CruzAndo · reskin REZAR (prueba de layout)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Crimson+Pro:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==== PALETA REAL DE REZAR.HTML (tema claro por defecto) ==== */
:root{
  --bg:#E6DED3;
  --bg-rgb:230,222,211;
  --card:#FFFCF7;
  --border:#D9D1C7;
  --text:#2B2622;
  --text-soft:#6B6259;
  --text-dim:#9B9389;
  --sec-bg:#EDE5D8;
  --lvl-bold:#02BBE0;
  --goz-color:#E8A0A0;        /* rosa gozoso de rezar */
  --rosa:#E8A0A0;
  --brand:#02BBE0;
  /* barritas apagadas por tema (patrón heredado del reskin de audio) */
  --seg-idle:rgba(43,38,34,0.20);
}
/* tema oscuro (para probar el toggle) */
.dark{
  --bg:#0A2028;
  --bg-rgb:10,32,40;
  --card:#0F2A33;
  --border:rgba(67,221,248,0.15);
  --text:#E6DED3;
  --text-soft:#B8A898;
  --text-dim:#786858;
  --sec-bg:#0c242c;
  --seg-idle:rgba(255,255,255,0.28);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:#c9bfae;
  min-height:100vh;display:flex;gap:24px;padding:24px;flex-wrap:wrap;
  align-items:flex-start;justify-content:center;
}

/* ==== PANEL DE PRUEBAS ==== */
.panel{width:300px;background:#12242b;color:#E6DED3;border-radius:16px;padding:20px;position:sticky;top:24px}
.panel h1{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;margin-bottom:4px;color:#fff}
.panel .hint{font-size:12px;color:#8a9;margin-bottom:18px;line-height:1.5}
.ctrl{margin-bottom:18px}
.ctrl label{display:block;font-size:12px;font-weight:600;color:#B8A898;margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px}
.ctrl .row{display:flex;align-items:center;gap:10px}
.ctrl input[type=range]{flex:1;accent-color:#E8A0A0}
.ctrl .val{font-size:13px;font-weight:600;color:#43DDF8;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.ctrl input[type=file]{font-size:12px;color:#B8A898;width:100%}
.ctrl input[type=text]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #345;background:#0a1418;color:#E6DED3;font-size:13px;font-family:inherit}
.ctrl textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #345;background:#0a1418;color:#E6DED3;font-size:13px;font-family:inherit;resize:vertical;min-height:44px}
.divider{height:1px;background:#345;margin:18px 0}
.toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#B8A898;margin-bottom:10px}
.toggle-row button{padding:6px 12px;border-radius:8px;border:1px solid #345;background:transparent;color:#E6DED3;font-size:12px;cursor:pointer;font-family:inherit}
.toggle-row button.on{background:#02BBE0;border-color:#02BBE0;color:#00232b}
.copy-btn{width:100%;padding:10px;border-radius:8px;border:1px solid #43DDF8;background:transparent;color:#43DDF8;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px}
.readout{font-size:11px;color:#8a9;margin-top:8px;line-height:1.5}

/* ==== EL TELÉFONO (pantalla de rezar reubicada) ==== */
.phone{
  width:390px;height:820px;max-height:90vh;border-radius:36px;overflow:hidden;
  position:relative;background:var(--bg);color:var(--text);
  box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;
  border:1px solid var(--border);transition:background .3s;
}

/* --- TOPBAR: BGM+tema izquierda · 7 barritas centro · ajustes derecha --- */
.topbar{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 0;
  position:relative;z-index:5;
}
.topbar-l,.topbar-r{display:flex;gap:8px;align-items:center}
.ic-btn{
  width:40px;height:40px;border-radius:50%;
  background:rgba(0,0,0,.20);backdrop-filter:blur(6px);
  border:2px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;
}
.ic-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-btn.strike{position:relative;opacity:.7}
.ic-btn.strike::after{content:'';position:absolute;left:9px;right:9px;top:50%;height:2px;background:currentColor;transform:rotate(-18deg);border-radius:2px}
/* 7 barritas de sección, flotando al centro (como en audio) */
.sec-bars{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 27px);
  left:50%;transform:translateX(-50%);
  display:flex;gap:4px;align-items:center;z-index:4;width:150px;justify-content:center;
}
.sec-bar{flex:1;max-width:18px;min-width:9px;height:3px;border-radius:2px;background:var(--seg-idle);transition:background .3s}
.sec-bar.active{background:var(--rosa)}
.sec-bar.done{background:var(--rosa)}

/* --- HERO --- */
.hero{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 22px 10px;overflow:hidden;margin-top:-54px}
.hero-img{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.hero-img.placeholder{background:linear-gradient(150deg,#b5643c,#7a3a2a 50%,#3a1e16)}
.hero-fade{position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(to top,var(--bg) 10%,transparent)}
.hero-kicker{position:relative;font-size:.72rem;letter-spacing:2.5px;color:var(--goz-color);font-weight:700;margin-bottom:5px;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.hero-titulo{position:relative;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.65rem;font-weight:600;color:#fff;line-height:1.15;margin-bottom:4px;text-shadow:0 1px 3px rgba(0,0,0,.9),0 4px 16px rgba(0,0,0,.85),0 8px 32px rgba(0,0,0,.7)}
.hero-subtitulo{position:relative;font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;font-style:italic;color:rgba(255,255,255,.75);line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.9),0 3px 12px rgba(0,0,0,.8)}

/* --- BARRA DE HERRAMIENTAS: 5 botones, SIN hilo --- */
.tools-bar{display:flex;justify-content:center;align-items:center;gap:14px;padding:12px 12px calc(env(safe-area-inset-bottom,8px) + 16px);background:var(--sec-bg);transition:background .3s}
.tool-btn{width:48px;height:48px;border-radius:50%;border:3px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-soft);cursor:pointer}
.tool-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool-btn.play{width:60px;height:60px;background:var(--rosa);border-color:var(--rosa)}
.tool-btn.play svg{width:26px;height:26px;fill:#fff;stroke:none}
</style>
</head>
<body>

<!-- ===== PANEL DE PRUEBAS ===== -->
<div class="panel">
  <h1>reskin · rezar</h1>
  <p class="hint">Prototipo para rezar.html. 7 barritas de sección (demo), 5 botones sin hilo. Ajusta imágenes y tamaños; prueba el tema claro/oscuro.</p>

  <div class="ctrl"><label>Imagen de hero</label><input type="file" id="heroFile" accept="image/*"></div>
  <div class="divider"></div>
  <div class="ctrl"><label>Tamaño del título</label><div class="row"><input type="range" id="ttSize" min="1.2" max="3" step="0.05" value="1.65"><span class="val" id="ttVal">1.65rem</span></div></div>
  <div class="ctrl"><label>Tamaño del subtítulo</label><div class="row"><input type="range" id="subSize" min="14" max="40" step="1" value="23"><span class="val" id="subVal">23px</span></div></div>
  <div class="divider"></div>
  <div class="ctrl"><label>Título</label><input type="text" id="ttText" value="La Anunciación"></div>
  <div class="ctrl"><label>Subtítulo</label><textarea id="subText">Ser humano es ser vulnerable</textarea></div>
  <div class="ctrl"><label>Kicker</label><input type="text" id="kickText" value="MISTERIOS GOZOSOS"></div>
  <div class="divider"></div>
  <div class="ctrl"><label>Sección activa (de 7)</label><div class="row"><input type="range" id="secActive" min="0" max="6" step="1" value="0"><span class="val" id="secVal">Inicio</span></div></div>
  <div class="toggle-row"><span>Tema</span><button id="themeToggle">CLARO</button></div>
  <div class="divider"></div>
  <button class="copy-btn" id="copyBtn">Copiar valores CSS</button>
  <div class="readout" id="readout">título: 1.65rem · subtítulo: 23px</div>
</div>

<!-- ===== EL TELÉFONO ===== -->
<div class="phone" id="phone">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-l">
      <button class="ic-btn strike" aria-label="Música de fondo"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
      <button class="ic-btn" aria-label="Tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></button>
    </div>
    <div class="sec-bars" id="secBars" aria-label="Progreso: Inicio, Misterios 1 a 5, Conclusión"></div>
    <div class="topbar-r">
      <button class="ic-btn" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </div>
  <!-- HERO -->
  <div class="hero">
    <div class="hero-img placeholder" id="heroImg"></div>
    <div class="hero-fade"></div>
    <div class="hero-kicker" id="heroKicker">MISTERIOS GOZOSOS</div>
    <div class="hero-titulo" id="heroTitulo">La Anunciación</div>
    <div class="hero-subtitulo" id="heroSubtitulo">Ser humano es ser vulnerable</div>
  </div>
  <!-- BARRA DE HERRAMIENTAS: 5 botones sin hilo -->
  <div class="tools-bar">
    <button class="tool-btn" aria-label="Biblia"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></button>
    <button class="tool-btn" aria-label="Contemplar"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="tool-btn play" aria-label="Reproducir"><svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg></button>
    <button class="tool-btn" aria-label="Escribir"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
    <button class="tool-btn" aria-label="Contar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</div>

<script>
var $=function(id){return document.getElementById(id);};
var SEC_NAMES=['Inicio','Misterio 1','Misterio 2','Misterio 3','Misterio 4','Misterio 5','Conclusión'];

/* imagen */
$('heroFile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var u=URL.createObjectURL(f);var img=$('heroImg');img.classList.remove('placeholder');img.style.backgroundImage='url('+u+')';});
/* tamaños */
$('ttSize').addEventListener('input',function(e){var v=parseFloat(e.target.value).toFixed(2);$('heroTitulo').style.fontSize=v+'rem';$('ttVal').textContent=v+'rem';readout();});
$('subSize').addEventListener('input',function(e){var v=parseInt(e.target.value,10);$('heroSubtitulo').style.fontSize=v+'px';$('subVal').textContent=v+'px';readout();});
/* textos */
$('ttText').addEventListener('input',function(e){$('heroTitulo').textContent=e.target.value;});
$('subText').addEventListener('input',function(e){$('heroSubtitulo').textContent=e.target.value;});
$('kickText').addEventListener('input',function(e){$('heroKicker').textContent=e.target.value;});
/* 7 barritas */
function renderSecs(active){
  var box=$('secBars');box.innerHTML='';
  for(var i=0;i<7;i++){
    var b=document.createElement('span');
    var c='sec-bar';
    if(i<active)c+=' done';else if(i===active)c+=' active';
    b.className=c;box.appendChild(b);
  }
}
$('secActive').addEventListener('input',function(e){var a=parseInt(e.target.value,10);$('secVal').textContent=SEC_NAMES[a];renderSecs(a);});
renderSecs(0);
/* tema */
var dark=false;
$('themeToggle').addEventListener('click',function(){
  dark=!dark;this.textContent=dark?'OSCURO':'CLARO';this.classList.toggle('on',dark);
  $('phone').classList.toggle('dark',dark);
});
/* readout + copiar */
function readout(){$('readout').textContent='título: '+$('ttVal').textContent+' · subtítulo: '+$('subVal').textContent;}
$('copyBtn').addEventListener('click',function(){
  var css='.misterio-titulo { font-size: '+$('ttVal').textContent+'; }\n.misterio-subtitulo { font-size: '+$('subVal').textContent+'; }';
  navigator.clipboard.writeText(css).then(function(){var b=$('copyBtn'),t=b.textContent;b.textContent='¡Copiado!';setTimeout(function(){b.textContent=t;},1400);}).catch(function(){$('readout').textContent=css;});
});
</script>
</body>
</html>
