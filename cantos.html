<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#1A0E04"/>
<title>Mis Cantos · CruzAndo</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & vars ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #1A0E04;
  --card:      #231508;
  --border:    rgba(255,255,255,0.09);
  --text:      #F5EDE4;
  --text-soft: #C8B8AA;
  --text-dim:  #806858;
  --orange:    #FF7A00;
  --green:     #4CAF50;
}
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
  min-height: 100vh; padding-bottom: 80px; }
body.light {
  --bg:        #E6DED3;
  --card:      #F5EDE4;
  --border:    rgba(0,0,0,0.1);
  --text:      #1A0E04;
  --text-soft: #4A3828;
  --text-dim:  #9A8878;
}

/* ── Header ── */
.main-header {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg); border-bottom: 1px solid var(--border);
  padding: 14px 18px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.h-title { font-family: 'Crimson Pro', serif; font-size: 1.1rem; font-weight: 600; color: var(--text); }
.h-sub   { font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.6px; }
.btn-icon { background: none; border: none; cursor: pointer; color: var(--text-soft);
  width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

/* ── Estado vacío ── */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 80px 32px; text-align: center; gap: 16px;
}
.empty-icon { font-size: 3rem; }
.empty-title { font-family: 'Crimson Pro', serif; font-size: 1.5rem; font-weight: 600; color: var(--text); }
.empty-desc  { font-size: 0.9rem; color: var(--text-soft); line-height: 1.6; max-width: 260px; }
.btn-orar {
  margin-top: 8px; padding: 13px 32px; border-radius: 14px;
  background: var(--orange); color: #fff; border: none;
  font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer;
}

/* ── Lista de cantos ── */
.cantos-list { padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; }

/* ── Tarjeta de canto ── */
.canto-card {
  background: var(--card); border-radius: 16px;
  border: 1px solid var(--border);
  border-left: 4px solid var(--block-color, #D4A017);
  overflow: hidden;
}
.canto-card-header { padding: 16px 16px 0; }
.canto-titulo { font-family: 'Crimson Pro', serif; font-size: 1.3rem; font-weight: 600;
  color: var(--text); margin-bottom: 3px; }
.canto-subtitulo { font-size: 0.78rem; color: var(--text-soft); font-style: italic; margin-bottom: 14px; }

/* ── Player ── */
.canto-player {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.canto-play-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--block-color, #D4A017); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: #fff;
  flex-shrink: 0; transition: opacity 0.2s;
}
.canto-play-btn:disabled { opacity: 0.35; cursor: default; }
.canto-play-btn:active:not(:disabled) { opacity: 0.8; }
.canto-player-right { flex: 1; min-width: 0; }
.canto-bar-wrap { height: 4px; background: var(--border); border-radius: 2px;
  cursor: pointer; margin-bottom: 5px; position: relative; overflow: hidden; }
.canto-bar-fill { height: 100%; background: var(--block-color, #D4A017);
  border-radius: 2px; width: 0%; transition: width 0.3s linear; }
.canto-time { font-size: 0.72rem; color: var(--text-dim); display: flex; justify-content: space-between; }

/* ── Letra ── */
.canto-letra-wrap { padding: 14px 16px 16px; }
.canto-letra {
  font-family: 'Crimson Pro', serif; font-size: 1.05rem;
  color: var(--text-soft); line-height: 1.75; white-space: pre-line;
  overflow: hidden; transition: max-height 0.4s ease;
}
.canto-letra .sep-line { color: var(--text-dim); display: block; text-align: center;
  margin: 2px 0; font-family: 'Inter', sans-serif; font-size: 0.75rem; letter-spacing: 2px; }
.canto-ver-mas {
  margin-top: 10px; background: none; border: none; cursor: pointer;
  font-size: 0.8rem; color: var(--text-dim); text-decoration: underline;
  font-family: inherit; padding: 0;
}

/* ── Nav bar ── */
.shell { padding-bottom: 72px; }
.app-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 80;
  background: var(--card); border-top: 1px solid var(--border);
  display: flex; align-items: stretch; padding: 6px 0 env(safe-area-inset-bottom, 0);
}
.app-nav-item {
  flex: 1; background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 4px 2px; color: var(--text-dim);
  font-family: inherit; transition: color 0.15s;
}
.app-nav-item.active { color: var(--orange); }
.app-nav-item[disabled] { cursor: default; opacity: 1; }
.app-nav-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
.app-nav-label { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.3px; }

/* ── Loading ── */
.loading-state { display: flex; align-items: center; justify-content: center;
  min-height: 40vh; color: var(--text-dim); font-size: 0.9rem; }

@keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.canto-card { animation: slideUp 0.45s cubic-bezier(0.34,1.56,0.64,1) both; }
</style>
<script src="utils.js"></script>
</head>
<body>

<div class="shell">
  <header class="main-header">
    <div>
      <div class="h-title">CruzAndo</div>
      <div class="h-sub">Mis Cantos</div>
    </div>
    <button class="btn-icon" id="btn-dark" aria-label="Tema">
      <svg id="ico-sun"  width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg id="ico-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
      </svg>
    </button>
  </header>

  <div id="content">
    <div class="loading-state">Cargando cantos…</div>
  </div>

  <nav class="app-nav">
    <button class="app-nav-item" onclick="navTap(this); goTo('orar.html')">
      <div class="app-nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="2" x2="12" y2="22"/><line x1="4" y1="9" x2="20" y2="9"/>
        </svg>
      </div>
      <span class="app-nav-label">Orar</span>
    </button>
    <button class="app-nav-item" onclick="navTap(this); goTo('diario.html')">
      <div class="app-nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>
        </svg>
      </div>
      <span class="app-nav-label">Diario</span>
    </button>
    <button class="app-nav-item active" disabled>
      <div class="app-nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <span class="app-nav-label">Cantos</span>
    </button>
    <button class="app-nav-item" onclick="navTap(this); goTo('sanar.html')">
      <div class="app-nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s-8-5.5-8-11a8 8 0 0116 0c0 5.5-8 11-8 11z"/><path d="M9 11h6M12 8v6"/>
        </svg>
      </div>
      <span class="app-nav-label">Sanar</span>
    </button>
    <button class="app-nav-item" onclick="navTap(this); goTo('index.html')">
      <div class="app-nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </div>
      <span class="app-nav-label">Inicio</span>
    </button>
  </nav>
</div>

<script type="module">
import { initializeApp }    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, getDocs, doc, setDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCYCZi1LmFuqIis9yx3QF3McvGHlAGKRKY",
  authDomain: "cruzando-app.firebaseapp.com",
  projectId: "cruzando-app",
  storageBucket: "cruzando-app.firebasestorage.app",
  messagingSenderId: "1059345488674",
  appId: "1:1059345488674:web:9e2b53e1a5ac6f1f6b1b78"
};
const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);

const CANTOS_BASE = 'https://pub-faed94e375aa443e846e07f81ef93274.r2.dev/cantos/';
const BLOCK_COLORS = { gozosos:'#D4A017', luminosos:'#01BBE1', dolorosos:'#C0392B', gloriosos:'#8E44AD' };
const BLOCK_LABELS = { gozosos:'Misterios Gozosos', luminosos:'Misterios Luminosos',
                       dolorosos:'Misterios Dolorosos', gloriosos:'Misterios Gloriosos' };

// Tema
var isLight = localStorage.getItem('cruzando_theme') === 'light';
function applyTheme(light) {
  document.body.classList.toggle('light', light);
  document.getElementById('ico-sun').style.display  = light ? 'none'  : 'block';
  document.getElementById('ico-moon').style.display = light ? 'block' : 'none';
  document.querySelector('meta[name="theme-color"]').content = light ? '#E6DED3' : '#1A0E04';
  localStorage.setItem('cruzando_theme', light ? 'light' : 'dark');
}
function toggleDark() { isLight = !isLight; applyTheme(isLight); }
applyTheme(isLight);
document.getElementById('btn-dark').onclick = toggleDark;

// Navegación
function goTo(page) {
  const base = location.origin + location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
  location.href = base + page;
}
function navTap(el) {
  el.classList.remove('tapped'); void el.offsetWidth; el.classList.add('tapped');
  setTimeout(() => el.classList.remove('tapped'), 400);
}
window.goTo   = goTo;
window.navTap = navTap;

// Player activo
let activeAudio = null;
let activePlayBtn = null;
let activeBarFill = null;
let activeCurEl = null;
let activeDurEl = null;

function fmt(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2,'0');
}

function playCantoAudio(url, playBtn, barFill, curEl, durEl) {
  // Parar el anterior
  if (activeAudio && activeAudio !== null) {
    activeAudio.pause();
    if (activePlayBtn) setPlayIcon(activePlayBtn, false);
    if (activeBarFill) activeBarFill.style.width = '0%';
    if (activeCurEl)  activeCurEl.textContent = '0:00';
  }

  if (activeAudio && activePlayBtn === playBtn) {
    // Mismo botón → pausar
    activeAudio = null; activePlayBtn = null;
    return;
  }

  const audio = new Audio(url);
  activeAudio = audio; activePlayBtn = playBtn;
  activeBarFill = barFill; activeCurEl = curEl; activeDurEl = durEl;

  audio.ontimeupdate = () => {
    if (!audio.duration) return;
    barFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    curEl.textContent = fmt(audio.currentTime);
  };
  audio.onloadedmetadata = () => { durEl.textContent = fmt(audio.duration); };
  audio.onended = () => {
    setPlayIcon(playBtn, false);
    barFill.style.width = '0%';
    curEl.textContent  = '0:00';
    activeAudio = null; activePlayBtn = null;
  };
  audio.onerror = () => { setPlayIcon(playBtn, false); activeAudio = null; };

  setPlayIcon(playBtn, true);
  audio.play().catch(() => { setPlayIcon(playBtn, false); });
}

function setPlayIcon(btn, playing) {
  btn.innerHTML = playing
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
}

function seekCanto(e, audio, barWrap) {
  if (!audio || !audio.duration) return;
  const rect = barWrap.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}

// Render de letra con separadores visuales
function renderLetra(letra) {
  return letra.split('\n\n───\n\n').map(estrofa =>
    '<span>' + estrofa.replace(/\n/g, '<br>') + '</span>'
  ).join('<span class="sep-line">───</span>');
}

// Render principal
function renderCantos(cantos) {
  const content = document.getElementById('content');

  if (!cantos.length) {
    content.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon">🎵</div>' +
        '<div class="empty-title">Aún no tienes cantos desbloqueados</div>' +
        '<div class="empty-desc">Completa los 5 misterios de un bloque en modo audio para desbloquear su canto.</div>' +
        '<button class="btn-orar" onclick="goTo(\'audio.html\')">Ir a orar</button>' +
      '</div>';
    return;
  }

  // Marcar como vistos en localStorage
  const SEEN_KEY = 'cruzando_cantos_seen_' + auth.currentUser?.uid;
  try { localStorage.setItem(SEEN_KEY, String(cantos.length)); } catch(e) {}

  const list = document.createElement('div');
  list.className = 'cantos-list';

  cantos.forEach((canto, ci) => {
    const color    = BLOCK_COLORS[canto.bloque] || '#D4A017';
    const label    = BLOCK_LABELS[canto.bloque] || canto.bloque;
    const cantoUrl = CANTOS_BASE + 'CANTO_' + canto.nivel + '_' + canto.cuaderno + '_' + canto.bloqueIdx + '.mp3';
    const cardId   = 'canto-' + ci;
    const delay    = Math.min(ci * 0.07, 0.4);

    const card = document.createElement('div');
    card.className = 'canto-card';
    card.style.cssText = '--block-color:' + color + '; animation-delay:' + delay + 's';
    card.innerHTML =
      '<div class="canto-card-header">' +
        '<div class="canto-titulo">' + escHTML(canto.titulo) + '</div>' +
        '<div class="canto-subtitulo">Nivel ' + canto.nivel + '-' + canto.cuaderno + ' · ' + label + '</div>' +
      '</div>' +
      '<div class="canto-player">' +
        '<button class="canto-play-btn" id="play-' + cardId + '">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>' +
        '</button>' +
        '<div class="canto-player-right">' +
          '<div class="canto-bar-wrap" id="bar-wrap-' + cardId + '">' +
            '<div class="canto-bar-fill" id="bar-' + cardId + '"></div>' +
          '</div>' +
          '<div class="canto-time">' +
            '<span id="cur-' + cardId + '">0:00</span>' +
            '<span id="dur-' + cardId + '">0:00</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="canto-letra-wrap">' +
        '<div class="canto-letra" id="letra-' + cardId + '" style="max-height:110px">' +
          renderLetra(canto.letra || '') +
        '</div>' +
        '<button class="canto-ver-mas" id="btn-ver-' + cardId + '">ver más</button>' +
      '</div>';

    list.appendChild(card);

    // Wiring después de insertar en DOM
    requestAnimationFrame(() => {
      const playBtn = document.getElementById('play-' + cardId);
      const barFill = document.getElementById('bar-' + cardId);
      const barWrap = document.getElementById('bar-wrap-' + cardId);
      const curEl   = document.getElementById('cur-' + cardId);
      const durEl   = document.getElementById('dur-' + cardId);
      const letraEl = document.getElementById('letra-' + cardId);
      const verBtn  = document.getElementById('btn-ver-' + cardId);

      // Verificar si el audio existe antes de habilitar el player
      fetch(cantoUrl, { method: 'HEAD' }).then(r => {
        if (!r.ok) { playBtn.disabled = true; }
      }).catch(() => { playBtn.disabled = true; });

      playBtn.onclick = () => {
        if (playBtn.disabled) return;
        const isPlaying = activePlayBtn === playBtn && activeAudio && !activeAudio.paused;
        if (isPlaying) {
          activeAudio.pause();
          setPlayIcon(playBtn, false);
          activeAudio = null; activePlayBtn = null;
        } else {
          playCantoAudio(cantoUrl, playBtn, barFill, curEl, durEl);
        }
      };

      barWrap.onclick = (e) => { if (activeAudio && activePlayBtn === playBtn) seekCanto(e, activeAudio, barWrap); };

      let expandido = false;
      verBtn.onclick = () => {
        expandido = !expandido;
        letraEl.style.maxHeight = expandido ? '9999px' : '110px';
        verBtn.textContent = expandido ? 'ver menos' : 'ver más';
      };
    });
  });

  content.innerHTML = '';
  content.appendChild(list);
}

function escHTML(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Auth + carga
onAuthStateChanged(auth, async user => {
  if (!user) {
    goTo('index.html'); return;
  }
  try {
    const snap  = await getDocs(collection(db, 'users', user.uid, 'unlockedCantos'));
    const cantos = [];
    snap.forEach(d => cantos.push(d.data()));
    cantos.sort((a, b) => (b.unlockedAt || 0) - (a.unlockedAt || 0));
    renderCantos(cantos);
  } catch(e) {
    document.getElementById('content').innerHTML =
      '<div class="empty-state"><div class="empty-icon">⚠️</div>' +
      '<div class="empty-title">Error al cargar</div>' +
      '<div class="empty-desc">' + e.message + '</div></div>';
  }

  // Timeout de seguridad
  setTimeout(() => {
    const c = document.getElementById('content');
    if (c && c.querySelector('.loading-state')) {
      c.innerHTML = '<div class="empty-state"><div class="empty-icon">🎵</div>' +
        '<div class="empty-title">Aún no tienes cantos</div>' +
        '<div class="empty-desc">Completa los 5 misterios de un bloque en modo audio.</div>' +
        '<button class="btn-orar" onclick="goTo(\'audio.html\')">Ir a orar</button></div>';
    }
  }, 8000);
});
</script>
</body>
</html>
