<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A0E04"/>
<!-- PWA / Home Screen Icon -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="CruzAndo">
<title>Mis Cantos · CruzAndo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & vars ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:            #002931;
  --bg-rgb:        0,41,49;
  --card:          #231508;
  --border:        rgba(255,255,255,0.09);
  --text:          #F5EDE4;
  --text-soft:     #C8B8AA;
  --text-dim:      #806858;
  --orange:        #FF7A00;
  --green:         #4CAF50;
  --block-color:      #E8A0A0;
  --block-color-glow: rgba(232,160,160,0.35);
  --block-color-bg:   rgba(232,160,160,0.18);
  --rosa:   #E8A0A0;
  --azul:   #02BBE0;
  --rojo:   #C0392B;
  --dorado: #D4A017;
  --brand:         #02BBE0;
  --brand-soft:    #43DDF8;
  --brand-ultra:   rgba(2,187,224,0.12);
  --brand-glow:    rgba(2,187,224,0.25);
}
body {
  background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
  height: 100dvh; overflow: hidden;
  display: flex; flex-direction: column;
}
body.light {
  --bg:            #E6DED3;
  --bg-rgb:        230,222,211;
  --card:          #F5EDE4;
  --border:        rgba(0,0,0,0.1);
  --text:          #1A0E04;
  --text-soft:     #4A3828;
  --text-dim:      #9A8878;
  --brand:         #02BBE0;
  --brand-soft:    #43DDF8;
  --brand-ultra:   rgba(2,187,224,0.10);
  --brand-glow:    rgba(2,187,224,0.20);
}

/* ── Header ── */
.main-header {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg); border-bottom: 1px solid var(--border);
  padding: 14px 18px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.h-title { font-family: 'Crimson Pro', serif; font-size: 1.1rem; font-weight: 600; color: var(--text); }
.h-sub   { font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.6px; }
.btn-icon { background: none; border: none; cursor: pointer; color: var(--text-soft);
  width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.h-center { flex: 1; text-align: center; }
.btn-auto {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1.5px solid var(--border); background: transparent;
  font-family: inherit; font-size: 0.62rem; font-weight: 700;
  color: var(--text-dim); cursor: pointer; letter-spacing: 0.8px;
  transition: background 0.25s, color 0.25s, border-color 0.25s;
  -webkit-tap-highlight-color: transparent;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.btn-auto.on { background: var(--block-color); border-color: var(--block-color); color: #fff; }

/* ── Estado vacío ── */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 80px 32px; text-align: center; gap: 16px;
}
.empty-icon { font-size: 3rem; }
.empty-title { font-family: 'Crimson Pro', serif; font-size: 1.5rem; font-weight: 600; color: var(--text); }
.empty-desc  { font-size: 0.9rem; color: var(--text-soft); line-height: 1.6; max-width: 260px; }
.btn-orar {
  margin-top: 8px; padding: 13px 32px; border-radius: 14px;
  background: var(--orange); color: #fff; border: none;
  font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer;
}

/* ── Lista de cantos ── */
.cantos-list { padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; }

/* ── Tarjeta de canto ── */
.canto-card {
  background: var(--card); border-radius: 16px;
  border: 1px solid var(--border);
  border-left: 4px solid var(--block-color, #D4A017);
  overflow: hidden;
}
.canto-card-header { padding: 16px 16px 0; }
.canto-titulo { font-family: 'Crimson Pro', serif; font-size: 1.3rem; font-weight: 600;
  color: var(--text); margin-bottom: 3px; }
.canto-subtitulo { font-size: 0.78rem; color: var(--text-soft); font-style: italic; margin-bottom: 14px; }

/* ── Player ── */
.canto-player {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.canto-play-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--block-color, #D4A017); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: #fff;
  flex-shrink: 0; transition: opacity 0.2s;
}
.canto-play-btn:disabled { opacity: 0.35; cursor: default; }
.canto-play-btn:active:not(:disabled) { opacity: 0.8; }
.canto-player-right { flex: 1; min-width: 0; }
.canto-bar-wrap { height: 4px; background: var(--border); border-radius: 2px;
  cursor: pointer; margin-bottom: 5px; position: relative; overflow: hidden; }
.canto-bar-fill { height: 100%; background: var(--block-color, #D4A017);
  border-radius: 2px; width: 0%; transition: width 0.3s linear; }
.canto-time { font-size: 0.72rem; color: var(--text-dim); display: flex; justify-content: space-between; }

/* ── Ordenar ── */
.sort-bar { display: flex; gap: 8px; padding: 12px 18px 4px; }
.sort-btn {
  flex: 1; padding: 7px 4px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card);
  font-family: inherit; font-size: 0.72rem; font-weight: 600;
  color: var(--text-dim); cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.sort-btn.active { background: var(--orange); border-color: var(--orange); color: #fff; }

/* ── Hero ── */
.cantos-hero {
  position: relative; overflow: hidden;
  margin: 14px 18px 4px; border-radius: 20px;
  padding: 22px 20px 18px;
  background: var(--block-color);
  border: 2px solid rgba(255,255,255,0.13);
  transition: background 0.5s ease;
}
.cantos-hero-noise {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; mix-blend-mode: soft-light; opacity: 0.55;
}
.cantos-hero-badge {
  display: inline-flex; align-items: center;
  background: rgba(0,0,0,0.22); border-radius: 999px;
  padding: 3px 11px; margin-bottom: 9px;
  font-size: 0.63rem; font-weight: 700;
  color: rgba(255,255,255,0.92); letter-spacing: 0.9px;
  text-transform: uppercase; position: relative;
}
.cantos-hero-title {
  font-family: 'Crimson Pro', Georgia, serif; font-size: 36px;
  font-weight: 600; color: #fff; line-height: 1.2; position: relative;
}
.cantos-hero-sub {
  font-size: 0.78rem; color: rgba(255,255,255,0.68);
  margin-top: 5px; position: relative;
}
.hero-controls {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 14px; position: relative;
}
.hero-nav-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.15);
  color: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.15s; -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
.hero-nav-btn:disabled { opacity: 0.3; cursor: default; }
.hero-nav-btn:active:not(:disabled) { background: rgba(0,0,0,0.3); }
.hero-dots {
  display: flex; align-items: center; justify-content: center;
  gap: 5px; flex: 1; padding: 0 8px;
}
.hero-dot {
  height: 6px; border-radius: 3px; background: rgba(255,255,255,0.4);
  transition: width 0.25s ease, background 0.25s ease; width: 6px; flex-shrink: 0;
}
.hero-dot.active { width: 18px; background: rgba(255,255,255,0.95); }
@keyframes heroBounceLeft {
  0%{transform:translateX(0)} 30%{transform:translateX(-14px)} 65%{transform:translateX(5px)} 100%{transform:translateX(0)}
}
@keyframes heroBounceRight {
  0%{transform:translateX(0)} 30%{transform:translateX(14px)} 65%{transform:translateX(-5px)} 100%{transform:translateX(0)}
}
.hero-bounce-left  { animation: heroBounceLeft  0.38s ease; }
.hero-bounce-right { animation: heroBounceRight 0.38s ease; }
.hero-player-row {
  display: flex; align-items: center; gap: 12px;
  margin-top: 14px; position: relative;
}
.hero-play-circle {
  width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
  background: rgba(255,255,255,0.92); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--block-color);
  transition: transform 0.12s, opacity 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.hero-play-circle:active { transform: scale(0.93); opacity: 0.85; }
.hero-player-bars { flex: 1; }
.hero-bar-wrap {
  height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px;
  cursor: pointer; overflow: hidden; margin-bottom: 5px;
}
.hero-bar-fill {
  height: 100%; background: rgba(255,255,255,0.9);
  border-radius: 2px; width: 0%; transition: width 0.3s linear;
}
.hero-time-row {
  font-size: 0.68rem; color: rgba(255,255,255,0.6);
  display: flex; justify-content: space-between;
}

/* ── Letra sheet ── */
.hero-letra-row {
  display: flex; justify-content: flex-end;
  margin-top: 10px; position: relative;
}
.hero-btn-letra {
  background: rgba(0,0,0,0.2); border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 999px; padding: 5px 16px;
  font-family: inherit; font-size: 0.72rem; font-weight: 600;
  color: rgba(255,255,255,0.9); cursor: pointer; letter-spacing: 0.4px;
  -webkit-tap-highlight-color: transparent;
}
.hero-btn-letra:active { background: rgba(0,0,0,0.35); }
.letra-sheet {
  position: absolute; inset: 0; border-radius: 18px;
  background: rgba(14, 7, 1, 0.97);
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1);
  overflow: hidden; z-index: 10;
}
.letra-sheet.open { transform: translateY(0); }
body.light .letra-sheet { background: rgba(248, 240, 230, 0.98); }
.sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: rgba(255,255,255,0.3); margin: 10px auto 6px; flex-shrink: 0;
}
body.light .sheet-handle { background: rgba(0,0,0,0.2); }
.sheet-header {
  padding: 2px 16px 10px; flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}
body.light .sheet-header { border-bottom-color: rgba(0,0,0,0.1); }
.sheet-titulo {
  font-family: 'Crimson Pro', Georgia, serif; font-size: 26px; font-weight: 600;
  color: rgba(255,255,255,0.55); letter-spacing: 0.3px;
  text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
body.light .sheet-titulo { color: var(--text-dim); }
.sheet-body {
  flex: 1; overflow-y: auto; padding: 28px 24px 32px;
  -webkit-overflow-scrolling: touch;
}
.sheet-letra {
  font-family: 'Crimson Pro', Georgia, serif; font-size: 36px;
  color: rgba(255,255,255,0.85); line-height: 1.7;
}
body.light .sheet-letra { color: var(--text-soft); }
.sheet-letra .sep-line {
  color: rgba(255,255,255,0.35); display: block; text-align: center;
  margin: 4px 0; font-family: 'Inter', sans-serif; font-size: 0.75rem; letter-spacing: 2px;
}
body.light .sheet-letra .sep-line { color: var(--text-dim); }
.btn-letra {
  display: block; width: 100%; padding: 10px 16px;
  background: none; border: none; cursor: pointer; text-align: left;
  font-family: 'Crimson Pro', Georgia, serif; font-size: 36px; line-height: 1.7; font-style: italic;
  color: var(--block-color, #D4A017); border-top: 1px solid var(--border);
  -webkit-tap-highlight-color: transparent;
}

/* ── Letra ── */
.canto-letra-wrap { padding: 14px 16px 16px; }
.canto-letra {
  font-family: 'Crimson Pro', Georgia, serif; font-size: 26px; font-weight: 600;
  color: var(--text-soft); line-height: 1.8; white-space: pre-line;
  overflow: hidden; transition: max-height 0.4s ease;
}
.canto-letra .sep-line { color: var(--text-dim); display: block; text-align: center;
  margin: 2px 0; font-family: 'Inter', sans-serif; font-size: 0.75rem; letter-spacing: 2px; }
.canto-header-top { display: flex; align-items: flex-start; justify-content: space-between; }
.btn-fav {
  background: none; border: none; cursor: pointer; padding: 4px;
  color: var(--text-dim); display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.2s, transform 0.15s; flex-shrink: 0;
}
.btn-fav:active { transform: scale(0.85); }
.btn-fav.on { color: #E53E3E; }
.hero-btn-fav {
  background: rgba(0,0,0,0.2); border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 999px; width: 32px; height: 32px;
  color: rgba(255,255,255,0.6); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.2s;
}
.hero-btn-fav:active { background: rgba(0,0,0,0.35); }
.hero-btn-fav.on { color: #fff; }
.canto-ver-mas {
  margin-top: 10px; background: none; border: none; cursor: pointer;
  font-size: 0.82rem; color: var(--text-dim); text-decoration: underline;
  font-family: inherit; padding: 0;
}

/* ── Nav bar ── */
.shell { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }
.app-nav {
  position: fixed; bottom: 0; left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: 100%; max-width: 480px; z-index: 9999;
  background: var(--card); border-top: 1px solid var(--border);
  display: flex; align-items: stretch; padding: 6px 0 env(safe-area-inset-bottom, 0);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.app-nav.visible { transform: translateX(-50%) translateY(0); }
.app-nav-item {
  flex: 1; background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 4px 2px; color: rgba(67,221,248,0.45);
  font-family: inherit; transition: color 0.15s;
}
body.light .app-nav-item { color: rgba(0,41,49,0.45); }
.app-nav-item.active { color: #43DDF8; }
.app-nav-item.tapped { color: #43DDF8; }
.app-nav-item[disabled] { cursor: default; opacity: 1; }
.app-nav-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
.app-nav-label { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.3px; }

/* ── Loading ── */
.loading-state { display: flex; align-items: center; justify-content: center;
  min-height: 40vh; color: var(--text-dim); font-size: 0.9rem; }

@keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.canto-card { animation: slideUp 0.45s cubic-bezier(0.34,1.56,0.64,1) both; }

/* ── Playlist trigger ── */
.playlist-trigger-row { padding: 10px 18px 0; }
.btn-playlist-trigger {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 14px 7px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card);
  font-family: inherit; font-size: 0.78rem; font-weight: 600;
  color: var(--text-dim); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn-playlist-trigger:active { background: var(--border); }
.btn-playlist-trigger.has-filter { border-color: rgba(212,160,23,0.5); color: #D4A017; }

/* ── Playlist overlay + sheet ── */
.playlist-overlay {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0,0,0,0.52);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.playlist-overlay.open { opacity: 1; pointer-events: auto; }
.playlist-sheet {
  position: fixed; bottom: 0; left: 50%;
  transform: translateX(-50%) translateY(110%);
  width: 100%; max-width: 480px; z-index: 95;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  border-top: 1px solid var(--border);
  transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.playlist-sheet.open { transform: translateX(-50%) translateY(0); }
.playlist-sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--border); margin: 10px auto 4px; display: block;
}
.playlist-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 18px 10px;
}
.playlist-title { font-family: 'Crimson Pro', serif; font-size: 1.15rem; font-weight: 600; color: var(--text); }
.playlist-close-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--border); border: none; cursor: pointer;
  color: var(--text-dim); font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

/* Hint de scroll */
.playlist-hint-wrap {
  display: flex; align-items: center; gap: 10px;
  padding: 0 18px 8px;
}
.playlist-hint-line { flex: 1; height: 1px; background: var(--border); }
.playlist-hint-text { font-size: 0.67rem; color: var(--text-dim); white-space: nowrap; letter-spacing: 0.3px; }

/* Rosario */
.rosario-scroll {
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 8px 18px 12px;
  scrollbar-width: none; cursor: grab;
}
.rosario-scroll::-webkit-scrollbar { display: none; }
.rosario-scroll.grabbing { cursor: grabbing; user-select: none; }
.rosario-row { display: flex; align-items: flex-start; width: max-content; }
.rosario-cuenta-wrap {
  display: flex; flex-direction: column; align-items: center;
  gap: 5px; flex-shrink: 0;
}
.rosario-cuenta {
  width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid rgba(212,160,23,0.2);
  background: rgba(212,160,23,0.08);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative;
  font-family: 'Crimson Pro', serif; font-size: 1.3rem; font-weight: 600;
  color: rgba(212,160,23,0.45);
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1),
              background 0.2s, border-color 0.2s, box-shadow 0.2s, color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.rosario-cuenta.selected {
  background: rgba(212,160,23,0.18); border-color: #D4A017;
  transform: scale(1.1); color: #D4A017;
  box-shadow: 0 0 0 4px rgba(212,160,23,0.18), 0 4px 14px rgba(212,160,23,0.22);
}
.rosario-cuenta.locked {
  background: rgba(212,160,23,0.03); border-color: rgba(212,160,23,0.08);
  color: rgba(212,160,23,0.18); cursor: default;
}
.rosario-cuenta-label {
  font-size: 0.58rem; color: var(--text-dim); text-align: center;
  max-width: 62px; line-height: 1.2; letter-spacing: 0.2px;
  transition: color 0.2s;
}
.rosario-cuenta-wrap.selected .rosario-cuenta-label { color: #D4A017; }
.rosario-lock {
  position: absolute; bottom: 2px; right: 2px;
  width: 13px; height: 13px; color: rgba(212,160,23,0.3);
}
.rosario-hilo {
  width: 20px; height: 2px; flex-shrink: 0;
  background: rgba(212,160,23,0.12);
  margin-top: 25px; transition: background 0.25s;
}
.rosario-hilo.lit { background: rgba(212,160,23,0.4); }

/* Seleccionar todos */
.playlist-select-all-row {
  display: flex; justify-content: flex-end;
  padding: 2px 18px 12px;
}
.btn-select-all {
  background: none; border: none; cursor: pointer;
  font-family: inherit; font-size: 0.8rem; color: var(--text-soft);
  padding: 0; -webkit-tap-highlight-color: transparent;
}
.btn-select-all:active { opacity: 0.7; }

/* Filtros */
.playlist-filters { border-top: 1px solid var(--border); padding: 6px 0 12px; }
.filter-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 10px 20px; background: none; border: none;
  cursor: pointer; text-align: left; font-family: inherit;
  font-size: 0.92rem; color: var(--text-soft);
  -webkit-tap-highlight-color: transparent; transition: background 0.12s;
}
.filter-row:active { background: rgba(255,255,255,0.04); }
body.light .filter-row:active { background: rgba(0,0,0,0.05); }
.filter-row.active { color: var(--text); }
.filter-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.filter-label { flex: 1; }
.filter-count {
  font-size: 0.75rem; color: var(--text-dim);
  background: var(--border); border-radius: 999px;
  padding: 2px 9px; min-width: 26px; text-align: center;
}
.filter-row.active .filter-count { background: rgba(212,160,23,0.15); color: #D4A017; }

/* ════ REDISEÑO VISUAL ════════════════════════════════════ */

/* Header nuevo */
.main-header {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 16px 10px;
}
.header-left  { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.header-right { display: flex; align-items: center; }
.header-center { flex: 1; text-align: center; }
.header-title {
  font-family: 'Crimson Pro', serif; font-size: 1.05rem; font-weight: 600;
  display: block; text-align: center; color: var(--text);
}
.header-sub {
  font-size: 0.65rem; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.5px;
  display: block; text-align: center;
}
.btn-autoplay {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid var(--text-dim); background: transparent;
  color: var(--text-dim); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.btn-autoplay.on {
  border-color: var(--block-color);
  background:   var(--block-color-bg);
  color: var(--block-color);
}
.autoplay-label {
  font-size: 0.58rem; font-weight: 700;
  color: var(--text-dim); letter-spacing: 0.3px; transition: color 0.2s;
}
.btn-autoplay.on + .autoplay-label { color: var(--block-color); }

/* Hero section */
.hero-section {
  position: relative; flex: 1; min-height: 200px; overflow: hidden;
  display: flex; flex-direction: column;
  justify-content: flex-end; padding: 20px 20px 14px;
}
.hero-bg {
  position: absolute; inset: 0;
  background: var(--block-color); opacity: 0.18;
  transition: background 0.5s;
}
.hero-noise {
  position: absolute; inset: 0;
  width: 100%; height: 100%; opacity: 0.35;
}
.hero-grad {
  position: absolute; inset: 0;
  background: linear-gradient(to top,
    rgba(26,14,4,0.95) 0%, rgba(26,14,4,0.4) 60%, transparent 100%);
}
body.light .hero-grad {
  background: linear-gradient(to top,
    rgba(230,222,211,0.95) 0%, rgba(230,222,211,0.4) 60%, transparent 100%);
}
.hero-glow {
  position: absolute; top: -40px; left: -40px;
  width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, var(--block-color-glow) 0%, transparent 70%);
  animation: glow-pulse 3s ease-in-out infinite;
}
@keyframes glow-pulse {
  0%,100% { opacity: 0.6; transform: scale(1); }
  50%      { opacity: 1;   transform: scale(1.1); }
}
.hero-ring {
  position: absolute; top: 50%; left: 50%; border-radius: 50%;
  border: 2px solid var(--block-color);
  opacity: 0; transform: translate(-50%,-50%) scale(0.8);
}
.hero-section.playing .hero-ring { animation: ring-expand 2s ease-out infinite; }
.hero-ring.r1 { width: 80px;  height: 80px;  animation-delay: 0s;   }
.hero-ring.r2 { width: 110px; height: 110px; animation-delay: 0.7s; }
.hero-ring.r3 { width: 140px; height: 140px; animation-delay: 1.4s; }
@keyframes ring-expand {
  0%   { opacity: 0.5; transform: translate(-50%,-50%) scale(0.8); }
  100% { opacity: 0;   transform: translate(-50%,-50%) scale(1.4); }
}
.hero-content { position: relative; z-index: 3; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--block-color-bg); border: 1px solid var(--block-color);
  border-radius: 20px; padding: 3px 10px; margin-bottom: 6px;
  font-size: 0.62rem; color: var(--block-color);
  letter-spacing: 0.5px; font-weight: 600;
  transition: background 0.4s, border-color 0.4s, color 0.4s;
}
.badge-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--block-color); transition: background 0.4s;
}
.hero-titulo {
  font-family: 'Crimson Pro', serif; font-size: 2rem; font-weight: 600;
  line-height: 1.1; color: #fff; margin-bottom: 4px;
  text-shadow: 0 1px 8px rgba(0,0,0,0.6), 0 2px 20px rgba(0,0,0,0.5);
}
.hero-subtitulo {
  font-size: 0.72rem; color: rgba(255,255,255,0.55);
  text-shadow: 0 1px 6px rgba(0,0,0,0.7);
}
.hero-badge { text-shadow: 0 1px 6px rgba(0,0,0,0.7); }
.badge-text  { text-shadow: 0 1px 6px rgba(0,0,0,0.7); }
.hero-color-wash {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 65%;
  background: linear-gradient(to top, var(--block-color) 0%, rgba(0,0,0,0) 100%);
  opacity: 0.45; pointer-events: none; z-index: 1;
  transition: opacity 0.3s;
}
body.light .hero-color-wash { opacity: 0.65; }
.hero-dots-bar {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: center;
  gap: 10px; margin-top: 10px;
}
.swipe-arrow { color: rgba(255,255,255,0.3); font-size: 16px; line-height: 1; }
.hero-dots { display: flex; gap: 5px; align-items: center; }
/* override old .hero-dot with new .dot */
.dot {
  width: 5px; height: 5px; border-radius: 3px;
  background: rgba(255,255,255,0.2);
  transition: width 0.2s, background 0.2s;
}
.dot.active { width: 14px; background: var(--block-color); }

/* Controls bar */
.controls-bar {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.progress-track {
  height: 3px; background: rgba(255,255,255,0.1);
  border-radius: 2px; margin-bottom: 8px;
  position: relative; cursor: pointer;
}
body.light .progress-track { background: rgba(0,0,0,0.1); }
.progress-fill {
  height: 100%; background: var(--block-color);
  border-radius: 2px; width: 0%; position: relative;
  transition: width 0.5s linear;
}
.progress-thumb {
  width: 10px; height: 10px; border-radius: 50%;
  background: #fff; position: absolute;
  right: -5px; top: -3.5px;
  box-shadow: 0 0 6px var(--block-color);
}
.time-row {
  display: flex; justify-content: space-between;
  font-size: 0.65rem; color: var(--text-dim); margin-bottom: 10px;
}
.playback-btns {
  display: flex; align-items: center;
  justify-content: center; gap: 20px;
}
.ctrl-btn {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: none; color: var(--text-soft); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent; transition: opacity 0.2s;
}
.ctrl-btn:disabled { opacity: 0.25; cursor: default; }
.ctrl-btn:active:not(:disabled) { opacity: 0.7; }
.btn-play-main {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--block-color); border: none; color: #fff; cursor: pointer;
  box-shadow: 0 4px 16px var(--block-color-glow);
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.3s, box-shadow 0.3s, transform 0.1s;
}
.btn-play-main:active { transform: scale(0.93); }

/* Tool bar */
.tool-bar {
  display: flex; align-items: center; justify-content: space-around;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
}
.tool-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-family: inherit; font-size: 0.6rem; font-weight: 600;
  letter-spacing: 0.3px; -webkit-tap-highlight-color: transparent;
  transition: color 0.2s;
}
.tool-btn.active { color: var(--block-color); }
.tool-btn svg {
  width: 34px; height: 34px; padding: 9px;
  border-radius: 10px; background: rgba(255,255,255,0.05);
  transition: background 0.2s;
}
body.light .tool-btn svg { background: rgba(0,0,0,0.04); }
.tool-btn.active svg { background: var(--block-color-bg); }

/* Badge "Extra" en el hero */
.hero-extra-badge {
  display: inline-flex; align-items: center; gap: 4px;

/* Playlist list section (dentro del popup) */
.playlist-list-section {
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  max-height: 50vh; border-top: 1px solid var(--border);
}

function renderDots() {
  const total = navCantos.length;
  const el    = document.getElementById('hero-dots');
  if (!el || total <= 1) { if (el) el.innerHTML = ''; return; }
  const MAX   = 7;
  const start = Math.max(0, Math.min(currentIdx - Math.floor(MAX / 2), total - MAX));
  const end   = Math.min(total, start + MAX);
  let html = '';
  for (let i = start; i < end; i++)
    html += '<div class="dot' + (i === currentIdx ? ' active' : '') + '"></div>';
  el.innerHTML = html;
}

function updateNavBtns() {

}

function heroBounce(dir) {
  const hero = document.getElementById('cantos-hero');
  const cls  = dir === 'right' ? 'hero-bounce-right' : 'hero-bounce-left';
  hero.classList.remove('hero-bounce-left', 'hero-bounce-right');
  void hero.offsetWidth;
  hero.classList.add(cls);
  hero.addEventListener('animationend', () => hero.classList.remove(cls), { once: true });
}

function goToCanto(index) {
  if (window.CZSound) CZSound('cantosSwipe');
  if (index < 0 || index >= navCantos.length) {
    heroBounce(index < 0 ? 'right' : 'left');
    return;
  }
  // Capturar si el hero estaba sonando antes de cambiar
  const heroPlayBtn   = document.getElementById('hero-play-btn');
  const wasHeroPlaying = activeAudio && !activeAudio.paused && activePlayBtn === heroPlayBtn;

  // Detener audio completamente
  if (activeAudio) {
    activeAudio.pause();
    activeAudio.src  = '';
    activeAudio.load();
    activeAudio.ontimeupdate     = null;
    activeAudio.onloadedmetadata = null;
    activeAudio.onended          = null;
    activeAudio.onerror          = null;
    if (activePlayBtn) setPlayIcon(activePlayBtn, false);
    if (activeBarFill) activeBarFill.style.width = '0%';
    if (activeCurEl)   activeCurEl.textContent   = '0:00';
    if (activeDurEl)   activeDurEl.textContent   = '0:00';
    activeAudio = null; activePlayBtn = null;
    activeBarFill = null; activeCurEl = null; activeDurEl = null;
  }
  document.getElementById('cantos-hero')?.classList.remove('playing');

  currentIdx = index;
  updateHero(navCantos[currentIdx]);
  renderDots();
  updateNavBtns();
  saveBookmark(navCantos[currentIdx]);

  // Si estaba sonando en el hero, arrancar el nuevo automáticamente
  if (wasHeroPlaying) playHeroCanto(navCantos[currentIdx]);
}

  const barFill = document.getElementById('hero-bar-fill');
  const curEl   = document.getElementById('hero-cur');
  const durEl   = document.getElementById('hero-dur');

  setupCantoMediaSession(canto);

function setupCantoMediaSession(canto) {
  if (!('mediaSession' in navigator) || !canto) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title:  canto.titulo || 'CruzAndo',
    artist: 'Santo Rosario · Canto',
    album:  'CruzAndo',
    artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
  });
  navigator.mediaSession.setActionHandler('play', function() {
    if (activeAudio) {
      activeAudio.play().catch(function(){});
      setPlayIcon(activePlayBtn, true);
      document.getElementById('cantos-hero')?.classList.add('playing');
    }
  });
  navigator.mediaSession.setActionHandler('pause', function() {
    if (activeAudio) {
      activeAudio.pause();
      setPlayIcon(activePlayBtn, false);
      document.getElementById('cantos-hero')?.classList.remove('playing');
    }
  });
  navigator.mediaSession.setActionHandler('nexttrack', function() {
    var next = currentIdx + 1;
    if (navCantos.length && next < navCantos.length) {
      currentIdx = next;
      updateHero(navCantos[currentIdx]); renderDots(); updateNavBtns();
      saveBookmark(navCantos[currentIdx]);
      playHeroCanto(navCantos[currentIdx]);
    }
  });
  navigator.mediaSession.setActionHandler('previoustrack', function() {
    var prev = currentIdx - 1;
    if (navCantos.length && prev >= 0) {
      currentIdx = prev;
      updateHero(navCantos[currentIdx]); renderDots(); updateNavBtns();
      saveBookmark(navCantos[currentIdx]);
      playHeroCanto(navCantos[currentIdx]);
    }
  });
}

(function() {

  el.addEventListener('mousedown', e => {
    down = true; startX = e.pageX - el.offsetLeft; scrollLeft = el.scrollLeft;
    el.classList.add('grabbing');
  });
  el.addEventListener('mouseleave', () => { down = false; el.classList.remove('grabbing'); });
  el.addEventListener('mouseup',    () => { down = false; el.classList.remove('grabbing'); });
  el.addEventListener('mousemove',  e => {
    if (!down) return;
    e.preventDefault();
    el.scrollLeft = scrollLeft - (e.pageX - el.offsetLeft - startX);

function renderRosario() {
  const row = document.getElementById('rosario-row');
  if (!row) return;
  row.innerHTML = '';
  for (let i = 1; i <= 7; i++) {
    const isUnlocked = unlockedMundos.has(i);
    const isSelected = activeFilter === null && selectedMundos.has(i) && isUnlocked;

    if (i > 1) {
      const hilo = document.createElement('div');
      const bothLit = unlockedMundos.has(i - 1) && isUnlocked;
      hilo.className = 'rosario-hilo' + (bothLit ? ' lit' : '');
      row.appendChild(hilo);
    }

    const wrap = document.createElement('div');
    wrap.className = 'rosario-cuenta-wrap' + (isSelected ? ' selected' : '');

    const cuenta = document.createElement('div');
    cuenta.className = 'rosario-cuenta' +
      (!isUnlocked ? ' locked' : (isSelected ? ' selected' : ''));
    cuenta.textContent = String(i);

    if (isUnlocked) {
      cuenta.addEventListener('click', () => toggleMundo(i));
    } else {
      const lock = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      lock.setAttribute('viewBox', '0 0 24 24');
      lock.setAttribute('fill', 'none');
      lock.setAttribute('stroke', 'currentColor');
      lock.setAttribute('stroke-width', '2');
      lock.setAttribute('stroke-linecap', 'round');
      lock.classList.add('rosario-lock');
      lock.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>';
      cuenta.appendChild(lock);
    }

    const label = document.createElement('div');
    label.className = 'rosario-cuenta-label';
    label.textContent = MUNDO_NAMES[i - 1];

    wrap.appendChild(cuenta);
    wrap.appendChild(label);
    row.appendChild(wrap);
  }
}

function toggleMundo(nivel) {
  activeFilter = null;
  if (selectedMundos.has(nivel)) {
    selectedMundos.delete(nivel);
  } else {
    selectedMundos.add(nivel);
  }
  renderRosario();
  updatePlaylistFilterBtns();
  updateSelectAllBtn();
}

function setPlaylistFilter(filter) {
  activeFilter = filter;
  renderRosario();
  updatePlaylistFilterBtns();
  updateSelectAllBtn();
}
window.setPlaylistFilter = setPlaylistFilter;

function toggleSelectAll() {
  const allUnlocked = [...unlockedMundos];
  const allSel = allUnlocked.length > 0 && allUnlocked.every(n => selectedMundos.has(n));
  if (allSel) {
    allUnlocked.forEach(n => selectedMundos.delete(n));
  } else {
    allUnlocked.forEach(n => selectedMundos.add(n));
  }
  activeFilter = null;
  renderRosario();
  updatePlaylistFilterBtns();
  updateSelectAllBtn();
}
window.toggleSelectAll = toggleSelectAll;

function updatePlaylistFilterBtns() {
  ['todas', 'favoritas', 'extras'].forEach(f => {
    const btn = document.getElementById('filter-' + f);
    if (btn) btn.classList.toggle('active', activeFilter === f);
  });
}

function updateSelectAllBtn() {
  const btn = document.getElementById('btn-select-all');
  if (!btn) return;
  const allUnlocked = [...unlockedMundos];
  const allSel = allUnlocked.length > 0 && allUnlocked.every(n => selectedMundos.has(n));
  btn.textContent = allSel ? 'Quitar todos' : 'Seleccionar todos';
}

function updatePlaylistTrigger() {
  const btn = document.getElementById('btn-playlist-trigger');
  if (!btn) return;
  const isDefault = activeFilter === 'todas' && selectedMundos.size === 0;
  btn.classList.toggle('has-filter', !isDefault);
}

function applyPlaylist() {
  const all = [...allUnlockedCantos, ...allExtrasCantos];
  if (activeFilter === 'todas') {
    allCantos = all.slice();
  } else if (activeFilter === 'favoritas') {
    allCantos = all.filter(c => c.favorite);
  } else if (activeFilter === 'extras') {
    allCantos = allExtrasCantos.slice();
  } else {
    allCantos = selectedMundos.size > 0
      ? allUnlockedCantos.filter(c => selectedMundos.has(c.nivel))
      : all.slice();
  }
  currentIdx = 0;
  rebuildNavCantos();
  const list = document.getElementById('cantos-list');
  if (list) renderList(list, sortedCantos());
  updatePlaylistTrigger();
}

function openPlaylistPopup() {
  const all = [...allUnlockedCantos, ...allExtrasCantos];
  const favEl = document.getElementById('fav-count');
  const extEl = document.getElementById('ext-count');
  if (favEl) favEl.textContent = all.filter(c => c.favorite).length;
  if (extEl) extEl.textContent = allExtrasCantos.length;
  renderRosario();
  updatePlaylistFilterBtns();
  updateSelectAllBtn();
  document.getElementById('playlist-overlay').classList.add('open');
  document.getElementById('playlist-sheet').classList.add('open');
}
window.openPlaylistPopup = openPlaylistPopup;

function closePlaylistPopup() {
  document.getElementById('playlist-overlay').classList.remove('open');
  document.getElementById('playlist-sheet').classList.remove('open');
  applyPlaylist();
}
window.closePlaylistPopup = closePlaylistPopup;

async function saveBookmark(canto) {
  const uid = auth.currentUser?.uid;
  if (!uid || !canto || canto.source === 'extras') return;
  try {
    await setDoc(doc(db, 'users', uid, 'bookmark', 'currentCanto'),
      { nivel: canto.nivel, cuaderno: canto.cuaderno, bloqueIdx: canto.bloqueIdx });
  } catch(e) { /* silent */ }
}

function sortedCantos() {
  const arr = (sortMode === 'favs' ? allCantos.filter(c => c.favorite) : allCantos).slice();
  if (sortMode === 'nivel-asc' || sortMode === 'favs')
    arr.sort((a,b) => a.nivel!==b.nivel ? a.nivel-b.nivel : a.cuaderno!==b.cuaderno ? a.cuaderno-b.cuaderno : a.bloqueIdx-b.bloqueIdx);
  if (sortMode === 'nivel-desc') arr.sort((a,b) => a.nivel!==b.nivel ? b.nivel-a.nivel : a.cuaderno!==b.cuaderno ? b.cuaderno-a.cuaderno : b.bloqueIdx-a.bloqueIdx);
  if (sortMode === 'az')         arr.sort((a,b) => (a.titulo||'').localeCompare(b.titulo||'', 'es'));
  return arr;
}

function rebuildNavCantos() {
  const base = allCantos.slice().sort((a,b) => a.nivel!==b.nivel ? a.nivel-b.nivel : a.cuaderno!==b.cuaderno ? a.cuaderno-b.cuaderno : a.bloqueIdx-b.bloqueIdx);
  const prev = navCantos[currentIdx];
  navCantos = sortMode === 'favs' ? base.filter(c => c.favorite) : base;
  if (!navCantos.length) navCantos = [DEMO_CANTO];
  const ni = prev ? navCantos.findIndex(c => c.nivel===prev.nivel && c.cuaderno===prev.cuaderno && c.bloqueIdx===prev.bloqueIdx) : -1;
  currentIdx = ni >= 0 ? ni : 0;
  updateHero(navCantos[currentIdx]); renderDots(); updateNavBtns();
}

function setSortMode(mode) {
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === mode));
  rebuildNavCantos();
  const list = document.getElementById('cantos-list');
  if (list) renderList(list, sortedCantos());
}
window.setSortMode = setSortMode;

// Player activo

let activePlayBtn = null;
let activeBarFill = null;
let activeCurEl = null;
let activeDurEl = null;

function fmt(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2,'0');
}

function _doAutoplay() {
  if (autoplayEnabled && navCantos.length > 1) {
    const next = currentIdx + 1;
    if (next < navCantos.length) {
      currentIdx = next;
      updateHero(navCantos[currentIdx]);
      renderDots();
      updateNavBtns();
      saveBookmark(navCantos[currentIdx]);
      playHeroCanto(navCantos[currentIdx]);
    } else {
      heroBounce('right');
    }
  }
}
window._doAutoplay = _doAutoplay;

function playCantoAudio(url, playBtn, barFill, curEl, durEl) {
  // Destruir completamente el audio anterior antes de crear el nuevo
  if (activeAudio) {
    activeAudio.pause();
    activeAudio.src              = '';
    activeAudio.load();
    activeAudio.ontimeupdate     = null;
    activeAudio.onloadedmetadata = null;
    activeAudio.onended          = null;
    activeAudio.onerror          = null;
    if (activePlayBtn) setPlayIcon(activePlayBtn, false);
    if (activeBarFill) activeBarFill.style.width = '0%';
    if (activeCurEl)   activeCurEl.textContent   = '0:00';
    if (activeDurEl)   activeDurEl.textContent   = '0:00';
    document.getElementById('cantos-hero')?.classList.remove('playing');
    activeAudio = null; activePlayBtn = null;
    activeBarFill = null; activeCurEl = null; activeDurEl = null;
  }

  const audio = new Audio(url);
  activeAudio = audio; activePlayBtn = playBtn;
  activeBarFill = barFill; activeCurEl = curEl; activeDurEl = durEl;

  audio.ontimeupdate = () => {
    if (!audio.duration) return;
    barFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    curEl.textContent = fmt(audio.currentTime);
  };
  audio.onloadedmetadata = () => { durEl.textContent = fmt(audio.duration); };
  audio.onended = () => {
    setPlayIcon(playBtn, false);
    barFill.style.width = '0%';
    curEl.textContent  = '0:00';
    activeAudio = null; activePlayBtn = null;

    // ── Interstitial periódico cada N tracks (solo Free) ──────────
    var _planNow = window.effectivePlan ? window.effectivePlan() : 'premium';
    if (_planNow === 'free') {
      _cantoPlayCount++;
      if (_cantoPlayCount % _INTERSTITIAL_EVERY === 0) {
        _showInterstitial(function() { _doAutoplay(); }, false);
        return;
      }
    }

    _doAutoplay();
  };
  audio.onerror = () => { setPlayIcon(playBtn, false); activeAudio = null; };

  const heroEl   = document.getElementById('cantos-hero');
  const isHeroBtn = playBtn.id === 'hero-play-btn';
  setPlayIcon(playBtn, true);
  if (isHeroBtn && heroEl) heroEl.classList.add('playing');
  audio.play().catch(() => { setPlayIcon(playBtn, false); if (isHeroBtn && heroEl) heroEl.classList.remove('playing'); });
}

function setPlayIcon(btn, playing) {

    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
}

function seekCanto(e, audio, barWrap) {
  if (!audio || !audio.duration) return;
  const rect = barWrap.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}

          '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>' +
        '</button>' +
        '<div class="canto-player-right">' +

            '<div class="canto-bar-fill" id="bar-' + cardId + '"></div>' +

    listEl.appendChild(card);

    requestAnimationFrame(() => {
      const playBtn = document.getElementById('play-' + cardId);
      const barFill = document.getElementById('bar-' + cardId);
      const barWrap = document.getElementById('bar-wrap-' + cardId);
      const curEl   = document.getElementById('cur-' + cardId);
      const durEl   = document.getElementById('dur-' + cardId);
      const letraBtn = document.getElementById('btn-letra-' + cardId);
      const favBtn   = document.getElementById('fav-' + cardId);

      fetch(cantoUrl, { method: 'HEAD' }).then(r => {
        if (!r.ok) playBtn.disabled = true;
      }).catch(() => { playBtn.disabled = true; });

      playBtn.onclick = () => {
        if (playBtn.disabled) return;

        // Toggle pause/resume cuando es el mismo botón
        if (activeAudio && activePlayBtn === playBtn) {
          if (activeAudio.paused) {
            activeAudio.play().catch(() => {});
            setPlayIcon(playBtn, true);
          } else {
            activeAudio.pause();
            setPlayIcon(playBtn, false);
          }
          return;
        }

        // Nuevo canto: destruir anterior y arrancar este
        playCantoAudio(cantoUrl, playBtn, barFill, curEl, durEl);
        updateHero(canto);
        const ni = navCantos.findIndex(c =>
          c.nivel===canto.nivel && c.cuaderno===canto.cuaderno && c.bloqueIdx===canto.bloqueIdx);
        if (ni >= 0) { currentIdx = ni; renderDots(); updateNavBtns(); }
        saveBookmark(canto);
      };
      barWrap.onclick = (e) => { if (activeAudio && activePlayBtn === playBtn) seekCanto(e, activeAudio, barWrap); };

      letraBtn.onclick = () => {
        updateHero(canto);
        const ni = navCantos.findIndex(c => c.nivel===canto.nivel && c.cuaderno===canto.cuaderno && c.bloqueIdx===canto.bloqueIdx);
        if (ni >= 0) { currentIdx = ni; renderDots(); updateNavBtns(); }
        openLetraSheet(canto.letra || '', canto.titulo);
      };

      if (favBtn) favBtn.onclick = () => {
        if (!canto._col) return;
        const newVal = !canto.favorite;
        setFavIcon(favBtn, newVal);
        toggleFavorite(canto, newVal);
      };
    });
  });
}

function renderCantos(unlockedCantos, extrasCantos_arg, bookmark) {
  allUnlockedCantos = unlockedCantos;
  allExtrasCantos   = extrasCantos_arg;
  unlockedMundos    = new Set(unlockedCantos.map(c => c.nivel));

  const all     = [...unlockedCantos, ...extrasCantos_arg];
  const content = document.getElementById('playlist-list-section');
  const totalEl = document.getElementById('total-cantos');
  if (totalEl) totalEl.textContent = all.length;

  if (!all.length) {
    if (content) content.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon">🎵</div>' +
        '<div class="empty-title">Aún no tienes cantos desbloqueados</div>' +

        '<button class="btn-orar" onclick="goTo(\'audio.html\')">Ir a orar</button>' +
      '</div>';
    navCantos = [DEMO_CANTO]; currentIdx = 0;
    updateHero(DEMO_CANTO); renderDots(); updateNavBtns();
    return;
  }

  allCantos = all.slice();  // modo "Todas" por defecto
  navCantos = allCantos.slice().sort((a,b) => a.nivel!==b.nivel ? a.nivel-b.nivel : a.cuaderno!==b.cuaderno ? a.cuaderno-b.cuaderno : a.bloqueIdx-b.bloqueIdx);

  if (bookmark) {
    const bi = navCantos.findIndex(c => c.nivel===bookmark.nivel && c.cuaderno===bookmark.cuaderno && c.bloqueIdx===bookmark.bloqueIdx);
    currentIdx = bi >= 0 ? bi : 0;
  } else {
    currentIdx = 0;
  }

  const SEEN_KEY = 'cruzando_cantos_seen_' + auth.currentUser?.uid;
  try { localStorage.setItem(SEEN_KEY, String(all.length)); } catch(e) {}

  if (content) content.innerHTML =
    '<div class="sort-bar">' +
      '<button class="sort-btn active" data-sort="nivel-asc"  onclick="setSortMode(\'nivel-asc\')">Nivel ↑</button>' +
      '<button class="sort-btn"        data-sort="nivel-desc" onclick="setSortMode(\'nivel-desc\')">Nivel ↓</button>' +
      '<button class="sort-btn"        data-sort="az"         onclick="setSortMode(\'az\')">A – Z</button>' +

    '</div>' +
    '<div class="cantos-list" id="cantos-list"></div>';

  renderList(document.getElementById('cantos-list'), sortedCantos());
  updateHero(navCantos[currentIdx]); renderDots(); updateNavBtns();
}

function escHTML(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Backfill: detecta bloques completados en progress/ y crea los unlockedCantos faltantes
async function backfillCantos(uid) {
  const base = location.origin + location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
  const BLOCK_IDX_MAP = { gozosos:1, luminosos:2, dolorosos:3, gloriosos:4 };
  const BLOCKS = ['gozosos','luminosos','dolorosos','gloriosos'];
  try {
    const progressSnap = await getDocs(collection(db, 'users', uid, 'progress'));
    for (const pDoc of progressSnap.docs) {
      const nivelId  = pDoc.id;
      const nivel    = parseInt(nivelId.slice(0, 2));
      const cuaderno = parseInt(nivelId.slice(2, 4));
      const prog     = (pDoc.data().progress) || {};
      for (const block of BLOCKS) {
        const slots = prog[block] || [];
        if (slots.length < 5 || !slots.every(v => v != null)) continue;
        const bloqueIdx = BLOCK_IDX_MAP[block];
        const cantoKey  = `${nivel}_${cuaderno}_${bloqueIdx}`;
        const existing  = await getDoc(doc(db, 'users', uid, 'unlockedCantos', cantoKey));
        if (existing.exists()) continue;
        try {
          const r = await fetch(base + 'data/' + nivelId + '-cantos.json');
          if (!r.ok) continue;
          const cantosData = await r.json();
          if (!cantosData.cantos?.[block]) continue;
          const letra  = cantosData.cantos[block].map(c => c.letra || '').join('\n\n───\n\n');
          const titulo = cantosData.cantos[block][0]?.titulo || block;
          await setDoc(doc(db, 'users', uid, 'unlockedCantos', cantoKey),
            { titulo, bloque: block, nivel, cuaderno, bloqueIdx, letra, unlockedAt: Date.now() });
        } catch(e) { console.warn('[backfill canto]', nivelId, block, e); }
      }
    }
  } catch(e) { console.warn('[backfill]', e); }
}

function _shouldShowInterstitial(plan) {
  if (plan !== 'free') return false;
  var hoy    = window.getTodayKey ? window.getTodayKey()
             : new Date().toISOString().slice(0,10);
  var ultimo = localStorage.getItem(INTERSTITIAL_KEY) || '';
  return ultimo !== hoy;
}

function _getInterstitialIdx() {
  var last = parseInt(localStorage.getItem('cruzando_interstitial_idx') || '-1');
  var next = (last + 1) % INTERSTITIAL_TOTAL;
  localStorage.setItem('cruzando_interstitial_idx', String(next));
  return next;
}

var _interstitialAudio = null;

function _showInterstitial(onClose, markAsShownToday) {
  var overlay = document.getElementById('interstitial-overlay');
  if (!overlay) { onClose(); return; }

  var idx  = _getInterstitialIdx();
  var url  = INTERSTITIAL_BASE + 'interstitial_0' + (idx + 1) + '.mp3';
  var text = INTERSTITIAL_TEXTS[idx];

  var bodyEl = document.getElementById('interstitial-body');
  if (bodyEl) bodyEl.innerHTML = text.replace(/\n\n/g, '<br><br>');

  overlay.style.display = 'flex';

  // Solo marcar "visto hoy" si es el interstitial inicial (no el periódico)
  if (markAsShownToday !== false) {
    var hoy = window.getTodayKey ? window.getTodayKey()
            : new Date().toISOString().slice(0,10);
    localStorage.setItem(INTERSTITIAL_KEY, hoy);
  }

  _interstitialAudio = new Audio(url);
  _interstitialAudio.play().catch(function(){});

  var skipBtn    = document.getElementById('interstitial-skip');
  var counterEl  = document.getElementById('interstitial-counter');
  var progressEl = document.getElementById('interstitial-progress');
  var skipSecs   = 10;
  var elapsed    = 0;

  var _ticker = setInterval(function() {
    elapsed++;
    var remaining = Math.max(0, skipSecs - elapsed);
    if (counterEl) counterEl.textContent = remaining > 0 ? remaining : '';
    if (elapsed >= skipSecs) {
      if (skipBtn)   skipBtn.style.display   = '';
      if (counterEl) counterEl.style.display = 'none';
      clearInterval(_ticker);
    }
  }, 1000);

  if (_interstitialAudio) {
    _interstitialAudio.addEventListener('timeupdate', function() {
      if (!_interstitialAudio.duration) return;
      var pct = (_interstitialAudio.currentTime / _interstitialAudio.duration) * 100;
      if (progressEl) progressEl.style.width = pct + '%';
    });
    _interstitialAudio.addEventListener('ended', function() {
      clearInterval(_ticker);
      if (skipBtn)    skipBtn.style.display   = '';
      if (counterEl)  counterEl.style.display = 'none';
      if (progressEl) progressEl.style.width  = '100%';
    });
  }

  window._closeInterstitial = function() {
    clearInterval(_ticker);
    if (_interstitialAudio) { _interstitialAudio.pause(); _interstitialAudio = null; }
    overlay.style.display = 'none';
    onClose();
  };
}

async function _loadCantos(user) {
  try {
    const [unlockedSnap, extrasSnap, bmarkSnap] = await Promise.all([
      getDocs(collection(db, 'users', user.uid, 'unlockedCantos')),
      getDocs(collection(db, 'users', user.uid, 'extrasCantos')).catch(() => null),
      getDoc(doc(db, 'users', user.uid, 'bookmark', 'currentCanto')).catch(() => null)
    ]);
    const unlockedCantos = [];
    const extrasCantos   = [];
    const bookmark = bmarkSnap?.exists() ? bmarkSnap.data() : null;
    unlockedSnap.forEach(d => { const data = d.data(); data._col = 'unlockedCantos'; data._docId = d.id; unlockedCantos.push(data); });
    if (extrasSnap) {
      let _ei = 0;
      extrasSnap.forEach(d => {
        const data     = d.data();
        data._col      = 'extrasCantos';
        data._docId    = d.id;
        data.titulo    = data.titulo || data.name || d.id;
        data.nivel     = parseInt(data.mundo, 10) || 99;
        data.cuaderno  = 0;
        data.bloqueIdx = _ei++;
        extrasCantos.push(data);
      });
    }

    // Si no hay cantos desbloqueados pero hay progreso, intentar backfill una vez
    if (unlockedCantos.length === 0) {
      await backfillCantos(user.uid);
      const snap2 = await getDocs(collection(db, 'users', user.uid, 'unlockedCantos'));
      snap2.forEach(d => { const data = d.data(); data._col = 'unlockedCantos'; data._docId = d.id; unlockedCantos.push(data); });
    }

    unlockedCantos.sort((a, b) => (b.unlockedAt || 0) - (a.unlockedAt || 0));
    renderCantos(unlockedCantos, extrasCantos, bookmark);
  } catch(e) {
    const errEl = document.getElementById('playlist-list-section');
    if (errEl) errEl.innerHTML =
      '<div class="empty-state"><div class="empty-icon">⚠️</div>' +
      '<div class="empty-title">Error al cargar</div>' +
      '<div class="empty-desc">' + e.message + '</div></div>';
  }

  // Timeout de seguridad
  setTimeout(() => {
    const c = document.getElementById('playlist-list-section');
    if (c && c.querySelector('.loading-state')) {
      c.innerHTML = '<div class="empty-state"><div class="empty-icon">🎵</div>' +
        '<div class="empty-title">Aún no tienes cantos</div>' +
        '<div class="empty-desc">Completa los 5 misterios de un bloque en modo audio.</div>' +
        '<button class="btn-orar" onclick="goTo(\'audio.html\')">Ir a orar</button></div>';
    }
  }, 8000);
}

<!-- ── Interstitial Free ── -->
<div id="interstitial-overlay" style="display:none;position:fixed;inset:0;
  background:var(--bg);z-index:9999;flex-direction:column;align-items:center;
  justify-content:center;padding:40px 28px;text-align:center;">

  <!-- Ícono CruzAndo -->
  <img src="icon-192.png" alt="CruzAndo"
    style="width:72px;height:72px;border-radius:50%;margin-bottom:24px;opacity:0.9;">

  <!-- Texto que se inyecta por JS -->
  <div id="interstitial-body" style="font-family:'Crimson Pro',Georgia,serif;
    font-size:22px;line-height:1.75;color:var(--text);max-width:340px;
    margin-bottom:40px;font-style:italic;">
  </div>

  <!-- Barra de progreso del audio -->
  <div style="width:100%;max-width:280px;height:3px;background:var(--border);
    border-radius:2px;margin-bottom:32px;overflow:hidden;">
    <div id="interstitial-progress" style="height:100%;background:var(--brand);
      width:0%;transition:width 0.5s linear;border-radius:2px;"></div>
  </div>

  <!-- Botón skip — aparece a los 10s -->
  <button id="interstitial-skip" onclick="window._closeInterstitial()"
    style="display:none;padding:12px 32px;border-radius:28px;border:1px solid var(--border);
    background:none;color:var(--text-dim);font-family:'Inter',sans-serif;
    font-size:0.85rem;cursor:pointer;-webkit-tap-highlight-color:transparent;">
    Continuar a la biblioteca →
  </button>

  <!-- Contador antes del skip -->
  <div id="interstitial-counter"
    style="font-family:'Inter',sans-serif;font-size:0.75rem;
    color:var(--text-dim);letter-spacing:1px;">
    10
  </div>

</div>

<script src="sounds.js"></script>
</body>
</html>
