<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#E6DED3;--card:#FFFCF7;--border:#D9D1C7;
  --text:#2B2622;--text-soft:#6B6259;--text-dim:#9B9389;
  --input-bg:#FFFCF7;--sec-bg:#F5F0E8;--shadow:rgba(43,38,34,0.08);
  --green:#34A853;--green-soft:rgba(52,168,83,0.12);
  --lvl-bold:#FF7A00;--lvl-base:#FF7F09;--lvl-soft:#F69C49;
  --lvl-mist:#FFA34E;--lvl-light:#FFCFA2;--lvl-ultra:rgba(255,122,0,0.07);
  --goz-color:#E8A0A0;--lum-color:#01BBE1;--dol-color:#C0392B;--glo-color:#D4A017;
  --brand:#01BBE1;
  --bg-rgb:230,222,211;
}
.dark{
  --bg:#1A1714;--card:#252119;--border:#3A3530;
  --text:#E6DED3;--text-soft:#B8A898;--text-dim:#786858;
  --input-bg:#2A2520;--sec-bg:#1E1B16;--shadow:rgba(0,0,0,0.3);
  --green-soft:rgba(52,168,83,0.18);
  --bg-rgb:26,23,20;
}
html{font-size:18px}
body{
  font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
  line-height:1.7;min-height:100dvh;-webkit-font-smoothing:antialiased;
  transition:background 0.4s,color 0.4s;
  background-image:
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.08'/></svg>"),
    linear-gradient(135deg,rgba(192,57,43,0.07) 0%,rgba(255,122,0,0.06) 60%,transparent 100%);
  background-size:200px 200px,100% 100%;background-blend-mode:multiply,normal;
}
.dark body{
  background-image:
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.07'/></svg>"),
    radial-gradient(ellipse at 20% 85%,rgba(255,122,0,0.11) 0%,transparent 55%);
  background-size:200px 200px,100% 100%;background-blend-mode:screen,normal;
}
.shell{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:72px}
.screen{display:none}
.screen.active{display:block}
#scr-orar.active{display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}

/* ── Header (home + micro) ── */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 10px;position:sticky;top:0;z-index:50;
  background:var(--bg);border-bottom:1px solid var(--border);
}
.header-title{font-size:1.05rem;font-weight:700;color:var(--lvl-bold)}
.header-sub{font-size:0.72rem;color:var(--text-dim);margin-top:1px}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:var(--card);cursor:pointer;display:flex;align-items:center;
  justify-content:center;color:var(--text-soft);transition:all 0.2s;
}
.icon-btn:active{transform:scale(0.92)}

/* ── Home ── */
.home-intro{padding:28px 18px 14px;text-align:center}
.home-intro h1{font-family:'Inter',sans-serif;font-size:0.62rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
.home-intro .nivel-heading{font-family:'Crimson Pro',Georgia,serif;font-size:1.1rem;font-weight:500;color:var(--lvl-bold);line-height:1.2;margin-bottom:6px;letter-spacing:0.5px}
.home-intro .elemento-heading{font-family:'Crimson Pro',Georgia,serif;font-size:2.8rem;font-weight:600;color:var(--text);line-height:1.05;letter-spacing:-0.01em}
.today-banner{margin:0 18px 16px;padding:16px 20px;border-radius:16px;background:linear-gradient(135deg,rgba(255,207,162,0.55),rgba(255,245,232,0.7));border:2px solid var(--lvl-bold);box-shadow:0 3px 16px rgba(255,122,0,0.1);cursor:pointer;transition:all 0.25s}
.dark .today-banner{background:linear-gradient(135deg,rgba(255,122,0,0.15),rgba(255,122,0,0.05))}
.today-banner:active{transform:scale(0.98)}
.today-banner-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.today-banner-label{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--lvl-bold);display:flex;align-items:center;gap:6px}
.today-pulse{width:8px;height:8px;border-radius:50%;background:var(--lvl-bold);animation:pulse 2s ease-in-out infinite}
.today-banner-arrow{color:var(--lvl-bold);font-size:1.2rem;font-weight:700}
.today-banner h3{font-size:1.1rem;font-weight:800;margin-bottom:3px}
.today-banner-days{font-size:0.72rem;color:var(--text-dim)}
.block-grid{display:flex;flex-direction:column;gap:14px;padding:8px 18px 24px}
.block-card{background:var(--card);border-radius:16px;padding:18px 20px;border:2px solid var(--border);cursor:pointer;transition:all 0.25s;position:relative;overflow:hidden}
.block-card:active{transform:scale(0.98)}
.block-card.cleared{border-color:var(--green)}
.block-card.current{border-color:var(--lvl-bold);box-shadow:0 2px 16px var(--lvl-ultra)}
.block-card.locked{opacity:0.5;cursor:default}
@keyframes todayPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,0,0.55),0 2px 16px var(--lvl-ultra)}50%{box-shadow:0 0 0 5px rgba(255,122,0,0),0 4px 24px rgba(255,122,0,0.2)}}
.block-card.today{border-color:var(--lvl-bold);background:radial-gradient(ellipse at top right,rgba(255,122,0,0.22) 0%,rgba(255,207,162,0.12) 40%,var(--card) 75%);animation:slideUp 0.55s cubic-bezier(0.34,1.72,0.64,1) both,todayPulse 2.4s ease-in-out 0.6s infinite}
.dark .block-card.today{background:radial-gradient(ellipse at top right,rgba(255,122,0,0.28) 0%,rgba(255,122,0,0.10) 45%,var(--card) 75%)}
.block-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.block-emoji{font-size:1.6rem}
.block-badge{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;padding:3px 10px;border-radius:20px}
.block-badge.pending{background:var(--sec-bg);color:var(--text-dim)}
.block-badge.progress{background:var(--lvl-ultra);color:var(--lvl-bold)}
.block-badge.cleared{background:var(--green-soft);color:var(--green)}
.block-badge.today{background:var(--lvl-bold);color:#fff}
.block-badge.locked-badge{background:var(--sec-bg);color:var(--text-dim)}
.block-title{font-size:1.05rem;font-weight:700;margin-bottom:2px}
.block-subtitle{font-size:0.78rem;color:var(--text-soft);font-style:italic}
.block-progress{margin-top:12px}
.block-dots{display:flex;gap:6px}
.block-dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:all 0.3s}
.block-dot.done{background:var(--green);box-shadow:0 0 6px rgba(52,168,83,0.4)}
.block-dot.active{background:var(--lvl-bold);box-shadow:0 0 8px var(--lvl-light)}
.block-locked-hint{font-size:0.72rem;color:var(--text-dim);margin-top:8px;font-style:italic}
.nivel-done-banner{margin:8px 18px 18px;padding:20px;border-radius:16px;background:linear-gradient(135deg,var(--green-soft),rgba(52,168,83,0.05));border:2px solid var(--green);text-align:center}
.nivel-done-banner h3{font-size:1.1rem;color:var(--green);margin-bottom:6px}
.nivel-done-banner p{font-size:0.82rem;color:var(--text-soft);margin-bottom:14px}
.nivel-switch-card{margin:0 18px 28px;padding:16px 18px;background:var(--card);border-radius:16px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all 0.2s;-webkit-tap-highlight-color:transparent}
.nivel-switch-card:active{transform:scale(0.98);border-color:var(--lvl-soft)}
.nivel-switch-left{display:flex;align-items:center;gap:12px}
.nivel-switch-icon{width:38px;height:38px;border-radius:10px;background:var(--lvl-ultra);border:1px solid var(--lvl-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nivel-switch-title{font-family:'Crimson Pro',Georgia,serif;font-size:1.1rem;font-weight:600;color:var(--text)}
.nivel-switch-sub{font-size:0.68rem;color:var(--text-dim);margin-top:1px}
.nivel-switch-arrow{color:var(--text-dim);font-size:1.1rem}

/* ── Botones ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border-radius:14px;border:none;cursor:pointer;font-family:inherit;font-size:0.88rem;font-weight:700;transition:all 0.2s;letter-spacing:0.3px}
.btn:active{transform:scale(0.96)}
.btn-primary{background:var(--lvl-bold);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,0.15)}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:transparent;border:2px solid var(--border);color:var(--text-soft)}
.btn-block{width:100%}

/* ── Micro ── */
.micro-screen{padding:0 18px 40px}
.micro-header{padding:16px 0 10px;display:flex;align-items:center;justify-content:space-between}
.micro-label{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--lvl-bold)}
.micro-sub{font-family:'Crimson Pro',Georgia,serif;font-size:1.2rem;font-weight:600;color:var(--text);margin-top:2px}
.micro-progress{display:flex;gap:6px;margin-bottom:16px}
.micro-dot{height:5px;border-radius:3px;background:var(--border);transition:all 0.4s ease}
.micro-dot.done{background:var(--green)}
.micro-dot.active{background:var(--lvl-bold)}
.micro-card{background:var(--card);border-radius:20px;padding:28px 22px;border:1.5px solid var(--border);animation:slideUp 0.45s cubic-bezier(0.34,1.72,0.64,1) both;min-height:220px;display:flex;flex-direction:column;justify-content:space-between}
.micro-card-emoji{font-size:2.2rem;margin-bottom:14px}
.micro-card-titulo{font-family:'Crimson Pro',Georgia,serif;font-size:1.55rem;font-weight:600;color:var(--lvl-bold);line-height:1.2;margin-bottom:12px}
.micro-card-contenido{font-family:'Crimson Pro',Georgia,serif;font-size:1.25rem;font-weight:400;line-height:1.75;color:var(--text);flex:1}
.micro-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}
.micro-card-count{font-size:0.68rem;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.8px}
.micro-q-card{background:var(--card);border-radius:20px;padding:24px 22px;border:1.5px solid var(--border);animation:slideUp 0.45s cubic-bezier(0.34,1.72,0.64,1) both}
.micro-q-label{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--lvl-bold);margin-bottom:14px}
.micro-q-texto{font-family:'Crimson Pro',Georgia,serif;font-size:1.4rem;font-weight:500;line-height:1.55;color:var(--text);margin-bottom:20px}
.micro-option{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--sec-bg);font-family:'Crimson Pro',Georgia,serif;font-size:1.2rem;font-weight:400;line-height:1.4;color:var(--text);cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;transition:all 0.25s;margin-bottom:10px}
.micro-option.selected{border-color:var(--lvl-bold);background:var(--lvl-ultra)}
.micro-option.dimmed{opacity:0.4;cursor:default;pointer-events:none}
.micro-option-circle{width:22px;height:22px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;transition:all 0.25s}
.micro-option.selected .micro-option-circle{background:var(--lvl-bold);border-color:var(--lvl-bold)}
.micro-eco{margin-top:16px;padding:14px 16px;background:var(--lvl-ultra);border-radius:14px;border-left:3px solid var(--lvl-soft);font-family:'Crimson Pro',Georgia,serif;font-size:1.15rem;font-weight:400;font-style:italic;color:var(--text);line-height:1.6;animation:fadeIn 0.4s ease both;display:flex;align-items:flex-start;gap:10px}
.micro-eco-emoji{font-size:1.3rem;flex-shrink:0}
.micro-final{text-align:center;padding:40px 0;animation:slideUp 0.55s cubic-bezier(0.34,1.72,0.64,1) both}
.micro-final-cross{margin:0 auto 24px;display:flex;align-items:center;justify-content:center;width:64px;height:64px}
.micro-final-titulo{font-family:'Crimson Pro',Georgia,serif;font-size:1.8rem;font-weight:600;color:var(--text);line-height:1.2;margin-bottom:12px}
.micro-final-sub{font-family:'Crimson Pro',Georgia,serif;font-size:1.2rem;color:var(--text-soft);line-height:1.65;margin:0 auto 28px;max-width:300px}
.micro-metros-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:20px;background:var(--green-soft);color:var(--green);font-size:0.82rem;font-weight:700;margin-bottom:28px}
.micro-nav{display:flex;gap:10px;margin-top:20px}
.micro-nav .btn{flex:1}

/* ── Celebración ── */
.celebration-screen{text-align:center;padding:40px 24px}
.maria-img{width:200px;height:200px;border-radius:50%;object-fit:cover;border:4px solid var(--lvl-soft);margin:0 auto 24px;box-shadow:0 8px 32px var(--shadow)}
.maria-placeholder{width:200px;height:200px;border-radius:50%;margin:0 auto 24px;background:linear-gradient(135deg,var(--lvl-ultra),var(--lvl-light));border:4px solid var(--lvl-soft);display:flex;align-items:center;justify-content:center;font-size:4rem;box-shadow:0 8px 32px var(--shadow)}
.celebration-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.9rem;font-weight:600;margin-bottom:8px;line-height:1.15}
.celebration-sub{font-size:0.88rem;color:var(--text-soft);margin-bottom:24px;line-height:1.7}

/* ── Loading / Error ── */
.loading-screen,.error-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80dvh;padding:40px 24px;text-align:center}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--lvl-bold);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:18px}

/* ── Confetti ── */
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;animation:confettiFall 2.5s ease-out forwards}
.grand-confetti{position:fixed;width:8px;height:8px;border-radius:50%;animation:confettiFall 2.5s ease-out forwards;pointer-events:none}

/* ── Animaciones ── */
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.4)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(22px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-4px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
@keyframes navSpring{0%{transform:scale(1)}35%{transform:scale(0.78)}65%{transform:scale(1.18)}82%{transform:scale(0.95)}100%{transform:scale(1)}}
.fade-in{animation:fadeIn 0.4s ease both}
.block-card.fade-in{animation:slideUp 0.55s cubic-bezier(0.34,1.72,0.64,1) both}
.block-card.fade-in-d1{animation-delay:0.05s}
.block-card.fade-in-d2{animation-delay:0.12s}
.block-card.fade-in-d3{animation-delay:0.19s}
.block-card.fade-in-d4{animation-delay:0.26s}

/* ── Bottom nav ── */
.app-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;z-index:250;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1)}
.app-nav.visible{transform:translateX(-50%) translateY(0)}
.app-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px 12px;background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:none;color:var(--text-dim);transition:color 0.2s;-webkit-tap-highlight-color:transparent}
.app-nav-item:active{opacity:1}
.app-nav-item.active{color:var(--lvl-bold)}
.app-nav-item[disabled]{cursor:default;opacity:1}
.app-nav-item.tapped .app-nav-icon{animation:navSpring 0.38s cubic-bezier(0.34,1.72,0.64,1) both}
.app-nav-item.tapped{color:var(--lvl-bold)}
.app-nav-icon{width:24px;height:24px;position:relative;display:flex;align-items:center;justify-content:center}
.app-nav-item.active .app-nav-icon::before{content:'';position:absolute;inset:-5px;background:rgba(255,122,0,0.12);border-radius:10px}
.nav-hide-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px 12px;background:none;border:none;cursor:pointer;font-family:inherit;color:var(--text-dim);transition:color 0.2s;-webkit-tap-highlight-color:transparent}
.nav-hide-btn:active{opacity:0.6}
.nav-hide-icon{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:var(--text-dim)}
.app-nav-label{font-size:0.6rem;font-weight:600;letter-spacing:0.4px;text-transform:uppercase}

/* ── Gamificación ── */
.lux-container{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.lux-svg{width:24px;height:24px;filter:drop-shadow(0 0 2px #FFFCF7);animation:luxBreathe 3s ease-in-out infinite}
.lux-svg.shine{animation:luxBreathe 3s ease-in-out infinite,luxShine 0.6s ease-out}
.lux-svg.spin{animation:luxSpin 2s linear}
@keyframes luxBreathe{0%,100%{transform:scale(1);opacity:0.9}50%{transform:scale(1.08);opacity:1}}
@keyframes luxShine{0%,100%{filter:drop-shadow(0 0 2px #FFFCF7)}50%{filter:drop-shadow(0 0 16px #FFFCF7)}}
@keyframes luxSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.lux-particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#FFFCF7;left:50%;top:50%;opacity:0.8;animation:luxParticleFly 1.5s ease-out forwards;pointer-events:none}
@keyframes luxParticleFly{0%{transform:translate(0,0) scale(1);opacity:0.8}100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
.meters-display{display:flex;align-items:center;gap:6px;background:var(--sec-bg);padding:6px 12px;border-radius:12px;border:1.5px solid var(--border)}
.meters-display span{font-size:0.82rem;font-weight:700;color:var(--lvl-bold)}
.mariano-overlay{position:fixed;top:0;right:0;bottom:0;width:100%;pointer-events:none;z-index:90;display:flex;align-items:center;justify-content:flex-end;padding-right:20px}
.mariano-slide{width:182px;height:auto;animation:marianoSlide 2.5s ease-in-out}
@keyframes marianoSlide{0%{transform:translateX(200px);opacity:0}30%{transform:translateX(0);opacity:1}70%{transform:translateX(0);opacity:1}100%{transform:translateX(200px);opacity:0}}
.meters-float{position:absolute;top:50%;right:220px;font-size:1rem;font-weight:800;color:var(--green);text-shadow:0 2px 8px rgba(52,168,83,0.4);animation:metersFloat 2.5s ease-out}
.meters-float .extra-badge{display:block;font-size:0.58rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#FFD700;text-shadow:0 1px 6px rgba(255,215,0,0.5);margin-bottom:2px}
@keyframes metersFloat{0%{transform:translateY(0);opacity:0}30%{opacity:1}70%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.mariano-grand-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:101;pointer-events:none}
.mariano-grand-container{position:relative;width:260px;height:260px}
.mariano-grand{width:260px;height:auto;margin-bottom:20px;animation:popScale 0.6s cubic-bezier(0.68,-0.55,0.265,1.55) forwards}
@keyframes popScale{0%{transform:scale(0);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
.mariano-grand-lux{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.mariano-grand-lux svg{width:32px;height:32px}
.mariano-grand-lux.orbit1 svg{animation:luxOrbit1 3s ease-in-out infinite}
.mariano-grand-lux.orbit2 svg{animation:luxOrbit2 3s ease-in-out infinite}
.mariano-grand-lux.orbit3 svg{animation:luxOrbit3 3s ease-in-out infinite}
.mariano-grand-lux.orbit4 svg{animation:luxOrbit4 3s ease-in-out infinite}
@keyframes luxOrbit1{0%{transform:rotate(0deg) translateX(120px) rotate(0deg) scale(1)}25%{transform:rotate(90deg) translateX(120px) rotate(-90deg) scale(1.5)}50%{transform:rotate(180deg) translateX(120px) rotate(-180deg) scale(1)}75%{transform:rotate(270deg) translateX(120px) rotate(-270deg) scale(1.5)}100%{transform:rotate(360deg) translateX(120px) rotate(-360deg) scale(1)}}
@keyframes luxOrbit2{0%{transform:rotate(45deg) translateX(120px) rotate(-45deg) scale(1)}25%{transform:rotate(135deg) translateX(120px) rotate(-135deg) scale(1.6)}50%{transform:rotate(225deg) translateX(120px) rotate(-225deg) scale(1)}75%{transform:rotate(315deg) translateX(120px) rotate(-315deg) scale(1.6)}100%{transform:rotate(405deg) translateX(120px) rotate(-405deg) scale(1)}}
@keyframes luxOrbit3{0%{transform:rotate(0deg) translateX(120px) rotate(0deg) scale(1.3)}33%{transform:rotate(120deg) translateX(120px) rotate(-120deg) scale(1)}66%{transform:rotate(240deg) translateX(120px) rotate(-240deg) scale(1.7)}100%{transform:rotate(360deg) translateX(120px) rotate(-360deg) scale(1.3)}}
@keyframes luxOrbit4{0%{transform:rotate(90deg) translateX(120px) rotate(-90deg) scale(1.2)}20%{transform:rotate(162deg) translateX(120px) rotate(-162deg) scale(1.5)}40%{transform:rotate(234deg) translateX(120px) rotate(-234deg) scale(1)}60%{transform:rotate(306deg) translateX(120px) rotate(-306deg) scale(1.6)}80%{transform:rotate(378deg) translateX(120px) rotate(-378deg) scale(1.1)}100%{transform:rotate(450deg) translateX(120px) rotate(-450deg) scale(1.2)}}
.mariano-grand-meters{text-align:center;color:#fff;font-size:1.55rem;font-weight:800;text-shadow:0 4px 16px rgba(0,0,0,0.5);margin-top:20px}
.mariano-grand-text{text-align:center;color:#fff;font-size:1rem;margin-top:8px;text-shadow:0 2px 8px rgba(0,0,0,0.5)}

/* ══════════════════════════════════════
   ZONA A — Hero del Misterio
   ══════════════════════════════════════ */
.misterio-hero{flex:1;min-height:0;position:relative;overflow:hidden;background:rgb(var(--bg-rgb));display:flex;align-items:center;justify-content:center;}
.misterio-hero-img{width:100%;height:auto;max-height:100%;object-fit:contain;object-position:center;display:block;}
.hero-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0.18}
.misterio-hero-grad {
  position: absolute; bottom: 0; left: 0; right: 0; height: 75%;
  background: linear-gradient(
    to top,
    rgba(var(--bg-rgb), 1.00)  0%,
    rgba(var(--bg-rgb), 0.90) 15%,
    rgba(var(--bg-rgb), 0.60) 35%,
    rgba(var(--bg-rgb), 0.20) 60%,
    rgba(var(--bg-rgb), 0.05) 80%,
    transparent               100%
  );
  pointer-events: none; z-index: 2;
}
.misterio-hero-grad-top {
  position: absolute; top: 0; left: 0; right: 0; height: 60%;
  background: linear-gradient(
    to bottom,
    rgba(var(--bg-rgb), 1.00)  0%,
    rgba(var(--bg-rgb), 0.80) 25%,
    rgba(var(--bg-rgb), 0.40) 50%,
    rgba(var(--bg-rgb), 0.10) 75%,
    transparent               100%
  );
  pointer-events: none; z-index: 2;
}
.misterio-hero-text{position:absolute;bottom:16px;left:18px;right:18px;z-index:3;pointer-events:none}
.misterio-bloque-label{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--lvl-bold);margin-bottom:4px}
.misterio-titulo{font-family:'Cormorant Garamond',Georgia,serif;font-size:2rem;font-weight:600;color:#fff;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,0.9),0 4px 16px rgba(0,0,0,0.85),0 8px 32px rgba(0,0,0,0.7);margin-bottom:4px}
.misterio-subtitulo{font-family:'Cormorant Garamond',Georgia,serif;font-size:1rem;font-style:italic;color:rgba(255,255,255,0.75);text-shadow:0 1px 3px rgba(0,0,0,0.9),0 3px 12px rgba(0,0,0,0.8)}
.hero-beads{margin-top:8px;pointer-events:auto}

/* Botones circulares sobre la imagen */
.hero-btn{position:absolute;top:14px;width:43px;height:43px;border-radius:50%;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;color:rgba(230,222,211,0.85);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);-webkit-tap-highlight-color:transparent;transition:background 0.2s;z-index:4;touch-action:manipulation}
.hero-btn svg{width:19px;height:19px}
.hero-btn:active{background:rgba(0,0,0,0.55)}
.hero-btn-left{left:14px}
.hero-btn-right{right:14px}
.hero-btn.bgm-on{background:rgba(255,122,0,0.5);border-color:rgba(255,122,0,0.7)}
/* ── Preparación en el hero (pill) ── */
.prep-hero{position:absolute;top:14px;left:66px;right:66px;z-index:10}
.prep-hero-btn{width:100%;height:43px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;background:rgba(0,0,0,0.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:22px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden}
.prep-hero-btn:active{opacity:0.7}
.prep-hero-kicker{font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--lvl-bold);flex-shrink:0}
.prep-hero-name{font-size:0.75rem;color:rgba(255,255,255,0.8);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-mystery-nav{position:absolute;top:50%;transform:translateY(-50%);left:0;right:0;display:flex;justify-content:space-between;padding:0 8px;pointer-events:none;z-index:10}
.hero-nav-btn{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,0.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1.5px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.85);cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background 0.15s,transform 0.15s}
.hero-nav-btn:active{background:rgba(0,0,0,0.55);transform:scale(0.92)}

/* ══════════════════════════════════════
   ZONA B — Barra de herramientas
   ══════════════════════════════════════ */
.tools-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  z-index:5;
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 12px env(safe-area-inset-bottom,8px);
  background:var(--tools-bar-bg,var(--card));
  border-top:1px solid var(--border);
}
/* ── Variables de contraste para toolbar (dark default → light override) ── */
:root{--tb-circle-bg:rgb(var(--bg-rgb));--tb-circle-border:rgba(255,255,255,0.45);--tb-icon:rgba(255,255,255,0.75);--tb-bead:rgba(255,255,255,0.22)}
body.light{--tb-circle-bg:var(--card);--tb-circle-border:var(--border);--tb-icon:var(--text-dim);--tb-bead:var(--card)}
.tool-btn{display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0;touch-action:manipulation}
.tool-btn-circle{width:48px;height:48px;border-radius:50%;border:3px solid var(--tb-circle-border);background:rgb(var(--bg-rgb));display:flex;align-items:center;justify-content:center;color:var(--tb-icon);transition:background 0.2s,border-color 0.2s,color 0.2s,transform 0.15s;position:relative;z-index:1}
.tool-btn.active .tool-btn-circle{background:var(--lvl-bold);border-color:var(--lvl-bold);color:#fff}
.tool-btn:active .tool-btn-circle{transform:scale(0.92)}
/* Línea de rosario que atraviesa los círculos */
.tools-bar::before{content:'';position:absolute;top:32px;left:0;right:0;height:1.5px;background:var(--tb-bead);z-index:0}

/* ══════════════════════════════════════
   POPUP — Bottom sheet sobre zona A
   ══════════════════════════════════════ */
.tool-popup{
  position:absolute;bottom:0;left:0;right:0;top:0;
  background:var(--bg);
  border-radius:20px 20px 0 0;
  transform:translateY(100%);
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
  z-index:20;
  display:flex;flex-direction:column;overflow:hidden;
}
.tool-popup.open{transform:translateY(0)}
.tool-popup-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px 10px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.popup-title{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim)}
.popup-close-btn,.popup-voice-btn{
  width:68px;height:68px;border-radius:50%;background:var(--sec-bg);
  border:1.5px solid var(--border);display:flex;align-items:center;
  justify-content:center;cursor:pointer;color:var(--text-soft);
  -webkit-tap-highlight-color:transparent;transition:background 0.15s;
  flex-shrink:0;
}
.popup-close-btn:active,.popup-voice-btn:active{background:var(--border)}
.popup-voice-btn.playing{background:var(--lvl-ultra);border-color:var(--lvl-bold);color:var(--lvl-bold)}
.tool-popup-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 20px 24px;color:var(--text)}

/* Contenido del popup — modo libro */
.popup-text{font-family:'Crimson Pro',Georgia,serif;font-size:36px;line-height:1.7;color:var(--text)}
.popup-reference{font-family:'Crimson Pro',Georgia,serif;font-size:26px;color:var(--text-dim);font-style:italic;margin-bottom:12px}
.popup-song-title{font-family:'Crimson Pro',Georgia,serif;font-size:36px;font-weight:600;color:var(--text);margin-bottom:14px}
.popup-lyrics{white-space:pre-line;font-family:'Crimson Pro',Georgia,serif;font-size:36px;line-height:1.7;font-style:italic;color:var(--text)}
.q-block{margin-bottom:28px}
.q-label{font-size:0.66rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.q-question{font-family:'Crimson Pro',Georgia,serif;font-size:36px;font-weight:500;line-height:1.7;color:var(--text-soft);font-style:italic;margin-bottom:12px}
.q-textarea{width:100%;min-height:110px;max-height:35vh;resize:vertical;overflow-y:auto;padding:14px;background:var(--sec-bg);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:'Crimson Pro',Georgia,serif;font-size:30px;line-height:1.7}
.q-textarea:focus{border-color:var(--lvl-soft);outline:none}
.q-saved{font-size:0.72rem;color:var(--green);margin-top:5px;min-height:26px}
.amen-btn{display:block;width:100%;margin-top:24px;padding:18px;border-radius:16px;border:none;cursor:pointer;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.6rem;font-weight:600;background:var(--lvl-bold);color:#fff;letter-spacing:1px;transition:all 0.2s;box-shadow:0 4px 16px rgba(0,0,0,0.12)}
.amen-btn:active{transform:scale(0.96)}
.amen-btn.done{background:var(--green)}
.mystery-done-pill{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--green-soft);border-radius:14px;border:1.5px solid rgba(52,168,83,0.2);margin-top:20px}
.mystery-done-pill .done-check{color:var(--green);font-size:1.2rem}
.mystery-done-pill .done-txt{font-size:0.82rem;font-weight:600;color:var(--green)}
.mystery-done-pill .done-date{font-size:0.72rem;color:var(--text-dim)}

/* ── Voice player — barra estilo audio.html ── */
.voice-player{
  position:fixed;bottom:calc(64px + env(safe-area-inset-bottom,0px));left:0;right:0;
  background:var(--bg);border-top:1px solid var(--border);
  padding:6px 0 8px;z-index:200;animation:slideUp 0.25s ease;
}
.voice-player-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:0 18px 4px;
}
.voice-player-tool{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--lvl-bold)}
.vp-progress-wrap{
  display:flex;align-items:center;gap:12px;padding:0 18px 6px;
}
.vp-progress-bar{
  flex:1;height:4px;background:var(--border);border-radius:3px;
  cursor:pointer;position:relative;overflow:visible;
}
.vp-progress-fill{
  height:100%;background:var(--lvl-bold);border-radius:3px;
  width:0%;transition:width 0.1s linear;position:relative;
}
.vp-progress-fill::after{
  content:'';position:absolute;right:-5px;top:-4px;
  width:12px;height:12px;background:var(--lvl-bold);
  border-radius:50%;opacity:0;transition:opacity 0.2s;
}
.vp-progress-bar:hover .vp-progress-fill::after{opacity:1}
.vp-time{font-size:0.68rem;color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.voice-player-controls{
  display:flex;justify-content:space-around;align-items:center;
  padding:0 12px;position:relative;
}
.voice-player-controls::before{
  content:'';position:absolute;top:24px;left:0;right:0;
  height:1.5px;background:var(--tb-bead);z-index:0;
}
.vp-btn{
  background:none;border:none;cursor:pointer;padding:0;
  -webkit-tap-highlight-color:transparent;
}
.vp-btn:active .vp-circle{transform:scale(0.9)}
.vp-circle{
  width:48px;height:48px;border-radius:50%;
  border:3px solid var(--tb-circle-border);
  background:rgb(var(--bg-rgb));
  display:flex;align-items:center;justify-content:center;
  color:var(--tb-icon);position:relative;z-index:1;
  transition:all 0.2s;font-size:0.7rem;font-weight:700;font-family:inherit;
}
.vp-circle.primary{
  background:var(--lvl-bold);border-color:var(--lvl-bold);color:#fff;
  box-shadow:0 4px 16px rgba(255,122,0,0.45);
}
.vp-speed-wrap{position:relative;z-index:1}
.vp-speed{
  background:rgb(var(--bg-rgb));border:3px solid var(--tb-circle-border);
  border-radius:24px;color:var(--tb-icon);font-size:0.7rem;
  font-weight:700;padding:6px 10px;cursor:pointer;font-family:inherit;
}

/* ── Onboarding tip ── */
.onboarding-tip{position:absolute;bottom:-40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.78);color:#fff;padding:7px 16px;border-radius:20px;font-size:0.78rem;font-weight:600;pointer-events:none;z-index:50;white-space:nowrap;animation:fadeInOut 3s ease forwards}

@media(max-width:380px){html{font-size:16px}}
.nav-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:1;padding:10px 4px 12px;text-decoration:none;color:var(--text-muted)}
.nav-tab .app-nav-icon svg{width:22px;height:22px}
.nav-tab-label{font-size:0.6rem;font-weight:600;letter-spacing:0.4px;text-transform:uppercase;font-family:inherit}
#tab-toggle-audio,#tab-toggle-texto{color:var(--lvl-bold)}
</style>
<script src="plan-utils.js"></script>
</head>
<body>
<div class="shell" id="app">

  <!-- Loading -->
  <div class="loading-screen" id="scr-loading">
    <div class="spinner"></div>
    <p style="font-size:0.88rem;color:var(--text-dim)">Cargando nivel…</p>
  </div>

  <!-- Error -->
  <div class="error-screen" id="scr-error" style="display:none">
    <div style="font-size:3rem;margin-bottom:16px">📿</div>
    <h2 style="font-size:1.1rem;margin-bottom:8px">No se encontró el nivel</h2>
    <p id="error-msg" style="font-size:0.82rem;color:var(--text-dim);margin-bottom:20px"></p>
    <a href="?c=0101" class="btn btn-primary">Ir a Nivel 1-1</a>
  </div>

  <!-- Header (home + micro) -->
  <header class="header" id="main-header" style="display:none">
    <div>
      <div class="header-title" id="h-title"></div>
      <div class="header-sub" id="h-sub"></div>
    </div>
    <div class="header-actions">
      <div class="meters-display" id="meters-display">
        <span>🚶‍♂️</span><span id="meters-value">0m</span>
      </div>
      <div class="lux-container" id="lux-container">
        <svg class="lux-svg" id="lux-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs><filter id="luxGlow"><feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter></defs>
          <g filter="url(#luxGlow)">
            <rect x="46.1926" y="0.285" width="7.6148" height="99.43" fill="#FFFCF7"/>
            <rect x="0" y="46.2068" width="100" height="7.5864" fill="#FFFCF7"/>
          </g>
        </svg>
      </div>
      <button class="icon-btn" id="btn-dark" title="Modo">
        <svg id="ico-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="ico-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- ═══ MICRO-APRENDIZAJE ═══ -->
  <div class="screen" id="scr-micro">
    <div class="micro-screen">
      <div class="micro-header">
        <div>
          <div class="micro-label" id="micro-label">Prepara tu corazón</div>
          <div class="micro-sub" id="micro-sub"></div>
        </div>
      </div>
      <div class="micro-progress" id="micro-progress"></div>
      <div id="micro-content"></div>
      <div class="micro-nav" id="micro-nav"></div>
    </div>
  </div>

  <!-- ═══ ORACIÓN — 3 zonas ═══ -->
  <div class="screen" id="scr-orar">

    <!-- Zona A: Hero + Popup -->
    <div class="misterio-hero" id="misterio-hero">
      <img class="misterio-hero-img" id="hero-img" src="" alt="">
      <div class="hero-placeholder" id="hero-ph" style="display:none">
        <svg viewBox="0 0 100 100" width="64" height="64" fill="none">
          <rect x="46" y="5" width="8" height="90" fill="rgba(230,222,211,0.3)"/>
          <rect x="5" y="42" width="90" height="8" fill="rgba(230,222,211,0.3)"/>
        </svg>
      </div>
      <div class="misterio-hero-grad" id="hero-grad"></div>
      <div class="misterio-hero-grad-top"></div>
      <div class="misterio-hero-text">
        <div class="misterio-bloque-label" id="hero-bloque-label"></div>
        <div class="misterio-titulo" id="hero-titulo"></div>
        <div class="misterio-subtitulo" id="hero-subtitulo"></div>
        <div class="hero-beads" id="hero-beads"></div>

const BLOCKS = ['gozosos','luminosos','dolorosos','gloriosos'];
const BN  = {gozosos:'Gozosos',luminosos:'Luminosos',dolorosos:'Dolorosos',gloriosos:'Gloriosos'};
const BFN = {gozosos:'Misterios Gozosos',luminosos:'Misterios Luminosos',dolorosos:'Misterios Dolorosos',gloriosos:'Misterios Gloriosos'};
const BEM = {gozosos:'🌟',luminosos:'✨',dolorosos:'✝️',gloriosos:'👑'};
const BCL = {gozosos:'#E8A0A0',luminosos:'#01BBE1',dolorosos:'#C0392B',gloriosos:'#D4A017'};
const BCL_RGB = {gozosos:'232,160,160',luminosos:'1,187,225',dolorosos:'192,57,43',gloriosos:'212,160,23'};
function applyBlockAccent(block){
  const c=BCL[block]||BCL.gozosos, r=BCL_RGB[block]||BCL_RGB.gozosos;
  const root=document.documentElement;
  root.style.setProperty('--lvl-bold',c);
  root.style.setProperty('--lvl-soft',c);
  root.style.setProperty('--lvl-ultra',`rgba(${r},0.10)`);
}
const BFM = {gozosos:1,luminosos:6,dolorosos:11,gloriosos:16};
const TBG = {gozosos:'rgba(232,160,160,0.18)',luminosos:'rgba(1,187,225,0.15)',dolorosos:'rgba(192,57,43,0.15)',gloriosos:'rgba(212,160,23,0.15)'};
const TN  = {palabra:'La Palabra',contemplar:'Contemplar',rezo:'Rezo',canto:'Canto',escribir:'Escribir',suplica:'Súplica'};
const TOOL_ORDER = ['palabra','contemplar','rezo','canto','escribir','suplica'];
const QL  = ['Por María hacia Jesús:','Desde el Hijo hacia el Padre:','Hijos y hermanos en el Espíritu:'];
const QC  = ['#FF7A00','#C0392B','#27AE60'];
const MR_REZO=1200, MR_CONT=800, MR_CANTO=600, MR_QF=650, MR_QU=325, MR_BNS=1000, MR_MICRO=600;

/* ─── STATE ─── */
let usr=null, data=null, cantoJ=null, microJ=null;

let blk=null, bIdx=0;

let ans={0:'',1:'',2:''}, ansT={}, firstAns={0:false,1:false,2:false};
let awd=new Set();

/* ─── MYSTERY NAV HELPERS ─── */
const BLOCK_START={gozosos:1,luminosos:6,dolorosos:11,gloriosos:16};
function getMysteryBlock(n){
  if(n<=5)  return{block:'gozosos',  idx:n-1};
  if(n<=10) return{block:'luminosos',idx:n-6};
  if(n<=15) return{block:'dolorosos',idx:n-11};
  return          {block:'gloriosos',idx:n-16};
}
function loadMystery(block,idx){blk=block;bIdx=idx;renderSession();}
function updateNavBtns(){
  const prev=$('btn-prev-mystery'),next=$('btn-next-mystery');
  if(prev) prev.style.opacity=currentGlobalMystery>1 ?'1':'0.3';
  if(next) next.style.opacity=currentGlobalMystery<20?'1':'0.3';
}
function updateToggleHref(){
  const tab=$('tab-toggle-audio');
  if(tab) tab.href=`audio.html?nivel=${nivel}&cuaderno=${cua}&misterio=${currentGlobalMystery}`;
}
function goPrevMystery(){
  if(currentGlobalMystery<=1){goTo('index.html');return;}
  const{block,idx}=getMysteryBlock(--currentGlobalMystery);
  loadMystery(block,idx);
}
function goNextMystery(){
  if(currentGlobalMystery>=20){showAdvanceLevelPrompt();return;}
  const{block,idx}=getMysteryBlock(++currentGlobalMystery);
  loadMystery(block,idx);
}
async function markMysteryComplete(block,idx){
  const prev=blk,prevIdx=bIdx;
  blk=block;bIdx=idx;
  await completeMystery();
  blk=prev;bIdx=prevIdx;
}

  let n=nivel,c=cua+1;
  if(c>4){c=1;n++;}
  const nId=String(n).padStart(2,'0')+String(c).padStart(2,'0');
  $('celeb-title').textContent='¡Veinte Misterios completados!';
  $('celeb-sub').textContent='Has rezado los 20 misterios de este cuaderno. ¡Magnífico camino!';
  $('btn-celeb-home').onclick=()=>loadCuaderno(nId);
  show('scr-celebration');
}
async function loadCuaderno(nId){
  showLoading();
  nivelId=nId;nivel=parseInt(nivelId.slice(0,2))||1;cua=parseInt(nivelId.slice(2,4))||1;
  const base=location.origin+location.pathname.substring(0,location.pathname.lastIndexOf('/')+1);
  try{const r=await fetch(base+'data/'+nivelId+'.json');if(r.ok)data=await r.json();}catch(e){}
  try{const r=await fetch(base+'data/'+nivelId+'-cantos.json');if(r.ok)cantoJ=await r.json();}catch(e){}
  try{const snap=await FS.collection('users').doc(usr.uid).collection('progress').doc(nivelId).get();prog=snap.exists?snap.data():{};}catch(e){prog={};}
  // Elegir primer bloque/misterio incompleto del nuevo nivel
  const pBlk=prog?.progress||{};let found=false;
  for(const b of BLOCKS){
    const dots=pBlk[b]||[null,null,null,null,null];
    const done=dots.filter(Boolean).length;
    if(done<5){blk=b;bIdx=Math.min(done,4);found=true;break;}
  }
  if(!found){blk=BLOCKS[0];bIdx=0;}
  await checkMicro();
}

/* ─── UTILS ─── */
const $=id=>document.getElementById(id);

/* ─── THEME ─── */
function initTheme(){applyTheme(localStorage.getItem('cruzando_theme')||'dark');}
function applyTheme(t){
  document.body.classList.toggle('dark',t==='dark');

}

/* ─── NAV ─── */
function goTo(pg){
  if(libro){libro.pause();libro.src='';}
  if(bgmEl) bgmEl.pause();
  location.href=location.origin+location.pathname.substring(0,location.pathname.lastIndexOf('/')+1)+pg;
}
let _nc=0;
function playNavChord(){
  const CH=[[523,659,784],[659,784,988],[784,988,1175],[587,740,880]];
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)(),now=ac.currentTime,notes=CH[_nc++%4];
    const mg=ac.createGain();mg.gain.setValueAtTime(0,now);mg.gain.linearRampToValueAtTime(0.07,now+0.018);mg.gain.exponentialRampToValueAtTime(0.001,now+0.4);mg.connect(ac.destination);
    notes.forEach((f,j)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=j?'triangle':'sine';o.frequency.value=f;g.gain.value=j?0.5:0.8;o.connect(g);g.connect(mg);o.start(now+j*0.012);o.stop(now+0.45);});
  }catch(e){}
}

/* ─── FIREBASE (compat) ─── */
const FS=_db;
const FSV=firebase.firestore.FieldValue;

async function addMeters(m){
  totalM+=m;
  const stored=parseInt(localStorage.getItem('cruzando_total_metros')||'0');
  localStorage.setItem('cruzando_total_metros',stored+m);
  const mv=$('meters-value'); if(mv) mv.textContent=totalM.toLocaleString('es-MX')+'m';
  // Siempre persistir en localStorage — fuente de verdad para el odómetro
  const todayKey=getTodayKey();
  const _hist=JSON.parse(localStorage.getItem('cruzando_daily_hist')||'{}');
  _hist[todayKey]=(_hist[todayKey]||0)+m;
  localStorage.setItem('cruzando_daily_hist',JSON.stringify(_hist));
  if(!usr) return;
  try{await FS.collection('users').doc(usr.uid).update({totalMeters:FSV.increment(m)});}
  catch(e){try{await FS.collection('users').doc(usr.uid).set({totalMeters:m},{merge:true});}catch(e2){}}
  const dailyRef=FS.collection('users').doc(usr.uid).collection('dailyGoal').doc('data');
  try{await dailyRef.update({[`historial.${todayKey}`]:FSV.increment(m)});}
  catch(e){try{await dailyRef.set({historial:{[todayKey]:m}},{merge:true});}catch(e2){}}
}

/* ─── PARSE QUESTIONS ─── */
function parseQ(text){
  if(!text) return ['','',''];
  const out=[];let rem=text;
  QL.forEach((lbl,i)=>{
    const idx=rem.indexOf(lbl);
    if(idx>=0){if(i>0)out.push(rem.substring(0,idx).trim());rem=rem.substring(idx+lbl.length).trim();}
  });
  out.push(rem.trim());
  while(out.length<3)out.push('');
  return out.slice(0,3);
}

  try{const r=await fetch(base+'data/'+nivelId+'.json');if(r.ok)data=await r.json();}catch(e){}
  try{const r=await fetch(base+'data/'+nivelId+'-cantos.json');if(r.ok)cantoJ=await r.json();}catch(e){}

function initAuth(){

async function loadAndStart(){
  showLoading();
  const p=new URLSearchParams(location.search);
  nivelId=p.get('c')||'0101';
  nivel=parseInt(nivelId.slice(0,2))||1;
  cua=parseInt(nivelId.slice(2,4))||1;

  try{
    const snap=await FS.collection('users').doc(usr.uid).get();
    const ud=snap.exists?snap.data():{};
    const _plan=window.effectivePlan?window.effectivePlan():(window.resolvePlan?window.resolvePlan(ud):'free');
    if(window.requirePremiumAccess&&!window.requirePremiumAccess('libro',_plan))return;
    totalM=ud.totalMeters||0;
    const mv=$('meters-value');if(mv)mv.textContent=totalM.toLocaleString('es-MX')+'m';
  }catch(e){}

  const base=location.origin+location.pathname.substring(0,location.pathname.lastIndexOf('/')+1);
  try{const r=await fetch(base+'data/'+nivelId+'.json');if(r.ok)data=await r.json();}catch(e){}
  try{const r=await fetch(base+'data/'+nivelId+'-cantos.json');if(r.ok)cantoJ=await r.json();}catch(e){}

  try{
    const snap=await FS.collection('users').doc(usr.uid).collection('progress').doc(nivelId).get();
    prog=snap.exists?snap.data():{};
  }catch(e){prog={};}

  const bParam=p.get('b'),mParam=p.get('m');
  if(bParam&&BLOCKS.includes(bParam)){
    blk=bParam; bIdx=Math.max(0,Math.min(4,parseInt(mParam||'0')-BFM[bParam]));
  } else {
    // Sin bloque explícito: elegir el primer bloque/misterio incompleto del progreso
    const pBlk=prog?.progress||{};
    let found=false;
    for(const b of BLOCKS){
      const dots=pBlk[b]||[null,null,null,null,null];
      const done=dots.filter(Boolean).length;
      if(done<5){blk=b;bIdx=Math.min(done,4);found=true;break;}
    }
    if(!found){blk=BLOCKS[0];bIdx=0;} // todos completados → empezar desde el inicio
  }
  await checkMicro();
}

/* ─── MICRO CHECK ─── */
async function checkMicro(){
  showLoading();
  const m=mNum(blk,bIdx),isFirst=[1,6,11,16].includes(m);
  if(isFirst&&prefs().microInAudio!==false){
    if(!microJ){
      const base=location.origin+location.pathname.substring(0,location.pathname.lastIndexOf('/')+1);
      try{const r=await fetch(base+'data/'+nivelId+'-micro.json');if(r.ok)microJ=await r.json();}catch(e){}
    }
    microDone=(prog?.microDone||{})[blk]===true;
    if(microJ?.bloques?.[blk]&&!microDone){renderMicro();return;}
  }
  renderSession();
}

/* ─── MICRO ─── */
function renderMicro(){
  const bloque=microJ.bloques[blk];
  const tarj=bloque.tarjetas||[],pregs=bloque.preguntas||[],tot=tarj.length+pregs.length;
  let step=0,sel=null;
  $('micro-label').textContent='Prepara tu corazón · '+BN[blk];
  $('micro-sub').textContent=bloque.subtitulo||'';

  function dots(){
    $('micro-progress').innerHTML=Array.from({length:tot},(_,i)=>
      `<div class="micro-dot ${i<step?'done':i===step?'active':''}" style="width:${i===step?'24px':'8px'};flex:${i===step?'0 0 24px':'1'}"></div>`).join('');
  }
  function render(){
    sel=null;dots();
    const body=$('micro-content'),nav=$('micro-nav');
    if(step>=tot){
      const c=BCL[blk]||'#FF7A00';
      body.innerHTML=`<div class="micro-final">
        <div class="micro-final-cross"><svg viewBox="0 0 100 100" width="48" height="48" style="filter:drop-shadow(0 0 8px ${c}80)"><rect x="46" y="5" width="8" height="90" fill="${c}"/><rect x="5" y="42" width="90" height="8" fill="${c}"/></svg></div>
        <div class="micro-final-titulo">Tu corazón está preparado</div>
        <div class="micro-final-sub">Reza sin prisa. Lo que necesitas ya lo traes contigo.</div>
        <div class="micro-metros-chip">🚶 +${MR_MICRO}m al peregrino</div></div>`;
      nav.innerHTML=`<button class="btn btn-primary btn-block" id="mgo">Comenzar →</button>`;
      $('mgo').onclick=async()=>{microDone=true;await saveMicroDone();await addMeters(MR_MICRO);showSlide(MR_MICRO);renderSession();};
      return;
    }
    if(step<tarj.length){
      const t=tarj[step];
      body.innerHTML=`<div class="micro-card"><div><div class="micro-card-emoji">${esc(t.emoji)}</div><div class="micro-card-titulo">${esc(t.titulo)}</div><div class="micro-card-contenido">${esc(t.contenido)}</div></div><div class="micro-card-footer"><span class="micro-card-count">Tarjeta ${step+1} de ${tarj.length}</span></div></div>`;
      nav.innerHTML=(step>0?`<button class="btn btn-outline" id="mp">← Anterior</button>`:'')+`<button class="btn btn-primary" id="mn">${step===tarj.length-1?'Prepara tu corazón →':'Siguiente →'}</button>`;
      if($('mp'))$('mp').onclick=()=>{step--;render();};
      $('mn').onclick=()=>{step++;render();};
      return;
    }
    const pi=step-tarj.length,pr=pregs[pi];
    body.innerHTML=`<div class="micro-q-card"><div class="micro-q-label">✦ ${pi+1} de ${pregs.length}</div><div class="micro-q-texto">${esc(pr.pregunta)}</div>${pr.opciones.map((o,oi)=>`<button class="micro-option" id="mo${oi}"><span class="micro-option-circle" id="mc${oi}"></span>${esc(o.texto)}</button>`).join('')}<div id="meco" style="display:none"></div></div>`;
    nav.innerHTML=`<button class="btn btn-primary" id="mnq" style="display:none">${pi===pregs.length-1?'Estoy listo →':'Siguiente →'}</button>`;
    pr.opciones.forEach((o,oi)=>{
      $('mo'+oi).onclick=()=>{
        if(sel!==null)return;sel=oi;
        pr.opciones.forEach((_,i)=>{if(i===oi){$('mo'+i).classList.add('selected');$('mc'+i).textContent='✓';}else $('mo'+i).classList.add('dimmed');});
        $('meco').innerHTML=`<div class="micro-eco"><span class="micro-eco-emoji">${esc(o.emoji)}</span>${esc(o.eco)}</div>`;
        $('meco').style.display='';$('mnq').style.display='';
      };
    });
    $('mnq').onclick=()=>{step++;render();};
  }
  $('main-header').style.display='none';
  show('scr-micro');render();
}

  const qs=parseQ(md?.meditacion||'');
  return qs.map((q,qi)=>
    `<div class="q-block">
       <div class="q-label" style="color:${QC[qi]}">${QL[qi]}</div>
       <div class="q-question">${esc(q)}</div>
       <textarea class="q-textarea" id="qta${qi}" placeholder="Escribe tu respuesta…"></textarea>
       <div class="q-saved" id="qsv${qi}"></div>
     </div>`).join('')+
    `<button class="amen-btn" id="amen-esc">Amén</button>`;
}
function initEscrH(md){
  [0,1,2].forEach(qi=>{
    const ta=$('qta'+qi);if(!ta)return;
    ta.addEventListener('input',()=>{ans[qi]=ta.value;clearTimeout(ansT[qi]);ansT[qi]=setTimeout(()=>onWrite(qi,ta.value),2000);});
  });

  if(ab)ab.onclick=async()=>{ab.textContent='✓ Guardado';ab.classList.add('done');for(let qi=0;qi<3;qi++)if(ans[qi])await onWrite(qi,ans[qi],true);};

async function onWrite(qi,text,force=false){
  if(!text.trim())return;
  await saveRef(qi,text);
  if(!firstAns[qi]){firstAns[qi]=true;if(window.CZSound)CZSound('reflectionSaved');await addMeters(MR_QF);showSlide(MR_QF,'¡Primera respuesta!');}
  else if(force){if(window.CZSound)CZSound('reflectionSaved');await addMeters(MR_QU);}
  const sv=$('qsv'+qi);
  if(sv){sv.textContent='✓ Guardado';setTimeout(()=>{if(sv)sv.textContent='';},2500);}
}

/* ─── COMPLETE MYSTERY ─── */
async function completeMystery(){
  if(window.CZSound)CZSound('mysteryClear');
  if(!blk||!usr)return;
  const dots=[...(prog?.progress?.[blk]||[null,null,null,null,null])];
  if(dots[bIdx])return;
  dots[bIdx]=Date.now();
  if(!prog)prog={};if(!prog.progress)prog.progress={};
  prog.progress[blk]=dots;
  try{
    await FS.collection('users').doc(usr.uid).collection('progress').doc(nivelId)
      .set({progress:{[blk]:dots}},{merge:true});
    try{localStorage.setItem('cruzando_progress_cache_dirty','true');}catch(_){}
  }catch(e){console.error('[CruzAndo] completeMystery:',e);}
  // Sincronizar cursor de audio para que ambos modos compartan posición
  try{
    await FS.collection('users').doc(usr.uid).collection('audioProgress').doc('current')
      .set({nivel,cuaderno:cua,misterio:mNum(blk,bIdx)},{merge:true});
  }catch(e){}
  // Refresh beads
  const cur=bIdx;
  $('hero-beads').innerHTML='<div style="display:flex;gap:8px;margin-top:6px">'+
    Array.from({length:5},(_,i)=>{
      const d=dots[i],c=i===cur;
      return `<div onclick="window._gm(${i})" style="width:${c?'12px':'8px'};height:${c?'12px':'8px'};border-radius:50%;cursor:pointer;transition:all 0.2s;background:${d?'#34A853':c?'#fff':'rgba(255,255,255,0.4)'};${c?'border:2px solid #fff;box-shadow:0 0 6px rgba(255,255,255,0.6)':''}"></div>`;
    }).join('')+'</div>';
  if(dots.every(Boolean)){
    setTimeout(async()=>{if(window.CZSound)CZSound('blockClear');await addMeters(MR_BNS);showSlide(MR_BNS,'¡Bloque completo!');showCelebration();},600);
    if(blk==='gloriosos'&&cua===4){
      if(window.CZSound)CZSound('levelClear');
      const MUNDO_MEDAL_MAP={1:'medal_cruz',2:'medal_emociones',3:'medal_mente',4:'medal_corazon',5:'medal_relaciones',6:'medal_amor',7:'medal_tiempo'};
      const medalId=MUNDO_MEDAL_MAP[nivel];
      if(medalId&&usr){
        try{
          const extrasRef=FS.collection('users').doc(usr.uid).collection('extras').doc('purchases');
          const extrasSnap=await extrasRef.get();
          const items=extrasSnap.exists?(extrasSnap.data().items||[]):[];
          if(!items.some(it=>it.id===medalId)){
            items.push({id:medalId,type:'medal',earnedAt:new Date().toISOString()});
            await extrasRef.set({items},{merge:true});
            setTimeout(()=>showSlide(0,'🏅 ¡Medalla desbloqueada!'),1200);
          }
        }catch(e){console.warn('[CruzAndo] medal:',e.message);}
      }
    }
  }
}
function showCelebration(){
  $('celeb-title').textContent=`¡${BFN[blk]} completados!`;
  $('celeb-sub').textContent=`Has rezado los 5 misterios ${BN[blk].toLowerCase()} de este cuaderno. ¡Bien hecho!`;
  $('btn-celeb-home').onclick=()=>{
    location.href=location.origin+location.pathname.substring(0,location.pathname.lastIndexOf('/')+1)+'orar.html?c='+nivelId;
  };
  var grandImg = $('mariano-grand-img');
  if (grandImg) grandImg.src = MARIANO_CELEB;
  show('scr-celebration');
}

/* ─── VOICE PLAYER ─── */
function toolUrl(t){
  const m=mNum(blk,bIdx);
  if(t==='contemplar')return`${R2}/cont/CONT_${nivel}_${cua}_${m}.mp3`;
  if(t==='rezo'){
    const _latin=prefs().latinPrayer===true;
    const _file=bIdx%2===0?(_latin?'L_MA.mp3':'MA.mp3'):(_latin?'L_MB.mp3':'MB.mp3');
    return`${R2}/global/${_file}`;
  }
  if(t==='canto')return`${MUSB}M_${nivel}_${cua}_${m}.mp3`;
  return'';
}
function fmtTime(s){var m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}
function initVP(){
  if(!libro){
    libro=new Audio();
    libro.addEventListener('ended',onAudioEnd);
    libro.addEventListener('timeupdate',function(){
      var fill=$('vp-progress-fill'),cur=$('vp-time-current'),dur=$('vp-time-duration');
      if(fill&&libro.duration)fill.style.width=(libro.currentTime/libro.duration*100)+'%';
      if(cur)cur.textContent=fmtTime(libro.currentTime);
      if(dur&&libro.duration)dur.textContent=fmtTime(libro.duration);
    });
  }
  $('vp-play-pause').onclick=()=>vpToggle();
  $('vp-rewind').onclick=()=>{if(libro)libro.currentTime=Math.max(0,libro.currentTime-15);};
  $('vp-forward').onclick=()=>{if(libro)libro.currentTime+=15;};
  $('vp-speed').onchange=()=>{if(libro)libro.playbackRate=parseFloat($('vp-speed').value);};
  $('vp-progress-bar').onclick=function(e){
    if(!libro||!libro.duration)return;
    var rect=$('vp-progress-bar').getBoundingClientRect();
    libro.currentTime=((e.clientX-rect.left)/rect.width)*libro.duration;
  };
  $('popup-voice-btn').onclick = function() {
    var vp = $('voice-player');
    var isOpen = vp && vp.style.display !== 'none';
    if (isOpen) {
      closeVP();
    } else {
      openVP(tool);
    }
  };
  $('popup-close').onclick=()=>closeToolPopup();
}
function openVP(t){
  if(!['contemplar','rezo','canto'].includes(t))return;
  const url=toolUrl(t);if(!url)return;
  $('vp-tool-name').textContent=TN[t]||t;
  if(libro.src!==url){libro.src=url;libro.load();}
  $('voice-player').style.display='';
  if(window.CZSound)CZSound('playStart');
  if(t==='canto'){
    if(bgmEl){ bgmFadeTo(0, 400); setTimeout(function(){ if(bgmEl) bgmEl.pause(); }, 420); }
  } else {
    bgmDuck();
  }
  libro.play().catch(()=>{});
  vpUpd();
}
function closeVP(){
  if(libro) libro.pause();
  $('voice-player').style.display='none';
  $('popup-voice-btn').classList.remove('playing');
  var pvbN = document.getElementById('pvb-normal');
  var pvbP = document.getElementById('pvb-playing');
  if(pvbN) pvbN.style.display = '';
  if(pvbP) pvbP.style.display = 'none';
  if(bgmOn && bgmEl){
    if(bgmEl.paused) bgmEl.play().catch(()=>{});
    bgmUnduck();
  }
}
function vpToggle(){
  if(!libro) return;
  if(libro.paused){
    if(!libro.src||libro.src===location.href) openVP(tool);
    else {
      libro.play().catch(()=>{});
      if(tool==='canto'){
        if(bgmEl){ bgmFadeTo(0, 400); setTimeout(function(){ if(bgmEl) bgmEl.pause(); }, 420); }
      } else {
        bgmDuck();
      }
    }
  } else {
    libro.pause();
    if(bgmOn && bgmEl){
      if(bgmEl.paused) bgmEl.play().catch(()=>{});
      bgmUnduck();
    }
  }
  vpUpd();
}
function vpUpd(){
  if(!libro) return;
  var isPaused = libro.paused;
  var svgPlay  = document.getElementById('vp-svg-play');
  var svgPause = document.getElementById('vp-svg-pause');
  if (svgPlay)  svgPlay.style.display  = isPaused  ? '' : 'none';
  if (svgPause) svgPause.style.display = !isPaused ? '' : 'none';
  var pbtn = $('popup-voice-btn');
  if (pbtn) pbtn.classList.toggle('playing', !isPaused);
  libro.onpause = libro.onplay = vpUpd;
}
function onAudioEnd(){
  vpUpd();
  if(bgmOn && bgmEl){
    if(bgmEl.paused) bgmEl.play().catch(()=>{});
    bgmUnduck();
  }
  if(!tool||awd.has(tool))return;
  awd.add(tool);
  const tm={contemplar:MR_CONT,rezo:MR_REZO,canto:MR_CANTO}[tool];
  if(tm){addMeters(tm);showSlide(tm,TN[tool]);}
}

/* ─── BGM ─── */
var BGM_NORMAL = 0.04;
var BGM_DUCK   = 0.005;
var _bgmFadeTimer = null;

function bgmFadeTo(targetVol, ms) {
  if (!bgmEl) return;
  if (_bgmFadeTimer) clearInterval(_bgmFadeTimer);
  var startVol = bgmEl.volume;
  var steps    = 20;
  var stepMs   = ms / steps;
  var stepVol  = (targetVol - startVol) / steps;
  var i = 0;
  _bgmFadeTimer = setInterval(function() {
    i++;
    bgmEl.volume = Math.max(0, Math.min(1, startVol + stepVol * i));
    if (i >= steps) {
      bgmEl.volume = targetVol;
      clearInterval(_bgmFadeTimer);
      _bgmFadeTimer = null;
    }
  }, stepMs);
}

function bgmDuck()   { bgmFadeTo(BGM_DUCK,   300); }
function bgmUnduck() { bgmFadeTo(BGM_NORMAL, 800); }

function toggleBgm(){
  bgmOn=!bgmOn;const p=prefs();p.bgm=bgmOn;localStorage.setItem('cruzando_prefs',JSON.stringify(p));
  $('btn-bgm').classList.toggle('bgm-on',bgmOn);
  bgmOn?startBgm():(bgmEl&&bgmEl.pause());
}
function startBgm(){
  if(!bgmOn)return;
  const url=`${R2}/BGM/BGM_${nivel}_${cua}.mp3`;
  const trackId=`BGM_${nivel}_${cua}.mp3`;
  if(!bgmEl){bgmEl=new Audio(url);bgmEl.loop=true;bgmEl.volume=BGM_NORMAL;}
  else if(!bgmEl.src.endsWith(trackId)){bgmEl.pause();bgmEl.src=url;}
  bgmEl.play().catch(()=>{});
}

function goToolAdj(dir){
  const i=TOOL_ORDER.indexOf(tool);
  const n=i+dir;
  if(n<0||n>=TOOL_ORDER.length)closeToolPopup();
  else openToolPopup(TOOL_ORDER[n]);
}

/* ─── SWIPE + INIT ─── */
function initSwipe(){
  let sx=0,sy=0;const pp=$('tool-popup');
  pp.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;e.stopPropagation();},{passive:true});
  pp.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    e.stopPropagation();
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.5){goToolAdj(dx<0?1:-1);}
  },{passive:true});

  // scr-home ya no existe; el swipe horizontal desde scr-orar lleva a index.html
  let hsx=0;const orarScr=$('scr-orar');
  orarScr.addEventListener('touchstart',e=>{hsx=e.touches[0].clientX;},{passive:true});
  orarScr.addEventListener('touchend',e=>{
    if(e.changedTouches[0].clientX-hsx>80)goTo('index.html');
  },{passive:true});

  // Swipe vertical en la sesión: arriba → muestra nav, abajo → oculta
  let nvY=0,nvX=0,navT=null;
  function showAppNav(){$('app-nav').classList.add('visible');clearTimeout(navT);navT=setTimeout(()=>$('app-nav').classList.remove('visible'),3500);}
  function hideAppNav(){$('app-nav').classList.remove('visible');clearTimeout(navT);}
  const scr=$('scr-orar');
  scr.addEventListener('touchstart',e=>{nvY=e.touches[0].clientY;nvX=e.touches[0].clientX;},{passive:true});
  scr.addEventListener('touchend',e=>{
    const dy=e.changedTouches[0].clientY-nvY;
    const dx=e.changedTouches[0].clientX-nvX;
    if(Math.abs(dy)>50&&Math.abs(dy)>Math.abs(dx)*1.5){
      if(dy<0)showAppNav();else hideAppNav();
    }
  },{passive:true});
}
function initBtns(){
  document.querySelectorAll('.tool-btn').forEach(b=>b.onclick=()=>openToolPopup(b.dataset.tool));
  if($('btn-dark'))        $('btn-dark').onclick=toggleTheme;
  if($('btn-bgm'))         $('btn-bgm').onclick=toggleBgm;
  if($('btn-theme'))       $('btn-theme').onclick=toggleTheme;
  if($('btn-prev-mystery'))$('btn-prev-mystery').onclick=goPrevMystery;
  if($('btn-next-mystery'))$('btn-next-mystery').onclick=goNextMystery;
}

bgmOn=prefs().bgm!==false;
initBtns();
initSwipe();
initAuth();
}());
