<style>
/* ══════════════════════════════════════════════════════
   CSS — CruzAndo App · Vanilla JS · Cero dependencias
   Colores dinámicos via CSS custom properties
   ══════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

:root {
/* ── Neutros Light ── */
–bg: #E6DED3;
–card: #FFFCF7;
–border: #D9D1C7;
–text: #2B2622;
–text-soft: #6B6259;
–text-dim: #9B9389;
–input-bg: #FFFCF7;
–sec-bg: #F5F0E8;
–shadow: rgba(43,38,34,0.08);
–green: #34A853;
–green-soft: rgba(52,168,83,0.12);
/* ── Paleta del nivel (se sobreescriben desde JS) ── */
–lvl-bold: #FF7A00;
–lvl-base: #FF7F09;
–lvl-soft: #F69C49;
–lvl-mist: #FFA34E;
–lvl-light: #FFCFA2;
–lvl-ultra: rgba(255,122,0,0.07);
/* ── Bloques ── */
–goz-color: #D4A017;
–lum-color: #01BBE1;
–dol-color: #C0392B;
–glo-color: #8E44AD;
/* ── Brand ── */
–brand: #01BBE1;
}

.dark {
–bg: #1A1714;
–card: #252119;
–border: #3A3530;
–text: #E6DED3;
–text-soft: #B8A898;
–text-dim: #786858;
–input-bg: #2A2520;
–sec-bg: #1E1B16;
–shadow: rgba(0,0,0,0.3);
–green-soft: rgba(52,168,83,0.18);
}

html { font-size:18px; }
body {
font-family:‘Inter’,system-ui,sans-serif;
background:var(–bg);
color:var(–text);
line-height:1.7;
min-height:100dvh;
-webkit-font-smoothing:antialiased;
transition:background 0.4s,color 0.4s;
/* ── Mejora 2: Risograph V4 light — grano + doble tinta naranja/rojo ── */
background-image:
url(“data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.08'/></svg>”),
linear-gradient(135deg, rgba(192,57,43,0.07) 0%, rgba(255,122,0,0.06) 60%, transparent 100%);
background-size: 200px 200px, 100% 100%;
background-blend-mode: multiply, normal;
}
.dark body {
/* ── Mejora 2: Risograph V3 dark — grano + halo naranja inferior izquierdo ── */
background-image:
url(“data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.07'/></svg>”),
radial-gradient(ellipse at 20% 85%, rgba(255,122,0,0.11) 0%, transparent 55%);
background-size: 200px 200px, 100% 100%;
background-blend-mode: screen, normal;
}

/* ── Layout ── */
.shell { max-width:480px; margin:0 auto; min-height:100dvh; position:relative; }
.screen { display:none; }
.screen.active { display:block; }

/* ── Header ── */
.header {
display:flex; align-items:center; justify-content:space-between;
padding:14px 18px 10px; position:sticky; top:0; z-index:50;
background:var(–bg); border-bottom:1px solid var(–border);
}
.header-title { font-size:1.05rem; font-weight:700; color:var(–lvl-bold); }
.header-sub { font-size:0.72rem; color:var(–text-dim); margin-top:1px; }
.header-actions { display:flex; gap:8px; align-items:center; }
.icon-btn {
width:36px; height:36px; border-radius:50%; border:1px solid var(–border);
background:var(–card); cursor:pointer; display:flex; align-items:center;
justify-content:center; color:var(–text-soft); transition:all 0.2s;
}
.icon-btn:active { transform:scale(0.92); }

/* ── Pantalla de Inicio: Tarjetas de Bloques ── */
.home-intro { padding:28px 18px 14px; text-align:center; }
.home-intro h1 {
font-family:‘Inter’, sans-serif;
font-size:0.62rem; font-weight:700; color:var(–text-dim);
text-transform:uppercase; letter-spacing:2px; margin-bottom:6px;
}
.home-intro .nivel-heading {
font-family:‘Crimson Pro’, Georgia, serif;
font-size:1.1rem; font-weight:500; color:var(–lvl-bold);
line-height:1.2; margin-bottom:6px; letter-spacing:0.5px;
}
.home-intro .elemento-heading {
font-family:‘Crimson Pro’, Georgia, serif;
font-size:2.8rem; font-weight:600; color:var(–text);
line-height:1.05; letter-spacing:-0.01em;
}

/* ── Banner Misterios del Día ── */
.today-banner {
margin:0 18px 16px; padding:16px 20px; border-radius:16px;
background:linear-gradient(135deg,rgba(var(–lvl-light-rgb,255,207,162),0.55),rgba(255,245,232,0.7));
border:2px solid var(–lvl-bold);
box-shadow:0 3px 16px rgba(var(–lvl-bold-rgb,255,122,0),0.1);
cursor:pointer; transition:all 0.25s;
}
.dark .today-banner {
background:linear-gradient(135deg,rgba(var(–lvl-bold-rgb,255,122,0),0.15),rgba(var(–lvl-bold-rgb,255,122,0),0.05));
}
.today-banner:active { transform:scale(0.98); }
.today-banner-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.today-banner-label {
font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:1px;
color:var(–lvl-bold); display:flex; align-items:center; gap:6px;
}
.today-pulse {
width:8px; height:8px; border-radius:50%; background:var(–lvl-bold);
animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(1.4); } }
.today-banner-arrow { color:var(–lvl-bold); font-size:1.2rem; font-weight:700; }
.today-banner h3 { font-size:1.1rem; font-weight:800; margin-bottom:3px; }
.today-banner-days { font-size:0.72rem; color:var(–text-dim); }
/* ── Mejora 4: Bloque del día dramático ── */
@keyframes todayPulse {
0%,100% { box-shadow:0 0 0 0 rgba(var(–lvl-bold-rgb,255,122,0),0.55), 0 2px 16px var(–lvl-ultra); }
50%      { box-shadow:0 0 0 5px rgba(var(–lvl-bold-rgb,255,122,0),0),   0 4px 24px rgba(var(–lvl-bold-rgb,255,122,0),0.2); }
}
.block-card.today {
border-color:var(–lvl-bold);
background:radial-gradient(ellipse at top right, rgba(var(–lvl-bold-rgb,255,122,0),0.22) 0%, rgba(var(–lvl-light-rgb,255,207,162),0.12) 40%, var(–card) 75%);
animation:slideUp 0.55s cubic-bezier(0.34,1.72,0.64,1) both, todayPulse 2.4s ease-in-out 0.6s infinite;
}
.dark .block-card.today {
background:radial-gradient(ellipse at top right, rgba(var(–lvl-bold-rgb,255,122,0),0.28) 0%, rgba(var(–lvl-bold-rgb,255,122,0),0.10) 45%, var(–card) 75%);
}

.block-grid { display:flex; flex-direction:column; gap:14px; padding:8px 18px 24px; }
.block-card {
background:var(–card); border-radius:16px; padding:18px 20px;
border:2px solid var(–border); cursor:pointer;
transition:all 0.25s; position:relative; overflow:hidden;
}
.block-card:active { transform:scale(0.98); }
.block-card.cleared { border-color:var(–green); }
.block-card.current { border-color:var(–lvl-bold); box-shadow:0 2px 16px var(–lvl-ultra); }
.block-card.locked  { opacity:0.5; cursor:default; }
.block-badge.locked-badge { background:var(–sec-bg); color:var(–text-dim); }
.block-locked-hint  { font-size:0.72rem; color:var(–text-dim); margin-top:8px; font-style:italic; }
.block-card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.block-emoji { font-size:1.6rem; }
.block-badge {
font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.8px;
padding:3px 10px; border-radius:20px;
}
.block-badge.pending { background:var(–sec-bg); color:var(–text-dim); }
.block-badge.progress { background:var(–lvl-ultra); color:var(–lvl-bold); }
.block-badge.cleared { background:var(–green-soft); color:var(–green); }
.block-badge.today { background:var(–lvl-bold); color:#fff; }
.block-title { font-size:1.05rem; font-weight:700; margin-bottom:2px; }
.block-subtitle { font-size:0.78rem; color:var(–text-soft); font-style:italic; }
.block-progress { margin-top:12px; }
.block-dots { display:flex; gap:6px; }
.block-dot {
width:10px; height:10px; border-radius:50%;
background:var(–border); transition:all 0.3s;
}
.block-dot.done { background:var(–green); box-shadow:0 0 6px rgba(52,168,83,0.4); }
.block-dot.active { background:var(–lvl-bold); box-shadow:0 0 8px var(–lvl-light); }

/* ── Banner de nivel completado ── */
.nivel-done-banner {
margin:8px 18px 18px; padding:20px; border-radius:16px;
background:linear-gradient(135deg,var(–green-soft),rgba(52,168,83,0.05));
border:2px solid var(–green); text-align:center;
}
.nivel-done-banner h3 { font-size:1.1rem; color:var(–green); margin-bottom:6px; }
.nivel-done-banner p { font-size:0.82rem; color:var(–text-soft); margin-bottom:14px; }

/* ── Botones ── */
.btn {
display:inline-flex; align-items:center; justify-content:center; gap:8px;
padding:14px 28px; border-radius:14px; border:none; cursor:pointer;
font-family:inherit; font-size:0.88rem; font-weight:700;
transition:all 0.2s; letter-spacing:0.3px;
}
.btn:active { transform:scale(0.96); }
.btn-primary { background:var(–lvl-bold); color:#fff; box-shadow:0 4px 14px rgba(0,0,0,0.15); }
.btn-green { background:var(–green); color:#fff; }
.btn-outline { background:transparent; border:2px solid var(–border); color:var(–text-soft); }
.btn-ghost { background:transparent; color:var(–text-soft); padding:10px 14px; font-size:0.82rem; }
.btn-block { width:100%; }

/* ── Micro-aprendizaje ── */
.micro-screen { padding:0 18px 40px; }
.micro-header { padding:16px 0 10px; display:flex; align-items:center; justify-content:space-between; }
.micro-label {
font-size:0.65rem; font-weight:700; text-transform:uppercase;
letter-spacing:1.2px; color:var(–lvl-bold);
}
.micro-sub {
font-family:‘Crimson Pro’, Georgia, serif;
font-size:1.2rem; font-weight:600; color:var(–text); margin-top:2px;
}
.micro-progress { display:flex; gap:6px; margin-bottom:16px; }
.micro-dot { height:5px; border-radius:3px; background:var(–border); transition:all 0.4s ease; }
.micro-dot.done { background:var(–green); }
.micro-dot.active { background:var(–lvl-bold); }
.micro-card {
background:var(–card); border-radius:20px; padding:28px 22px;
border:1.5px solid var(–border);
animation:slideUp 0.45s cubic-bezier(0.34,1.72,0.64,1) both;
min-height:220px; display:flex; flex-direction:column; justify-content:space-between;
}
.micro-card-emoji { font-size:2.2rem; margin-bottom:14px; }
.micro-card-titulo {
font-family:‘Crimson Pro’, Georgia, serif;
font-size:1.55rem; font-weight:600; color:var(–lvl-bold); line-height:1.2; margin-bottom:12px;
}
.micro-card-contenido {
font-family:‘Crimson Pro’, Georgia, serif;
font-size:1.25rem; font-weight:400; line-height:1.75; color:var(–text); flex:1;
}
.micro-card-footer {
display:flex; justify-content:space-between; align-items:center;
margin-top:20px; padding-top:14px; border-top:1px solid var(–border);
}
.micro-card-count { font-size:0.68rem; font-weight:600; color:var(–text-dim); text-transform:uppercase; letter-spacing:0.8px; }
.micro-q-card {
background:var(–card); border-radius:20px; padding:24px 22px;
border:1.5px solid var(–border);
animation:slideUp 0.45s cubic-bezier(0.34,1.72,0.64,1) both;
}
.micro-q-label {
font-size:0.65rem; font-weight:700; text-transform:uppercase;
letter-spacing:1.2px; color:var(–lvl-bold); margin-bottom:14px;
}
.micro-q-texto {
font-family:‘Crimson Pro’, Georgia, serif;
font-size:1.4rem; font-weight:500; line-height:1.55; color:var(–text); margin-bottom:20px;
}
.micro-option {
width:100%; padding:14px 16px; border-radius:14px;
border:1.5px solid var(–border); background:var(–sec-bg);
font-family:‘Crimson Pro’, Georgia, serif;
font-size:1.2rem; font-weight:400; line-height:1.4;
color:var(–text); cursor:pointer; text-align:left;
display:flex; align-items:center; gap:12px;
transition:all 0.25s; margin-bottom:10px;
}
.micro-option.selected { border-color:var(–lvl-bold); background:var(–lvl-ultra); }
.micro-option.dimmed { opacity:0.4; cursor:default; pointer-events:none; }
.micro-option-circle {
width:22px; height:22px; border-radius:50%; flex-shrink:0;
border:1.5px solid var(–border); background:transparent;
display:flex; align-items:center; justify-content:center;
font-size:11px; color:#fff; font-weight:700; transition:all 0.25s;
}
.micro-option.selected .micro-option-circle { background:var(–lvl-bold); border-color:var(–lvl-bold); }
.micro-eco {
margin-top:16px; padding:14px 16px;
background:var(–lvl-ultra); border-radius:14px; border-left:3px solid var(–lvl-soft);
font-family:‘Crimson Pro’, Georgia, serif;
font-size:1.15rem; font-weight:400; font-style:italic;
color:var(–text); line-height:1.6;
animation:fadeIn 0.4s ease both;
display:flex; align-items:flex-start; gap:10px;
}
.micro-eco-emoji { font-size:1.3rem; flex-shrink:0; }
.micro-final {
text-align:center; padding:40px 0;
animation:slideUp 0.55s cubic-bezier(0.34,1.72,0.64,1) both;
}
.micro-final-cross {
margin:0 auto 24px; display:flex; align-items:center; justify-content:center;
width:64px; height:64px;
}
.micro-final-titulo {
font-family:‘Crimson Pro’, Georgia, serif;
font-size:1.8rem; font-weight:600; color:var(–text); line-height:1.2; margin-bottom:12px;
}
.micro-final-sub {
font-family:‘Crimson Pro’, Georgia, serif;
font-size:1.2rem; color:var(–text-soft); line-height:1.65;
margin:0 auto 28px; max-width:300px;
}
.micro-metros-chip {
display:inline-flex; align-items:center; gap:6px; padding:7px 16px; border-radius:20px;
background:var(–green-soft); color:var(–green); font-size:0.82rem; font-weight:700; margin-bottom:28px;
}
.micro-nav { display:flex; gap:10px; margin-top:20px; }
.micro-nav .btn { flex:1; }

/* ── Mejora 6: Hero image ── */
.mystery-hero {
position:relative; width:100%;
aspect-ratio:3/4; overflow:hidden;
background:var(–card);
}
.mystery-hero-img {
width:100%; height:100%; object-fit:cover;
display:block;
animation:fadeIn 0.5s ease both;
}
.mystery-hero-placeholder {
width:100%; height:100%;
display:flex; align-items:center; justify-content:center;
opacity:0.18;
}
.mystery-hero-placeholder svg { width:64px; height:64px; }
.mystery-hero-gradient {
position:absolute; inset:0;
background:linear-gradient(
to top,
rgba(10,7,5,0.88) 0%,
rgba(10,7,5,0.45) 35%,
transparent 65%
);
}
.mystery-hero-text {
position:absolute; bottom:0; left:0; right:0;
padding:28px 20px 18px;
}
.mystery-hero-counter {
font-size:0.65rem; font-weight:700; text-transform:uppercase;
letter-spacing:1.2px; color:rgba(230,222,211,0.65);
margin-bottom:6px;
}
.mystery-hero-title {
font-family:‘Cormorant Garamond’, Georgia, serif;
font-size:2rem; font-weight:600; line-height:1.1;
letter-spacing:0.01em; color:#E6DED3;
text-shadow:0 2px 12px rgba(0,0,0,0.5);
}
.mystery-hero-subtitle {
font-family:‘Cormorant Garamond’, Georgia, serif;
font-size:1.05rem; font-weight:400; font-style:italic;
color:rgba(230,222,211,0.7); margin-top:4px;
}

/* Ocultar prayer-header en modo hero — el título vive en el hero */
.has-hero .prayer-header .mystery-title,
.has-hero .prayer-header .mystery-subtitle { display:none; }
.has-hero .prayer-header {
padding:10px 18px 6px;
}

/* ── Tarjeta Elegir nivel ── */
.nivel-switch-card {
margin:0 18px 28px;
padding:16px 18px;
background:var(–card); border-radius:16px;
border:1.5px solid var(–border);
display:flex; align-items:center; justify-content:space-between;
cursor:pointer; transition:all 0.2s;
-webkit-tap-highlight-color:transparent;
}
.nivel-switch-card:active { transform:scale(0.98); border-color:var(–lvl-soft); }
.nivel-switch-left { display:flex; align-items:center; gap:12px; }
.nivel-switch-icon {
width:38px; height:38px; border-radius:10px;
background:var(–lvl-ultra); border:1px solid var(–lvl-soft);
display:flex; align-items:center; justify-content:center;
flex-shrink:0;
}
.nivel-switch-title {
font-family:‘Crimson Pro’, Georgia, serif;
font-size:1.1rem; font-weight:600; color:var(–text);
}
.nivel-switch-sub { font-size:0.68rem; color:var(–text-dim); margin-top:1px; }
.nivel-switch-arrow { color:var(–text-dim); font-size:1.1rem; }
.prep-btn-wrap { padding:14px 18px 4px; }
.prep-btn {
width:100%; padding:18px 20px; border-radius:16px;
border:none;
background:linear-gradient(135deg, var(–lvl-bold) 0%, var(–lvl-soft) 100%);
font-family:‘Crimson Pro’, Georgia, serif;
font-size:1.4rem; font-weight:600;
color:#fff; cursor:pointer; text-align:left;
display:flex; align-items:center; justify-content:space-between; gap:12px;
transition:all 0.2s;
box-shadow:0 4px 18px rgba(var(–lvl-bold-rgb,255,122,0),0.35);
}
.prep-btn:active { transform:scale(0.97); opacity:0.92; }
.prep-btn-label {
font-size:0.62rem; font-weight:700; text-transform:uppercase;
letter-spacing:1px; opacity:0.85; margin-bottom:4px; display:block;
font-family:‘Inter’,sans-serif;
}

/* ── Pantalla de Oración (pre-hero) ── */
.prayer-header { padding:16px 18px 10px; }
.prayer-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.mystery-counter { font-size:0.72rem; font-weight:600; color:var(–text-dim); letter-spacing:1px; text-transform:uppercase; }
.mystery-title {
font-family:‘Cormorant Garamond’, Georgia, serif;
font-size:1.75rem; font-weight:600; line-height:1.15;
letter-spacing:0.01em; margin-bottom:4px;
}
.mystery-subtitle {
font-family:‘Cormorant Garamond’, Georgia, serif;
font-size:1.05rem; font-weight:400;
font-style:italic; color:var(–text-soft);
}

/* Cuentas del rosario (cadena de 5) */
.mystery-beads { padding:0 18px 14px; }
.mystery-beads svg { width:100%; height:30px; }

/* ── Evangelio ── */
.evangelio-box {
margin:0 18px 14px; padding:20px; border-radius:16px;
background:var(–card); border-left:4px solid var(–lvl-soft);
}
.evangelio-label {
font-size:0.68rem; font-weight:700; text-transform:uppercase;
letter-spacing:1.2px; color:var(–lvl-bold); margin-bottom:10px;
display:flex; align-items:center; gap:6px;
}
.evangelio-text {
font-family:‘Crimson Pro’, Georgia, serif;
font-size:26px; font-weight:500; line-height:1.7; color:var(–text);
}
.evangelio-ref { font-size:0.78rem; color:var(–text-dim); text-align:right; margin-top:12px; font-style:italic; }

/* ── Acordeón ── */
.accordion { margin:0 18px 10px; }
.acc-item { background:var(–card); border-radius:14px; margin-bottom:10px; overflow:hidden; border:1.5px solid var(–border); transition:border-color 0.3s; }
.acc-item.open { border-color:var(–lvl-soft); }
.acc-trigger {
width:100%; display:flex; align-items:center; justify-content:space-between;
padding:14px 18px; background:none; border:none; cursor:pointer;
font-family:inherit; color:var(–text); transition:background 0.2s;
}
.acc-trigger:active { background:var(–sec-bg); }
.acc-trigger-left { display:flex; align-items:center; gap:10px; }
.acc-icon {
width:32px; height:32px; border-radius:10px;
display:flex; align-items:center; justify-content:center;
font-size:1rem;
}
.acc-label { font-size:0.88rem; font-weight:600; }
.acc-chevron { transition:transform 0.3s; color:var(–text-dim); }
.acc-item.open .acc-chevron { transform:rotate(180deg); }
.acc-body { max-height:0; overflow:hidden; transition:max-height 0.4s ease; }
.acc-body-inner { padding:0 18px 18px; }

/* ── Audio Player ── */
.audio-player {
display:flex; align-items:center; gap:12px; padding:12px 16px;
background:var(–sec-bg); border-radius:12px;
}
.play-btn {
width:44px; height:44px; border-radius:50%; border:none;
background:var(–lvl-bold); color:#fff; cursor:pointer;
display:flex; align-items:center; justify-content:center;
flex-shrink:0; transition:all 0.2s;
}
.play-btn:active { transform:scale(0.9); }
.audio-info { flex:1; min-width:0; }
.audio-label { font-size:0.75rem; color:var(–text-soft); margin-bottom:4px; }
.audio-bar-wrap { width:100%; height:5px; background:var(–border); border-radius:3px; cursor:pointer; position:relative; }
.audio-bar-fill { height:100%; border-radius:3px; background:var(–lvl-bold); transition:width 0.1s linear; }
.audio-time { font-size:0.68rem; color:var(–text-dim); margin-top:3px; display:flex; justify-content:space-between; }

/* ── Canto ── */
.canto-box {
padding:18px; background:var(–lvl-ultra); border-radius:14px;
border-left:3px solid var(–lvl-soft); text-align:center;
}
.canto-box p { font-size:0.88rem; color:var(–text); font-style:italic; line-height:1.7; }
.canto-box .canto-hint { font-size:0.78rem; color:var(–text-dim); margin-top:8px; display:block; }

.canto-letra {
margin-top:16px; padding:16px 18px;
background:var(–sec-bg); border-radius:12px;
font-family:‘Crimson Pro’, Georgia, serif;
font-size:25px; font-weight:400; line-height:1.85;
color:var(–text); white-space:pre-line; text-align:left;
font-style:italic;
}
.canto-letra-titulo {
font-size:0.65rem; font-weight:700; text-transform:uppercase;
letter-spacing:1px; color:var(–lvl-bold);
margin-bottom:10px; display:block;
}

/* ── Contemplación texto ── */
.contempl-text {
margin-top:14px; padding:16px 18px; background:var(–sec-bg);
border-radius:14px; border-left:3px solid var(–lvl-soft);
font-family:‘Crimson Pro’, Georgia, serif;
font-size:26px; font-weight:500; line-height:1.7; white-space:pre-line;
}

/* ── Meditación ── */
.med-group { margin-bottom:18px; }
.med-label-row { display:flex; align-items:center; gap:7px; margin-bottom:6px; }
.med-dot { width:7px; height:7px; border-radius:50%; }
.med-label-text { font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; }
.med-question {
font-family:‘Crimson Pro’, Georgia, serif;
font-size:24px; font-weight:500; line-height:1.7; margin-bottom:10px;
}
.journal-area {
width:100%; min-height:120px; padding:14px; border-radius:12px;
border:1.5px solid var(–border); background:var(–input-bg);
font-family:‘Crimson Pro’, Georgia, serif;
font-size:22px; font-weight:400; line-height:1.7;
color:var(–text); resize:vertical; transition:border-color 0.3s;
}
.journal-area:focus { outline:none; border-color:var(–lvl-soft); }
.journal-area::placeholder { color:var(–text-dim); }
.med-confirm {
display:flex; align-items:center; justify-content:center; gap:6px;
width:100%; margin-top:8px; padding:10px; border-radius:10px;
border:1.5px solid var(–border); background:var(–sec-bg);
font-family:inherit; font-size:0.78rem; font-weight:600;
color:var(–text-soft); cursor:pointer; transition:all 0.3s;
}
.med-confirm:active { transform:scale(0.96); }
.med-confirm.done {
background:var(–green-soft); border-color:var(–green);
color:var(–green); cursor:default;
}
@keyframes medGlow {
0% { box-shadow:0 0 0 0 rgba(52,168,83,0.4); }
70% { box-shadow:0 0 0 10px rgba(52,168,83,0); }
100% { box-shadow:0 0 0 0 rgba(52,168,83,0); }
}
.med-confirm.glow { animation:medGlow 0.6s ease; }

/* ── Intercesión ── */
.interc-text {
padding:18px; background:var(–lvl-ultra); border-radius:14px;
font-family:‘Crimson Pro’, Georgia, serif;
font-size:26px; font-weight:500; line-height:1.7; white-space:pre-line;
}
.amen-btn {
display:block; width:100%; margin-top:14px; padding:16px;
border-radius:14px; border:none; cursor:pointer;
font-family:inherit; font-size:1rem; font-weight:800;
background:var(–lvl-bold); color:#fff; letter-spacing:1px;
transition:all 0.2s; box-shadow:0 4px 16px rgba(0,0,0,0.12);
}
.amen-btn:active { transform:scale(0.96); }
.amen-btn.done { background:var(–green); }

/* ── Completado de misterio ── */
.mystery-done-bar {
margin:12px 18px; padding:14px 18px; border-radius:14px;
background:var(–green-soft); border:1.5px solid rgba(52,168,83,0.2);
display:flex; align-items:center; gap:10px;
}
.done-check { color:var(–green); font-size:1.2rem; }
.done-text { font-size:0.82rem; font-weight:600; color:var(–green); }
.done-date { font-size:0.72rem; color:var(–text-dim); }

/* ── Navegación de prayer (botones Siguiente/Anterior) ── */
.bottom-nav {
padding:14px 18px 28px; display:flex; gap:10px;
}
.bottom-nav .btn { flex:1; }

/* ── Mejora 5: Bottom nav bar fija ── */
.shell { padding-bottom:72px; }
.app-nav {
position:fixed; bottom:0; left:50%; transform:translateX(-50%);
width:100%; max-width:480px; z-index:80;
background:var(–bg); border-top:1px solid var(–border);
display:flex; align-items:stretch;
padding-bottom:env(safe-area-inset-bottom, 0px);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
}
.app-nav-item {
flex:1; display:flex; flex-direction:column;
align-items:center; justify-content:center;
gap:4px; padding:10px 4px 12px;
background:none; border:none; cursor:pointer;
font-family:inherit; text-decoration:none;
color:var(–text-dim); transition:color 0.2s;
-webkit-tap-highlight-color:transparent;
}
.app-nav-item:active { opacity:1; }
.app-nav-item.active { color:var(–lvl-bold); }
.app-nav-item[disabled] { cursor:default; opacity:1; }
@keyframes navSpring {
0%   { transform:scale(1); }
35%  { transform:scale(0.78); }
65%  { transform:scale(1.18); }
82%  { transform:scale(0.95); }
100% { transform:scale(1); }
}
.app-nav-item.tapped .app-nav-icon { animation:navSpring 0.38s cubic-bezier(0.34,1.72,0.64,1) both; }
.app-nav-item.tapped { color:var(–lvl-bold); }
.app-nav-icon {
width:24px; height:24px; position:relative;
display:flex; align-items:center; justify-content:center;
}
.app-nav-item.active .app-nav-icon::before {
content:’’; position:absolute; inset:-5px;
background:rgba(var(–lvl-bold-rgb,255,122,0),0.12);
border-radius:10px;
}
.app-nav-label {
font-size:0.6rem; font-weight:600; letter-spacing:0.4px;
text-transform:uppercase;
}

/* ── Pantalla de celebración de bloque ── */
.celebration-screen { text-align:center; padding:40px 24px; }
.maria-img {
width:200px; height:200px; border-radius:50%; object-fit:cover;
border:4px solid var(–lvl-soft); margin:0 auto 24px;
box-shadow:0 8px 32px var(–shadow);
}
.maria-placeholder {
width:200px; height:200px; border-radius:50%; margin:0 auto 24px;
background:linear-gradient(135deg,var(–lvl-ultra),var(–lvl-light));
border:4px solid var(–lvl-soft); display:flex; align-items:center;
justify-content:center; font-size:4rem;
box-shadow:0 8px 32px var(–shadow);
}
.celebration-title {
font-family:‘Cormorant Garamond’, Georgia, serif;
font-size:1.9rem; font-weight:600; margin-bottom:8px; line-height:1.15;
}
.celebration-sub { font-size:0.88rem; color:var(–text-soft); margin-bottom:24px; line-height:1.7; }

/* ── Error / Loading ── */
.loading-screen, .error-screen {
display:flex; flex-direction:column; align-items:center; justify-content:center;
min-height:80dvh; padding:40px 24px; text-align:center;
}
.spinner {
width:40px; height:40px; border:3px solid var(–border);
border-top-color:var(–lvl-bold); border-radius:50%;
animation:spin 0.8s linear infinite; margin-bottom:18px;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── Celebración animada ── */
.confetti-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }
.confetti-piece {
position:absolute; width:8px; height:8px; border-radius:2px;
animation:confettiFall 2.5s ease-out forwards;
}
@keyframes confettiFall {
0% { transform:translateY(-20px) rotate(0deg); opacity:1; }
100% { transform:translateY(100vh) rotate(720deg); opacity:0; }
}

/* ── Mejora 3: Spring slide-up — cubic-bezier expresivo ── */
@keyframes fadeIn  { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideUp { from { opacity:0; transform:translateY(22px) scale(0.98); } to { opacity:1; transform:translateY(0) scale(1); } }

/* Elementos genéricos: fade suave original */
.fade-in { animation:fadeIn 0.4s ease both; }

/* Tarjetas de bloque (1): spring expresivo con stagger */
.block-card.fade-in    { animation:slideUp 0.55s cubic-bezier(0.34,1.72,0.64,1) both; }
.block-card.fade-in-d1 { animation-delay:0.05s; }
.block-card.fade-in-d2 { animation-delay:0.12s; }
.block-card.fade-in-d3 { animation-delay:0.19s; }
.block-card.fade-in-d4 { animation-delay:0.26s; }

/* Evangelio (2): spring con delay heredado */
.evangelio-box.fade-in { animation:slideUp 0.55s cubic-bezier(0.34,1.72,0.64,1) both; }

/* Prayer header / mystery-title (3): spring más lento, contemplativo */
.prayer-header.fade-in { animation:slideUp 0.65s cubic-bezier(0.34,1.72,0.64,1) both; }

/* Delays genéricos */
.fade-in-d1 { animation-delay:0.08s; }
.fade-in-d2 { animation-delay:0.16s; }
.fade-in-d3 { animation-delay:0.24s; }
.fade-in-d4 { animation-delay:0.32s; }

/* ══════════════════════════════════════════════════════
GAMIFICACIÓN: Lux + Mariano + Metros
══════════════════════════════════════════════════════ */

/* ── Lux (cruz guía en header) ── */
.lux-container {
position:relative; width:36px; height:36px;
display:flex; align-items:center; justify-content:center;
}
.lux-svg {
width:24px; height:24px;
filter:drop-shadow(0 0 2px #FFFCF7);
animation:luxBreathe 3s ease-in-out infinite;
}
.lux-svg.shine { animation:luxBreathe 3s ease-in-out infinite, luxShine 0.6s ease-out; }
.lux-svg.spin { animation:luxSpin 2s linear; }

@keyframes luxBreathe {
0%,100% { transform:scale(1); opacity:0.9; }
50% { transform:scale(1.08); opacity:1; }
}
@keyframes luxShine {
0%,100% { filter:drop-shadow(0 0 2px #FFFCF7); }
50% { filter:drop-shadow(0 0 16px #FFFCF7); }
}
@keyframes luxSpin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }

/* Partículas de Lux */
.lux-particle {
position:absolute; width:4px; height:4px; border-radius:50%;
background:#FFFCF7; left:50%; top:50%; opacity:0.8;
animation:luxParticleFly 1.5s ease-out forwards;
pointer-events:none;
}
@keyframes luxParticleFly {
0% { transform:translate(0,0) scale(1); opacity:0.8; }
100% { transform:translate(var(–x),var(–y)) scale(0); opacity:0; }
}

/* ── Display de metros ── */
.meters-display {
display:flex; align-items:center; gap:6px;
background:var(–sec-bg); padding:6px 12px; border-radius:12px;
border:1.5px solid var(–border);
}
.meters-display span { font-size:0.82rem; font-weight:700; color:var(–lvl-bold); }

/* ── Mariano Slide-in Overlay ── */
.mariano-overlay {
position:fixed; top:0; right:0; bottom:0; width:100%;
pointer-events:none; z-index:90;
display:flex; align-items:center; justify-content:flex-end;
padding-right:20px;
}
.mariano-slide {
width:182px; height:auto;
animation:marianoSlide 2.5s ease-in-out;
}
@keyframes marianoSlide {
0% { transform:translateX(200px); opacity:0; }
30% { transform:translateX(0); opacity:1; }
70% { transform:translateX(0); opacity:1; }
100% { transform:translateX(200px); opacity:0; }
}

.meters-float {
position:absolute; top:50%; right:220px;
font-size:1rem; font-weight:800; color:var(–green);
text-shadow:0 2px 8px rgba(52,168,83,0.4);
animation:metersFloat 2.5s ease-out;
}
.meters-float .extra-badge {
display:block; font-size:0.58rem; font-weight:800;
letter-spacing:1.5px; text-transform:uppercase;
color:#FFD700; text-shadow:0 1px 6px rgba(255,215,0,0.5);
margin-bottom:2px;
}
@keyframes metersFloat {
0% { transform:translateY(0); opacity:0; }
30% { opacity:1; }
70% { opacity:1; }
100% { transform:translateY(-40px); opacity:0; }
}

/* ── Mariano Grand Celebration ── */
.mariano-grand-overlay {
position:fixed; inset:0;
background:rgba(0,0,0,0.5);
display:flex; align-items:center; justify-content:center;
z-index:101; pointer-events:none;
}
.mariano-grand-container { position:relative; width:260px; height:260px; }
.mariano-grand {
width:260px; height:auto; margin-bottom:20px;
animation:popScale 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
}
@keyframes popScale {
0% { transform:scale(0); opacity:0; }
60% { transform:scale(1.1); opacity:1; }
100% { transform:scale(1); opacity:1; }
}

.mariano-grand-lux {
position:absolute; top:50%; left:50%;
transform:translate(-50%, -50%);
}
.mariano-grand-lux svg { width:32px; height:32px; }
.mariano-grand-lux.orbit1 svg { animation:luxOrbit1 3s ease-in-out infinite; }
.mariano-grand-lux.orbit2 svg { animation:luxOrbit2 3s ease-in-out infinite; }
.mariano-grand-lux.orbit3 svg { animation:luxOrbit3 3s ease-in-out infinite; }
.mariano-grand-lux.orbit4 svg { animation:luxOrbit4 3s ease-in-out infinite; }

@keyframes luxOrbit1 {
0% { transform:rotate(0deg) translateX(120px) rotate(0deg) scale(1); }
25% { transform:rotate(90deg) translateX(120px) rotate(-90deg) scale(1.5); }
50% { transform:rotate(180deg) translateX(120px) rotate(-180deg) scale(1); }
75% { transform:rotate(270deg) translateX(120px) rotate(-270deg) scale(1.5); }
100% { transform:rotate(360deg) translateX(120px) rotate(-360deg) scale(1); }
}
@keyframes luxOrbit2 {
0% { transform:rotate(45deg) translateX(120px) rotate(-45deg) scale(1); }
25% { transform:rotate(135deg) translateX(120px) rotate(-135deg) scale(1.6); }
50% { transform:rotate(225deg) translateX(120px) rotate(-225deg) scale(1); }
75% { transform:rotate(315deg) translateX(120px) rotate(-315deg) scale(1.6); }
100% { transform:rotate(405deg) translateX(120px) rotate(-405deg) scale(1); }
}
@keyframes luxOrbit3 {
0% { transform:rotate(0deg) translateX(120px) rotate(0deg) scale(1.3); }
33% { transform:rotate(120deg) translateX(120px) rotate(-120deg) scale(1); }
66% { transform:rotate(240deg) translateX(120px) rotate(-240deg) scale(1.7); }
100% { transform:rotate(360deg) translateX(120px) rotate(-360deg) scale(1.3); }
}
@keyframes luxOrbit4 {
0% { transform:rotate(90deg) translateX(120px) rotate(-90deg) scale(1.2); }
20% { transform:rotate(162deg) translateX(120px) rotate(-162deg) scale(1.5); }
40% { transform:rotate(234deg) translateX(120px) rotate(-234deg) scale(1); }
60% { transform:rotate(306deg) translateX(120px) rotate(-306deg) scale(1.6); }
80% { transform:rotate(378deg) translateX(120px) rotate(-378deg) scale(1.1); }
100% { transform:rotate(450deg) translateX(120px) rotate(-450deg) scale(1.2); }
}

.mariano-grand-meters {
text-align:center; color:#fff; font-size:1.55rem; font-weight:800;
text-shadow:0 4px 16px rgba(0,0,0,0.5); margin-top:20px;
}
.mariano-grand-text {
text-align:center; color:#fff; font-size:1rem; margin-top:8px;
text-shadow:0 2px 8px rgba(0,0,0,0.5);
}

/* Confetti para grand celebration */
.grand-confetti {
position:fixed; width:8px; height:8px; border-radius:50%;
animation:confettiFall 2.5s ease-out forwards;
pointer-events:none;
}

/* Responsivo */
@media(max-width:380px) { html { font-size:16px; } }
</style>

<script>
/* ══════════════════════════════════════════════════════
   CruzAndo App · Vanilla JS · Cero dependencias
   Lee JSON desde data/{id}.json via URL param ?c=0101
   Toda la paleta de colores viene de DATA.tema.paleta
   ══════════════════════════════════════════════════════ */

(function() {
  'use strict';

  // ── Estado global ──
  let DATA = null;
  let CANTOS_DATA = null;
  let MICRO_DATA = null;
  let NIVEL_ID = null;
  const MUSIC_BASE = 'https://pub-faed94e375aa443e846e07f81ef93274.r2.dev/';
  const AUDIO_BASE = 'https://pub-cd28789360f74fc0a623bb76605f42c3.r2.dev/';
  const IMAGE_BASE = 'https://pub-96c43f31e0da42dd950d4ac90328256e.r2.dev/';
  const BLOCK_COLORS = {
    gozosos:  '#D4A017',
    luminosos:'#01BBE1',
    dolorosos:'#C0392B',
    gloriosos:'#8E44AD'
  };
  let currentBlock = null;   // 'gozosos' | 'luminosos' | 'dolorosos' | 'gloriosos'
  let currentMystery = 0;    // 0-4 dentro del bloque
  let openSection = null;     // qué acordeón está abierto
  let progress = {};          // { gozosos: [ts,ts,null,null,null], ... }
  let journal = {};           // { gozosos: { 0: {q0:'',q1:'',q2:''}, ... }, ... }
  let medConfirmed = {};      // { gozosos: { 0: {q0:true,q1:false,q2:false}, ... }, ... }
  let microDone = {};          // { gozosos: true, luminosos: false, ... }
  let isDark = false;
  let userPlan = 'free'; // 'free' | 'pro' | 'beta' — se carga desde Firestore al init
  const isPremium = () => userPlan === 'pro' || userPlan === 'beta';

  // ── Gamificación ──
  let totalMeters = 0;
  let reflectionRewards = {}; // { blockId_mysteryId_questionId: true }
  let audioRewards = {};      // { blockId_mysteryId_audioType: true }
  let restPoseIndex = 0;
  let orbitIndex = 0;
  const REST_POSES = ['rest-staff', 'rest-sitting', 'rest-rock', 'rest-tree'];
  const MARIANO_BASE = 'https://padremonti.github.io/cruzando-app/assets/mariano/';

  const BLOCKS = ['gozosos','luminosos','dolorosos','gloriosos'];
  const BLOCK_NAMES = { gozosos:'Gozosos', luminosos:'Luminosos', dolorosos:'Dolorosos', gloriosos:'Gloriosos' };
  const ORDS = ['Primer','Segundo','Tercer','Cuarto','Quinto'];
  const BTYPES = { gozosos:'Gozoso', luminosos:'Luminoso', dolorosos:'Doloroso', gloriosos:'Glorioso' };
  const MED_LABELS = ['Por María hacia Jesús','Desde el Hijo hacia el Padre','Hijos y hermanos en el Espíritu'];
  const MED_COLORS = ['#FF7A00','#C0392B','#27AE60'];

  // Misterios del día según tradición católica
  const DAY_BLOCKS = { 0:'gloriosos', 1:'gozosos', 2:'dolorosos', 3:'gloriosos', 4:'luminosos', 5:'dolorosos', 6:'gozosos' };

  // Audio
  let audioEl = null;
  let audioPlaying = false;
  let currentAudioId = null;

  // ── Navegación al menú principal ──
  function goHome() {
    stopAudio();
    const base = window.location.origin
      + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
    window.location.href = base + 'index.html';
  }

  // ── Navegación a otras secciones (bottom nav) ──
  function goTo(page) {
    stopAudio();
    const base = window.location.origin
      + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
    window.location.href = base + page;
  }
  window._ca = window._ca || {};
  window._ca.goTo = goTo;

  // ── Sonido + animación bottom nav ──
  let _navChord = 0;
  const NAV_CHORDS = [
    [523,659,784],   // Do mayor
    [659,784,988],   // Mi menor
    [784,988,1175],  // Sol mayor
    [587,740,880]    // Re mayor
  ];
  function playNavChord() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const now = ac.currentTime;
      const notes = NAV_CHORDS[_navChord % 4]; _navChord++;
      const master = ac.createGain();
      master.gain.setValueAtTime(0, now);
      master.gain.linearRampToValueAtTime(0.07, now + 0.018);
      master.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      master.connect(ac.destination);
      notes.forEach((freq, j) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = j === 0 ? 'sine' : 'triangle';
        o.frequency.value = freq;
        g.gain.value = j === 0 ? 0.8 : 0.5;
        o.connect(g); g.connect(master);
        o.start(now + j * 0.012);
        o.stop(now + 0.45);
      });
    } catch(e) {}
  }
  function navTap(el) {
    playNavChord();
    el.classList.remove('tapped');
    void el.offsetWidth;
    el.classList.add('tapped');
    setTimeout(() => el.classList.remove('tapped'), 400);
  }
  window.navTap = navTap;

  // ── Utilidades ──
  const $ = id => document.getElementById(id);
  const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); };
  const lsKey = () => 'cruzando_nivel_' + NIVEL_ID;

  // Formatear ID "0101" → "Nivel 1-1" (estilo Mario Bros)
  function nivelLabel(id) {
    const mundo = parseInt(id.substring(0,2), 10);
    const nivel = parseInt(id.substring(2,4), 10);
    return 'Nivel ' + mundo + '-' + nivel;
  }

  // ── Construir URLs de audio dinámicamente desde NIVEL_ID ───────
  function contemplacionUrl(m) {
    const mundo = parseInt(NIVEL_ID.substring(0,2), 10);
    const nivel = parseInt(NIVEL_ID.substring(2,4), 10);
    return AUDIO_BASE + mundo + '_' + nivel + '_' + m.numero + '.mp3';
  }

  function cantoUrl(m) {
    const mundo = parseInt(NIVEL_ID.substring(0,2), 10);
    const nivel = parseInt(NIVEL_ID.substring(2,4), 10);
    return MUSIC_BASE + 'M_' + mundo + '_' + nivel + '_' + m.numero + '.mp3';
  }

  function imagenUrl(m) {
    const mundo = parseInt(NIVEL_ID.substring(0,2), 10);
    const nivel  = parseInt(NIVEL_ID.substring(2,4), 10);
    return IMAGE_BASE + 'P_' + mundo + '_' + nivel + '_' + m.numero + '.webp';
  }

  // ── Guardar reflexión individual en Firestore ──────────────────
  async function saveReflectionToFirestore(b, mi, qi, texto, questionText) {
    try {
      const user = _auth.currentUser;
      if (!user) return;
      const docId = NIVEL_ID + '_' + b + '_' + mi + '_q' + qi;
      await _db.collection('users').doc(user.uid).collection('reflections').doc(docId).set({
        nivelId:     NIVEL_ID,
        bloque:      b,
        misterioIdx: mi,
        questionIdx: qi,
        question:    questionText || MED_LABELS[qi] || '',
        text:        texto,
        confirmedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch(e) {
      console.warn('[CruzAndo] saveReflection:', e.message);
    }
  }

  // ── PERSISTENCIA — Firestore primero, localStorage como respaldo ──

  // Guarda en Firestore (fuente de verdad) + localStorage (respaldo offline)
  async function saveProgress() {
    const payload = {
      progress,
      journal,
      medConfirmed,
      microDone,
      reflectionRewards,
      audioRewards,
      updatedAt: Date.now()
    };

    // 1. localStorage — progreso del nivel
    try {
      localStorage.setItem(lsKey(), JSON.stringify({ ...payload, isDark }));
    } catch(e) {}

    // 2. localStorage — metros globales (clave separada)
    try {
      localStorage.setItem('cruzando_total_metros', String(totalMeters));
    } catch(e) {}

    // 3. Firestore — progreso del nivel (sin totalMeters)
    try {
      const user = _auth.currentUser;
      if (!user) return;
      await _db.collection('users').doc(user.uid)
        .collection('progress').doc(NIVEL_ID)
        .set({
          ...payload,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      await _db.collection('users').doc(user.uid)
        .set({ totalMeters }, { merge: true });
    } catch(e) {
      console.warn('[CruzAndo] saveProgress Firestore:', e.message);
    }
  }

  // Carga desde Firestore; si falla o no hay sesión, usa localStorage
  async function loadProgress(user) {
    let loaded = false;

    // 1. Firestore — fuente de verdad (solo si hay usuario)
    if (user) {
      try {
        const [snapNivel, snapUser] = await Promise.all([
          _db.collection('users').doc(user.uid).collection('progress').doc(NIVEL_ID).get(),
          _db.collection('users').doc(user.uid).get()
        ]);

        if (snapNivel.exists) {
          const d = snapNivel.data();
          if (d.progress)          progress          = d.progress;
          if (d.journal)           journal            = d.journal;
          if (d.medConfirmed)      medConfirmed       = d.medConfirmed;
          if (d.microDone)         microDone          = d.microDone;
          if (d.reflectionRewards) reflectionRewards  = d.reflectionRewards;
          if (d.audioRewards)      audioRewards       = d.audioRewards;
          loaded = true;
        }

        // Metros globales — Firestore es fuente de verdad
        if (snapUser.exists && typeof snapUser.data().totalMeters === 'number') {
          totalMeters = snapUser.data().totalMeters;
          try { localStorage.setItem('cruzando_total_metros', String(totalMeters)); } catch(e) {}
        } else {
          // Migrar desde localStorage si Firestore no tiene metros
          try {
            const m = localStorage.getItem('cruzando_total_metros');
            if (m !== null && !isNaN(Number(m)) && Number(m) > 0) {
              totalMeters = Number(m);
              _db.collection('users').doc(user.uid).set({ totalMeters }, { merge: true }).catch(() => {});
            }
          } catch(e) {}
        }
      } catch(e) {
        console.warn('[CruzAndo] loadProgress Firestore:', e.message);
      }
    }

    // 2. Fallback a localStorage si Firestore no devolvió datos del nivel
    if (!loaded) {
      try {
        const raw = localStorage.getItem(lsKey());
        if (raw) {
          const d = JSON.parse(raw);
          if (d.progress)          progress          = d.progress;
          if (d.journal)           journal            = d.journal;
          if (d.medConfirmed)      medConfirmed       = d.medConfirmed;
          if (d.microDone)         microDone          = d.microDone;
          if (d.reflectionRewards) reflectionRewards  = d.reflectionRewards;
          if (d.audioRewards)      audioRewards       = d.audioRewards;
        }
      } catch(e) {}
      // Metros desde localStorage como último recurso
      try {
        const m = localStorage.getItem('cruzando_total_metros');
        if (m !== null && !isNaN(Number(m))) totalMeters = Number(m);
      } catch(e) {}
    }

    // isDark siempre desde localStorage (preferencia de UI, no progreso)
    try {
      const raw = localStorage.getItem(lsKey());
      if (raw) {
        const d = JSON.parse(raw);
        if (typeof d.isDark === 'boolean') isDark = d.isDark;
      }
    } catch(e) {}

    // Inicializar estructura si no existe
    BLOCKS.forEach(b => {
      if (!progress[b]) progress[b] = [null,null,null,null,null];
      if (!journal[b])  journal[b]  = {};
    });

    updateMetersDisplay();
  }

  // ── Colores dinámicos ──
  function hexToRgb(hex) {
    const h = hex.replace('#','');
    return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)].join(',');
  }
  function applyPalette() {
    if (!DATA || !DATA.tema) return;
    const p = DATA.tema.paleta;
    const r = document.documentElement.style;
    r.setProperty('--lvl-bold', p.bold);
    r.setProperty('--lvl-base', p.base);
    r.setProperty('--lvl-soft', p.soft);
    r.setProperty('--lvl-mist', p.mist);
    r.setProperty('--lvl-light', p.light);
    r.setProperty('--lvl-ultra', p.ultra);
    // RGB versions for rgba() in gradients
    r.setProperty('--lvl-bold-rgb', hexToRgb(p.bold));
    r.setProperty('--lvl-light-rgb', hexToRgb(p.light));
    // Colores de bloques
    const bl = DATA.tema.bloques;
    if (bl.gozosos) r.setProperty('--goz-color', bl.gozosos.color);
    if (bl.luminosos) r.setProperty('--lum-color', bl.luminosos.color);
    if (bl.dolorosos) r.setProperty('--dol-color', bl.dolorosos.color);
    if (bl.gloriosos) r.setProperty('--glo-color', bl.gloriosos.color);
    // Meta theme-color
    document.querySelector('meta[name="theme-color"]').content = isDark ? '#1A1714' : '#E6DED3';
  }

  function blockColor(b) {
    if (!DATA || !DATA.tema || !DATA.tema.bloques[b]) return '#888';
    return DATA.tema.bloques[b].color;
  }
  function blockEmoji(b) {
    if (!DATA || !DATA.tema || !DATA.tema.bloques[b]) return '📿';
    return DATA.tema.bloques[b].emoji;
  }

  // ══════════════════════════════════════════════════════
  // GAMIFICACIÓN: Lux + Mariano + Metros + Sonidos
  // ══════════════════════════════════════════════════════

  // ── Actualizar display de metros ──
  function updateMetersDisplay() {
    const display = $('meters-value');
    if (display) {
      display.textContent = totalMeters.toLocaleString('es-MX') + 'm';
    }
  }

  // ── Obtener siguiente pose de descanso (ciclo) ──
  function getNextRestPose() {
    const pose = REST_POSES[restPoseIndex];
    restPoseIndex = (restPoseIndex + 1) % REST_POSES.length;
    return pose;
  }

  // ── Obtener siguiente órbita de Lux (ciclo) ──
  function getNextOrbit() {
    const orbit = 'orbit' + ((orbitIndex % 4) + 1);
    orbitIndex++;
    return orbit;
  }

  // ── Lux: Brillo y partículas ──
  function luxShine() {
    const lux = $('lux-svg');
    if (!lux) return;
    lux.classList.add('shine');
    setTimeout(() => lux.classList.remove('shine'), 600);
    spawnLuxParticles(3);
  }

  function spawnLuxParticles(count) {
    const container = $('lux-container');
    if (!container) return;
    for (let i = 0; i < count; i++) {
      const particle = document.createElement('div');
      particle.className = 'lux-particle';
      particle.style.setProperty('--x', (Math.random() - 0.5) * 100 + 'px');
      particle.style.setProperty('--y', (Math.random() - 0.5) * 100 + 'px');
      container.appendChild(particle);
      setTimeout(() => particle.remove(), 1500);
    }
  }

  // ── Sonido recompensante (melódico) ──
  function playRewardSound() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const frequencies = [523, 659]; // C5 + E5 (acorde mayor alegre)
      frequencies.forEach((f, i) => {
        setTimeout(() => {
          const o = ac.createOscillator();
          const g = ac.createGain();
          o.type = 'sine';
          o.frequency.value = f;
          g.gain.setValueAtTime(0.12, ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.35);
          o.connect(g);
          g.connect(ac.destination);
          o.start();
          o.stop(ac.currentTime + 0.35);
        }, i * 90);
      });
    } catch(e) {}
  }

  // ── Ganar metros (Mariano aparece) ──
  function gainMeters(meters, pose, isFirst = true) {
    const award = isFirst ? meters : Math.floor(meters / 2);
    totalMeters += award;
    updateMetersDisplay();
    saveProgress();
    luxShine();
    playRewardSound();
    showMarianoSlide(award, pose, isFirst);
  }

  // ── Mostrar Mariano slide-in ──
  function showMarianoSlide(meters, pose, isFirst = true) {
    const overlay = $('mariano-overlay');
    const img = $('mariano-slide-img');
    const text = $('meters-float-text');
    if (!overlay || !img || !text) return;

    img.src = MARIANO_BASE + 'mariano-' + pose + '.png';
    text.innerHTML = (isFirst
      ? '<span class="extra-badge">✦ EXTRA</span>'
      : '') +
      '+' + meters.toLocaleString('es-MX') + 'm';

    overlay.style.display = 'flex';
    setTimeout(() => { overlay.style.display = 'none'; }, 2500);
  }

  // ── Celebración grand (Mariano + Lux + Confetti) ──
  function showMarianoGrandCelebration() {
    totalMeters += 1000;
    updateMetersDisplay();
    saveProgress();

    const overlay = $('mariano-grand-overlay');
    const img = $('mariano-grand-img');
    const luxEl = $('mariano-grand-lux');
    const metersEl = $('mariano-grand-meters');

  // ── Sonidos de celebración ──
  function playNotes(freqs) {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      freqs.forEach((f, i) => {
        setTimeout(() => {
          const o = ac.createOscillator();
          const g = ac.createGain();
          o.type = 'sine'; o.frequency.value = f;
          g.gain.setValueAtTime(0.07, ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.35);
          o.connect(g); g.connect(ac.destination);
          o.start(); o.stop(ac.currentTime + 0.35);
        }, i * 180);
      });
    } catch(e){}
  }

  function playBubble() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const now = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, now);
      o.frequency.exponentialRampToValueAtTime(580, now + 0.055);
      o.frequency.exponentialRampToValueAtTime(220, now + 0.14);
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.15, now + 0.012);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      o.connect(g); g.connect(ac.destination);
      o.start(now); o.stop(now + 0.2);
    } catch(e){}
  }

  function playSoftTap() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const now = ac.currentTime;
      const bSz = ac.sampleRate * 0.03, buf = ac.createBuffer(1, bSz, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bSz; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bSz * 0.15));
      const s = ac.createBufferSource(); s.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(600, now);
      const gn = ac.createGain(); gn.gain.setValueAtTime(0.22, now); gn.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      s.connect(f); f.connect(gn); gn.connect(ac.destination); s.start(now); s.stop(now + 0.1);
    } catch(e){}
  }

  // ── Audio player ──
  function stopAudio() {
    if (audioEl) { audioEl.pause(); audioEl.currentTime = 0; }
    audioPlaying = false;
    currentAudioId = null;
    document.querySelectorAll('.play-btn').forEach(b => { b.innerHTML = playSVG(); });
    document.querySelectorAll('.audio-bar-fill').forEach(b => { b.style.width = '0%'; });
  }

  function toggleAudio(src, playerId) {
    if (!src) return;
    if (currentAudioId === playerId && audioPlaying) {
      audioEl.pause();
      audioPlaying = false;
      updatePlayBtn(playerId, false);
      return;
    }
    if (currentAudioId !== playerId) {
      stopAudio();
      audioEl = new Audio(src);
      currentAudioId = playerId;
      audioEl.addEventListener('timeupdate', () => {
        if (!audioEl.duration) return;
        const pct = (audioEl.currentTime / audioEl.duration) * 100;
        const fill = document.querySelector('#' + playerId + ' .audio-bar-fill');
        if (fill) fill.style.width = pct + '%';
        const cur = document.querySelector('#' + playerId + ' .a-cur');
        const dur = document.querySelector('#' + playerId + ' .a-dur');
        if (cur) cur.textContent = fmtTime(audioEl.currentTime);
        if (dur) dur.textContent = fmtTime(audioEl.duration);
      });
      audioEl.addEventListener('ended', () => {
        audioPlaying = false;
        currentAudioId = null;
        updatePlayBtn(playerId, false);
        
        console.log('Audio terminado:', playerId);
        
        // Disparar recompensa si no se ha dado antes
        const rewardKey = currentBlock + '_' + currentMystery + '_' + playerId;
        console.log('RewardKey:', rewardKey, 'Ya existe?', !!audioRewards[rewardKey]);
        
        const isFirstAudio = !audioRewards[rewardKey];
        if (isFirstAudio) audioRewards[rewardKey] = true;

          // Determinar metros y pose según tipo de audio
          let meters, pose;
          if (playerId.includes('rezar')) {
            meters = 1200; pose = 'walking';
          } else if (playerId.includes('contempl')) {
            meters = 800; pose = 'contemplative';
          } else if (playerId.includes('canto')) {
            meters = 600; pose = 'happy';
          }

          if (meters && pose) {
            gainMeters(meters, pose, isFirstAudio);
          }
      });
    }
    audioEl.play().then(() => {
      audioPlaying = true;
      updatePlayBtn(playerId, true);
    }).catch(()=>{});
  }

  function seekAudio(e, playerId) {
    if (!audioEl || currentAudioId !== playerId || !audioEl.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audioEl.currentTime = pct * audioEl.duration;
  }

  function updatePlayBtn(playerId, playing) {
    const btn = document.querySelector('#' + playerId + ' .play-btn');
    if (btn) btn.innerHTML = playing ? pauseSVG() : playSVG();
  }

  function fmtTime(s) {
    if (!s || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  function playSVG() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><polygon points="6,3 20,12 6,21"/></svg>'; }
  function pauseSVG() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/></svg>'; }

  // ── Entrar a un bloque ──
  function enterBlock(b) {
    // Usuario free: solo puede entrar al bloque del día
    const todayBlock = DAY_BLOCKS[new Date().getDay()];
    if (!isPremium() && b !== todayBlock) return;

    stopAudio();
    currentBlock = b;

    // Mostrar micro-aprendizaje si no se ha completado y hay datos
    if (!microDone[b] && MICRO_DATA && MICRO_DATA.bloques && MICRO_DATA.bloques[b]) {
      renderMicro(b);
      return;
    }

    const prog = progress[b] || [];
    const first = prog.findIndex(x => x === null);
    currentMystery = first >= 0 ? first : 0;
    openSection = null;
    renderPrayer();
  }

  // ── Micro-aprendizaje ──────────────────────────────────────────
  function renderMicro(b) {
    const bloque = MICRO_DATA.bloques[b];
    const tarjetas = bloque.tarjetas || [];
    const preguntas = bloque.preguntas || [];
    const total = tarjetas.length + preguntas.length;
    let step = 0;
    let seleccion = null;  // opción seleccionada en pregunta actual

    const blockColor = BLOCK_COLORS[b] || '#FF7A00';

    // Actualizar header
    $('micro-label').textContent = 'Prepara tu corazón · ' + BLOCK_NAMES[b];
    $('micro-sub').textContent = bloque.subtitulo || '';

    function renderDots() {
      const wrap = $('micro-progress');
      let html = '';
      for (let i = 0; i < total; i++) {
        const cls = i < step ? 'done' : i === step ? 'active' : '';
        const w = i === step ? '24px' : '8px';
        html += '<div class="micro-dot ' + cls + '" style="width:' + w + '"></div>';
      }
      wrap.innerHTML = html;
    }

    function renderStep() {
      seleccion = null;
      renderDots();
      const content = $('micro-content');
      const nav = $('micro-nav');

      // Pantalla final
      if (step >= total) {
        content.innerHTML =
          '<div class="micro-final">' +
            '<div class="micro-final-cross">' +
              '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="48" height="48"' +
              ' style="filter:drop-shadow(0 0 8px ' + blockColor + '80)">' +
                '<rect x="46" y="5" width="8" height="90" fill="' + blockColor + '"/>' +
                '<rect x="5" y="42" width="90" height="8" fill="' + blockColor + '"/>' +
              '</svg>' +
            '</div>' +
            '<div class="micro-final-titulo">Tu corazón está preparado</div>' +
            '<div class="micro-final-sub">Entra a los Misterios ' + BLOCK_NAMES[b] + '. Reza sin prisa. Lo que necesitas ya lo traes contigo.</div>' +
            '<div class="micro-metros-chip">🚶‍♂️ +600m al peregrino</div>' +
          '</div>';
        nav.innerHTML = '<button class="btn btn-primary btn-block" id="micro-btn-orar">Comenzar a rezar →</button>';
        $('micro-btn-orar').onclick = () => {
          const isFirstMicro = !microDone[b];
          microDone[b] = true;
          const microAward = isFirstMicro ? 600 : 300;
          totalMeters += microAward;
          updateMetersDisplay();
          saveProgress();
          // Mostrar Mariano con EXTRA si es primera vez
          showMarianoSlide(microAward, 'happy', isFirstMicro);
          playRewardSound();
          // Ir al primer misterio
          const prog = progress[b] || [];
          const first = prog.findIndex(x => x === null);
          currentMystery = first >= 0 ? first : 0;
          openSection = null;
          renderPrayer();
        };
        playNotes([392, 523, 659]);
        return;
      }

      // Tarjeta informativa
      if (step < tarjetas.length) {
        const t = tarjetas[step];
        content.innerHTML =
          '<div class="micro-card">' +
            '<div>' +
              '<div class="micro-card-emoji">' + escHTML(t.emoji) + '</div>' +
              '<div class="micro-card-titulo">' + escHTML(t.titulo) + '</div>' +
              '<div class="micro-card-contenido">' + escHTML(t.contenido) + '</div>' +
            '</div>' +
            '<div class="micro-card-footer">' +
              '<span class="micro-card-count">Tarjeta ' + (step + 1) + ' de ' + tarjetas.length + '</span>' +
            '</div>' +
          '</div>';
        nav.innerHTML =
          (step > 0 ? '<button class="btn btn-outline" id="micro-prev">← Anterior</button>' : '') +
          '<button class="btn btn-primary" id="micro-next">' +
            (step === tarjetas.length - 1 ? 'Prepara tu corazón →' : 'Siguiente →') +
          '</button>';
        if ($('micro-prev')) $('micro-prev').onclick = () => { step--; renderStep(); };
        $('micro-next').onclick = () => { step++; renderStep(); playBubble(); };
        return;
      }

      // Pregunta de apropiación
      const pi = step - tarjetas.length;
      const p = preguntas[pi];
      content.innerHTML =
        '<div class="micro-q-card" id="micro-q">' +
          '<div class="micro-q-label">✦ ' + (pi + 1) + ' de ' + preguntas.length + '</div>' +
          '<div class="micro-q-texto">' + escHTML(p.pregunta) + '</div>' +
          p.opciones.map((o, oi) =>
            '<button class="micro-option" id="micro-opt-' + oi + '" onclick="window._ca.microPick(' + oi + ')">' +
              '<span class="micro-option-circle" id="micro-circ-' + oi + '"></span>' +
              escHTML(o.texto) +
            '</button>'
          ).join('') +
          '<div id="micro-eco" style="display:none"></div>' +
        '</div>';
      nav.innerHTML = '<button class="btn btn-primary" id="micro-next-q" style="display:none">' +
        (pi === preguntas.length - 1 ? 'Estoy listo →' : 'Siguiente →') +
        '</button>';

      window._ca.microPick = (oi) => {
        if (seleccion !== null) return;
        seleccion = oi;
        const o = p.opciones[oi];
        // Actualizar estilos
        p.opciones.forEach((_, i) => {
          const btn = $('micro-opt-' + i);
          const circ = $('micro-circ-' + i);
          if (i === oi) { btn.classList.add('selected'); circ.textContent = '✓'; }
          else { btn.classList.add('dimmed'); }
        });
        // Mostrar eco
        const eco = $('micro-eco');
        eco.innerHTML =
          '<div class="micro-eco">' +
            '<span class="micro-eco-emoji">' + escHTML(o.emoji) + '</span>' +
            escHTML(o.eco) +
          '</div>';
        eco.style.display = '';
        // Mostrar botón siguiente
        $('micro-next-q').style.display = '';
        playSoftTap();
      };

      $('micro-next-q').onclick = () => { step++; renderStep(); playBubble(); };
    }

    show('scr-micro');
    renderStep();
  }

function parseMeditation(text) {
if (!text) return [’’,’’,’’];
// Intentar separar por las 3 etiquetas
const labels = MED_LABELS;
const parts = [];
let remaining = text;
for (let i = 0; i < labels.length; i++) {
const idx = remaining.indexOf(labels[i]);
if (idx >= 0) {
if (i > 0 && parts.length < i) parts.push(remaining.substring(0, idx).trim());
remaining = remaining.substring(idx + labels[i].length);
// Quitar : inicial si hay
remaining = remaining.replace(/^\s*:\s*/, ‘’);
}
}
if (remaining.trim()) parts.push(remaining.trim());

```
// Si no se pudo parsear con labels, intentar por líneas
if (parts.length < 3) {
  const lines = text.split('\n').filter(l => l.trim());
  return [lines[0] || '', lines[1] || '', lines[2] || ''];
}
return parts.length >= 3 ? parts.slice(0,3) : [...parts, ...Array(3-parts.length).fill('')];
```

    fetch(base + 'data/' + NIVEL_ID + '-micro.json')
  ]);
