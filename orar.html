<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E6DED3">
<title>CruzAndo · Orar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════
   CruzAndo · orar.html · MVP Vanilla JS · Cero deps
   Motor genérico: lee data/{id}.json + data/{id}-micro.json
   Flujo: Bloques → Micro-learning (1ª vez) → Oración
   ══════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

:root {
  --bg: #E6DED3;
  --card: #FFFCF7;
  --border: #D9D1C7;
  --text: #2B2622;
  --text-soft: #6B6259;
  --text-dim: #9B9389;
  --input-bg: #FFFCF7;
  --sec-bg: #F5F0E8;
  --shadow: rgba(43,38,34,0.08);
  --green: #34A853;
  --green-soft: rgba(52,168,83,0.12);
  --lvl-bold: #FF7A00;
  --lvl-base: #FF7F09;
  --lvl-soft: #F69C49;
  --lvl-mist: #FFA34E;
  --lvl-light: #FFCFA2;
  --lvl-ultra: rgba(255,122,0,0.07);
  --goz-color: #D4A017;
  --lum-color: #01BBE1;
  --dol-color: #C0392B;
  --glo-color: #8E44AD;
}

.dark {
  --bg: #1A1714;
  --card: #252119;
  --border: #3A3530;
  --text: #E6DED3;
  --text-soft: #B8A898;
  --text-dim: #786858;
  --input-bg: #2A2520;
  --sec-bg: #1E1B16;
  --shadow: rgba(0,0,0,0.3);
  --green-soft: rgba(52,168,83,0.18);
}

html { font-size:18px; }
body {
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  line-height:1.7; min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  transition:background 0.4s,color 0.4s;
}

.shell { max-width:480px; margin:0 auto; min-height:100dvh; position:relative; }
.screen { display:none; }
.screen.active { display:block; }

/* ── Header ── */
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px 10px; position:sticky; top:0; z-index:50;
  background:var(--bg); border-bottom:1px solid var(--border);
}
.header-title { font-size:1.05rem; font-weight:700; color:var(--lvl-bold); }
.header-sub { font-size:0.72rem; color:var(--text-dim); margin-top:1px; }
.header-actions { display:flex; gap:8px; align-items:center; }
.icon-btn {
  width:36px; height:36px; border-radius:50%; border:1px solid var(--border);
  background:var(--card); cursor:pointer; display:flex; align-items:center;
  justify-content:center; color:var(--text-soft); transition:all 0.2s;
}
.icon-btn:active { transform:scale(0.92); }

/* ── Metros display ── */
.meters-display {
  display:flex; align-items:center; gap:5px; padding:5px 10px;
  background:var(--card); border-radius:20px; border:1px solid var(--border);
  font-size:0.78rem; font-weight:700; color:var(--text-soft);
}

/* ── Lux ── */
.lux-container { position:relative; width:36px; height:36px; display:flex; align-items:center; justify-content:center; }
.lux-svg { width:24px; height:24px; filter:drop-shadow(0 0 2px #FFFCF7); animation:luxBreathe 3s ease-in-out infinite; }
.lux-svg.shine { animation:luxBreathe 3s ease-in-out infinite, luxShine 0.6s ease-out; }
@keyframes luxBreathe { 0%,100% { transform:scale(1); opacity:0.9; } 50% { transform:scale(1.08); opacity:1; } }
@keyframes luxShine { 0%,100% { filter:drop-shadow(0 0 2px #FFFCF7); } 50% { filter:drop-shadow(0 0 16px #FFFCF7); } }
.lux-particle {
  position:absolute; width:4px; height:4px; border-radius:50%;
  background:#FFFCF7; pointer-events:none;
  animation:luxParticle 1.5s ease-out forwards;
  --x:0px; --y:0px;
}
@keyframes luxParticle { 0% { transform:translate(0,0) scale(1); opacity:0.9; } 100% { transform:translate(var(--x),var(--y)) scale(0); opacity:0; } }

/* ══ PANTALLA: BLOQUES ══ */
.home-intro { padding:24px 18px 12px; text-align:center; }
.home-intro h1 { font-size:1.35rem; font-weight:800; color:var(--text); margin-bottom:4px; }
.home-intro p { font-size:0.82rem; color:var(--text-dim); }

.today-banner {
  margin:0 18px 16px; padding:16px 20px; border-radius:16px;
  background:linear-gradient(135deg,rgba(var(--lvl-light-rgb,255,207,162),0.55),rgba(255,245,232,0.7));
  border:2px solid var(--lvl-bold); cursor:pointer; transition:all 0.25s;
}
.dark .today-banner { background:linear-gradient(135deg,rgba(var(--lvl-bold-rgb,255,122,0),0.15),rgba(var(--lvl-bold-rgb,255,122,0),0.05)); }
.today-banner:active { transform:scale(0.98); }
.today-banner-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.today-banner-label { font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--lvl-bold); display:flex; align-items:center; gap:6px; }
.today-pulse { width:8px; height:8px; border-radius:50%; background:var(--lvl-bold); animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(1.4); } }
.today-banner-arrow { color:var(--lvl-bold); font-size:1.2rem; font-weight:700; }
.today-banner h3 { font-size:1.1rem; font-weight:800; margin-bottom:3px; }
.today-banner-days { font-size:0.72rem; color:var(--text-dim); }

.block-grid { display:flex; flex-direction:column; gap:14px; padding:8px 18px 24px; }
.block-card {
  background:var(--card); border-radius:16px; padding:18px 20px;
  border:2px solid var(--border); cursor:pointer; transition:all 0.25s;
  position:relative; overflow:hidden;
}
.block-card:active { transform:scale(0.98); }
.block-card.cleared { border-color:var(--green); }
.block-card.current { border-color:var(--lvl-bold); box-shadow:0 2px 16px var(--lvl-ultra); }
.block-card.today { border-color:var(--lvl-soft); background:linear-gradient(135deg,rgba(var(--lvl-light-rgb,255,207,162),0.35),var(--card)); }
.dark .block-card.today { background:linear-gradient(135deg,rgba(var(--lvl-bold-rgb,255,122,0),0.1),var(--card)); }
.block-card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.block-emoji { font-size:1.6rem; }
.block-badge { font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; padding:3px 10px; border-radius:20px; }
.block-badge.pending { background:var(--sec-bg); color:var(--text-dim); }
.block-badge.progress { background:var(--lvl-ultra); color:var(--lvl-bold); }
.block-badge.cleared { background:var(--green-soft); color:var(--green); }
.block-badge.today { background:var(--lvl-bold); color:#fff; }
.block-title { font-size:1.05rem; font-weight:700; margin-bottom:2px; }
.block-subtitle { font-size:0.78rem; color:var(--text-soft); font-style:italic; }
.block-progress { margin-top:12px; }
.block-dots { display:flex; gap:6px; }
.block-dot { width:10px; height:10px; border-radius:50%; background:var(--border); transition:all 0.3s; }
.block-dot.done { background:var(--green); box-shadow:0 0 6px rgba(52,168,83,0.4); }
.block-dot.active { background:var(--lvl-bold); box-shadow:0 0 8px var(--lvl-light); }

.nivel-done-banner {
  margin:8px 18px 18px; padding:20px; border-radius:16px;
  background:linear-gradient(135deg,var(--green-soft),rgba(52,168,83,0.05));
  border:2px solid var(--green); text-align:center;
}
.nivel-done-banner h3 { font-size:1.1rem; color:var(--green); margin-bottom:6px; }
.nivel-done-banner p { font-size:0.82rem; color:var(--text-soft); margin-bottom:14px; }

/* ══ PANTALLA: MICRO-LEARNING ══ */
#scr-micro {
  min-height:100dvh;
  background:var(--bg);
}

.micro-header {
  padding:18px 18px 14px;
  display:flex; align-items:center; justify-content:space-between;
}
.micro-header-left { display:flex; flex-direction:column; }
.micro-level-label { font-size:0.68rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.5px; font-weight:600; margin-bottom:3px; }
.micro-title { font-size:1.1rem; font-weight:700; color:var(--lvl-bold); }

.micro-progress-bar {
  margin:0 18px 18px; height:4px; background:var(--border); border-radius:2px; overflow:hidden;
}
.micro-progress-fill {
  height:100%; background:var(--lvl-bold); border-radius:2px;
  transition:width 0.4s ease;
}

.micro-progress-dots {
  display:flex; justify-content:center; gap:7px; margin-bottom:20px;
}
.micro-dot {
  height:8px; border-radius:4px; background:var(--border);
  transition:all 0.4s ease;
}
.micro-dot.done { background:var(--green); width:8px; }
.micro-dot.active { background:var(--lvl-bold); width:24px; }
.micro-dot.pending { width:8px; }

.micro-content { padding:0 18px; }

/* Tarjeta de micro-learning */
.micro-card {
  background:var(--card); border-radius:20px; padding:28px 24px;
  border:1.5px solid var(--border);
  box-shadow:0 6px 28px var(--shadow);
  animation:fadeSlideUp 0.35s ease both;
  min-height:220px; display:flex; flex-direction:column; justify-content:space-between;
}
.micro-card-emoji { font-size:2rem; margin-bottom:12px; }
.micro-card-title { font-size:1.2rem; font-weight:700; color:var(--lvl-bold); margin-bottom:14px; line-height:1.3; }
.micro-card-body { font-size:0.95rem; line-height:1.8; color:var(--text); flex:1; }
.micro-card-footer {
  display:flex; justify-content:space-between; align-items:center;
  margin-top:20px; padding-top:14px; border-top:1px solid var(--border);
}
.micro-card-counter { font-size:0.68rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.8px; font-weight:600; }
.micro-listen-btn {
  font-size:0.75rem; padding:5px 10px; border-radius:8px;
  border:1px solid var(--border); background:var(--sec-bg);
  color:var(--text-soft); cursor:pointer; transition:all 0.2s;
  font-family:inherit; font-weight:500;
}
.micro-listen-btn.speaking { background:var(--lvl-ultra); border-color:var(--lvl-soft); color:var(--lvl-bold); }

/* Pregunta A/B */
.micro-question-card {
  background:var(--card); border-radius:20px; padding:28px 24px;
  border:1.5px solid var(--border);
  box-shadow:0 6px 28px var(--shadow);
  animation:fadeSlideUp 0.35s ease both;
}
.micro-q-label {
  font-size:0.65rem; color:var(--lvl-bold); text-transform:uppercase;
  letter-spacing:1.5px; font-weight:700; margin-bottom:14px;
  display:flex; align-items:center; gap:6px;
}
.micro-q-label span { font-size:0.68rem; color:var(--text-dim); margin-left:auto; font-weight:400; letter-spacing:0; text-transform:none; }
.micro-question-text { font-size:1.1rem; font-weight:600; line-height:1.5; margin-bottom:20px; }
.micro-options { display:flex; flex-direction:column; gap:10px; }
.micro-option {
  display:flex; align-items:center; gap:12px; padding:14px 16px;
  border-radius:14px; border:1.5px solid var(--border);
  background:var(--sec-bg); cursor:pointer; transition:all 0.25s;
  font-family:inherit; font-size:0.9rem; line-height:1.5;
  color:var(--text); text-align:left;
}
.micro-option:active { transform:scale(0.98); }
.micro-option.selected {
  border-color:var(--lvl-bold); background:var(--lvl-ultra);
}
.micro-option.dimmed { opacity:0.4; }
.micro-option-radio {
  flex-shrink:0; width:22px; height:22px; border-radius:50%;
  border:1.5px solid var(--border); background:transparent;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.25s; font-size:0.7rem; color:#fff; font-weight:700;
}
.micro-option.selected .micro-option-radio {
  background:var(--lvl-bold); border-color:var(--lvl-bold);
}

.micro-eco {
  margin-top:16px; padding:14px 16px; border-radius:14px;
  border-left:3px solid var(--lvl-bold); background:var(--lvl-ultra);
  animation:fadeSlideUp 0.3s ease both;
  display:flex; align-items:flex-start; gap:10px;
}
.micro-eco-emoji { font-size:1.2rem; flex-shrink:0; }
.micro-eco-text { font-size:0.88rem; line-height:1.65; font-weight:500; }

/* Pantalla final del micro */
.micro-final {
  text-align:center; padding:50px 24px 30px;
  animation:fadeSlideUp 0.4s ease both;
}
.micro-final-lux {
  margin:0 auto 20px;
  width:48px; height:48px;
  display:flex; align-items:center; justify-content:center;
  animation:luxBreathe 3s ease-in-out infinite;
  filter:drop-shadow(0 0 10px #FFFCF7);
}
.micro-final h3 { font-size:1.3rem; font-weight:800; color:var(--lvl-bold); margin-bottom:10px; }
.micro-final p { font-size:0.92rem; line-height:1.7; color:var(--text-soft); margin-bottom:8px; max-width:300px; margin-left:auto; margin-right:auto; }
.micro-final-meters {
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 18px; border-radius:20px;
  background:var(--green-soft); color:var(--green);
  font-size:0.88rem; font-weight:700; margin:14px 0 28px;
}

/* Navegación inferior del micro */
.micro-nav {
  display:flex; justify-content:space-between; align-items:center;
  padding:20px 18px 0;
}
.micro-btn-back {
  background:none; border:none; cursor:pointer; font-family:inherit;
  font-size:0.88rem; font-weight:500; color:var(--text-dim); padding:8px;
}
.micro-btn-back:disabled { opacity:0.3; cursor:default; }
.micro-btn-next {
  padding:12px 22px; border-radius:12px; border:none;
  background:var(--lvl-bold); color:#fff; font-family:inherit;
  font-size:0.88rem; font-weight:700; cursor:pointer;
  transition:all 0.2s; box-shadow:0 4px 14px rgba(0,0,0,0.12);
}
.micro-btn-next:active { transform:scale(0.96); }
.micro-swipe-hint {
  text-align:center; margin-top:14px;
  font-size:0.75rem; color:var(--text-dim); font-style:italic;
}

/* ══ PANTALLA: ORACIÓN ══ */
.prayer-header { padding:16px 18px 10px; }
.prayer-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.mystery-counter { font-size:0.72rem; font-weight:600; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; }
.mystery-title { font-size:1.15rem; font-weight:800; margin-bottom:2px; }
.mystery-subtitle { font-size:0.82rem; color:var(--text-soft); font-style:italic; }

.mystery-beads { padding:0 18px 14px; }
.mystery-beads svg { width:100%; height:30px; }

.evangelio-box { margin:0 18px 14px; padding:20px; border-radius:16px; background:var(--card); border-left:4px solid var(--lvl-soft); }
.evangelio-label { font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; color:var(--lvl-bold); margin-bottom:10px; display:flex; align-items:center; gap:6px; }
.evangelio-text { font-size:0.95rem; line-height:1.85; color:var(--text); }
.evangelio-ref { font-size:0.78rem; color:var(--text-dim); text-align:right; margin-top:12px; font-style:italic; }

.accordion { margin:0 18px 10px; }
.acc-item { background:var(--card); border-radius:14px; margin-bottom:10px; overflow:hidden; border:1.5px solid var(--border); transition:border-color 0.3s; }
.acc-item.open { border-color:var(--lvl-soft); }
.acc-trigger { width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:none; border:none; cursor:pointer; font-family:inherit; color:var(--text); transition:background 0.2s; }
.acc-trigger:active { background:var(--sec-bg); }
.acc-trigger-left { display:flex; align-items:center; gap:10px; }
.acc-icon { width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1rem; }
.acc-label { font-size:0.88rem; font-weight:600; }
.acc-chevron { transition:transform 0.3s; color:var(--text-dim); }
.acc-item.open .acc-chevron { transform:rotate(180deg); }
.acc-body { max-height:0; overflow:hidden; transition:max-height 0.4s ease; }
.acc-body-inner { padding:0 18px 18px; }

.audio-player { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--sec-bg); border-radius:12px; }
.play-btn { width:44px; height:44px; border-radius:50%; border:none; background:var(--lvl-bold); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; }
.play-btn:active { transform:scale(0.9); }
.audio-info { flex:1; min-width:0; }
.audio-label { font-size:0.75rem; color:var(--text-soft); margin-bottom:4px; }
.audio-bar-wrap { width:100%; height:5px; background:var(--border); border-radius:3px; cursor:pointer; position:relative; }
.audio-bar-fill { height:100%; border-radius:3px; background:var(--lvl-bold); transition:width 0.1s linear; }
.audio-time { font-size:0.68rem; color:var(--text-dim); margin-top:3px; display:flex; justify-content:space-between; }

.canto-box { padding:18px; background:var(--lvl-ultra); border-radius:14px; border-left:3px solid var(--lvl-soft); text-align:center; }
.canto-box p { font-size:0.88rem; color:var(--text); font-style:italic; line-height:1.7; }
.canto-box .canto-hint { font-size:0.78rem; color:var(--text-dim); margin-top:8px; display:block; }

.contempl-text { margin-top:14px; padding:16px 18px; background:var(--sec-bg); border-radius:14px; border-left:3px solid var(--lvl-soft); font-size:0.92rem; line-height:1.9; white-space:pre-line; }

.med-group { margin-bottom:18px; }
.med-label-row { display:flex; align-items:center; gap:7px; margin-bottom:6px; }
.med-dot { width:7px; height:7px; border-radius:50%; }
.med-label-text { font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; }
.med-question { font-size:0.92rem; line-height:1.7; margin-bottom:10px; }
.journal-area { width:100%; min-height:100px; padding:14px; border-radius:12px; border:1.5px solid var(--border); background:var(--input-bg); font-family:inherit; font-size:0.88rem; line-height:1.6; color:var(--text); resize:vertical; transition:border-color 0.3s; }
.journal-area:focus { outline:none; border-color:var(--lvl-soft); }
.journal-area::placeholder { color:var(--text-dim); }
.med-confirm { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; margin-top:8px; padding:10px; border-radius:10px; border:1.5px solid var(--border); background:var(--sec-bg); font-family:inherit; font-size:0.78rem; font-weight:600; color:var(--text-soft); cursor:pointer; transition:all 0.3s; }
.med-confirm:active { transform:scale(0.96); }
.med-confirm.done { background:var(--green-soft); border-color:var(--green); color:var(--green); cursor:default; }
@keyframes medGlow { 0% { box-shadow:0 0 0 0 rgba(52,168,83,0.4); } 70% { box-shadow:0 0 0 10px rgba(52,168,83,0); } 100% { box-shadow:0 0 0 0 rgba(52,168,83,0); } }
.med-confirm.glow { animation:medGlow 0.6s ease; }

.interc-text { padding:18px; background:var(--lvl-ultra); border-radius:14px; font-size:0.92rem; line-height:1.85; white-space:pre-line; }
.amen-btn { display:block; width:100%; margin-top:14px; padding:16px; border-radius:14px; border:none; cursor:pointer; font-family:inherit; font-size:1rem; font-weight:800; background:var(--lvl-bold); color:#fff; letter-spacing:1px; transition:all 0.2s; box-shadow:0 4px 16px rgba(0,0,0,0.12); }
.amen-btn:active { transform:scale(0.96); }
.amen-btn.done { background:var(--green); }

.mystery-done-bar { margin:12px 18px; padding:14px 18px; border-radius:14px; background:var(--green-soft); border:1.5px solid rgba(52,168,83,0.2); display:flex; align-items:center; gap:10px; }
.done-check { color:var(--green); font-size:1.2rem; }
.done-text { font-size:0.82rem; font-weight:600; color:var(--green); }
.done-date { font-size:0.72rem; color:var(--text-dim); }

.bottom-nav { padding:14px 18px 28px; display:flex; gap:10px; }
.bottom-nav .btn { flex:1; }

/* ══ PANTALLA: CELEBRACIÓN ══ */
.celebration-screen { text-align:center; padding:40px 24px; }
.maria-placeholder { width:200px; height:200px; border-radius:50%; margin:0 auto 24px; background:linear-gradient(135deg,var(--lvl-ultra),var(--lvl-light)); border:4px solid var(--lvl-soft); display:flex; align-items:center; justify-content:center; font-size:4rem; box-shadow:0 8px 32px var(--shadow); }
.maria-img { width:200px; height:200px; border-radius:50%; object-fit:cover; border:4px solid var(--lvl-soft); margin:0 auto 24px; box-shadow:0 8px 32px var(--shadow); }
.celebration-title { font-size:1.3rem; font-weight:800; margin-bottom:8px; }
.celebration-sub { font-size:0.88rem; color:var(--text-soft); margin-bottom:24px; line-height:1.7; }

/* ══ BOTONES COMUNES ══ */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 28px; border-radius:14px; border:none; cursor:pointer; font-family:inherit; font-size:0.88rem; font-weight:700; transition:all 0.2s; letter-spacing:0.3px; }
.btn:active { transform:scale(0.96); }
.btn-primary { background:var(--lvl-bold); color:#fff; box-shadow:0 4px 14px rgba(0,0,0,0.15); }
.btn-green { background:var(--green); color:#fff; }
.btn-outline { background:transparent; border:2px solid var(--border); color:var(--text-soft); }
.btn-ghost { background:transparent; color:var(--text-soft); padding:10px 14px; font-size:0.82rem; }
.btn-block { width:100%; }

/* ══ OVERLAYS DE MARIANO ══ */
.mariano-overlay {
  position:fixed; bottom:0; right:0; z-index:90;
  display:none; flex-direction:column; align-items:flex-end;
  pointer-events:none;
}
.mariano-slide {
  width:120px; height:auto;
  animation:marianoSlideIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes marianoSlideIn { from { transform:translateX(140px); opacity:0; } to { transform:translateX(0); opacity:1; } }
.meters-float {
  position:absolute; bottom:110px; right:18px;
  background:var(--green); color:#fff;
  font-size:1.1rem; font-weight:800; padding:6px 14px; border-radius:20px;
  animation:floatUp 1.5s ease-out forwards;
  box-shadow:0 4px 14px rgba(52,168,83,0.4);
}
@keyframes floatUp { 0% { opacity:0; transform:translateY(10px) scale(0.8); } 20% { opacity:1; transform:translateY(0) scale(1); } 70% { opacity:1; transform:translateY(-16px) scale(1); } 100% { opacity:0; transform:translateY(-28px) scale(0.9); } }

.mariano-grand-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.5);
  display:none; align-items:center; justify-content:center;
  z-index:101; pointer-events:none;
}
.mariano-grand-container { position:relative; width:260px; height:260px; }
.mariano-grand { width:260px; height:auto; margin-bottom:20px; animation:popScale 0.6s cubic-bezier(0.68,-0.55,0.265,1.55) forwards; }
@keyframes popScale { 0% { transform:scale(0); opacity:0; } 60% { transform:scale(1.1); opacity:1; } 100% { transform:scale(1); opacity:1; } }
.mariano-grand-lux { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
.mariano-grand-lux.orbit1 svg { animation:luxOrbit1 3s ease-in-out infinite; }
@keyframes luxOrbit1 { 0% { transform:rotate(0deg) translateX(120px) rotate(0deg) scale(1); } 25% { transform:rotate(90deg) translateX(120px) rotate(-90deg) scale(1.5); } 50% { transform:rotate(180deg) translateX(120px) rotate(-180deg) scale(1); } 75% { transform:rotate(270deg) translateX(120px) rotate(-270deg) scale(1.5); } 100% { transform:rotate(360deg) translateX(120px) rotate(-360deg) scale(1); } }
.mariano-grand-meters { text-align:center; color:#fff; font-size:1.55rem; font-weight:800; text-shadow:0 4px 16px rgba(0,0,0,0.5); margin-top:20px; }
.mariano-grand-text { text-align:center; color:#fff; font-size:1rem; margin-top:8px; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
.grand-confetti { position:fixed; width:8px; height:8px; border-radius:50%; animation:confettiFall 2.5s ease-out forwards; pointer-events:none; }

/* ══ LOADING / ERROR ══ */
.loading-screen, .error-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80dvh; padding:40px 24px; text-align:center; }
.spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--lvl-bold); border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:18px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ══ ANIMACIONES ══ */
@keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeSlideUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
.fade-in { animation:fadeIn 0.4s ease both; }
.fade-in-d1 { animation-delay:0.08s; }
.fade-in-d2 { animation-delay:0.16s; }
.fade-in-d3 { animation-delay:0.24s; }
.fade-in-d4 { animation-delay:0.32s; }

@keyframes confettiFall { 0% { transform:translateY(-20px) rotate(0deg); opacity:1; } 100% { transform:translateY(100vh) rotate(720deg); opacity:0; } }
.confetti-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }
.confetti-piece { position:absolute; width:8px; height:8px; border-radius:2px; animation:confettiFall 2.5s ease-out forwards; }

/* Transición entre screens del micro */
.micro-transition-overlay {
  position:fixed; inset:0; z-index:80;
  background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transition:opacity 0.3s;
}
.micro-transition-overlay.active { opacity:1; pointer-events:all; }
.micro-transition-lux {
  animation:luxBreathe 1.5s ease-in-out infinite;
  filter:drop-shadow(0 0 20px #FFFCF7);
}

@media(max-width:380px) { html { font-size:16px; } }
</style>
</head>
<body>
<div class="shell" id="app">

  <!-- Loading -->
  <div class="loading-screen" id="scr-loading">
    <div class="spinner"></div>
    <p style="font-size:0.88rem;color:var(--text-dim)">Cargando nivel…</p>
  </div>

  <!-- Error -->
  <div class="error-screen" id="scr-error" style="display:none">
    <div style="font-size:3rem;margin-bottom:16px">📿</div>
    <h2 style="font-size:1.1rem;margin-bottom:8px">No se encontró el nivel</h2>
    <p id="error-msg" style="font-size:0.82rem;color:var(--text-dim);margin-bottom:20px"></p>
    <a href="?c=0101" class="btn btn-primary">Ir a Nivel 1-1: Males</a>

  <!-- ═══ HEADER (compartido) ═══ -->
  <header class="header" id="main-header" style="display:none">
    <div>

      <div class="header-sub" id="h-sub"></div>

      <div class="lux-container" id="lux-container">

          <defs><filter id="luxGlow"><feGaussianBlur stdDeviation="2" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
          <g filter="url(#luxGlow)">
            <rect x="46.1926" y="0.285" width="7.6148" height="99.43" fill="#FFFCF7"/>
            <rect x="0" y="46.2068" width="100" height="7.5864" fill="#FFFCF7"/>
          </g>
        </svg>
      </div>
      <button class="icon-btn" id="btn-dark" title="Modo oscuro">
        <svg id="ico-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="ico-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- ═══ PANTALLA: BLOQUES ═══ -->
  <div class="screen" id="scr-home">
    <div class="home-intro fade-in">
      <h1 id="home-title"></h1>
      <p id="home-element"></p>
    </div>
    <div id="today-banner-wrap"></div>
    <div class="block-grid" id="block-grid"></div>
    <div id="nivel-done-wrap" style="display:none"></div>
  </div>

  <!-- ═══ PANTALLA: MICRO-LEARNING ═══ -->
  <div class="screen" id="scr-micro">
    <div class="micro-header">
      <div class="micro-header-left">
        <div class="micro-level-label" id="micro-level-label"></div>
        <div class="micro-title" id="micro-title"></div>
      </div>
      <button class="btn-ghost" id="micro-btn-skip" style="font-size:0.75rem;padding:6px 10px">Saltar →</button>
    </div>
    <div class="micro-progress-bar"><div class="micro-progress-fill" id="micro-progress-fill"></div></div>
    <div class="micro-progress-dots" id="micro-progress-dots"></div>
    <div class="micro-content" id="micro-content"></div>
    <div class="micro-nav" id="micro-nav">
      <button class="micro-btn-back" id="micro-btn-back">← Anterior</button>
      <button class="micro-btn-next" id="micro-btn-next">Siguiente →</button>
    </div>
    <div class="micro-swipe-hint" id="micro-swipe-hint">Desliza o toca para avanzar</div>
  </div>

  <!-- ═══ PANTALLA: ORACIÓN ═══ -->
  <div class="screen" id="scr-prayer">
    <div class="prayer-header fade-in">
      <div class="prayer-nav">
        <button class="btn-ghost" id="btn-back-home">← Inicio</button>
        <span class="mystery-counter" id="prayer-counter"></span>
      </div>
      <div class="mystery-title" id="prayer-title"></div>
      <div class="mystery-subtitle" id="prayer-subtitle"></div>
    </div>
    <div class="mystery-beads" id="prayer-dots"></div>
    <div class="evangelio-box fade-in fade-in-d1" id="evangelio-box">
      <div class="evangelio-label">📖 Evangelio</div>
      <div class="evangelio-text" id="ev-text"></div>
      <div class="evangelio-ref" id="ev-ref"></div>
    </div>
    <div class="accordion" id="accordion"></div>
    <div id="mystery-done-wrap" style="display:none"></div>
    <div class="bottom-nav" id="bottom-nav"></div>
  </div>

  <!-- ═══ PANTALLA: CELEBRACIÓN ═══ -->
  <div class="screen" id="scr-celebration">
    <div class="celebration-screen fade-in">
      <div class="maria-placeholder" id="maria-container">🙏</div>
      <h2 class="celebration-title" id="celeb-title"></h2>
      <p class="celebration-sub" id="celeb-sub"></p>
      <button class="btn btn-primary btn-block" id="btn-celeb-home">Regresar a inicio</button>
    </div>

  <!-- ═══ OVERLAY: MARIANO SLIDE ═══ -->
  <div class="mariano-overlay" id="mariano-overlay">
    <img id="mariano-slide-img" class="mariano-slide" alt="Mariano">
    <div class="meters-float" id="meters-float-text"></div>
  </div>

  <!-- ═══ OVERLAY: MARIANO GRAND ═══ -->
  <div class="mariano-grand-overlay" id="mariano-grand-overlay">
    <div class="mariano-grand-container">
      <img id="mariano-grand-img" class="mariano-grand" alt="Mariano celebrando">
      <div class="mariano-grand-lux orbit1" id="mariano-grand-lux">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
          <g filter="url(#luxGlow)">
            <rect x="46.1926" y="0.285" width="7.6148" height="99.43" fill="#FFFCF7"/>
            <rect x="0" y="46.2068" width="100" height="7.5864" fill="#FFFCF7"/>
          </g>
        </svg>
      </div>
      <div class="mariano-grand-meters" id="mariano-grand-meters"></div>
      <div class="mariano-grand-text" id="mariano-grand-text"></div>

  <!-- ═══ OVERLAY: TRANSICIÓN MICRO ═══ -->
  <div class="micro-transition-overlay" id="micro-transition-overlay">
    <div class="micro-transition-lux">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
        <g filter="url(#luxGlow)">
          <rect x="46.1926" y="0.285" width="7.6148" height="99.43" fill="#FFFCF7"/>
          <rect x="0" y="46.2068" width="100" height="7.5864" fill="#FFFCF7"/>
        </g>
      </svg>
    </div>
  </div>

</div><!-- /.shell -->

<script>
/* ══════════════════════════════════════════════════════
   CruzAndo · orar.html · Motor genérico · Vanilla JS
   Lee: data/{id}.json  +  data/{id}-micro.json
   Flujo: Bloques → Micro (1ª vez) → Oración
   ══════════════════════════════════════════════════════ */

(function() {
  'use strict';

  // ════════════════════════════════
  // ESTADO GLOBAL
  // ════════════════════════════════
  let DATA       = null;   // data/{id}.json
  let MICRO      = null;   // data/{id}-micro.json  (puede ser null)
  let NIVEL_ID   = null;

  let currentBlock   = null;   // 'gozosos' | 'luminosos' | 'dolorosos' | 'gloriosos'
  let currentMystery = 0;
  let openSection    = null;
  let isDark         = false;

  // Progreso de oración
  let progress      = {};   // { gozosos: [ts,ts,null,null,null], ... }
  let journal       = {};
  let medConfirmed  = {};

  // Gamificación
  let totalMeters       = 0;
  let reflectionRewards = {};
  let audioRewards      = {};
  let microDone         = {};   // { gozosos: true, ... } — micro completado para ese bloque

  // Micro-learning state
  let microStep        = 0;   // paso actual dentro del micro
  let microSteps       = [];  // array plano: [{type:'card',...}, {type:'question',...}, {type:'final'}]
  let microAnswered    = {};  // { stepIndex: opcionIndex }
  let microSpeaking    = false;
  let microSpeechUtil  = null;

  // Audio oración
  let audioEl       = null;
  let audioPlaying  = false;
  let currentAudioId = null;

  const BLOCKS      = ['gozosos','luminosos','dolorosos','gloriosos'];
  const BLOCK_NAMES = { gozosos:'Gozosos', luminosos:'Luminosos', dolorosos:'Dolorosos', gloriosos:'Gloriosos' };
  const ORDS        = ['Primer','Segundo','Tercer','Cuarto','Quinto'];
  const BTYPES      = { gozosos:'Gozoso', luminosos:'Luminoso', dolorosos:'Doloroso', gloriosos:'Glorioso' };
  const MED_LABELS  = ['Por María hacia Jesús','Desde el Hijo hacia el Padre','Hijos y hermanos en el Espíritu'];
  const MED_COLORS  = ['#FF7A00','#C0392B','#27AE60'];
  const DAY_BLOCKS  = { 0:'gloriosos',1:'gozosos',2:'dolorosos',3:'gloriosos',4:'luminosos',5:'dolorosos',6:'gozosos' };
  const REST_POSES  = ['rest-staff','rest-sitting','rest-rock','rest-tree'];
  const MARIANO_BASE = 'https://padremonti.github.io/cruzando-app/assets/mariano/';
  const MUSIC_BASE   = 'https://pub-faed94e375aa443e846e07f81ef93274.r2.dev/';
  const AUDIO_BASE   = 'https://pub-cd28789360f74fc0a623bb76605f42c3.r2.dev/';

  let restPoseIndex = 0;
  let orbitIndex    = 0;

  // ════════════════════════════════
  // UTILIDADES
  // ════════════════════════════════
  const $ = id => document.getElementById(id);

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  function lsKey()      { return 'cruzando_nivel_' + NIVEL_ID; }
  function nivelLabel(id) {
    const m = parseInt(id.substring(0,2), 10);
    const n = parseInt(id.substring(2,4), 10);
    return 'Nivel ' + m + '-' + n;
  }

  // Construir URL de contemplación desde NIVEL_ID y número de misterio
  function contemplacionUrl(m) {
    const mundo = parseInt(NIVEL_ID.substring(0,2), 10);
    const nivel  = parseInt(NIVEL_ID.substring(2,4), 10);
    return AUDIO_BASE + mundo + '_' + nivel + '_' + m.numero + '.mp3';
  }

  // Construir URL del canto desde NIVEL_ID y número de misterio
  function cantoUrl(m) {
    // NIVEL_ID = '0101' → mundo=1, nivel=1
    const mundo = parseInt(NIVEL_ID.substring(0,2), 10);
    const nivel = parseInt(NIVEL_ID.substring(2,4), 10);
    return MUSIC_BASE + 'M_' + mundo + '_' + nivel + '_' + m.numero + '.mp3';
  }

  function escHTML(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  function hexToRgb(hex) {
    const h = hex.replace('#','');
    return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)].join(',');
  }

  // ════════════════════════════════
  // PERSISTENCIA
  // ════════════════════════════════
  function saveProgress() {
    try {
      localStorage.setItem(lsKey(), JSON.stringify({
        progress, journal, medConfirmed, isDark,
        totalMeters, reflectionRewards, audioRewards, microDone
      }));
    } catch(e) {}
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem(lsKey());
      if (raw) {
        const d = JSON.parse(raw);
        if (d.progress)          progress          = d.progress;
        if (d.journal)           journal           = d.journal;
        if (d.medConfirmed)      medConfirmed      = d.medConfirmed;
        if (typeof d.isDark === 'boolean') isDark  = d.isDark;
        if (typeof d.totalMeters === 'number') totalMeters = d.totalMeters;
        if (d.reflectionRewards) reflectionRewards = d.reflectionRewards;
        if (d.audioRewards)      audioRewards      = d.audioRewards;
        if (d.microDone)         microDone         = d.microDone;
      }
    } catch(e) {}
    BLOCKS.forEach(b => {
      if (!progress[b]) progress[b] = [null,null,null,null,null];
      if (!journal[b])  journal[b]  = {};
    });
    updateMetersDisplay();
  }

  // ════════════════════════════════
  // PALETA DE COLORES
  // ════════════════════════════════
  function applyPalette() {
    if (!DATA || !DATA.tema) return;
    const p = DATA.tema.paleta;
    const r = document.documentElement.style;
    r.setProperty('--lvl-bold',  p.bold);
    r.setProperty('--lvl-base',  p.base);
    r.setProperty('--lvl-soft',  p.soft);
    r.setProperty('--lvl-mist',  p.mist);
    r.setProperty('--lvl-light', p.light);
    r.setProperty('--lvl-ultra', p.ultra);
    r.setProperty('--lvl-bold-rgb',  hexToRgb(p.bold));
    r.setProperty('--lvl-light-rgb', hexToRgb(p.light));
    const bl = DATA.tema.bloques;
    if (bl.gozosos)  r.setProperty('--goz-color', bl.gozosos.color);
    if (bl.luminosos) r.setProperty('--lum-color', bl.luminosos.color);
    if (bl.dolorosos) r.setProperty('--dol-color', bl.dolorosos.color);
    if (bl.gloriosos) r.setProperty('--glo-color', bl.gloriosos.color);
    document.querySelector('meta[name="theme-color"]').content = isDark ? '#1A1714' : '#E6DED3';
  }

  function blockColor(b) {
    if (!DATA || !DATA.tema || !DATA.tema.bloques[b]) return '#888';
    return DATA.tema.bloques[b].color;
  }
  function blockEmoji(b) {
    if (!DATA || !DATA.tema || !DATA.tema.bloques[b]) return '📿';
    return DATA.tema.bloques[b].emoji;
  }

  // ════════════════════════════════
  // DARK MODE
  // ════════════════════════════════
  function toggleDark() {
    isDark = !isDark;
    document.body.classList.toggle('dark', isDark);
    $('ico-sun').style.display  = isDark ? 'none'  : 'block';
    $('ico-moon').style.display = isDark ? 'block' : 'none';
    document.querySelector('meta[name="theme-color"]').content = isDark ? '#1A1714' : '#E6DED3';
    saveProgress();
  }

  // ════════════════════════════════
  // GAMIFICACIÓN: LUX + MARIANO + METROS
  // ════════════════════════════════
  function updateMetersDisplay() {
    const el = $('meters-value');
    if (el) el.textContent = totalMeters.toLocaleString('es-MX') + 'm';
  }

  function luxShine() {
    const lux = $('lux-svg');
    if (!lux) return;
    lux.classList.add('shine');
    setTimeout(() => lux.classList.remove('shine'), 600);
    spawnLuxParticles(3);
  }

  function spawnLuxParticles(count) {
    const c = $('lux-container');
    if (!c) return;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'lux-particle';
      p.style.setProperty('--x', (Math.random()-0.5)*100+'px');
      p.style.setProperty('--y', (Math.random()-0.5)*100+'px');
      c.appendChild(p);
      setTimeout(() => p.remove(), 1500);
    }
  }

  function gainMeters(meters, pose) {
    totalMeters += meters;
    updateMetersDisplay();
    saveProgress();
    luxShine();
    playRewardSound();
    showMarianoSlide(meters, pose);
  }

  function showMarianoSlide(meters, pose) {
    const overlay = $('mariano-overlay');
    const img     = $('mariano-slide-img');
    const text    = $('meters-float-text');
    if (!overlay || !img || !text) return;
    img.src = MARIANO_BASE + 'mariano-' + pose + '.png';
    text.textContent = '+' + meters.toLocaleString('es-MX') + 'm';
    overlay.style.display = 'flex';
    setTimeout(() => { overlay.style.display = 'none'; }, 2500);
  }

  function showMarianoGrandCelebration() {
    totalMeters += 1000;
    updateMetersDisplay();
    saveProgress();
    const overlay        = $('mariano-grand-overlay');

  // ════════════════════════════════
  // AUDIO: SONIDOS SINTÉTICOS
  // ════════════════════════════════
  let _ac = null;
  function getAC() {
    if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    if (_ac.state === 'suspended') _ac.resume();
    return _ac;
  }

  function playBubble() {
    try {
      const ctx = getAC(), now = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, now);
      o.frequency.exponentialRampToValueAtTime(580, now + 0.055);
      o.frequency.exponentialRampToValueAtTime(220, now + 0.14);
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.18, now + 0.012);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      o.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now + 0.2);
    } catch(e) {}
  }

  function playSoftTap() {
    try {
      const ctx = getAC(), now = ctx.currentTime;
      const bSz = ctx.sampleRate * 0.03, buf = ctx.createBuffer(1, bSz, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bSz; i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(bSz*0.15));
      const s = ctx.createBufferSource(); s.buffer = buf;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(600, now);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.25, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.08);
      s.connect(f); f.connect(g); g.connect(ctx.destination); s.start(now); s.stop(now+0.1);
    } catch(e) {}
  }

  function playChoir(rootFreq) {
    try {
      const ctx = getAC(), now = ctx.currentTime;
      const ratios = [1,1.5,2,2.5];
      const master = ctx.createGain();
      master.gain.setValueAtTime(0, now);
      master.gain.linearRampToValueAtTime(0.08, now+0.12);
      master.gain.linearRampToValueAtTime(0.05, now+0.35);
      master.gain.linearRampToValueAtTime(0, now+0.7);
      master.connect(ctx.destination);
      ratios.forEach((r, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = i % 2 === 0 ? 'sine' : 'triangle';
        o.frequency.setValueAtTime(rootFreq * r, now);
        const lfo = ctx.createOscillator(), lg = ctx.createGain();
        lfo.frequency.setValueAtTime(4.5 + i*0.3, now); lg.gain.setValueAtTime(1.5, now);
        lfo.connect(lg); lg.connect(o.frequency); lfo.start(now); lfo.stop(now+0.75);
        g.gain.setValueAtTime(i===0 ? 0.7 : 0.4, now);
        o.connect(g); g.connect(master); o.start(now); o.stop(now+0.75);
      });
    } catch(e) {}
  }

  const CHOIR_NOTES = [220,246,261,277,293,329,349,370];
  function playTransitionChoir(i) { playChoir(CHOIR_NOTES[i % 8]); }

  function playCompleteChoir() {
    [261,329,392,523].forEach((f,i) => setTimeout(() => playChoir(f), i*180));
  }

  function playRewardSound() {
    try {
      const ac = getAC();
      [523,659].forEach((f,i) => {
        setTimeout(() => {
          const o = ac.createOscillator(), g = ac.createGain();
          o.type = 'sine'; o.frequency.value = f;
          g.gain.setValueAtTime(0.12, ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.35);
          o.connect(g); g.connect(ac.destination);
          o.start(); o.stop(ac.currentTime+0.35);
        }, i*90);
      });
    } catch(e) {}
  }

  function playNotes(freqs) {
    try {
      const ac = getAC();
      freqs.forEach((f,i) => {
        setTimeout(() => {
          const o = ac.createOscillator(), g = ac.createGain();
          o.type = 'sine'; o.frequency.value = f;
          g.gain.setValueAtTime(0.07, ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.35);
          o.connect(g); g.connect(ac.destination);
          o.start(); o.stop(ac.currentTime+0.35);
        }, i*180);
      });
    } catch(e) {}
  }

  const MELODIES = [[440,554,659],[523,659,784],[392,494,587,784],[349,440,523,659]];
  function celebrationSound(variant) { playNotes(MELODIES[variant % 4]); }

  // TTS — voz masculina
  function speakText(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-MX'; u.rate = 0.88; u.pitch = 0.85;
    const voices = window.speechSynthesis.getVoices();
    const maleVoice = voices.find(v => v.lang.startsWith('es') && /male|jorge|diego|carlos|andrés/i.test(v.name))
      || voices.find(v => v.lang.startsWith('es-MX'))
      || voices.find(v => v.lang.startsWith('es'));
    if (maleVoice) u.voice = maleVoice;
    u.onstart = () => { microSpeaking = true; renderMicroListenBtn(true); };
    u.onend   = () => { microSpeaking = false; renderMicroListenBtn(false); };
    u.onerror = () => { microSpeaking = false; renderMicroListenBtn(false); };
    microSpeechUtil = u;
    window.speechSynthesis.speak(u);
  }

  function stopSpeech() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    microSpeaking = false;
    renderMicroListenBtn(false);
  }

  function renderMicroListenBtn(speaking) {
    const btn = document.querySelector('.micro-listen-btn');
    if (!btn) return;
    btn.textContent = speaking ? '⏹ Detener' : '🔊 Escuchar';

  // ════════════════════════════════
  // ENTRAR A UN BLOQUE → decide micro o directo
  // ════════════════════════════════
  function enterBlock(b) {
    currentBlock = b;
    const prog   = progress[b] || [];
    const first  = prog.findIndex(x => x === null);
    currentMystery = first >= 0 ? first : 0;
    openSection    = null;

    // ¿Hay micro para este bloque y aún no se ha completado?
    if (MICRO && MICRO.bloques && MICRO.bloques[b] && !microDone[b]) {
      buildMicroSteps(b);
      renderMicro();
    } else {
      renderPrayer();
    }
  }

  // ════════════════════════════════
  // MICRO-LEARNING: CONSTRUCCIÓN
  // ════════════════════════════════
  function buildMicroSteps(b) {
    const bloqueData = MICRO.bloques[b];
    microSteps    = [];
    microStep     = 0;
    microAnswered = {};

    // Tarjetas
    if (bloqueData.tarjetas) {
      bloqueData.tarjetas.forEach((t, i) => {
        microSteps.push({ type:'card', data:t, index:i, total:bloqueData.tarjetas.length });
      });
    }
    // Preguntas A/B
    if (bloqueData.preguntas) {
      bloqueData.preguntas.forEach((p, i) => {
        microSteps.push({ type:'question', data:p, index:i, total:bloqueData.preguntas.length });
      });
    }
    // Pantalla final
    microSteps.push({ type:'final' });
  }

  // ════════════════════════════════
  // MICRO-LEARNING: RENDER
  // ════════════════════════════════
  function renderMicro() {
    const b          = currentBlock;
    const bloqueData = MICRO.bloques[b];
    const total      = microSteps.length;
    const step       = microSteps[microStep];
    const isFinal    = step.type === 'final';
    const isQuestion = step.type === 'question';
    const isCard     = step.type === 'card';

    // Header
    $('micro-level-label').textContent = nivelLabel(DATA.tema.id) + ' · Misterios ' + BLOCK_NAMES[b];
    $('micro-title').textContent       = bloqueData.subtitulo || 'Prepárate para orar';

    // Progress bar
    const pct = Math.round((microStep / (total - 1)) * 100);
    $('micro-progress-fill').style.width = pct + '%';

    // Progress dots
    const dotsEl = $('micro-progress-dots');
    dotsEl.innerHTML = microSteps.slice(0, -1).map((s, i) => {
      const cls = i < microStep ? 'done' : i === microStep ? 'active' : 'pending';
      return '<div class="micro-dot ' + cls + '"></div>';
    }).join('');

    // Contenido
    const contentEl = $('micro-content');
    contentEl.innerHTML = '';

    if (isCard) {
      contentEl.innerHTML = renderMicroCard(step);
    } else if (isQuestion) {
      contentEl.innerHTML = renderMicroQuestion(step);
    } else if (isFinal) {
      contentEl.innerHTML = renderMicroFinal();
    }

    // Navegación
    const navEl          = $('micro-nav');
    const swipeHint      = $('micro-swipe-hint');
    const skipBtn        = $('micro-btn-skip');
    const backBtn        = $('micro-btn-back');
    const nextBtn        = $('micro-btn-next');

    if (isFinal) {
      navEl.style.display     = 'none';
      swipeHint.style.display = 'none';
      skipBtn.style.display   = 'none';
    } else {
      navEl.style.display   = 'flex';
      skipBtn.style.display = '';

      backBtn.disabled = microStep === 0;

      if (isCard) {
        nextBtn.style.display = 'inline-flex';
        nextBtn.textContent   = microStep === microSteps.length - 2 ? 'Listo para rezar →' : 'Siguiente →';
        swipeHint.style.display = '';
      } else if (isQuestion) {
        // El botón "siguiente" de pregunta aparece sólo al responder
        const answered = microAnswered[microStep] !== undefined;
        nextBtn.style.display   = answered ? 'inline-flex' : 'none';
        nextBtn.textContent     = microStep === microSteps.length - 2 ? 'Listo para rezar →' : 'Siguiente →';
        swipeHint.style.display = 'none';
      }
    }

    // Attach option handlers después del render
    if (isQuestion) attachOptionHandlers(step);

    show('scr-micro');
  }

  function renderMicroCard(step) {
    const t = step.data;
    return '<div class="micro-card">' +
      '<div>' +
        '<div class="micro-card-emoji">' + (t.emoji || '✦') + '</div>' +
        '<div class="micro-card-title">' + escHTML(t.titulo) + '</div>' +
        '<div class="micro-card-body">' + escHTML(t.contenido) + '</div>' +
      '</div>' +
      '<div class="micro-card-footer">' +
        '<span class="micro-card-counter">Reflexión ' + (step.index+1) + ' de ' + step.total + '</span>' +
        '<button class="micro-listen-btn" onclick="window._ca.microToggleSpeech()">' +
          (microSpeaking ? '⏹ Detener' : '🔊 Escuchar') +
        '</button>' +
      '</div>' +
    '</div>';
  }

  function renderMicroQuestion(step) {
    const q        = step.data;
    const answered = microAnswered[microStep];
    const isAns    = answered !== undefined;

    let optionsHTML = q.opciones.map((o, i) => {
      const isSel = isAns && answered === i;
      const isDim = isAns && answered !== i;
      return '<button class="micro-option' + (isSel ? ' selected' : '') + (isDim ? ' dimmed' : '') + '" ' +
        'data-opt-index="' + i + '" ' +
        (isAns ? 'disabled' : '') + '>' +
        '<span class="micro-option-radio">' + (isSel ? '✓' : '') + '</span>' +
        escHTML(o.texto) +
      '</button>';
    }).join('');

    let ecoHTML = '';
    if (isAns) {
      const op = q.opciones[answered];
      ecoHTML = '<div class="micro-eco">' +
        '<span class="micro-eco-emoji">' + (op.emoji || '✦') + '</span>' +
        '<span class="micro-eco-text">' + escHTML(op.eco) + '</span>' +
      '</div>';
    }

    return '<div class="micro-question-card">' +
      '<div class="micro-q-label">✦ Prepara tu corazón <span>' + (step.index+1) + ' de ' + step.total + '</span></div>' +
      '<p class="micro-question-text">' + escHTML(q.pregunta) + '</p>' +
      '<div class="micro-options">' + optionsHTML + '</div>' +
      ecoHTML +
    '</div>';
  }

  function renderMicroFinal() {
    return '<div class="micro-final">' +
      '<div class="micro-final-lux">' +
        '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="48" height="48">' +
          '<g filter="url(#luxGlow)">' +
            '<rect x="46.1926" y="0.285" width="7.6148" height="99.43" fill="#FFFCF7"/>' +
            '<rect x="0" y="46.2068" width="100" height="7.5864" fill="#FFFCF7"/>' +
          '</g>' +
        '</svg>' +
      '</div>' +
      '<h3>Tu corazón está preparado</h3>' +
      '<p>Lo que necesitas ya lo traes contigo.</p>' +
      '<div class="micro-final-meters">+800m ganados 🚶‍♂️</div>' +
      '<button class="btn btn-primary btn-block" onclick="window._ca.microFinish()">Comenzar a rezar →</button>' +
    '</div>';
  }

  function attachOptionHandlers(step) {
    document.querySelectorAll('.micro-option').forEach(btn => {
      if (btn.disabled) return;
      btn.addEventListener('click', () => {
        const i = parseInt(btn.getAttribute('data-opt-index'));
        playSoftTap();
        microAnswered[microStep] = i;
        renderMicro(); // re-render con respuesta elegida
      });
    });
  }

  // Micro: toggle escuchar tarjeta
  function microToggleSpeech() {
    if (microSpeaking) {
      stopSpeech();
      return;
    }
    const step = microSteps[microStep];
    if (step && step.type === 'card') {
      playBubble();
      speakText(step.data.titulo + '. ' + step.data.contenido);
    }
  }

  // Micro: avanzar
  function microAdvance() {
    stopSpeech();
    const step = microSteps[microStep];

    // Si es pregunta y no está respondida, no avanzar
    if (step.type === 'question' && microAnswered[microStep] === undefined) return;

    if (microStep < microSteps.length - 1) {
      const transitionDuration = 400;
      const overlay = $('micro-transition-overlay');
      overlay.classList.add('active');
      playTransitionChoir(microStep);
      setTimeout(() => {
        microStep++;
        overlay.classList.remove('active');
        renderMicro();
      }, transitionDuration);
    }
  }

  // Micro: retroceder
  function microBack() {
    if (microStep === 0) return;
    stopSpeech();
    playBubble();
    microStep--;
    renderMicro();
  }

  // Micro: saltar (va directo a oración sin marcar como done)
  function microSkip() {
    stopSpeech();
    playBubble();
    renderPrayer();
  }

  // Micro: completado → +800m → oración
  function microFinish() {
    microDone[currentBlock] = true;
    saveProgress();
    playCompleteChoir();
    gainMeters(800, 'walking');
    setTimeout(() => renderPrayer(), 600);
  }

  // Swipe en micro
  let microTouchX = null;
  function microOnTouchStart(e) { microTouchX = e.touches[0].clientX; }
  function microOnTouchEnd(e) {
    if (microTouchX === null) return;
    const diff = microTouchX - e.changedTouches[0].clientX;
    if (diff > 60)  { microAdvance(); }
    if (diff < -60) { microBack(); }
    microTouchX = null;
  }

  // ════════════════════════════════
  // AUDIO DE ORACIÓN
  // ════════════════════════════════
  function stopAudio() {
    if (audioEl) { audioEl.pause(); audioEl.currentTime = 0; }
    audioPlaying   = false;
    currentAudioId = null;
    document.querySelectorAll('.play-btn').forEach(b => { b.innerHTML = playSVG(); });
    document.querySelectorAll('.audio-bar-fill').forEach(b => { b.style.width = '0%'; });
  }

  function toggleAudio(src, playerId) {
    if (!src) return;
    if (currentAudioId === playerId && audioPlaying) {
      audioEl.pause(); audioPlaying = false;
      updatePlayBtn(playerId, false);
      return;
    }
    if (currentAudioId !== playerId) {
      stopAudio();
      audioEl        = new Audio(src);
      currentAudioId = playerId;
      audioEl.addEventListener('timeupdate', () => {
        if (!audioEl.duration) return;
        const pct  = (audioEl.currentTime / audioEl.duration) * 100;
        const fill = document.querySelector('#' + playerId + ' .audio-bar-fill');
        if (fill) fill.style.width = pct + '%';
        const cur = document.querySelector('#' + playerId + ' .a-cur');
        const dur = document.querySelector('#' + playerId + ' .a-dur');
        if (cur) cur.textContent = fmtTime(audioEl.currentTime);
        if (dur) dur.textContent = fmtTime(audioEl.duration);
      });
      audioEl.addEventListener('ended', () => {
        audioPlaying   = false;
        currentAudioId = null;
        updatePlayBtn(playerId, false);
        const rewardKey = currentBlock + '_' + currentMystery + '_' + playerId;
        if (!audioRewards[rewardKey]) {
          audioRewards[rewardKey] = true;
          let meters, pose;
          if (playerId.includes('rezar'))   { meters=1200; pose='walking'; }
          else if (playerId.includes('contempl')) { meters=800; pose='contemplative'; }
          else if (playerId.includes('canto'))    { meters=100; pose='happy'; }
          if (meters && pose) gainMeters(meters, pose);
        }
      });
    }
    audioEl.play().then(() => { audioPlaying = true; updatePlayBtn(playerId, true); }).catch(()=>{});
  }

  function seekAudio(e, playerId) {
    if (!audioEl || currentAudioId !== playerId || !audioEl.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    audioEl.currentTime = ((e.clientX - rect.left) / rect.width) * audioEl.duration;
  }

  function updatePlayBtn(playerId, playing) {
    const btn = document.querySelector('#' + playerId + ' .play-btn');
    if (btn) btn.innerHTML = playing ? pauseSVG() : playSVG();
  }

  function fmtTime(s) {
    if (!s || isNaN(s)) return '0:00';
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  function playSVG()  { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><polygon points="6,3 20,12 6,21"/></svg>'; }
  function pauseSVG() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/></svg>'; }

  function audioPlayerHTML(id, label, src) {
    if (!src) return '<div class="audio-player" style="opacity:0.5"><div style="font-size:0.82rem;color:var(--text-dim)">Audio pendiente</div></div>';
    return '<div class="audio-player" id="' + id + '">' +
      '<button class="play-btn" onclick="window._ca.toggleAudio(\'' + src + '\',\'' + id + '\')">' + playSVG() + '</button>' +
      '<div class="audio-info">' +
        '<div class="audio-label">' + label + '</div>' +
        '<div class="audio-bar-wrap" onclick="window._ca.seekAudio(event,\'' + id + '\')">' +
          '<div class="audio-bar-fill" style="width:0%"></div>' +
        '</div>' +
        '<div class="audio-time"><span class="a-cur">0:00</span><span class="a-dur">0:00</span></div>' +
      '</div></div>';
  }

  // ════════════════════════════════
  // PANTALLA: ORACIÓN
  // ════════════════════════════════
  function renderPrayer() {
    const b    = currentBlock;
    const mi   = currentMystery;
    const mists = DATA.misterios[b];
    const m    = mists[mi];
    const prog = progress[b];

    $('h-title').textContent = 'CruzAndo';
    $('h-sub').textContent   = nivelLabel(DATA.tema.id) + ' · ' + BLOCK_NAMES[b];
    $('prayer-counter').textContent  = ORDS[mi] + ' Misterio ' + BTYPES[b];
    $('prayer-title').textContent    = m.titulo;
    $('prayer-subtitle').textContent = m.subtitulo || '';

    // Cuentas del rosario
    const beadPositions = [24,72,120,168,216];
    const boldColor     = DATA.tema.paleta.bold;
    const lightColor    = DATA.tema.paleta.light;
    const borderC       = isDark ? '#3A3530' : '#D9D1C7';
    const lastDoneIdx   = (() => { for (let i=4;i>=0;i--) { if (prog[i]) return i; } return -1; })();
    const chainEndX     = lastDoneIdx >= 0 ? beadPositions[lastDoneIdx] : 24;

    let svg = '<svg viewBox="0 0 240 30" preserveAspectRatio="xMidYMid meet">';
    svg += '<line x1="24" y1="15" x2="216" y2="15" stroke="' + borderC + '" stroke-width="1.5" stroke-linecap="round"/>';
    if (lastDoneIdx >= 0) svg += '<line x1="24" y1="15" x2="' + chainEndX + '" y2="15" stroke="' + lightColor + '" stroke-width="1.5" stroke-linecap="round"/>';
    for (let i=0; i<5; i++) {
      const cx = beadPositions[i];
      if (prog[i]) {
        svg += '<circle cx="' + cx + '" cy="15" r="9" fill="' + boldColor + '" style="cursor:pointer" onclick="window._ca.goMystery(' + i + ')"/>';
      } else if (i === mi) {
        svg += '<circle cx="' + cx + '" cy="15" r="9.5" fill="none" stroke="' + boldColor + '" stroke-width="2" style="cursor:pointer" onclick="window._ca.goMystery(' + i + ')"/>';
        svg += '<circle cx="' + cx + '" cy="15" r="4" fill="' + lightColor + '" style="cursor:pointer" onclick="window._ca.goMystery(' + i + ')"/>';
      } else {
        svg += '<circle cx="' + cx + '" cy="15" r="9" fill="none" stroke="' + borderC + '" stroke-width="1.2" style="cursor:pointer" onclick="window._ca.goMystery(' + i + ')"/>';
      }
    }
    svg += '</svg>';
    $('prayer-dots').innerHTML = svg;

    // Evangelio
    $('ev-text').textContent = m.evangelio;
    $('ev-ref').textContent  = '— ' + m.referencia;

    // Acordeón
    renderAccordion(b, mi, m);

    // Done bar
    const doneWrap = $('mystery-done-wrap');
    if (prog[mi]) {
      const d = new Date(prog[mi]);
      doneWrap.style.display = '';
      doneWrap.innerHTML =
        '<div class="mystery-done-bar fade-in">' +
          '<span class="done-check">✓</span>' +
          '<div><div class="done-text">Misterio completado</div>' +
          '<div class="done-date">' + d.toLocaleDateString('es-MX',{day:'numeric',month:'long'}) + '</div></div>' +
        '</div>';
    } else {
      doneWrap.style.display = 'none';
    }

    renderBottomNav(b, mi);
    show('scr-prayer');
  }

  function renderAccordion(b, mi, m) {
    const acc = $('accordion');
    const sections = [
      { key:'rezar',      icon:'📿', label:'Rezar este Misterio' },
      { key:'canto',      icon:'🎵', label:'Canto' },
      { key:'contemplar', icon:'👁️', label:'Contemplar' },
      { key:'meditar',    icon:'✏️', label:'Meditar y escribir' },
      { key:'intercesion',icon:'🙏', label:'Intercesión' },
    ];
    acc.innerHTML = sections.map(s => {
      const isOpen = openSection === s.key;
      return '<div class="acc-item' + (isOpen ? ' open' : '') + '" id="acc-' + s.key + '">' +
        '<button class="acc-trigger" onclick="window._ca.toggleSection(\'' + s.key + '\')">' +
          '<div class="acc-trigger-left">' +
            '<div class="acc-icon" style="background:var(--lvl-ultra)">' + s.icon + '</div>' +
            '<span class="acc-label">' + s.label + '</span>' +
          '</div>' +
          '<svg class="acc-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</button>' +
        '<div class="acc-body" style="max-height:' + (isOpen ? '2000px' : '0') + '">' +
          '<div class="acc-body-inner">' + sectionContent(s.key, b, mi, m) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function sectionContent(key, b, mi, m) {
    if (key === 'rezar') {
      return audioPlayerHTML('ap-rezar', 'Padrenuestro · 10 Avemarías · Gloria · Jaculatoria', DATA.audio_rezo || '');
    }
    if (key === 'canto') {
      const src = cantoUrl(m);
      return audioPlayerHTML('ap-canto-' + m.numero, 'Canto contemplativo', src);
    }
    if (key === 'contemplar') {
      const src = contemplacionUrl(m);
      return audioPlayerHTML('ap-contempl-' + m.numero, 'Audio de la contemplación', src) +
             '<div class="contempl-text">' + escHTML(m.contemplacion) + '</div>';
    }
    if (key === 'meditar')    { return renderMeditation(b, mi, m); }
    if (key === 'intercesion') {
      const isDone = progress[b] && progress[b][mi];
      return '<div class="interc-text">' + escHTML(m.intercesion) + '</div>' +
        '<button class="amen-btn' + (isDone ? ' done' : '') + '" onclick="window._ca.completeMystery()">' +
          (isDone ? '✓ Amén' : 'Amén') +
        '</button>';
    }
    return '';
  }

  function renderMeditation(b, mi, m) {
    const questions = parseMeditation(m.meditacion);
    const j  = journal[b] && journal[b][mi] ? journal[b][mi] : {};
    const mc = medConfirmed[b] && medConfirmed[b][mi] ? medConfirmed[b][mi] : {};
    return questions.map((q, qi) => {
      const val       = j['q' + qi] || '';
      const confirmed = mc['q' + qi] || false;
      return '<div class="med-group">' +
        '<div class="med-label-row">' +
          '<div class="med-dot" style="background:' + MED_COLORS[qi] + '"></div>' +
          '<span class="med-label-text" style="color:' + MED_COLORS[qi] + '">' + MED_LABELS[qi] + '</span>' +
        '</div>' +
        '<p class="med-question">' + escHTML(q) + '</p>' +
        '<textarea class="journal-area" id="med-ta-' + qi + '" placeholder="Escribe tu reflexión…" ' +
          'oninput="window._ca.onMedInput(\'' + b + '\',' + mi + ',' + qi + ',this.value)">' + escHTML(val) + '</textarea>' +
        '<button class="med-confirm' + (confirmed ? ' done' : '') + '" id="med-btn-' + qi + '" ' +
          'onclick="window._ca.confirmReflection(\'' + b + '\',' + mi + ',' + qi + ')">' +
          (confirmed ? '✓ Reflexión guardada' : '📝 Guardar reflexión') +
        '</button>' +
      '</div>';
    }).join('');
  }

  function parseMeditation(text) {
    if (!text) return ['','',''];
    const parts = [];
    let remaining = text;
    for (let i = 0; i < MED_LABELS.length; i++) {
      const idx = remaining.indexOf(MED_LABELS[i]);
      if (idx >= 0) {
        if (i > 0 && parts.length < i) parts.push(remaining.substring(0, idx).trim());
        remaining = remaining.substring(idx + MED_LABELS[i].length).replace(/^\s*:\s*/, '');
      }
    }
    if (remaining.trim()) parts.push(remaining.trim());
    if (parts.length < 3) {
      const lines = text.split('\n').filter(l => l.trim());
      return [lines[0]||'', lines[1]||'', lines[2]||''];
    }
    return parts.length >= 3 ? parts.slice(0,3) : [...parts, ...Array(3-parts.length).fill('')];
  }

  function onMedInput(b, mi, qi, val) {
    if (!journal[b])     journal[b]     = {};
    if (!journal[b][mi]) journal[b][mi] = {};
    journal[b][mi]['q'+qi] = val;
    saveProgress();
    if (!medConfirmed[b])     medConfirmed[b]     = {};
    if (!medConfirmed[b][mi]) medConfirmed[b][mi] = {};
    if (!medConfirmed[b][mi]['q'+qi] && val.length >= 140) confirmReflection(b, mi, qi);
  }

  function confirmReflection(b, mi, qi) {
    if (!medConfirmed[b])     medConfirmed[b]     = {};
    if (!medConfirmed[b][mi]) medConfirmed[b][mi] = {};
    if (medConfirmed[b][mi]['q'+qi]) return;
    const val = (journal[b] && journal[b][mi] && journal[b][mi]['q'+qi]) || '';
    if (val.trim().length < 5) return;
    medConfirmed[b][mi]['q'+qi] = true;
    saveProgress();
    playNotes([[523,659],[587,740],[659,880]][qi] || [523,659]);
    const btn = $('med-btn-' + qi);
    if (btn) { btn.className = 'med-confirm done glow'; btn.textContent = '✓ Reflexión guardada'; }
    const rewardKey = b + '_' + mi + '_q' + qi;
    if (!reflectionRewards[rewardKey]) {
      reflectionRewards[rewardKey] = true;
      gainMeters(650, getNextRestPose());
    }
  }

  function toggleSection(key) {
    openSection = openSection === key ? null : key;
    renderAccordion(currentBlock, currentMystery, DATA.misterios[currentBlock][currentMystery]);
  }

  function completeMystery() {
    const b  = currentBlock;
    const mi = currentMystery;
    if (progress[b][mi]) return;
    progress[b][mi] = Date.now();
    saveProgress();
    celebrationSound(BLOCKS.indexOf(b) * 5 + mi);
    const allDone = progress[b].every(x => x !== null);
    if (allDone) {
      setTimeout(() => { showConfetti(); showCelebration(b); }, 600);
    } else {
      renderPrayer();
      if (mi < 4) {
        setTimeout(() => { currentMystery = mi+1; openSection = null; stopAudio(); renderPrayer(); }, 800);
      }
    }
  }

  function renderBottomNav(b, mi) {
    const nav    = $('bottom-nav');
    const hasPrev = mi > 0;
    const isDone  = progress[b][mi];
    let html = '';
    if (hasPrev) html += '<button class="btn btn-outline" onclick="window._ca.goMystery(' + (mi-1) + ')">← Anterior</button>';
    if (mi < 4 && isDone) html += '<button class="btn btn-primary" onclick="window._ca.goMystery(' + (mi+1) + ')">Siguiente →</button>';
    nav.innerHTML = html;
  }

  function goMystery(i) {
    currentMystery = i; openSection = null; stopAudio(); renderPrayer();
  }

  function showCelebration(b) {
    showMarianoGrandCelebration();
    setTimeout(() => {
      $('celeb-title').textContent = '¡Misterios ' + BLOCK_NAMES[b] + ' completados!';
      $('celeb-sub').textContent   = 'Has contemplado los cinco Misterios ' + BLOCK_NAMES[b] + ' de este nivel. Que María siga acompañándote en el camino.';
      $('btn-celeb-home').onclick  = () => { stopAudio(); window.location.href = 'index.html'; };
      // Intentar cargar imagen
      const maria = 'img/maria_' + b + '.webp';
      const img = new Image();
      img.onload  = () => { $('maria-container').outerHTML = '<img class="maria-img" id="maria-container" src="' + maria + '" alt="Virgen María">'; };
      img.onerror = () => { $('maria-container').innerHTML = '🙏'; };
      img.src = maria;
      celebrationSound(BLOCKS.indexOf(b));
      show('scr-celebration');
    }, 3500);
  }

  // ════════════════════════════════
  // INIT
  // ════════════════════════════════
  async function init() {
    const params = new URLSearchParams(window.location.search);
    NIVEL_ID     = params.get('c') || '0101';

    if (!/^\d{4}$/.test(NIVEL_ID)) {
      showError('ID inválido: ' + NIVEL_ID);
      return;
    }

    const loc  = window.location;
    const base = loc.origin + loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);

    // Cargar JSON principal
    try {
      const resp = await fetch(base + 'data/' + NIVEL_ID + '.json');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      DATA = await resp.json();
    } catch(e) {
      showError('No se pudo cargar data/' + NIVEL_ID + '.json');
      return;
    }

    // Cargar micro-learning (silencioso si no existe)
    try {
      const resp = await fetch(base + 'data/' + NIVEL_ID + '-micro.json');
      if (resp.ok) MICRO = await resp.json();
    } catch(e) { /* sin micro, ok */ }

    loadProgress();

    if (isDark) {
      document.body.classList.add('dark');
      $('ico-sun').style.display  = 'none';
      $('ico-moon').style.display = 'block';
    }

    applyPalette();

    // Event listeners
    $('btn-dark').onclick      = toggleDark;
    $('btn-back-home').onclick = () => { stopAudio(); stopSpeech(); window.location.href = 'index.html'; };
    $('micro-btn-back').onclick = () => microBack();
    $('micro-btn-next').onclick = () => microAdvance();
    $('micro-btn-skip').onclick = () => microSkip();

    // Swipe en micro
    const microScr = $('scr-micro');
    microScr.addEventListener('touchstart', microOnTouchStart, { passive:true });
    microScr.addEventListener('touchend',   microOnTouchEnd,   { passive:true });

    // API global para onclick inline
    window._ca = {
      toggleAudio,       seekAudio,
      toggleSection,     completeMystery,
      goMystery,         onMedInput,
      confirmReflection, enterBlock,
      microToggleSpeech, microFinish,
    };

    // Precargar voces TTS
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    $('scr-loading').style.display = 'none';
    $('main-header').style.display = '';
    renderHome();
  }

  function showError(msg) {
    $('scr-loading').style.display = 'none';
    $('error-msg').textContent      = msg;
    $('scr-error').style.display    = 'flex';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
