<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Seed Talleres · CruzAndo</title>
<style>
  body { font-family:sans-serif; background:#1A0E04; color:#F0E6DA;
         display:flex; flex-direction:column; align-items:center;
         justify-content:center; min-height:100vh; gap:20px; padding:24px; }
  h2  { color:#FF7A00; margin-bottom:0; }
  p   { color:#C4A882; max-width:400px; text-align:center; line-height:1.6; }
  button {
    background:#FF7A00; color:#fff; border:none; border-radius:12px;
    padding:14px 32px; font-size:1rem; font-weight:700; cursor:pointer;
    transition:opacity 0.2s;
  }
  button:hover { opacity:0.85; }
  button:disabled { background:#4A2E1A; cursor:not-allowed; }
  #status {
    padding:14px 24px; border-radius:12px;
    background:#2C1810; border:1px solid #4A2E1A;
    font-size:0.9rem; max-width:420px;
    text-align:center; display:none;
  }
  #status.ok  { border-color:#4CAF7D; color:#4CAF7D; }
  #status.err { border-color:#C0392B; color:#f88; }
</style>
</head>
<body>

<h2>🌱 Seed Talleres</h2>
<p>Esta página crea el documento <code>talleres/cruz</code> en tu Firestore con los 5 talleres de la categoría Cruz.</p>
<p style="color:#7A5C40;font-size:0.8rem;">⚠️ Úsala una sola vez. Después puedes eliminarla.</p>

<button id="btn" onclick="seedData()">Crear documento en Firestore</button>
<div id="status"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
/* ── Pega aquí tu firebaseConfig ── */
const firebaseConfig = {
    apiKey: "AIzaSyCYCZi1LmFuqIis9yx3QF3McvGHlAGKRKY",
    authDomain: "cruzando-app.firebaseapp.com",
    projectId: "cruzando-app",
    storageBucket: "cruzando-app.firebasestorage.app",
    messagingSenderId: "408196948528",
    appId: "1:408196948528:web:de291e8afc969252e943f5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function seedData() {
  const btn    = document.getElementById('btn');
  const status = document.getElementById('status');

  btn.disabled    = true;
  btn.textContent = 'Creando…';
  status.style.display = 'block';
  status.className     = '';
  status.textContent   = '⏳ Conectando con Firestore…';

  try {
    await db.collection('talleres').doc('cruz').set({
      nombre: "Cruz",
      orden: 1,
      talleres: [
        {
          id: "cruz_infancia",
          titulo: "Cruzando las Heridas de la infancia",
          descripcion: "Sanación de las heridas más profundas a través del Rosario.",
          duracion: "58 min",
          videoId: "BCRW-vBz73A"
        },
        {
          id: "cruz_perdon",
          titulo: "Cruzando el Perdón",
          descripcion: "Sana las heridas del corazón perdonando desde la fe.",
          duracion: "50 min",
          videoId: "TYXGLmbPz0U"
        },
        {
          id: "cruz_enfermedad",
          titulo: "Cruzando la Enfermedad",
          descripcion: "Encuentro con Cristo en el misterio del sufrimiento.",
          duracion: "45 min",
          videoId: "_KnwnzvUnRA",
          startAt: 145
        },
        {
          id: "cruz_duelo",
          titulo: "Cruzando el Duelo",
          descripcion: "Un camino de sanación a través de los misterios del Rosario.",
          duracion: "58 min",
          videoId: "tqsd99MZX58"
        },
        {
          id: "cruz_muerte",
          titulo: "Cruzando la Muerte",
          descripcion: "La esperanza cristiana ante el misterio de la muerte.",
          duracion: "49 min",
          videoId: "w1F0pKgA62M"
        }
      ]
    });

    status.className   = 'ok';
    status.textContent = '✅ ¡Listo! El documento talleres/cruz fue creado correctamente en Firestore.';
    btn.textContent    = '✓ Creado';

  } catch (err) {
    status.className   = 'err';
    status.textContent = '❌ Error: ' + err.message;
    btn.disabled       = false;
    btn.textContent    = 'Reintentar';
    console.error(err);
  }
}
</script>
</body>
</html>
