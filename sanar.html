<meta charset="UTF-8">

<title>Sanar · CruzAndo</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg:#0E0602; --bg2:#1A0F06; --card:#1E1206; --border:rgba(255,122,0,0.14);
    --text:#F5E9DC; --text-dim:rgba(245,233,220,0.55); --orange:#FF7A00; --brand:#01BBE1;
  }
  body.light {
    --bg:#FBF5EE; --bg2:#F3E9DC; --card:#FFF7EF; --border:rgba(255,122,0,0.18);
    --text:#2B1A0E; --text-dim:rgba(43,26,14,0.55);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 24px; text-align:center; transition:background .3s,color .3s;
  }
  .cruz { width:44px; height:44px; margin-bottom:22px; }
  .titulo { font-family:'Crimson Pro',Georgia,serif; font-size:2rem; font-weight:700; margin:0 0 8px; }
  .sub { font-size:1rem; color:var(--text-dim); max-width:340px; line-height:1.6; margin:0 0 6px; }
  .chip {
    margin:18px 0 30px; padding:6px 14px; border-radius:20px;
    background:rgba(255,122,0,0.12); color:var(--orange);
    font-size:0.78rem; font-weight:700; letter-spacing:0.4px;
  }
  .btn {
    padding:14px 26px; border-radius:16px; border:none; cursor:pointer;
    background:var(--orange); color:#fff; font-weight:700; font-size:0.92rem;
    font-family:'Inter',sans-serif;
  }
  .btn:active { opacity:0.9; }
</style>
