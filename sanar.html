window._fbFirestore = {
  doc: function(db){
    var segs = Array.prototype.slice.call(arguments, 1), ref = db;
    for (var i = 0; i < segs.length; i++) ref = (i % 2 === 0) ? ref.collection(segs[i]) : ref.doc(segs[i]);
    return ref;
  },
  getDoc: function(ref){ return ref.get(); },
  setDoc: function(ref, data, opts){ return opts && opts.merge ? ref.set(data, { merge:true }) : ref.set(data); },
  serverTimestamp: function(){ return firebase.firestore.FieldValue.serverTimestamp(); }
};

<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

/* ── Tokens reales del hub (teal/cian) — copiados de index.html ── */
:root {
  --bg:        #002931;
  --bg-rgb:    0,41,49;
  --bg2:       #001E25;
  --card:      #004C5B;
  --card2:     #003845;
  --border:    rgba(67,221,248,0.15);
  --text:      #F0E6DA;
  --text-soft: #C4A882;
  --text-dim:  #7A5C40;
  --orange:    #FF7A00;
  --orange-soft:#F69C49;
  --orange-dim: rgba(255,122,0,0.12);
  --brand:     #02BBE0;
  --brand-soft:#43DDF8;
  --brand-ultra:rgba(2,187,224,0.12);
  --hub-cyan:  #02BBE0;
  --nav-bg:    rgba(0,41,49,0.97);
  --popup-bg:  #003845;
  --shadow:    rgba(0,0,0,0.5);
}
.light {
  --bg:        #E6DED3;
  --bg-rgb:    230,222,211;
  --bg2:       #D9CFC4;
  --card:      #FFFCF7;
  --card2:     #F5EDE4;
  --border:    #D0C4B8;
  --text:      #2B1A0E;
  --text-soft: #6B5040;
  --text-dim:  #9B8878;
  --orange-dim: rgba(255,122,0,0.08);
  --brand:     #02BBE0;
  --brand-soft:#43DDF8;
  --brand-ultra:rgba(2,187,224,0.10);
  --hub-cyan:  #0389A6;
  --nav-bg:    rgba(237,228,216,0.97);
  --popup-bg:  #F5EDE4;
  --shadow:    rgba(0,0,0,0.15);
}

html { font-size:18px; }
body {
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  line-height:1.6; min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  transition:background 0.35s, color 0.35s;
}
.shell {
  max-width:480px; margin:0 auto; min-height:100dvh;
  position:relative; padding:0 20px 96px;
}

/* ── Cabecera ── */
.s-top {
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 0 10px; position:sticky; top:0; z-index:20;
  background:linear-gradient(180deg, var(--bg) 78%, transparent);
}
.s-back, .s-theme {
  width:40px; height:40px; border-radius:12px; border:1px solid var(--border);
  background:var(--card); color:var(--text);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.s-back svg, .s-theme svg { width:20px; height:20px; }
.s-title { font-family:'Crimson Pro',Georgia,serif; font-weight:700; font-size:1.15rem; letter-spacing:0.2px; }

.s-hero { margin:6px 0 18px; }
.s-hero h1 { font-family:'Crimson Pro',Georgia,serif; font-weight:700; font-size:1.7rem; margin-bottom:4px; }
.s-hero p { color:var(--text-soft); font-size:0.92rem; max-width:340px; }

/* ── Selector de modo ── */
.modes { display:flex; gap:8px; margin-bottom:14px; }
.mode-btn {
  flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 6px; min-height:44px; border-radius:13px; cursor:pointer;
  background:var(--card2); border:1px solid var(--border); color:var(--text-soft);
  font-family:inherit; font-size:0.8rem; font-weight:600;
  transition:background .2s, color .2s, border-color .2s;
}
.mode-btn svg { width:16px; height:16px; }
.mode-btn.active { background:var(--brand-ultra); border-color:var(--brand); color:var(--brand-soft); }

/* ── Buscador ── */
.search-wrap { position:relative; margin-bottom:16px; }
.search-wrap svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--text-dim); }
.search-input {
  width:100%; padding:13px 14px 13px 42px; border-radius:14px;
  background:var(--bg2); border:1px solid var(--border); color:var(--text);
  font-family:inherit; font-size:0.95rem;
}
.search-input::placeholder { color:var(--text-dim); }
.search-input:focus { outline:none; border-color:var(--brand); }

/* ── Chips de eje ── */
.ejes-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.eje-chip {
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 13px; border-radius:20px; cursor:pointer;
  background:var(--card2); border:1px solid var(--border); color:var(--text-soft);
  font-family:inherit; font-size:0.82rem; font-weight:600;
  transition:background .2s, color .2s;
}
.eje-chip svg { width:15px; height:15px; }
.eje-chip.active { color:#fff; }

/* ── Modo Misterio (developer) · numberpad tipo PIN ── */
.mist-pad { display:flex; flex-direction:column; align-items:center; gap:16px; margin-bottom:16px; }
.pad-display { display:flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums; }
.pad-grp { display:flex; gap:6px; }
.pad-sep { color:var(--text-dim); font-weight:700; }
.pad-cell {
  width:34px; height:46px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-size:1.4rem; font-weight:700; color:var(--text);
  background:var(--card); border:2px solid var(--border);
}
.pad-cell.active { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-ultra); }
.pad-grid { display:grid; grid-template-columns:repeat(3,64px); gap:10px; }
.pad-key {
  min-height:56px; border-radius:14px; cursor:pointer; font-family:inherit;
  font-size:1.3rem; font-weight:600; color:var(--text);
  background:var(--card2); border:1px solid var(--border);
  transition:transform .1s, background .2s, border-color .2s;
}
.pad-key:active { transform:scale(.96); background:var(--brand-ultra); border-color:var(--brand); }
.pad-key:focus-visible { outline:2px solid var(--brand-soft); outline-offset:2px; }
.pad-alt { color:var(--text-soft); font-size:1.15rem; }

/* ── Tarjetas de pain ── */
.pain-card {
  position:relative; display:block; width:100%; text-align:left;
  padding:15px 16px 15px 20px; margin-bottom:10px; border-radius:16px;
  background:var(--card); border:1px solid var(--border); color:var(--text);
  font-family:inherit; font-size:0.95rem; line-height:1.5; cursor:pointer;
  transition:transform .12s, border-color .2s;
}
.pain-card:active { transform:scale(0.985); }
.pain-card::before {
  content:''; position:absolute; left:0; top:12px; bottom:12px; width:4px;
  border-radius:0 4px 4px 0; background:var(--_eje,#888);
}
.pain-eje {
  display:inline-flex; align-items:center; gap:5px; margin-top:9px;
  font-size:0.7rem; font-weight:700; letter-spacing:0.3px; color:var(--_eje,#888);
}
.pain-eje svg { width:13px; height:13px; }

.empty { color:var(--text-dim); text-align:center; padding:34px 10px; font-size:0.9rem; }

/* ── Fase acogida ── */
.acg-recepcion {
  background:var(--brand-ultra); border:1px solid var(--border);
  border-radius:16px; padding:16px 18px; margin-bottom:18px;
}
.acg-recepcion .dolor { font-size:0.86rem; color:var(--text-soft); font-style:italic; }

.acg-progress { display:flex; gap:6px; justify-content:center; margin-bottom:18px; }
.acg-progress .p { width:8px; height:8px; border-radius:50%; background:var(--border); }
.acg-progress .p.on { background:var(--brand); }

.acg-pregunta { font-family:'Crimson Pro',Georgia,serif; font-size:1.3rem; font-weight:600; text-align:center; margin-bottom:18px; }

.acg-eco {
  text-align:center; color:var(--text-soft); font-style:italic;
  font-family:'Crimson Pro',Georgia,serif; font-size:1.05rem;
  min-height:1.6em; margin-bottom:18px; transition:opacity .3s;
}

.btn-primary {
  width:100%; padding:15px; border-radius:15px; border:none; cursor:pointer;
  background:var(--orange); color:#fff; font-family:inherit; font-weight:700; font-size:0.98rem;
  transition:opacity .2s;
}
.btn-primary:disabled { opacity:0.4; cursor:default; }
.btn-primary:active:not(:disabled) { opacity:0.9; }
.btn-ghost {
  width:100%; padding:13px; border-radius:15px; margin-top:10px; cursor:pointer;
  background:none; border:1px solid var(--border); color:var(--text-soft);
  font-family:inherit; font-weight:600; font-size:0.9rem;
}

/* ── Fase handoff ── */
.ho-card {
  text-align:center; padding:30px 22px; border-radius:22px; margin:8px 0 20px;
  background:linear-gradient(150deg, var(--card), var(--card2));
  border:1px solid var(--border);
}
.ho-kicker { font-size:0.72rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--orange-soft); margin-bottom:10px; }
.ho-title { font-family:'Crimson Pro',Georgia,serif; font-weight:700; font-size:1.7rem; margin-bottom:8px; }
.ho-mal { color:var(--text-soft); font-size:0.95rem; font-style:italic; }
.ho-ecos-intro { margin:18px 0 6px; font-size:0.72rem; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:var(--text-dim); }
.ho-ecos { list-style:none; margin:0 0 4px; }
.ho-ecos li { color:var(--text-soft); font-size:0.9rem; padding:6px 0; border-top:1px solid var(--border); }
.ho-ecos li:first-child { border-top:none; }

/* ── Handoff · acogida reposada (fade lento propio) ── */
.ho-flow { text-align:center; padding:10px 4px 6px; }
.ho-kick { font-size:0.72rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--orange); margin-bottom:14px; }
.ho-eco-line { font-family:'Crimson Pro',Georgia,serif; font-size:1.12rem; color:var(--text); line-height:1.5; margin:12px 0; }
.ho-oracion { margin-top:30px; }
.ho-an { opacity:0; transform:translateY(16px); }
.san-go .ho-an { animation:hoRise .9s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes hoRise { to { opacity:1; transform:translateY(0); } }

/* ── Elenco inmersivo · scroll 3D (modo Navegar) ── */
.wheel-hint { text-align:center; color:var(--text-soft); font-size:1.02rem; letter-spacing:0.2px; margin:4px 0 12px; }
.wheel {
  height:60vh; min-height:340px; overflow-y:auto; overflow-x:hidden;
  perspective:900px; scroll-snap-type:y proximity;
  -webkit-overflow-scrolling:touch; margin:0 -2px;
  -ms-overflow-style:none; scrollbar-width:none;
}
.wheel::-webkit-scrollbar { display:none; }
.wheel-pad { height:calc(30vh - 46px); }
.wheel .pain-card {
  scroll-snap-align:center; margin:9px 2px; transform-origin:center center;
  will-change:transform, opacity; backface-visibility:hidden;
  transition:box-shadow .25s, border-color .25s;
}
.wheel .pain-card.centered {
  border-color:var(--_eje,var(--brand));
  /* Halo cian difuso (rgba precomputado de #02BBE0) — señala "activa/accionable"
     sin texto. Filo tenue (0 0 0 1px) + resplandor suave (0 8px 40px -6px). */
  box-shadow: 0 0 0 1px rgba(2,187,224,.40),
              0 8px 40px -6px rgba(2,187,224,.50);
}

/* ── Entrada escalonada del elenco (familia de movimiento del hub) ── */
/* Sin reglas reduce-motion propias: el @media global (arriba) ya las cubre.
   El wheel entra como bloque (su contenedor lleva .san-an); las tarjetas NO
   tienen entrada propia — conservan el transform 3D inline de update(). */
.san-an{opacity:0;transform:translateY(18px)}
.san-go .san-an{animation:sanRise .6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes sanRise{to{opacity:1;transform:translateY(0)}}
/* Variante solo-opacidad para elementos ya posicionados con transform (cercanía:
   .cc-pos/.cc-lux usan translate para centrar) — no debe tocarse su transform. */
.san-fade{opacity:0}
.san-go .san-fade{animation:sanFade .6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes sanFade{to{opacity:1}}

/* ── Velo de foco (confirmación al tocar la tarjeta central) ── */
/* Tarjeta + botones entran como un solo gesto: la tarjeta se asienta arriba y
   los botones emergen debajo (desfase mínimo). Misma curva de la app; el
   cierre acompaña (revierte al quitar .on). Sin reglas reduce-motion propias:
   el @media global reduce las transiciones a instantáneas → aparecen directo. */
.foco-overlay{
  position:fixed; inset:0; z-index:300;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:20px; padding:28px 22px;
  background:rgba(0,10,14,.72);
  -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
  opacity:0; transition:opacity .3s ease;
}
.foco-overlay.on{ opacity:1; }
.foco-card-wrap{
  width:100%; max-width:440px;
  opacity:0; transform:translateY(18px) scale(.96);
  transition:opacity .45s cubic-bezier(.2,.7,.3,1), transform .45s cubic-bezier(.2,.7,.3,1);
}
.foco-actions{
  width:100%; max-width:440px; display:flex; flex-direction:column; gap:10px;
  opacity:0; transform:translateY(24px);
  transition:opacity .45s cubic-bezier(.2,.7,.3,1) .07s, transform .45s cubic-bezier(.2,.7,.3,1) .07s;
}
.foco-overlay.on .foco-card-wrap{ opacity:1; transform:translateY(0) scale(1); }
.foco-overlay.on .foco-actions{ opacity:1; transform:translateY(0); }
/* Salida (reverso de la entrada): los botones bajan/ocultan primero, la tarjeta
   baja después (desfase espejo), y el velo se levanta. */
.foco-overlay.leaving{ opacity:0; }
.foco-overlay.leaving .foco-actions{
  opacity:0; transform:translateY(24px);
  transition:opacity .4s cubic-bezier(.2,.7,.3,1), transform .4s cubic-bezier(.2,.7,.3,1);
}
.foco-overlay.leaving .foco-card-wrap{
  opacity:0; transform:translateY(18px) scale(.96);
  transition:opacity .4s cubic-bezier(.2,.7,.3,1) .06s, transform .4s cubic-bezier(.2,.7,.3,1) .06s;
}
.foco-overlay .pain-card{ box-shadow:0 18px 50px -12px rgba(0,0,0,.6); cursor:default; }
.foco-btn{ width:100%; padding:14px; border-radius:14px; border:none; font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.foco-btn-go{ background:var(--orange); color:#fff; }
.foco-btn-cancel{ background:transparent; color:var(--text-soft); font-weight:600; }

/* ── Coach-marks (onboarding de primer uso) ── */
.coach {
  position:fixed; left:50%; bottom:86px; transform:translateX(-50%);
  width:calc(100% - 32px); max-width:440px; z-index:200;
  background:var(--popup-bg); border:1px solid var(--border); border-radius:16px;
  padding:14px 14px 14px 16px; box-shadow:0 14px 44px -12px var(--shadow);
  display:flex; align-items:center; gap:12px;
}
.coach p { font-size:0.83rem; color:var(--text); line-height:1.5; }
.coach b { color:var(--brand-soft); font-weight:700; }
.coach .x {
  flex:none; width:30px; height:30px; border-radius:9px; cursor:pointer;
  background:var(--card2); border:1px solid var(--border); color:var(--text-soft);
  display:flex; align-items:center; justify-content:center;
}
.coach .x svg { width:15px; height:15px; }

/* ── Acogida · corazones (estado) ── */
.cz-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px 10px; margin-bottom:8px; }
.cz-opt {
  display:flex; flex-direction:column; align-items:center; gap:7px;
  background:none; border:none; cursor:pointer; font-family:inherit; padding:6px 2px; min-height:44px;
}
.cz-svg { width:54px; height:54px; }
.cz-svg path { fill:var(--cz,#888); fill-opacity:0.20; stroke:var(--cz,#888); stroke-width:1.3; transition:fill-opacity .25s; }
.cz-opt.sel .cz-svg path { fill-opacity:1; }
.cz-opt.sel .cz-svg { animation:czSettle .42s ease; }
@keyframes czSettle { 0%{transform:scale(.86)} 55%{transform:scale(1.1)} 100%{transform:scale(1)} }
.cz-label { font-size:0.8rem; font-weight:600; color:var(--text-soft); }
.cz-opt.sel .cz-label { color:var(--text); }

/* ── Acogida · termómetro (intensidad) ── */
.tm-wrap { display:flex; gap:16px; justify-content:center; align-items:stretch; margin:4px 0 10px; }
.tm-track {
  position:relative; width:58px; height:224px; border-radius:29px; cursor:pointer;
  background:linear-gradient(to top,#3FBFA0 0%,#EFA02A 55%,#D9534F 100%);
  border:1px solid var(--border); touch-action:none; overflow:hidden;
}
.tm-thumb {
  position:absolute; left:50%; bottom:50%; transform:translate(-50%,50%);
  width:44px; height:44px; border-radius:50%; background:var(--card);
  border:3px solid #fff; box-shadow:0 3px 10px rgba(0,0,0,.35);
}
.tm-labels { display:flex; flex-direction:column; justify-content:space-between; padding:4px 0; max-width:130px; }
.tm-labels span { font-size:0.82rem; color:var(--text-soft); line-height:1.3; }
.tm-labels .max { color:var(--text); font-weight:600; }

/* ── Acogida · cuerpo (zonas) — dos columnas: muñeco + lista, selección única ── */
.cu-wrap { display:flex; align-items:center; justify-content:center; gap:16px; margin:2px 0 10px; }
.cu-svg { width:132px; height:auto; flex-shrink:0; }
.cu-base > * { fill:var(--card2); stroke:var(--border); stroke-width:1.3; }
.cu-zone { cursor:pointer; }
.cu-zone > * { fill:var(--card); stroke:var(--border); stroke-width:1.4; transition:fill .2s, stroke .2s; }
.cu-zone.on > * { fill:var(--brand); stroke:var(--brand); }          /* iluminación cian */
.cu-zone.on { filter:drop-shadow(0 0 5px var(--brand)); }
/* lista de zonas — camino accesible (botones nativos con texto) */
.cu-list { display:flex; flex-direction:column; gap:8px; flex:1; min-width:0; max-width:196px; }
.cu-zbtn {
  display:block; width:100%; text-align:left; cursor:pointer;
  padding:11px 14px; border-radius:12px; min-height:44px;
  background:var(--card); border:1.5px solid var(--border); color:var(--text);
  font-family:inherit; font-size:0.9rem; font-weight:600;
  transition:border-color .2s, background .2s;
}
.cu-zbtn.on { border-color:var(--brand); background:var(--brand-ultra); }
.cu-zbtn:focus-visible { outline:2px solid var(--brand-soft); outline-offset:2px; }
/* "No sabría decir" — salida aparte: no es una parte del cuerpo más */
.cu-aparte { margin-top:8px; border-style:dashed; font-style:italic; color:var(--text-soft); }
.cu-aparte.on { border-style:solid; }

/* ── Acogida · sendero (tiempo) ── */
.sd-wrap { position:relative; margin:10px 2px 12px; }
.sd-line { position:absolute; left:10%; right:10%; top:24px; height:3px; background:var(--border); border-radius:2px; }
.sd-stops { position:relative; display:flex; }
.sd-stop { flex:1; display:flex; flex-direction:column; align-items:center; gap:9px; background:none; border:none; cursor:pointer; font-family:inherit; min-height:44px; padding:14px 2px 0; }
.sd-dot { width:24px; height:24px; border-radius:50%; background:var(--card); border:2px solid var(--border); transition:.2s; }
.sd-stop.sel .sd-dot { background:var(--_eje,var(--brand)); border-color:var(--_eje,var(--brand)); transform:scale(1.14); }
.sd-lbl { font-size:0.78rem; color:var(--text-soft); text-align:center; line-height:1.3; }
.sd-stop.sel .sd-lbl { color:var(--text); font-weight:600; }

/* ── Acogida · cercanía (presencia) ── */
.cc-field {
  position:relative; height:158px; border-radius:18px; margin-bottom:14px;
  background:radial-gradient(circle at 17% 50%, var(--orange-dim), transparent 62%);
  border:1px solid var(--border);
}
.cc-lux { position:absolute; left:17%; top:50%; transform:translate(-50%,-50%); }
.cc-lux svg { width:58px; height:58px; }
.cc-pos {
  position:absolute; top:50%; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:7px;
  background:none; border:none; cursor:pointer; font-family:inherit; min-width:56px; min-height:56px; padding:0;
}
.cc-pos .yo { width:20px; height:20px; border-radius:50%; border:2px solid var(--text-soft); background:transparent; transition:.2s; }
.cc-pos.sel .yo { background:var(--brand-soft); border-color:var(--brand-soft); box-shadow:0 0 0 5px var(--brand-ultra); }
.cc-cap { font-size:0.72rem; color:var(--text-soft); white-space:nowrap; }
.cc-pos.sel .cc-cap { color:var(--text); font-weight:600; }
.cc-apart {
  width:100%; padding:14px; border-radius:15px; margin-bottom:14px; cursor:pointer; min-height:44px;
  background:var(--card); border:1.5px solid var(--border); color:var(--text); font-family:inherit; text-align:center;
  display:flex; flex-direction:column; align-items:center; justify-content:center;   /* etiqueta sola: centrada, sin hueco del sub ausente */
  transition:border-color .2s, background .2s;
}
.cc-apart.sel { border-color:var(--brand); background:var(--brand-ultra); }
.cc-apart b { display:block; font-weight:600; }
.cc-apart b:not(:last-child) { margin-bottom:2px; }   /* separa del sub solo cuando existe */
.cc-apart span { font-size:0.82rem; color:var(--text-soft); }

/* ── Acogida · mosaico (texto tintado) ── */
.mo-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:8px; }
.mo-tile {
  position:relative; min-height:92px; padding:16px 14px; border-radius:16px; cursor:pointer;
  display:flex; align-items:flex-end; text-align:left; font-family:inherit; font-weight:600; font-size:0.94rem;
  color:#fff; border:2px solid transparent; text-shadow:0 1px 6px rgba(0,0,0,.4);
  background:linear-gradient(150deg, var(--_eje,#555) 0%, rgba(0,0,0,0.42) 145%);
  transition:transform .12s, box-shadow .2s, border-color .2s;
}
.mo-tile:active { transform:scale(.98); }
.mo-tile.sel { border-color:#fff; box-shadow:0 0 0 3px var(--brand-ultra); }

/* ── Acogida · peso (carga) — figura con bulto creciente; texto = dato y camino
   accesible, imagen = refuerzo visual. Selección única, realce cian. ── */
.peso-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:8px; }
@media (max-width:430px){ .peso-grid { grid-template-columns:1fr 1fr; gap:12px; } }
.peso-tile {
  display:flex; flex-direction:column; align-items:center; gap:9px; cursor:pointer;
  padding:12px 8px 11px; border-radius:16px; min-height:44px;
  background:var(--card); border:2px solid var(--border); font-family:inherit;
  transition:transform .12s, box-shadow .2s, border-color .2s, background .2s;
}
.peso-tile:active { transform:scale(.98); }
.peso-tile.sel { border-color:var(--brand); background:var(--brand-ultra); box-shadow:0 0 0 3px var(--brand-ultra); }
.peso-tile:focus-visible { outline:2px solid var(--brand-soft); outline-offset:2px; }
/* marco de la figura: fondo neutro tenue siempre presente → sirve de placeholder
   antes de cargar y si la webp falta (404), sin icono de imagen rota. */
.peso-img {
  display:block; width:100%; aspect-ratio:1/1; object-fit:contain;
  border-radius:12px; background:var(--card2);
}
.peso-img.peso-noart { opacity:.55; }   /* webp ausente: marco neutro, sigue usable */
.peso-lbl { font-size:0.9rem; font-weight:600; color:var(--text-soft); text-align:center; line-height:1.2; }
.peso-tile.sel .peso-lbl { color:var(--text); }

/* ── prefers-reduced-motion ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}

/* ── Bottom nav (copiada del hub) ── */
.app-nav {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; z-index:100;
  background:var(--nav-bg); border-top:1px solid var(--border);
  display:flex; align-items:stretch;
  padding-bottom:env(safe-area-inset-bottom, 0px);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.app-nav-item {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:10px 4px 12px; background:none; border:none; cursor:pointer;
  font-family:inherit; text-decoration:none; color:rgba(67,221,248,0.45);
  transition:color 0.2s; -webkit-tap-highlight-color:transparent;
}
body.light .app-nav-item { color:rgba(0,41,49,0.45); }
.app-nav-item.active { color:#43DDF8; }
@keyframes navSpring {
  0%{transform:scale(1)} 35%{transform:scale(0.78)} 65%{transform:scale(1.18)} 82%{transform:scale(0.95)} 100%{transform:scale(1)}
}
.app-nav-item.tapped .app-nav-icon { animation:navSpring 0.38s cubic-bezier(0.34,1.72,0.64,1) both; }
.app-nav-item.tapped { color:#43DDF8; }
.app-nav-icon { width:24px; height:24px; position:relative; display:flex; align-items:center; justify-content:center; }
.app-nav-item.active .app-nav-icon::before { content:''; position:absolute; inset:-5px; background:rgba(2,187,224,0.12); border-radius:10px; }
.app-nav-label { font-size:0.6rem; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }

/* ── Fase 0 · Onboarding de afinidad ── */
.ob-screen { display:flex; flex-direction:column; min-height:calc(100dvh - 150px); padding:6px 0 16px; }
.ob-progress { display:flex; gap:6px; justify-content:center; margin:2px 0 22px; }
.ob-progress .p { width:8px; height:8px; border-radius:50%; background:var(--border); }
.ob-progress .p.on { background:var(--brand); }
.ob-lead { color:var(--text-soft); font-size:1rem; line-height:1.6; margin-bottom:18px; }
.ob-title { font-family:'Crimson Pro',Georgia,serif; font-weight:700; font-size:1.7rem; line-height:1.25; margin-bottom:6px; }
.ob-sub { color:var(--text-soft); font-size:0.9rem; margin-bottom:16px; }
.ob-grid { display:grid; gap:10px; margin:14px 0 8px; }
.ob-grid-2 { grid-template-columns:1fr 1fr; }
.ob-opt {
  min-height:64px; padding:14px 12px; border-radius:16px; cursor:pointer;
  background:var(--card); border:1px solid var(--border); color:var(--text);
  font-family:'Crimson Pro',Georgia,serif; font-size:1.05rem; font-weight:600;
  display:flex; align-items:center; justify-content:center; text-align:center;
  transition:transform .12s, border-color .2s, background .2s;
}
.ob-opt:active { transform:scale(.97); }
.ob-opt.sel { border-color:var(--brand); background:var(--brand-ultra); }
/* P2 · áreas (chips, multi máx-4) */
.ob-areas { display:flex; flex-wrap:wrap; gap:9px; margin:12px 0 6px; }
.ob-area {
  padding:11px 14px; border-radius:20px; cursor:pointer; min-height:44px;
  background:var(--card2); border:1.5px solid var(--border); color:var(--text-soft);
  font-family:inherit; font-size:0.9rem; font-weight:600;
  transition:opacity .2s, border-color .2s, background .2s, color .2s;
}
.ob-area.sel { border-color:var(--brand); background:var(--brand-ultra); color:var(--brand-soft); }
.ob-areas.maxed .ob-area:not(.sel) { opacity:0.4; }   /* al llegar a 4, las no elegidas se atenúan */
.ob-actions { margin-top:auto; padding-top:18px; display:flex; flex-direction:column; gap:8px; }
.ob-primary {
  width:100%; padding:15px; border-radius:15px; border:none; cursor:pointer;
  background:var(--orange); color:#fff; font-family:inherit; font-weight:700; font-size:1rem;
  transition:opacity .2s;
}
.ob-primary:disabled { opacity:0.4; cursor:default; }
.ob-primary:active:not(:disabled) { opacity:0.9; }
.ob-ghost {
  width:100%; padding:13px; border-radius:15px; cursor:pointer;
  background:none; border:1px solid var(--border); color:var(--text-soft);
  font-family:inherit; font-weight:600; font-size:0.92rem;
}
.ob-skip {
  margin:18px auto 0; padding:8px 16px; cursor:pointer; min-height:44px;
  background:none; border:none; color:var(--text-dim); font-family:inherit;
  font-size:0.85rem; text-decoration:underline;
}
/* Cierre personalizado */
.ob-cierre { justify-content:center; text-align:center; }
.ob-cierre-line { font-family:'Crimson Pro',Georgia,serif; font-size:1.2rem; line-height:1.5; color:var(--text); margin:14px 0; }
.ob-cierre .ob-primary { margin-top:28px; }
</style>
</head>

<script>
(function(){
  'use strict';

  // ── Constantes ──────────────────────────────────────────────────
  var ELEMENTO = '0101';   // piloto: único elenco con datos. Parametrizable.
  var base = location.origin + location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
  var IMGB = 'https://pub-96c43f31e0da42dd950d4ac90328256e.r2.dev/';   // bucket de ilustraciones (mismo que orar/mini). arte relativo → IMGB + o.arte

  // Gate developer — ahora sobre el effectivePlan() canónico de plan-utils.js
  // (honra "ver como" en sessionStorage → window.currentPlan → caché). DEV se
  // resuelve en el arranque diferido (Bloque B), cuando el plan real del doc ya
  // está en window.currentPlan: un developer por deep link no cae en falso 'free'.
  function _plan(){ return (window.effectivePlan ? window.effectivePlan() : 'free'); }
  var DEV = false;   // resuelto tras onAuthStateChanged, antes del primer render

  // ── Datos cargados ──────────────────────────────────────────────
  var TAGS = null;      // tags.json
  var PLANT = null;     // acogida-plantillas-v1.json .plantillas
  var SIDE = null;      // {ELEMENTO}-pains.json
  var INDEX = null;     // pains-index.json
  var pains = [];       // lista aplanada de pains {..., mid, misterio}
  var painById = {};
  var misterioByMid = {};

  // ── Estado / máquina de 3 fases ─────────────────────────────────
  var estado = {
    fase: 'elenco',            // 'onboarding' | 'elenco' | 'acogida' | 'handoff'
    modo: 'navegar',           // 'navegar' | 'buscar' | 'ejes'
    ejeActivo: null,
    query: '',
    painSel: null,
    misterioSel: null,
    pasoAcogida: 0,
    senales: [],               // [{tipo, valor, eco}]
    elencoRecentrar: null,     // id del pain a re-centrar al volver de la acogida (se consume una vez)
    misterioPin: '',           // dev: dígitos del mid tecleados en el numberpad del modo Misterio
    // Onboarding de afinidad (Fase B)
    obPaso: 0,                 // 0=bienvenida · 1=tono · 2=áreas · 3=anhelo · 4=cierre
    obTono: null,              // clave de TONOS (P1)
    obAnhelo: null,            // clave de ANHELOS (P3)
    obAreas: []                // claves de AREAS elegidas (P2, máx 4)
  };

  // ── Helpers ─────────────────────────────────────────────────────
  function $(id){ return document.getElementById(id); }
  function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function norm(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
  function cap(s){ s=String(s||''); return s.charAt(0).toUpperCase()+s.slice(1); }
  function ejeData(k){ return (TAGS && TAGS.ejes && TAGS.ejes[k]) || { label:cap(k), color:'#888' }; }

  // Íconos SVG inline por eje (glifos sobrios; sustituibles por iconos/ejes/*.svg luego)
  var EJE_GLIFO = {
    emociones:   '<path d="M12 3s6 6.5 6 10a6 6 0 01-12 0c0-3.5 6-10 6-10z"/>',
    vinculos:    '<circle cx="9" cy="12" r="4.2"/><circle cx="15" cy="12" r="4.2"/>',
    cuerpo:      '<circle cx="12" cy="6" r="3"/><path d="M6 21v-1.5a6 6 0 0112 0V21"/>',
    existencial: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3"/>',
    recursos:    '<path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/>',
    social:      '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.4"/>',
    actitud:     '<path d="M12 21v-8"/><path d="M12 13c0-3 2.6-5.2 6-5 .2 3.2-2.6 5.4-6 5z"/><path d="M12 14c0-2.6-2.2-4.6-5.2-4.4-.2 2.8 2.2 4.6 5.2 4.4z"/>'
  };
  function ejeSVG(k, cls){
    var inner = EJE_GLIFO[k] || '<circle cx="12" cy="12" r="8"/>';
    return '<svg class="'+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
  }

  // ── Onboarding de afinidad · datos (Fase B) ─────────────────────
  // Cada array sirve a la vez de UI y de mapeo. TONOS/ANHELOS llevan el fragmento
  // (frag) de la pantalla de cierre. AREAS mapea cada opción de P2 a su eje.
  var TONOS = [
    { clave:'cansado',    texto:'Cansado/a',       frag:'con cansancio' },
    { clave:'inquieto',   texto:'Inquieto/a',      frag:'con inquietud' },
    { clave:'herida',     texto:'Con una herida',  frag:'con una herida' },
    { clave:'buscando',   texto:'Buscando a Dios', frag:'en busca de Dios' },
    { clave:'agradecido', texto:'Agradecido/a',    frag:'con el corazón agradecido' },
    { clave:'nose',       texto:'No sé bien',      frag:'sin saber bien cómo' }
  ];
  var ANHELOS = [
    { clave:'consuelo',       texto:'Consuelo',       frag:'consuelo' },
    { clave:'claridad',       texto:'Claridad',       frag:'claridad' },
    { clave:'fuerza',         texto:'Fuerza',         frag:'fortaleza' },
    { clave:'reconciliacion', texto:'Reconciliación', frag:'reconciliación' },
    { clave:'gratitud',       texto:'Gratitud',       frag:'más gratitud aún' },
    { clave:'estarcondios',   texto:'Estar con Dios', frag:'Su presencia' }
  ];
  var AREAS = [
    { clave:'cuerpo',    eje:'cuerpo',      texto:'Mi cuerpo' },
    { clave:'salud',     eje:'cuerpo',      texto:'Mi salud' },
    { clave:'familia',   eje:'vinculos',    texto:'Mi familia' },
    { clave:'hijos',     eje:'vinculos',    texto:'La relación con mis hijos' },
    { clave:'padres',    eje:'vinculos',    texto:'La relación con mis padres' },
    { clave:'amor',      eje:'vinculos',    texto:'Mis relaciones amorosas' },
    { clave:'soledad',   eje:'vinculos',    texto:'Mi soledad' },
    { clave:'duelo',     eje:'vinculos',    texto:'Un duelo / una pérdida' },
    { clave:'amigos',    eje:'social',      texto:'La relación con mis amigos' },
    { clave:'laboral',   eje:'social',      texto:'Mis relaciones laborales' },
    { clave:'dinero',    eje:'recursos',    texto:'Mi dinero' },
    { clave:'trabajo',   eje:'recursos',    texto:'Mi trabajo' },
    { clave:'tiempo',    eje:'recursos',    texto:'Mi tiempo' },
    { clave:'tristeza',  eje:'emociones',   texto:'Mi tristeza' },
    { clave:'ansiedad',  eje:'emociones',   texto:'Mi ansiedad' },
    { clave:'enojo',     eje:'emociones',   texto:'Mi enojo' },
    { clave:'miedo',     eje:'emociones',   texto:'Mi miedo' },
    { clave:'sentido',   eje:'existencial', texto:'El sentido de mi vida' },
    { clave:'fe',        eje:'existencial', texto:'Mi fe' },
    { clave:'dios',      eje:'existencial', texto:'Mi relación con Dios' },
    { clave:'pasado',    eje:'existencial', texto:'Mi pasado' },
    { clave:'reacciones',eje:'actitud',     texto:'Mis reacciones' },
    { clave:'paz',       eje:'actitud',     texto:'Mi falta de paz' },
    { clave:'habitos',   eje:'actitud',     texto:'Mis hábitos' },
    { clave:'verme',     eje:'actitud',     texto:'Mi forma de verme a mí misma/o' }
  ];
  // Fórmula simple (Fase C afinará): cada área elegida suma +1 a su eje.
  function pesosDeAreas(areasSel){
    var ejes = _ejesVacios();
    (areasSel || []).forEach(function(clave){
      var a = AREAS.filter(function(x){ return x.clave === clave; })[0];
      if (a && ejes[a.eje] != null) ejes[a.eje] += 1;
    });
    return ejes;
  }
  function tonoFrag(k){ var t = TONOS.filter(function(x){return x.clave===k;})[0]; return t ? t.frag : ''; }
  function anheloFrag(k){ var a = ANHELOS.filter(function(x){return x.clave===k;})[0]; return a ? a.frag : ''; }

  // Resuelve el tipo de acogida (string = default; objeto = alterna → usamos su .tipo)
  function tipoDe(entry){ return (typeof entry === 'string') ? entry : (entry && entry.tipo); }

  // Normaliza las opciones de cualquier mecánica a {clave, texto, eco}
  // (fallback universal de Bloque A; el Bloque B rendereará cada mecánica a su forma)
  function opcionesDe(pl){
    if (!pl) return [];
    var src = pl.opciones || pl.tramos || pl.zonas || pl.pasos || [];
    return src.map(function(o){

  // ── Perfil de afinidad · onboarding-test (Fase B) ───────────────
  // Señal EXPLÍCITA (el test guiado). Puebla users/{uid}/profile/afinidad.
  // Fase C leerá perfil.ejes para reordenar el elenco (aún NO se reordena).
  var _AF_KEY = 'cruzando_afinidad';   // mirror de localStorage (respaldo + flag "visto")
  function _ejesVacios(){ return { emociones:0, vinculos:0, cuerpo:0, existencial:0, recursos:0, social:0, actitud:0 }; }
  function _localPerfil(){
    try { var raw = localStorage.getItem(_AF_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
  }
  function _qpRehacer(){
    try { return new URLSearchParams(location.search).get('rehacer') === '1'; } catch(e){ return false; }
  }
  // Lee el perfil: Firestore primero; si no hay (o falla la red), el mirror local.
  function _cargarPerfil(user){
    var FS = window._fbFirestore;
    if (!FS || !FS.getDoc) return Promise.resolve(_localPerfil());
    try {
      var ref = FS.doc(_db, 'users', user.uid, 'profile', 'afinidad');
      return FS.getDoc(ref).then(function(snap){
        return (snap && snap.exists) ? snap.data() : _localPerfil();
      }).catch(function(){ return _localPerfil(); });
    } catch(e){ return Promise.resolve(_localPerfil()); }
  }
  // Escritura: localStorage primero (síncrono, marca pendingSync), luego Firestore
  // vía el shim; si Firestore confirma, se limpia pendingSync.
  function guardarPerfilAfinidad(perfil){
    var doc = {
      version: 1,
      status:  perfil.status || 'complete',
      tono:    perfil.tono || null,
      anhelo:  perfil.anhelo || null,
      areas:   perfil.areas || [],
      ejes:    perfil.ejes || _ejesVacios()
    };
    _perfil = doc.ejes;   // en memoria para la sesión (Fase C)
    try { localStorage.setItem(_AF_KEY, JSON.stringify(Object.assign({ pendingSync:true }, doc))); } catch(e){}
    _escribirAfinidadFirestore(doc);
  }
  function _escribirAfinidadFirestore(doc){
    var FS = window._fbFirestore, uid = window._obUID;
    if (!FS || !FS.setDoc || !uid || !_db) return;   // sin canal → queda pendingSync en localStorage
    try {
      var ref = FS.doc(_db, 'users', uid, 'profile', 'afinidad');
      FS.setDoc(ref, {
        version: doc.version, status: doc.status, tono: doc.tono,
        anhelo: doc.anhelo, areas: doc.areas, ejes: doc.ejes,
        updatedAt: FS.serverTimestamp ? FS.serverTimestamp() : null
      }, { merge:true })
      .then(function(){ _clearPendingSync(); })
      .catch(function(){ /* pendingSync sigue true → se reintenta en el próximo arranque */ });
    } catch(e){}
  }
  function _clearPendingSync(){
    var p = _localPerfil(); if (!p) return;
    p.pendingSync = false;
    try { localStorage.setItem(_AF_KEY, JSON.stringify(p)); } catch(e){}
  }
  function _retryPendingSync(){
    var p = _localPerfil();
    if (p && p.pendingSync) _escribirAfinidadFirestore(p);
  }

  // ── Carga de los 4 JSON ─────────────────────────────────────────
  async function cargar(){
    async function j(archivo){
      try { var r = await fetch(base + 'data/' + archivo); if (r.ok) return await r.json(); } catch(e){}
      return null;
    }
    var res = await Promise.all([
      j('tags.json'),
      j('acogida-plantillas-v1.json'),
      j(ELEMENTO + '-pains.json'),
      j('pains-index.json')
    ]);
    TAGS = res[0];
    PLANT = res[1] && res[1].plantillas;
    SIDE = res[2];
    INDEX = res[3];

    if (!TAGS || !SIDE || !INDEX) {
      $('view').innerHTML = '<div class="empty">No se pudo cargar el contenido de Sanar.<br>Intenta de nuevo más tarde.</div>';
      return;
    }

    (SIDE.misterios || []).forEach(function(m){
      misterioByMid[m.mid] = m;
      (m.pains || []).forEach(function(p){
        var pn = { id:p.id, texto:p.texto, ejePrincipal:p.ejePrincipal, tags:p.tags||[], mid:m.mid, misterio:m };
        pains.push(pn);
        painById[pn.id] = pn;
      });
    });

    render();
  }

  // ── Router ──────────────────────────────────────────────────────
  function render(){
    // El botón "volver" se oculta en el elenco y en la bienvenida del onboarding.
    var hideBack = (estado.fase === 'elenco') ||
                   (estado.fase === 'onboarding' && estado.obPaso === 0);
    $('s-back').style.visibility = hideBack ? 'hidden' : 'visible';
    if (estado.fase === 'onboarding') return renderOnboarding();
    if (estado.fase === 'elenco')  return renderElenco();
    if (estado.fase === 'acogida') return renderAcogida();
    if (estado.fase === 'handoff') return renderHandoff();
  }

  function onBack(){
    if (estado.fase === 'onboarding') {
      if (estado.obPaso > 0) { estado.obPaso--; return render(); }
      return;   // bienvenida: el atrás lo maneja el gesto (→ index)
    }
    estado._acgEntrada = false;   // retroceso → recepción/progreso fijos, sin re-animar
    if (estado.fase === 'handoff') { estado.fase = 'acogida'; estado.pasoAcogida = Math.max(0,(estado.misterioSel.acogida||[]).length-1); return render(); }
    if (estado.fase === 'acogida') {
      if (estado.pasoAcogida > 0) { estado.pasoAcogida--; estado.senales.pop(); return render(); }
      estado.elencoRecentrar = estado.painSel && estado.painSel.id;   // recordar el pain para re-centrarlo en el wheel al volver
      estado.fase = 'elenco'; estado.painSel = null; estado.misterioSel = null; estado.senales = [];
      return render();
    }
  }
  window.onBack = onBack;

  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // Al volver de la acogida (atrás desde el primer paso), re-centra el pain de
  // origen en el wheel ya montado (renderList→setupWheel ya corrió update()): el
  // scrollIntoView instantáneo manda sobre el centrado inicial. Se consume una
  // sola vez → no afecta a entradas normales al elenco. Modo/filtro no se tocan
  // (se conservan solos): la lista ya se re-montó con el mismo modo y filtro.
  function _recentrarElenco(){
    var id = estado.elencoRecentrar;
    estado.elencoRecentrar = null;
    if (!id) return;
    var box = $('elenco-list'); if (!box) return;
    var card = box.querySelector('.pain-card[data-id="'+id+'"]');
    // rAF: asegura layout listo antes de reposicionar el scroll del wheel.
    if (card) requestAnimationFrame(function(){ card.scrollIntoView({ block:'center', behavior:'auto' }); });
  }

  // Re-dispara la cascada de entrada del elenco en cada entrada a la fase
  // (incluido volver del handoff, porque renderElenco re-renderiza). El wheel
  // entra como bloque vía el .san-an de su contenedor (#elenco-list); las
  // tarjetas conservan intacto su transform 3D inline de update().
  function _sanEntrada(){
    var view = $('view'); if (!view) return;
    view.classList.remove('san-go');
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ view.classList.add('san-go'); });
    });
  }

  function _misterioPadHTML(){

    keys += '<button class="pad-key pad-alt" type="button" data-act="del" aria-label="Borrar último dígito">⌫</button>';

  // ── Orden del elenco · PUNTO ÚNICO ──────────────────────────────
  // Toda decisión de orden del wheel pasa por aquí. Hoy:
  //   • user + 'navegar'      → orden actual (tal como llega del JSON).
  //   • developer + 'navegar' → orden de itinerario (mid canónico ascendente).
  //   • 'buscar' / 'ejes'     → no se reordenan (búsqueda movida por el usuario).
  // Fase C: en la rama user de 'navegar', sustituir el return por
  //   ordenarPorAfinidad(list, perfil). No hay que reestructurar nada más.
  var _perfil = null;   // Fase B/C: perfil de afinidad del usuario (aún sin poblar)
  function ordenElenco(list, modo, perfil){
    if (modo === 'navegar' && DEV) return _ordenItinerario(list);
    // user + 'navegar' → orden actual. Fase C: return ordenarPorAfinidad(list, perfil);
    return list;
  }
  // Itinerario (developer): por mid canónico ascendente. El mid es zero-padded
  // (mundo·nivel·número, 2+2+2), así que el orden lexicográfico del string ya
  // equivale a 1_1_1→1_1_20→1_2_1→… No muta la lista original (slice antes de sort).
  function _ordenItinerario(list){
    return list.slice().sort(function(a,b){
      var A = String(a.mid || ''), B = String(b.mid || '');
      return A < B ? -1 : A > B ? 1 : 0;
    });
  }

  function renderList(){
    var box = $('elenco-list'); if (!box) return;

    if (estado.modo === 'buscar') {
      var q = norm(estado.query).trim();
      if (!q) { box.innerHTML = '<div class="empty">Escribe una palabra o una frase…<br>Ej. «me siento solo», «miedo», «cansancio».</div>'; return; }
      var hits = pains.filter(function(p){
        if (norm(p.texto).indexOf(q) !== -1) return true;
        // match contra slugs de tags (nunca se muestran en la UI)
        return (p.tags||[]).some(function(t){ return norm(t).indexOf(q) !== -1; });
      });
      if (!hits.length) { box.innerHTML = '<div class="empty">Nada por aquí con esas palabras.<br>Prueba con otra forma de nombrarlo.</div>'; return; }
      renderWheel(hits, '');
      return;
    }

    if (estado.modo === 'ejes') {
      if (!estado.ejeActivo) { box.innerHTML = '<div class="empty">Elige un tema</div>'; return; }
      var ids = (INDEX.porEje && INDEX.porEje[estado.ejeActivo]) || [];
      var ps = ids.map(function(id){ return painById[id]; }).filter(Boolean);
      if (!ps.length) { box.innerHTML = '<div class="empty">Sin dolores en este eje.</div>'; return; }
      renderWheel(ps, '');
      return;
    }

    if (estado.modo === 'misterio') {   // dev: cargar un Misterio por mid
      var pin = estado.misterioPin || '';
      if (pin.length < 6) { box.innerHTML = '<div class="empty">Teclea el mid del Misterio (6 dígitos).<br>mundo·nivel·número — ej. «010120».</div>'; return; }
      var m = misterioByMid[pin];
      if (!m) { box.innerHTML = '<div class="empty">Ese Misterio no está cargado.<br><small>mid '+esc(pin)+' — hoy solo '+esc(ELEMENTO)+' (010101–010120).</small></div>'; return; }
      var mps = pains.filter(function(p){ return p.mid === pin; });
      if (!mps.length) { box.innerHTML = '<div class="empty">Sin pains en este Misterio.</div>'; return; }
      renderWheel(mps, m.titulo);   // título del Misterio como encabezado (confirma cuál cargó)
      return;
    }

    // navegar: elenco completo — orden centralizado (Fase C insertará afinidad aquí)
    renderWheel(ordenElenco(pains, 'navegar', _perfil), DEV ? 'Orden de itinerario' : 'Desliza y elige');
  }

  // Todos los modos pintan sus resultados en el mismo wheel 3D
  function renderWheel(list, hint){
    var box = $('elenco-list'); if (!box) return;
    box.innerHTML =
      (hint ? '<div class="wheel-hint">'+esc(hint)+'</div>' : '')+
      '<div class="wheel" id="wheel"><div class="wheel-pad"></div>'+
        list.map(function(p){ return painCard(p); }).join('')+
      '<div class="wheel-pad"></div></div>';
    setupWheel();
  }

  function painCard(p){
    var e = ejeData(p.ejePrincipal);
    // La tarjeta muestra SOLO la frase + color/label del eje. Nunca los tags.
    return '<button class="pain-card" data-id="'+p.id+'" style="--_eje:'+e.color+'" onclick="onWheelTap(this,\''+p.id+'\')">'+
      esc(p.texto)+
      '<span class="pain-eje">'+ejeSVG(p.ejePrincipal)+esc(e.label)+'</span>'+
      '</button>';
  }

  // ── Scroll 3D del elenco (modo Navegar) ─────────────────────────
  var wheelRAF = null;
  function setupWheel(){
    var w = $('wheel'); if (!w) return;
    var cards = Array.prototype.slice.call(w.querySelectorAll('.pain-card'));
    if (!cards.length) return;

    function update(){
      wheelRAF = null;
      var vc = w.scrollTop + w.clientHeight / 2;
      var half = w.clientHeight / 2;
      var best = null, bestD = Infinity;
      cards.forEach(function(c){
        var cc = c.offsetTop + c.offsetHeight / 2;
        var d = (cc - vc) / half;                 // ~-1 (arriba) .. 1 (abajo)
        var ad = Math.min(Math.abs(d), 1);
        var scale = 1 - ad * 0.16;
        var op = 1 - ad * 0.55;
        var rot = reduceMotion ? 0 : Math.max(-1, Math.min(1, d)) * -15;  // rotateX ∝ distancia al centro
        c.style.opacity = op.toFixed(3);
        c.style.transform = 'scale(' + scale.toFixed(3) + ')' + (rot ? ' rotateX(' + rot.toFixed(1) + 'deg)' : '');
        if (ad < bestD) { bestD = ad; best = c; }
      });
      cards.forEach(function(c){ c.classList.toggle('centered', c === best); });
      w._centered = best;
    }
    w.addEventListener('scroll', function(){ if (!wheelRAF) wheelRAF = requestAnimationFrame(update); }, { passive:true });
    update();
  }

  window.onWheelTap = function(elm, id){
    var w = $('wheel');
    if (w && w._centered === elm) { abrirFoco(id); }       // tarjeta centrada → velo de confirmación
    else { elm.scrollIntoView({ block:'center', behavior: reduceMotion ? 'auto' : 'smooth' }); }  // si no, la centra
  };

  // ── Velo de foco: paso de confirmación antes de entrar a la acogida ──────
  var _focoEsc = null;
  function abrirFoco(painId){
    var p = painById[painId]; if (!p) return;
    if ($('foco')) return;
    cerrarCoach();
    var ov = el(
      '<div class="foco-overlay" id="foco" role="dialog" aria-modal="true" aria-label="Confirmar elección">'+
        '<div class="foco-card-wrap">'+painCard(p)+'</div>'+
        '<div class="foco-actions">'+
          '<button class="foco-btn foco-btn-go" id="foco-go">Continuar</button>'+
          '<button class="foco-btn foco-btn-cancel" id="foco-cancel">Cancelar</button>'+
        '</div>'+
      '</div>');
    // La tarjeta del velo es solo visual: anula su onclick (onWheelTap) para que
    // tocarla no dispare nada; y solo el fondo (no la tarjeta) cierra el velo.
    var card = ov.querySelector('.pain-card'); if (card) card.onclick = null;
    ov.addEventListener('click', function(e){ if (e.target === ov) cerrarFoco(); });
    document.body.appendChild(ov);
    // Continuar → cierre directo (la transición es hacia la acogida, no en reversa).
    $('foco-go').addEventListener('click', function(){ cerrarFoco(true); pickPain(painId); });
    // Cancelar / tap-fuera / Esc → salida coreografiada (reverso de la entrada).
    $('foco-cancel').addEventListener('click', function(){ cerrarFoco(); });
    _focoEsc = function(e){ if (e.key === 'Escape') cerrarFoco(); };
    document.addEventListener('keydown', _focoEsc);
    // Un frame después → .on dispara la entrada coordinada (tarjeta + botones).
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ ov.classList.add('on'); }); });
    $('foco-go').focus();
  }
  // immediate=true → quita el velo al instante (Continuar/reduce-motion).
  // Si no, corre la salida en reversa y remueve tras terminar (transitionend + respaldo).
  function cerrarFoco(immediate){
    var ov = $('foco');
    if (_focoEsc) { document.removeEventListener('keydown', _focoEsc); _focoEsc = null; }
    if (!ov) return;
    if (immediate || reduceMotion) { ov.remove(); return; }
    if (ov._closing) return;
    ov._closing = true;
    ov.classList.remove('on');
    ov.classList.add('leaving');                     // dispara las transiciones de salida
    var done = false;
    var fin = function(){ if (done) return; done = true; if (ov.parentNode) ov.remove(); };
    var wrap = ov.querySelector('.foco-card-wrap');  // el último en asentarse (lleva el desfase)
    if (wrap) wrap.addEventListener('transitionend', fin);
    setTimeout(fin, 480);                            // respaldo si transitionend no dispara
  }

  // ── Onboarding de primer uso (coach-marks) ──────────────────────
  // Persiste un contador; tras ~3-4 veces no reaparece.
  // TODO: si hay sesión, migrar el contador a Firestore (users/{uid}).
  function coachCount(){ try { return parseInt(localStorage.getItem('microOnboardingVisto') || '0', 10) || 0; } catch(e){ return 4; } }
  function setCoachCount(v){ try { localStorage.setItem('microOnboardingVisto', String(v)); } catch(e){} }
  function maybeCoach(){
    if (coachCount() >= 4) return;
    if ($('coach')) return;
    var c = el('<div class="coach" id="coach" role="note" aria-live="polite">'+
      '<p>Desliza para recorrer · <b>toca</b> la tarjeta central para entrar · o <b>escríbelo</b> / filtra por <b>eje</b>.</p>'+
      '<button class="x" aria-label="Entendido" onclick="cerrarCoach()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
    '</div>');
    document.body.appendChild(c);
    setCoachCount(coachCount() + 1);
  }
  window.cerrarCoach = function(){ var c = $('coach'); if (c) c.remove(); };

  window.setModo = function(m){ cerrarCoach(); estado.misterioPin = ''; estado.modo = m; render(); };   // cambiar de modo limpia el PIN (dev)
  window.pickEje = function(k){ estado.ejeActivo = (estado.ejeActivo === k) ? null : k; render(); };
  window.pickPain = function(id){
    var p = painById[id]; if (!p) return;
    cerrarCoach();
    estado.painSel = p;
    estado.misterioSel = misterioByMid[p.mid] || null;
    estado.pasoAcogida = 0;
    estado.senales = [];
    estado.fase = 'acogida';
    estado._acgEntrada = true;   // primera entrada → cascada completa
    render();
    window.scrollTo(0,0);
  };

  // ── FASE 2 · Acogida ────────────────────────────────────────────
  // Emisión uniforme de la señal del paso actual: { tipo, valor, eco }.
  function setEco(eco){
    var e = $('acg-eco'); if (!e) return;
    if (Array.isArray(eco)) e.innerHTML = eco.map(function(x){ return esc(x); }).join('<br>');
    else e.textContent = eco || '';
  }
  function commit(tipo, valor, eco){
    estado.senales[estado.pasoAcogida] = { tipo:tipo, valor:valor, eco:eco };
    // El eco ya NO se muestra durante la acogida: se reserva para el handoff.
    // La señal (con su eco) se sigue acumulando en estado.senales, intacta.
    var c = $('acg-cont'); if (c) c.disabled = false;
  }

  function renderAcogida(){
    var v = $('view');
    var m = estado.misterioSel, p = estado.painSel;
    var pasos = (m && m.acogida) || [];
    var entry = pasos[estado.pasoAcogida];
    var tipo = tipoDe(entry);
    var pl = PLANT && PLANT[tipo];

    // Salvaguarda: tipo sin plantilla → saltar el paso
    if (!pl) { avanzarAcogida(); return; }

    // string = mecánica por defecto de la plantilla; objeto = alterna (honra su .mecanica)
    var mec = (entry && typeof entry === 'object' && entry.mecanica) || pl.mecanica || 'mosaico';
    var ejeColor = ejeData(p.ejePrincipal).color;
    var dots = pasos.map(function(_,i){ return '<span class="p'+(i<=estado.pasoAcogida?' on':'')+'"></span>'; }).join('');

    // Primera entrada (desde pickPain) → cascada completa. Avance/retroceso →
    // recepción y progreso fijos (sin .san-an); solo animan pregunta + body.
    var first = !!estado._acgEntrada;

    v.innerHTML =
      '<div class="acg-recepcion'+(first?' san-an':'')+'"'+(first?' style="animation-delay:0s"':'')+'>'+
        '<div class="dolor">«'+esc(p.texto)+'»</div>'+
      '</div>'+
      '<div class="acg-progress'+(first?' san-an':'')+'" aria-hidden="true"'+(first?' style="animation-delay:.12s"':'')+'>'+dots+'</div>'+
      '<div class="acg-pregunta san-an" style="animation-delay:'+(first?'.24s':'0s')+'">'+esc(pl.pregunta||'')+'</div>'+
      '<div id="acg-body" style="--_eje:'+ejeColor+'"></div>'+   // sus elementos escalonan (Bloque B); base .36s/.12s
      '<div class="acg-eco" id="acg-eco" aria-live="polite"></div>'+
      '<button class="btn-primary" id="acg-cont" disabled onclick="avanzarAcogida()">Continuar</button>';

    var body = $('acg-body');
    var prev = estado.senales[estado.pasoAcogida];   // señal previa (si se retrocede)
    switch (mec) {
      case 'corazones': rndCorazones(body, pl, tipo); break;
      case 'termometro': rndTermometro(body, pl, tipo); break;
      case 'cuerpo':     rndCuerpo(body, pl, tipo, prev && prev.valor); break;   // restaura su estado interno
      case 'sendero':    rndSendero(body, pl, tipo); break;
      case 'cercania':   rndCercania(body, pl, tipo); break;
      case 'peso':       rndPeso(body, pl, tipo); break;   // carga; restaura vía _acgRestaura genérico (.sel + aria-pressed)
      case 'mosaico':
      default:           rndMosaico(body, pl, tipo); break;   // fallback universal
    }

    // Continuidad si el usuario retrocede: reactiva Continuar y re-marca la
    // opción elegida (el eco ya no se pinta aquí; se reserva para el handoff).
    // cuerpo (multi-selección) se restaura dentro de su renderer para no
    // desincronizar su estado interno; el resto, re-marcado sobre el DOM.
    if (prev) {
      var cb = $('acg-cont'); if (cb) cb.disabled = false;
      if (mec !== 'cuerpo') _acgRestaura(body, mec, prev.valor, pl);
    }

    _acgDispara();   // dispara la cascada (.san-go sobre #view) y limpia tras la entrada
  }

  // Delay de un elemento del body, relativo al disparo: base tras la pregunta
  // (.36s primera entrada / .12s avance) + índice × paso (.13s; .18s en cercanía).
  function _acgD(i, step){
    var base = estado._acgEntrada ? 0.36 : 0.12;
    return (base + i * (step || 0.13)).toFixed(2) + 's';
  }
  // Dispara la cascada del body en cada renderAcogida y, al terminar, quita las
  // clases para no dejar el transform bloqueado por forwards (p.ej. .mo-tile:active).
  var _acgGen = 0;
  function _acgDispara(){
    var view = $('view'); if (!view) return;
    view.classList.remove('san-go');
    var gen = ++_acgGen;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        view.classList.add('san-go');
        setTimeout(function(){
          if (gen !== _acgGen) return;   // hubo otro paso; que el suyo limpie
          var els = view.querySelectorAll('.san-an, .san-fade');
          for (var i = 0; i < els.length; i++){
            els[i].classList.remove('san-an', 'san-fade');
            els[i].style.animationDelay = '';
          }
        }, 2200);
      });
    });
  }

  // Restaura el estado visual "seleccionado" al retroceder a un paso ya respondido
  // (antes lo indicaba el eco; ahora el eco se reserva al handoff). Solo re-marca
  // el DOM ya pintado según la mecánica; no toca la lógica de los renderers.
  function _acgRestaura(box, mec, valor, pl){
    if (!box) return;
    if (mec === 'termometro') {
      // No hay nodo "seleccionado": el thumb es la señal. Se reposiciona al
      // punto medio del tramo elegido (aprox., no guardamos el frac exacto).
      var thumb = $('tm-thumb'), track = $('tm-track'), tramos = (pl && pl.tramos) || [];
      var idx = -1; for (var i = 0; i < tramos.length; i++){ if (tramos[i].clave === valor){ idx = i; break; } }
      if (thumb && idx >= 0) {
        var lo = idx > 0 ? tramos[idx-1].hasta : 0;
        var hi = (tramos[idx].hasta != null) ? tramos[idx].hasta : 100;
        var mid = (lo + hi) / 2;
        thumb.style.bottom = mid + '%';
        if (track) track.setAttribute('aria-valuenow', Math.round(mid));
      }
    } else {
      // Selección única con .sel: corazones / sendero / mosaico / cercanía / peso.
      var n = box.querySelector('[data-clave="'+valor+'"]');
      if (n) {
        n.classList.add('sel');
        if (n.hasAttribute('aria-pressed')) n.setAttribute('aria-pressed', 'true');   // peso: repone estado a11y (resto no lo declara → no-op)
      }
    }
  }

  // Selección única genérica: cada opción debe traer .clave y .eco
  function wireSingle(box, sel, opts, tipo){
    var nodes = box.querySelectorAll(sel);
    Array.prototype.forEach.call(nodes, function(n){
      n.addEventListener('click', function(){
        Array.prototype.forEach.call(nodes, function(x){
          x.classList.remove('sel');
          if (x.hasAttribute('aria-pressed')) x.setAttribute('aria-pressed', 'false');
        });
        n.classList.add('sel');
        if (n.hasAttribute('aria-pressed')) n.setAttribute('aria-pressed', 'true');   // toggle-btn (peso); resto no lo declara → no-op
        var o = opts[+n.getAttribute('data-i')];
        commit(tipo, o.clave, o.eco || '');
        // UX: con tiles altos (mosaico/peso) el botón cae bajo el pliegue. Tras
        // seleccionar, revelar "Continuar" solo si no está visible, y lo mínimo
        // (block:'nearest' → el mosaico sigue a la vista). No auto-avanza.
        var cont = $('acg-cont');
        if (cont) {
          var r = cont.getBoundingClientRect();
          if (!(r.top >= 0 && r.bottom <= window.innerHeight))
            cont.scrollIntoView({ block:'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
        }
      });
    });
  }

  // 1 · corazones (estado) — corazones SVG teñidos con opcion.color, selección única
  function rndCorazones(box, pl, tipo){
    var opts = pl.opciones || [];
    box.innerHTML = '<div class="cz-grid">' + opts.map(function(o,i){
      return '<button class="cz-opt san-an" data-i="'+i+'" data-clave="'+esc(o.clave)+'" style="animation-delay:'+_acgD(i)+'">'+
        '<span class="cz-svg" style="--cz:'+(o.color||'#888')+'">'+heartSVG()+'</span>'+
        '<span class="cz-label">'+esc(o.texto)+'</span></button>';
    }).join('') + '</div>';
    wireSingle(box, '.cz-opt', opts, tipo);
  }
  function heartSVG(){
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6S3.6 15 3.6 9.3C3.6 6.5 5.7 4.7 8 4.7c1.7 0 3.1 1 4 2.4 0.9-1.4 2.3-2.4 4-2.4 2.3 0 4.4 1.8 4.4 4.6C20.4 15 12 20.6 12 20.6z"/></svg>';
  }

  // 2 · termometro (intensidad) — slider vertical suave→intenso; el valor cae en un tramo por umbral
  function rndTermometro(box, pl, tipo){
    var tramos = pl.tramos || [];
    var ex = pl.extremos || { min:'', max:'' };
    box.innerHTML =
      '<div class="tm-wrap san-an" style="animation-delay:'+_acgD(0)+'">'+
        '<div class="tm-track" id="tm-track" role="slider" aria-label="'+esc(pl.pregunta||'Intensidad')+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0">'+
          '<div class="tm-thumb" id="tm-thumb"></div>'+
        '</div>'+
        '<div class="tm-labels"><span class="max">'+esc(ex.max||'')+'</span><span>'+esc(ex.min||'')+'</span></div>'+
      '</div>';
    var track = $('tm-track'), thumb = $('tm-thumb');
    var frac = 0.5, dragging = false;
    function place(){ thumb.style.bottom = (frac*100) + '%'; track.setAttribute('aria-valuenow', Math.round(frac*100)); }
    function fromY(clientY){
      var r = track.getBoundingClientRect();
      frac = Math.max(0, Math.min(1, 1 - (clientY - r.top) / r.height));
      place();
    }
    function tramoDe(v){ for (var i=0;i<tramos.length;i++){ if (v <= tramos[i].hasta) return tramos[i]; } return tramos[tramos.length-1]; }
    function commitFrac(){ var t = tramoDe(Math.round(frac*100)); if (t) commit(tipo, t.clave, t.eco); }
    place();
    track.addEventListener('pointerdown', function(e){ dragging = true; try { track.setPointerCapture(e.pointerId); } catch(_){} fromY(e.clientY); });
    track.addEventListener('pointermove', function(e){ if (dragging) fromY(e.clientY); });
    track.addEventListener('pointerup', function(){ if (!dragging) return; dragging = false; commitFrac(); });
    track.addEventListener('keydown', function(e){
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { frac = Math.min(1, frac + 0.1); place(); commitFrac(); e.preventDefault(); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { frac = Math.max(0, frac - 0.1); place(); commitFrac(); e.preventDefault(); }
    });
  }

  // 3 · cuerpo (cuerpo) — silueta neutra; zonas de la plantilla (incluida la cabeza); selección múltiple
  // Texto visible de la lista (limpio: "Cabeza", no "Cabeza (mente)").
  var CU_LBL = { cabeza:'Cabeza', garganta:'Garganta', hombros:'Hombros', pecho:'Pecho', estomago:'Estómago', manos:'Manos' };
  function rndCuerpo(box, pl, tipo, pre){
    var zonas = pl.zonas || [];
    var byC = {}; zonas.forEach(function(z){ byC[z.clave] = z; });
    // Camino accesible: una lista de <button> con texto visible (molde de las
    // otras mecánicas). El muñeco solo refleja/permite el tap (no accesible).
    var lista = zonas.map(function(z){
      var txt = z.texto || CU_LBL[z.clave] || cap(z.clave);
      var extra = z.aparte ? ' cu-aparte' : '';   // "No sabría decir" → visualmente aparte
      return '<button class="cu-zbtn'+extra+'" type="button" data-clave="'+esc(z.clave)+'" aria-pressed="false">'+esc(txt)+'</button>';
    }).join('');
    box.innerHTML =
      '<div class="cu-wrap san-an" style="animation-delay:'+_acgD(0)+'">'+
        cuerpoSVG(zonas)+
        '<div class="cu-list" role="group" aria-label="Zonas del cuerpo">'+lista+'</div>'+
      '</div>';

    var zButtons = box.querySelectorAll('.cu-zbtn');
    var zGs = box.querySelectorAll('.cu-zone');   // muñeco: sincronía visual, no accesible
    var selZona = null;

    // Selección ÚNICA con reemplazo: marca una zona, de-marca la anterior,
    // sincroniza lista (.on + aria-pressed) y muñeco (.on + glow cian), y emite
    // commit como STRING/STRING (igual que las otras 5 mecánicas).
    function marca(clave){
      if (!byC[clave]) return;
      selZona = clave;
      Array.prototype.forEach.call(zButtons, function(b){
        var on = b.getAttribute('data-clave') === clave;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      Array.prototype.forEach.call(zGs, function(g){
        g.classList.toggle('on', g.getAttribute('data-clave') === clave);
      });
      commit(tipo, clave, byC[clave].eco || '');
    }

    Array.prototype.forEach.call(zButtons, function(b){
      b.addEventListener('click', function(){ marca(b.getAttribute('data-clave')); });
    });
    Array.prototype.forEach.call(zGs, function(g){
      g.addEventListener('click', function(){ marca(g.getAttribute('data-clave')); });
    });

    // Retroceso: re-selecciona la única elección previa (string) — repone lista
    // (.on+aria-pressed) y muñeco (cian si es zona con forma; noUbico no ilumina),
    // y habilita Continuar (commit). El eco NO se re-muestra (reserva del handoff).
    if (pre) marca(pre);
  }
  function cuerpoSVG(zonas){
    // Formas por zona (viewBox 0 0 120 250). Sólo se dibujan las de la plantilla.
    var Z = {
      cabeza:   '<circle cx="60" cy="30" r="18"/>',
      garganta: '<rect x="51" y="49" width="18" height="13" rx="6"/>',
      hombros:  '<rect x="24" y="63" width="72" height="18" rx="9"/>',
      pecho:    '<rect x="36" y="85" width="48" height="34" rx="12"/>',
      estomago: '<rect x="40" y="123" width="40" height="34" rx="12"/>',
      manos:    '<circle cx="16" cy="150" r="12"/><circle cx="104" cy="150" r="12"/>'
    };
    var base =
      '<g class="cu-base" aria-hidden="true">'+
        '<rect x="18" y="80" width="12" height="66" rx="6"/>'+   // brazo izq
        '<rect x="90" y="80" width="12" height="66" rx="6"/>'+   // brazo der
        '<rect x="44" y="156" width="14" height="76" rx="7"/>'+  // pierna izq
        '<rect x="62" y="156" width="14" height="76" rx="7"/>'+  // pierna der
      '</g>';
    // El muñeco es solo sincronía visual/tap: sin semántica (el camino accesible
    // es la lista de <button>). SVG raíz aria-hidden para no duplicar anuncios.
    var hot = zonas.map(function(z){
      if (!Z[z.clave]) return '';
      return '<g class="cu-zone" data-clave="'+esc(z.clave)+'">'+Z[z.clave]+'</g>';
    }).join('');
    return '<svg class="cu-svg" viewBox="0 0 120 250" fill="none" aria-hidden="true">'+base+hot+'</svg>';
  }

  // 4 · sendero (tiempo) — camino horizontal con paradas ordinales; selección única
  function rndSendero(box, pl, tipo){
    var ps = pl.pasos || [];
    box.innerHTML =
      '<div class="sd-wrap"><div class="sd-line" aria-hidden="true"></div><div class="sd-stops">'+
        ps.map(function(o,i){ return '<button class="sd-stop san-an" data-i="'+i+'" data-clave="'+esc(o.clave)+'" style="animation-delay:'+_acgD(i)+'"><span class="sd-dot" aria-hidden="true"></span><span class="sd-lbl">'+esc(o.etiqueta||o.texto||o.clave)+'</span></button>'; }).join('')+
      '</div></div>';
    wireSingle(box, '.sd-stop', ps, tipo);
  }

  // 5 · cercania (presencia) — Lux fijo; se coloca el "yo"; "no sé si está" va aparte, con igual dignidad
  function rndCercania(box, pl, tipo){
    var opts = pl.opciones || [];
    var eje = opts.filter(function(o){ return !o.aparte; });
    var aparte = opts.filter(function(o){ return o.aparte; });
    var lefts = ['42%','63%','84%'];
    var field = '<div class="cc-field"><div class="cc-lux san-fade" style="animation-delay:'+_acgD(0,0.18)+'" aria-label="Lux">'+luxSVG()+'</div>'+
      eje.map(function(o,i){
        return '<button class="cc-pos san-fade" data-clave="'+esc(o.clave)+'" style="left:'+(lefts[i] || (42 + i*22) + '%')+';animation-delay:'+_acgD(i+1,0.18)+'" title="'+esc(o.sub||'')+'">'+
          '<span class="yo" aria-hidden="true"></span><span class="cc-cap">'+esc(o.etiqueta||o.texto)+'</span></button>';
      }).join('') + '</div>';
    var apts = aparte.map(function(o,k){
      return '<button class="cc-apart san-fade" data-clave="'+esc(o.clave)+'" style="animation-delay:'+_acgD(eje.length+1+k,0.18)+'"><b>'+esc(o.etiqueta||o.texto)+'</b>'+(o.sub?'<span>'+esc(o.sub)+'</span>':'')+'</button>';
    }).join('');
    box.innerHTML = field + apts;
    var all = box.querySelectorAll('[data-clave]');
    Array.prototype.forEach.call(all, function(n){
      n.addEventListener('click', function(){
        Array.prototype.forEach.call(all, function(x){ x.classList.remove('sel'); });
        n.classList.add('sel');
        var k = n.getAttribute('data-clave');
        var o = opts.filter(function(z){ return z.clave === k; })[0];
        if (o) commit(tipo, o.clave, o.eco);
      });
    });
  }
  function luxSVG(){
    // Orbe neutro y cálido — no figurativo. Lux no se mueve.
    return '<svg viewBox="0 0 60 60" aria-hidden="true">'+
      '<circle cx="30" cy="30" r="26" fill="var(--orange)" opacity="0.10"/>'+
      '<circle cx="30" cy="30" r="17" fill="var(--orange)" opacity="0.20"/>'+
      '<circle cx="30" cy="30" r="9" fill="var(--orange-soft)"/></svg>';
  }

  // 6 · mosaico (compania, disposicion, necesidad, imagen, horizonte) — texto tintado; también fallback universal
  function rndMosaico(box, pl, tipo){
    var opts = opcionesDe(pl);   // normaliza opciones/tramos/zonas/pasos si llega una mecánica sin renderer
    box.innerHTML = '<div class="mo-grid">' + opts.map(function(o,i){
      return '<button class="mo-tile san-an" data-i="'+i+'" data-clave="'+esc(o.clave)+'" style="animation-delay:'+_acgD(i)+'">'+esc(o.texto)+'</button>';
    }).join('') + '</div>';
    wireSingle(box, '.mo-tile', opts, tipo);
  }

  // 7 · peso (peso) — figura que carga un bulto de tamaño creciente (nada→mucho).
  // El texto (Nada/Poco/Bastante/Mucho) es el DATO y el camino accesible: siempre
  // visible y lo único que lee el lector de pantalla. La <img> es refuerzo visual
  // (alt="" + aria-hidden). El <button> entero es tappable (imagen o texto valen
  // igual). Selección única con reemplazo, realce cian; commit string/string.
  function rndPeso(box, pl, tipo){
    var opts = pl.opciones || [];
    box.innerHTML = '<div class="peso-grid">' + opts.map(function(o,i){
      var img = o.arte
        ? '<img class="peso-img" src="'+esc(IMGB + o.arte)+'" alt="" aria-hidden="true" onerror="pesoSinArte(this)">'
        : '<span class="peso-img peso-noart" aria-hidden="true"></span>';
      return '<button class="peso-tile san-an" type="button" data-i="'+i+'" data-clave="'+esc(o.clave)+'" aria-pressed="false" style="animation-delay:'+_acgD(i)+'">'+
        img +
        '<span class="peso-lbl">'+esc(o.texto || cap(o.clave))+'</span>'+
      '</button>';
    }).join('') + '</div>';
    wireSingle(box, '.peso-tile', opts, tipo);
  }
  // webp ausente (404): deja un marco neutro (peso-noart) y evita el icono de
  // imagen rota (svg vacío transparente). La etiqueta y el botón siguen intactos
  // → la mecánica funciona y es testeable por teclado solo con texto.
  window.pesoSinArte = function(img){
    img.onerror = null;
    img.classList.add('peso-noart');
    img.src = 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%2F%3E';
  };

  window.avanzarAcogida = function(){
    var pasos = (estado.misterioSel && estado.misterioSel.acogida) || [];
    estado._acgEntrada = false;   // avance de paso → no re-animar recepción/progreso
    estado.pasoAcogida++;
    if (estado.pasoAcogida >= pasos.length) {
      estado.senales = estado.senales.filter(Boolean);
      estado.fase = 'handoff';
      guardarAfinidad(estado.painSel, estado.senales);
    }
    render();
    window.scrollTo(0,0);
  };

  // ── FASE 3 · Handoff ────────────────────────────────────────────
  function renderHandoff(){
    var v = $('view');
    var m = estado.misterioSel, p = estado.painSel;
    var ecos = estado.senales.map(function(s){ return s && s.eco; }).filter(Boolean);

    // Coreografía reposada con delays largos. Los ecos van uno a uno (0.7 + i*1.5),
    // y la oración tras un respiro — recalculado por índice para no dejar huecos si
    // hay menos de 3 ecos. CRÍTICO A11Y: con reduceMotion NO se aplican clases ni
    // delays → todo se muestra de inmediato (nadie espera ~7s con pantalla vacía).
    var hasEcos = ecos.length > 0;
    var lastEco = hasEcos ? (0.7 + (ecos.length - 1) * 1.5) : 0;
    var oBase   = hasEcos ? (lastEco + 2.0) : 0.2;   // respiro tras el último eco

    function hoEl(cls, delay, html){
      if (reduceMotion) return '<div class="'+cls+'">'+html+'</div>';
      return '<div class="'+cls+' ho-an" style="animation-delay:'+(+delay).toFixed(2)+'s">'+html+'</div>';
    }
    function hoBtn(cls, delay, onclick, label){
      if (reduceMotion) return '<button class="'+cls+'" onclick="'+onclick+'">'+label+'</button>';
      return '<button class="'+cls+' ho-an" style="animation-delay:'+(+delay).toFixed(2)+'s" onclick="'+onclick+'">'+label+'</button>';
    }

    v.innerHTML =
      '<div class="ho-flow">'+
        (hasEcos ? hoEl('ho-kick', 0.2, 'Buena noticia:') : '')+
        ecos.map(function(e, i){ return hoEl('ho-eco-line', 0.7 + i * 1.5, esc(e)); }).join('')+
        '<div class="ho-oracion">'+
          hoEl('ho-kick',  oBase,       'Puedes orar con')+
          hoEl('ho-title', oBase + 0.6, esc(m.titulo))+
          hoEl('ho-mal',   oBase + 1.2, esc(m.mal || ''))+
        '</div>'+
      '</div>'+
      hoBtn('btn-primary', oBase + 1.8, 'irMini()',      'Entrar al Misterio')+
      hoBtn('btn-ghost',   oBase + 2.0, 'volverElenco()', 'Elegir otro dolor');

    _sanEntrada();   // toggle .san-go → dispara las animaciones (no-op bajo reduceMotion)
  }

  window.irMini = function(){
    var mid = estado.misterioSel.mid;
    navTo('mini.html?mid=' + encodeURIComponent(mid) + '&pain=' + encodeURIComponent(estado.painSel.id));
  };
  window.volverElenco = function(){
    estado.fase = 'elenco'; estado.painSel = null; estado.misterioSel = null;
    estado.pasoAcogida = 0; estado.senales = [];
    render(); window.scrollTo(0,0);
  };

  // ── Tema (misma clave que el resto de la app) ───────────────────
  var isLight = localStorage.getItem('cruzando_theme') === 'light';
  function applyTheme(light){
    document.body.classList.toggle('light', light);
    document.querySelector('meta[name="theme-color"]').content = light ? '#E6DED3' : '#1A0E04';
    localStorage.setItem('cruzando_theme', light ? 'light' : 'dark');
  }
  window.toggleDark = function(){ isLight = !isLight; applyTheme(isLight); };
  if (isLight) applyTheme(true);

  // ── Navegación (patrón del repo) ────────────────────────────────
  window.navTo = function(pg){ location.href = base + pg; };
  window.navTap = function(elm){
    elm.classList.remove('tapped'); void elm.offsetWidth; elm.classList.add('tapped');
    setTimeout(function(){ elm.classList.remove('tapped'); }, 400);
  };

  // ── Gestos (comunes en gestures.js) ─────────────────────────────
  // El swipe horizontal no navega aquí: los bordes quedan bloqueados y el atrás propio
  // cierra el velo de foco si está abierto; si no, vuelve al inicio.
  CZGestures.init({ onBack: function(){
    if ($('foco')) { cerrarFoco(); return true; }
    if (estado.fase === 'onboarding' && estado.obPaso > 0) { onBack(); return true; }
    window.navTo('index.html');
  }});

  // ── Arranque (diferido tras Auth) ───────────────────────────────
  // No hay usuarios anónimos: el sign-in es obligatorio. Esperamos a que Auth
  // resuelva; con sesión → capturamos uid, resolvemos el plan REAL del doc y
  // arrancamos; sin sesión → al sign-in. Patrón de orar/audio.
  function _arranque(user){
    window._obDB  = _db;
    window._obUID = user.uid;   // uid para Fase B (persistir el perfil de afinidad)
    // En paralelo: doc de usuario (plan real → window.currentPlan; así effectivePlan()
    // no depende del caché frío) + doc de afinidad (perfil del onboarding). Ambos con
    // fallback a null para no bloquear el arranque si falla la red.
    Promise.all([
      _db.collection('users').doc(user.uid).get().catch(function(){ return null; }),
      _cargarPerfil(user)
    ]).then(function(res){
      var userData = (res[0] && res[0].exists) ? res[0].data() : {};
      window.currentPlan = window.resolvePlan ? window.resolvePlan(userData) : 'free';
      DEV = _plan() === 'developer';        // gate resuelto de verdad, antes del primer render
      var perfil = res[1];
      _retryPendingSync();                  // reintenta subir un perfil que quedó pendiente
      if (perfil && perfil.ejes) _perfil = perfil.ejes;   // Fase C leerá esto
      // Onboarding si: se pide rehacer (?rehacer=1) o no hay perfil previo.
      if (_qpRehacer() || !perfil) { estado.fase = 'onboarding'; estado.obPaso = 0; }
      else { estado.fase = 'elenco'; }
      cargar();
    });
  }
  _auth.onAuthStateChanged(function(u){
    if (u) _arranque(u);
    else window.navTo('index.html');   // sin sesión → sign-in
  });
})();
</script>
</body>
