<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mapa · CruzAndo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lora:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    /* Variables — mismo sistema del proyecto */
    :root {
      --bg: #0d0d1a;
      --surface: #1a1a2e;
      --text: #f0ede8;
      --text-soft: rgba(240,237,232,0.5);
      --border: rgba(240,237,232,0.1);
      --accent: #C0392B;
    }
    [data-theme="light"] {
      --bg: #faf8f5;
      --surface: #f0ede8;
      --text: #1a1a1a;
      --text-soft: rgba(26,26,26,0.45);
      --border: rgba(26,26,26,0.1);
      --accent: #C0392B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* Layout principal */
    #world-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* Header */
    #world-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #world-header-titulo {
      font-family: 'Lora', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }
    #btn-world-back {
      background: none;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-world-theme {
      background: none;
      border: none;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      -webkit-tap-highlight-color: transparent;
    }

    /* Barra de tabs */
    #tabs-container {
      display: flex;
      overflow-x: auto;
      gap: 4px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #tabs-container::-webkit-scrollbar { display: none; }

    .tab-mundo {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-soft);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-mundo.activo {
      color: white;
      border-color: transparent;
    }
    .tab-mundo.bloqueado {
      opacity: 0.4;
      cursor: default;
    }
    .tab-mundo.bloqueado .tab-candado {
      font-size: 11px;
    }

    /* Área del mapa */
    #mapa-container {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .mundo-panel {
      position: absolute;
      inset: 0;
      overflow-x: auto;
      overflow-y: auto;
      display: none;
      align-items: center;
      padding: 32px 24px;
      scrollbar-width: none;
    }
    .mundo-panel::-webkit-scrollbar { display: none; }
    .mundo-panel.visible { display: flex; }

    /* Placeholder de contenido */
    .mundo-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 100%;
      min-height: 200px;
      opacity: 0.3;
    }
    .mundo-placeholder-icono { font-size: 48px; }
    .mundo-placeholder-texto {
      font-family: 'Lora', serif;
      font-size: 18px;
      color: var(--text-soft);
    }

    /* Bottom nav */
    #bottom-nav {
      display: flex;
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 4px 10px;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-soft);
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s;
    }
    .nav-item.activo { color: var(--accent); }
    .nav-item:active { opacity: 0.7; }
    .nav-item-icono { font-size: 20px; line-height: 1; }

    /* ── Nodos del mapa ── */
    .mundo-mapa {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 8px;
      min-width: max-content;
    }

    .mundo-titulo-mapa {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Lora', serif;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-left: 8px;
    }

    .nodos-fila {
      display: flex;
      align-items: flex-start;
    }

    .nodo-columna {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nodo-fila-principal {
      display: flex;
      align-items: center;
    }

    .nodo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .nodo-nivel {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2.5px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
      position: relative;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .nodo-nivel:active { transform: scale(0.92); }

    .nodo-num {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }

    .nodo-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: var(--text-soft);
      text-align: center;
      max-width: 64px;
      line-height: 1.3;
    }

    .linea-horizontal {
      width: 32px;
      height: 2.5px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .nodo-fila-santuario {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 4px;
    }

    .linea-vertical {
      width: 2.5px;
      height: 24px;
      border-radius: 2px;
    }

    .nodo-santuario {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.18s;
      -webkit-tap-highlight-color: transparent;
    }
    .nodo-santuario:active { transform: scale(0.92); }

    .nodo-label-santuario {
      max-width: 72px;
      margin-top: 4px;
      font-size: 10px;
    }

    /* ── Estados de nodo ── */
    .nodo-completado {
      box-shadow: 0 0 0 3px currentColor;
    }
    .nodo-check {
      font-size: 22px;
      font-weight: 700;
    }
    .nodo-bloqueado {
      opacity: 0.45;
    }
    @keyframes pulso-nodo {
      0%, 100% { box-shadow: 0 0 0 0 currentColor; }
      50%       { box-shadow: 0 0 0 6px transparent; }
    }
    .nodo-pulso {
      animation: pulso-nodo 2s ease-in-out infinite;
    }
    @keyframes anillo-progreso {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .nodo-progreso::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: currentColor;
      animation: anillo-progreso 1.2s linear infinite;
    }

    /* ── Cofre animado ── */
    .nodo-cofre {
      font-size: 20px;
      cursor: pointer;
      animation: cofre-bounce 1.5s ease-in-out infinite;
      margin-bottom: 4px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes cofre-bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-4px); }
    }

    /* ── Modal de cofre ── */
    .cofre-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      animation: fadeInUp 0.3s ease-out;
    }
    .cofre-modal-inner {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 32px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .cofre-modal-icono {
      font-size: 40px;
      animation: cofre-bounce 1.5s ease-in-out infinite;
    }
    .cofre-modal-titulo {
      font-family: 'Lora', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
    }
    #cofre-modal-contenido {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cofre-recompensa {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .cofre-recompensa-santuario {
      border-color: var(--accent);
      cursor: pointer;
    }
    .cofre-recompensa-santuario:active { opacity: 0.8; }
    .cofre-recomp-icono { font-size: 24px; flex-shrink: 0; }
    .cofre-recomp-titulo {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .cofre-recomp-sub {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: var(--text-soft);
      margin-top: 2px;
    }
    .cofre-modal-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 12px 32px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .cofre-modal-btn:active { opacity: 0.85; }

    /* ── Animaciones auxiliares ── */
    @keyframes sacudir {
      0%   { transform: translateX(0); }
      20%  { transform: translateX(-6px); }
      40%  { transform: translateX(6px); }
      60%  { transform: translateX(-4px); }
      80%  { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }
    .sacudir { animation: sacudir 0.4s ease !important; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<!-- Aplicar tema antes de render para evitar flash -->
<script>
  (function() {
    var t = localStorage.getItem('theme');
    if (t === 'light') document.documentElement.dataset.theme = 'light';
  })();
</script>

<div id="world-container">

  <!-- Header -->
  <div id="world-header">
    <button id="btn-world-back" onclick="history.back()">←</button>
    <span id="world-header-titulo">Mapa del Peregrino</span>
    <button id="btn-world-theme" onclick="window.toggleTheme()">☀</button>
  </div>

  <!-- Tabs de Mundos -->
  <div id="tabs-container">
    <!-- Se generan dinámicamente -->
  </div>

  <!-- Paneles de cada Mundo -->
  <div id="mapa-container">
    <!-- Se generan dinámicamente -->
  </div>

  <!-- Bottom nav -->
  <nav id="bottom-nav">
    <button class="nav-item" onclick="location.href='index.html'">
      <span class="nav-item-icono">🏠</span>
      <span>Inicio</span>
    </button>
    <button class="nav-item" onclick="location.href='orar.html'">
      <span class="nav-item-icono">📿</span>
      <span>Orar</span>
    </button>
    <button class="nav-item activo">
      <span class="nav-item-icono">🗺</span>
      <span>Mapa</span>
    </button>
    <button class="nav-item" onclick="location.href='sanar.html'">
      <span class="nav-item-icono">◆</span>
      <span>Sanar</span>
    </button>
    <button class="nav-item" onclick="location.href='diario.html'">
      <span class="nav-item-icono">📖</span>
      <span>Diario</span>
    </button>
  </nav>

</div>
<div id="cofre-modal" class="cofre-modal" style="display:none" onclick="window.cerrarCofre()">
  <div class="cofre-modal-inner" onclick="event.stopPropagation()">
    <div class="cofre-modal-icono">📦</div>
    <h3 class="cofre-modal-titulo">Recompensas desbloqueadas</h3>
    <div id="cofre-modal-contenido"></div>
    <button class="cofre-modal-btn" onclick="window.cerrarCofre()">¡Genial!</button>
  </div>
</div>

<script type="module" src="world.js"></script>
</body>
</html>
